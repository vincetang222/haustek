# =====================================================================
# Cổng kiểm thử cho cả hai app.
#
# VÌ SAO CÓ FILE NÀY
# CRM và portal nói chuyện với nhau qua một hợp đồng dữ liệu (portal/SYNC.md).
# Hợp đồng đó hiện chỉ được giữ bằng việc ai đó NHỚ chạy lệnh trước khi merge.
# Hai đội làm song song thì trí nhớ là thứ hỏng đầu tiên: một bên đổi hình dạng
# một trường, bên kia không hay, và không gì báo cho tới lúc người vận hành mở
# màn hình Bàn giao ra thấy trống.
#
# Cổng này biến hợp đồng đó thành thứ máy kiểm được.
#
# CHẠY ĐƯỢC TRÊN MỌI NHÁNH, KỂ CẢ NHÁNH CHỈ CÓ MỘT NỬA
# Mỗi bước tự tìm file test có mặt rồi mới chạy. Nhánh chỉ có crm/ thì bỏ qua
# phần portal và ngược lại; không nhánh nào đỏ chỉ vì thiếu nửa kia. Riêng
# crm/test/handoff-e2e.mjs tự BỎ QUA (thoát 0) khi thiếu một nửa — nó chỉ thực
# sự chạy trên nhánh hoặc trên main có đủ cả hai.
# =====================================================================
name: Kiểm thử

on:
  pull_request:
  push:
    branches: [main]

# Đẩy liên tiếp lên cùng một PR thì huỷ lượt chạy cũ: không ai cần kết quả của
# commit đã bị thay thế, và runner thì có hạn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ranh-gioi:
    # Cổng RẺ NHẤT và là thứ phải xanh trước mọi thứ khác. Không cần trình
    # duyệt, chạy thẳng trên lõi, xong trong vài giây. Nó chứng minh nghệ sĩ A
    # không truy vấn được dữ liệu nghệ sĩ B — mốc số 2 trong tài liệu bàn giao.
    name: Ranh giới quyền
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: portal/test/api-guard.js
        run: |
          if [ -f portal/test/api-guard.js ]; then
            node portal/test/api-guard.js
          else
            echo "Nhánh này không có portal/test/api-guard.js — bỏ qua."
          fi

  trinh-duyet:
    name: Kiểm thử trình duyệt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Repo không có package.json, và CỐ Ý không có: thêm vào là Vercel đổi
      # cách dựng trang (từ tĩnh sang có bước build). Nên dựng package.json
      # tạm ngay tại runner, chỉ để kéo Playwright về.
      - name: Cài Playwright
        run: |
          npm init -y > /dev/null
          npm i -D playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      # smoke/flow/edge của portal cần một máy chủ tĩnh sẵn có ở BASE. Hai bộ
      # upgrade và handoff-e2e tự dựng máy chủ riêng nên không đụng tới cái này.
      - name: Dựng máy chủ tĩnh cho portal
        if: hashFiles('portal/intranet.html') != ''
        run: |
          cat > /tmp/srv.cjs <<'JS'
          const http = require("http"), fs = require("fs"), path = require("path");
          const ROOT = path.resolve("portal");
          const T = { ".html":"text/html", ".js":"text/javascript", ".css":"text/css",
                      ".json":"application/json", ".png":"image/png", ".svg":"image/svg+xml",
                      ".webp":"image/webp", ".jpg":"image/jpeg", ".ico":"image/x-icon" };
          http.createServer((q, s) => {
            let u = decodeURIComponent(q.url.split("?")[0]);
            if (u.endsWith("/")) u += "index.html";
            const f = path.join(ROOT, u);
            if (!f.startsWith(ROOT)) { s.writeHead(403); return s.end(); }
            fs.readFile(f, (e, d) => {
              if (e) { s.writeHead(404); return s.end("404"); }
              s.writeHead(200, { "content-type": T[path.extname(f)] || "application/octet-stream",
                                 "cache-control": "no-store" });
              s.end(d);
            });
          }).listen(8099, "127.0.0.1", () => console.log("máy chủ tĩnh: 8099"));
          JS
          # Đẩy log ra file chứ không để nguyên: tiến trình nền giữ stdout của
          # bước mở thì runner có thể treo ở đó chờ hết giờ.
          node /tmp/srv.cjs > /tmp/srv.log 2>&1 &
          # Đợi cho tới khi nó thực sự trả lời, đừng ngủ một khoảng đoán mò:
          # runner chậm thì sleep 2 là đủ đỏ một cách ngẫu nhiên.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/intranet.html && exit 0
            sleep 1
          done
          echo "Máy chủ tĩnh không lên sau 30 giây" >&2
          exit 1

      - name: CRM
        run: |
          shopt -s nullglob
          files=(crm/test/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nhánh này không có crm/test — bỏ qua."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Portal
        env:
          BASE: http://127.0.0.1:8099
        run: |
          shopt -s nullglob
          # api-guard đã chạy ở job kia rồi, không chạy lại.
          files=(portal/test/upgrade.mjs portal/test/smoke.js portal/test/flow.js portal/test/edge.js)
          ran=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
            ran=1
          done
          [ $ran -eq 1 ] || echo "Nhánh này không có bộ kiểm thử trình duyệt của portal — bỏ qua."
