# =====================================================================
# Cổng kiểm thử cho cả hai app.
#
# VÌ SAO CÓ FILE NÀY
# CRM và portal nói chuyện với nhau qua một hợp đồng dữ liệu. Hợp đồng đó
# nếu chỉ giữ bằng việc ai đó NHỚ chạy lệnh trước khi merge thì hỏng sớm:
# hai đội làm song song, một bên đổi hình dạng một trường, bên kia không
# hay, và không gì báo cho tới lúc người vận hành mở màn hình Bàn giao ra
# thấy trống. Cổng này biến hợp đồng đó thành thứ máy kiểm được.
#
# CHẠY ĐƯỢC TRÊN MỌI NHÁNH, KỂ CẢ NHÁNH CHỈ CÓ MỘT NỬA
# Không job nào gõ cứng tên file. .github/scripts/kiem.sh tự đọc thư mục
# test và suy ra loại từng bộ, nên nhánh chỉ có crm/ bỏ qua phần portal và
# ngược lại, còn nhánh dựng lại portal thành v2 thì bộ mới tự được chạy.
# Lý do đầy đủ nằm trong đầu file kiem.sh — tóm lại: danh sách gõ cứng ở
# bản trước đã khiến nhánh v2 chạy 0/41 bộ mà vẫn xanh.
# =====================================================================
name: Kiểm thử

on:
  pull_request:
  push:
    branches: [main]

# Đẩy liên tiếp lên cùng một PR thì huỷ lượt chạy cũ: không ai cần kết quả
# của commit đã bị thay thế, và runner thì có hạn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ranh-gioi:
    # Cổng RẺ NHẤT và là thứ phải xanh trước mọi thứ khác. Không cần trình
    # duyệt, chạy thẳng trên lõi, xong trong vài giây. Nó chứng minh nghệ sĩ
    # A không truy vấn được dữ liệu nghệ sĩ B — mốc số 2 trong tài liệu bàn
    # giao. Vì thế nó đứng riêng chứ không nằm chung nhóm node bên dưới.
    name: Ranh giới quyền
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: portal/test/api-guard.js
        run: |
          if [ -f portal/test/api-guard.js ]; then
            node portal/test/api-guard.js
          else
            echo "Nhánh này không có portal/test/api-guard.js — bỏ qua."
          fi

  nhanh:
    # Nhóm chạy thẳng bằng node: lược đồ, di trú, ma trận quyền, bất biến
    # tiền, mã định danh, i18n… Trên nhánh v2 là 17 bộ.
    #
    # Tách khỏi job trình duyệt vì cài Playwright mất khoảng ba phút. Một
    # lỗi lược đồ mà phải chờ ba phút cài trình duyệt mới thấy là ba phút
    # mua bằng không gì cả.
    name: Kiểm thử không cần trình duyệt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: bash .github/scripts/kiem.sh node

  trinh-duyet:
    name: Kiểm thử trình duyệt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Repo không có package.json, và CỐ Ý không có: thêm vào là Vercel đổi
      # cách dựng trang (từ tĩnh sang có bước build). Nên dựng package.json
      # tạm ngay tại runner, chỉ để kéo Playwright về.
      - name: Cài Playwright
        run: |
          npm init -y > /dev/null
          npm i -D playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Bộ kiểm trình duyệt của portal cần một máy chủ tĩnh sẵn có ở BASE.
      # Trang cổng nằm ở portal/intranet.html (bản v1) hay portal/v2/
      # intranet.html (bản v2) tuỳ nhánh, nên ĐỪNG dò đúng một đường dẫn:
      # bản trước gác bước này bằng hashFiles('portal/intranet.html'), và
      # trên nhánh v2 máy chủ không bao giờ lên.
      - name: Dựng máy chủ tĩnh cho portal
        if: hashFiles('portal/**/*.html') != ''
        run: |
          cat > /tmp/srv.cjs <<'JS'
          const http = require("http"), fs = require("fs"), path = require("path");
          const ROOT = path.resolve("portal");
          const T = { ".html":"text/html", ".js":"text/javascript", ".css":"text/css",
                      ".json":"application/json", ".png":"image/png", ".svg":"image/svg+xml",
                      ".webp":"image/webp", ".jpg":"image/jpeg", ".ico":"image/x-icon",
                      ".woff2":"font/woff2", ".woff":"font/woff" };
          http.createServer((q, s) => {
            let u = decodeURIComponent(q.url.split("?")[0]);
            if (u.endsWith("/")) u += "index.html";
            const f = path.join(ROOT, u);
            if (!f.startsWith(ROOT)) { s.writeHead(403); return s.end(); }
            fs.readFile(f, (e, d) => {
              if (e) { s.writeHead(404); return s.end("404"); }
              s.writeHead(200, { "content-type": T[path.extname(f)] || "application/octet-stream",
                                 "cache-control": "no-store" });
              s.end(d);
            });
          }).listen(8099, "127.0.0.1", () => console.log("máy chủ tĩnh: 8099"));
          JS
          # Đẩy log ra file chứ không để nguyên: tiến trình nền giữ stdout của
          # bước mở thì runner có thể treo ở đó chờ hết giờ.
          node /tmp/srv.cjs > /tmp/srv.log 2>&1 &
          # Đợi cho tới khi nó thực sự trả lời, đừng ngủ một khoảng đoán mò:
          # runner chậm thì sleep 2 là đủ đỏ một cách ngẫu nhiên. Nhận bất kỳ
          # trang cổng nào có mặt — v2 trước, v1 sau, cuối cùng là trang chủ.
          for i in $(seq 1 30); do
            for u in v2/intranet.html intranet.html index.html; do
              if curl -sf -o /dev/null "http://127.0.0.1:8099/$u"; then
                echo "máy chủ tĩnh trả lời ở /$u"; exit 0
              fi
            done
            sleep 1
          done
          echo "Máy chủ tĩnh không lên sau 30 giây" >&2
          cat /tmp/srv.log >&2
          exit 1

      - name: Bộ kiểm cần trình duyệt
        env:
          BASE: http://127.0.0.1:8099
        run: bash .github/scripts/kiem.sh trinh-duyet
