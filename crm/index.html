<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAUSTEK CRM — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== HỆ MÀU =====================
   Theo bản thiết kế portal chủ dự án đưa làm chuẩn: nền xanh-xám lạnh, accent
   teal, dải chrome tối ở cột trái, và có cả nền tối.

   HOÀ GIẢI VỚI PLAYBOOK THƯƠNG HIỆU — đây là quyết định đáng giải thích.
   Playbook (docs/haustek-brand-playbook.html) định nghĩa Signal Red #FF2E4C là
   "CTA, trạng thái, điểm nhấn". Bản tham khảo lại để teal làm accent và đỏ làm
   nguy hiểm. Hai bên đều có lý, nên chia việc thay vì chọn một:

     --brand  #FF2E4C  Signal Red — HÀNH ĐỘNG CHÍNH. Nút tạo, nút duyệt, chấm
                       logo, vạch mục đang mở. Đúng vai playbook giao.
     --accent #0C7287  Teal — TƯƠNG TÁC và THÔNG TIN. Link, tên bản ghi, ô đang
                       chọn, vòng focus, thanh dữ liệu. Trước đây vai này do
                       --ice-dark #0b6b80 giữ, gần như cùng màu, nay gọi đúng tên.
     --danger #C8102E  Đỏ sẫm — SAI và QUÁ HẠN. Deal trễ, CEO không duyệt, xoá.

   Hai sắc đỏ hai việc: đỏ tươi nghĩa là "bấm đi", đỏ sẫm nghĩa là "có vấn đề".
   Bản cũ dùng một màu cho cả hai, nên nút Tạo cơ hội và ngày quá hạn hét to
   ngang nhau — mắt không biết nhìn đâu trước.

   Tên token giữ nguyên hết, chỉ đổi GIÁ TRỊ: đổi tên thì phải sửa vài trăm rule
   và bộ kiểm đang bám vào một số class. */
:root{
  color-scheme:light;
  --paper:#FFFFFF;        /* mặt thẻ */
  --raised:#FFFFFF;
  --surface:#EBEEF3;      /* nền trang */
  --fill:#DAE1E9;         /* ô lấp, nền nhạt trong thẻ */
  --head:#E2E7EE;         /* dải tiêu đề trong thẻ */
  --zebra:#F4F7FA;        /* dòng bảng khi rê chuột */
  --ink:#1A2129;
  --ink-2:#4F5964;
  --muted:#5C6672;   /* đậm thêm một nấc: #6B7683 chỉ đạt 3.97:1 trên nền trang */
  --muted-2:#818C99;
  --line:#D2D9E2;         /* viền thấy rõ */
  --line-2:#E6EBF1;       /* kẻ mảnh giữa các dòng — NHẠT hơn --line, đừng đảo */
  --card-line:#D3DAE3;

  --brand:#FF2E4C;        /* Signal Red — hành động chính */
  --brand-dark:#D4213C;
  --brand-tint:#FFEDF0;

  --accent:#0C7287;       /* teal — tương tác, thông tin */
  --accent-2:#3D9DB1;
  --accent-3:#7FC3D2;
  --accent-lo:#DCEEF3;
  --ice:#7FC3D2;          /* giữ tên cũ, trỏ vào accent-3 */
  --ice-dark:#0C7287;     /* giữ tên cũ, trỏ vào accent */

  --ok:#136E46;      --ok-lo:#E6F4ED;
  --warn:#A15F00;    --warn-lo:#FFF6E5;
  --danger:#C8102E;  --danger-lo:#FCEEF0;
  --amber:#A15F00;   --green:#136E46;  --red:#C8102E;
  --violet:#5A4BB8;  --teal:#0F7A6E;

  /* chrome — cột trái và thanh trên, TỐI ở cả hai theme */
  --chrome:#080E14; --chrome-2:#101B24; --chrome-3:#16242F; --chrome-line:#1D2C37;
  --chrome-grad:linear-gradient(180deg,#0F1A23 0%,#0A131A 100%);
  --on-chrome:#E3EBF2; --on-chrome-2:#A6B5C2; --on-chrome-3:#7F909E;
  --nav:#080E14;          /* giữ tên cũ */
  --nav-2:#A6B5C2;

  --r:9px; --r-sm:6px; --radius:6px;
  --shadow:0 1px 1px rgba(20,32,44,.05), 0 2px 6px -1px rgba(20,32,44,.07);
  --shadow-2:0 2px 6px rgba(20,32,44,.06), 0 14px 36px -12px rgba(20,32,44,.18);
  --shadow-lift:0 2px 8px -4px rgba(12,114,135,.35);
  --side:212px;

  --disp:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* Nền tối. Ba trạng thái chứ không phải hai: người chưa chọn gì thì gốc không
   mang data-theme và chỉ prefers-color-scheme quyết định. Khối media phải tự
   loại trừ khi người đã chọn sáng, nếu không máy để dark mà chọn sáng sẽ ra
   chữ sáng trên nền sáng. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#15212B; --raised:#1A2833; --surface:#0B141B; --fill:#2A3A48;
    --head:#1E2C39;  --zebra:#1A2733;
    --ink:#E8EEF4;   --ink-2:#A9B7C4; --muted:#8B9AA8; --muted-2:#6E7E8C;
    --line:#2C3E4E;  --line-2:#223140; --card-line:#24333F;
    --brand:#FF5C73; --brand-dark:#FF8095; --brand-tint:#331A20;
    --accent:#4CB8CE; --accent-2:#6FCADD; --accent-3:#8FD8E7; --accent-lo:#14313C;
    --ice:#8FD8E7;    --ice-dark:#4CB8CE;
    --ok:#4FC98F;     --ok-lo:#122F24;
    --warn:#E5A24A;   --warn-lo:#2E2413;
    --danger:#FF6B80; --danger-lo:#33161C;
    --amber:#E5A24A;  --green:#4FC98F; --red:#FF6B80;
    --violet:#9B8AF0; --teal:#4FBFAF;
    --chrome:#0E1A24; --chrome-2:#16242F; --chrome-3:#1B2C38; --chrome-line:#22323E;
    --chrome-grad:linear-gradient(180deg,#10202C 0%,#0C1720 100%);
    --nav:#0E1A24;
    --shadow:0 1px 1px rgba(0,0,0,.34), 0 2px 6px -1px rgba(0,0,0,.30);
    --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 20px 50px -12px rgba(0,0,0,.7);
    --shadow-lift:0 4px 14px -6px rgba(76,184,206,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15212B; --raised:#1A2833; --surface:#0B141B; --fill:#2A3A48;
  --head:#1E2C39;  --zebra:#1A2733;
  --ink:#E8EEF4;   --ink-2:#A9B7C4; --muted:#8B9AA8; --muted-2:#6E7E8C;
  --line:#2C3E4E;  --line-2:#223140; --card-line:#24333F;
  --brand:#FF5C73; --brand-dark:#FF8095; --brand-tint:#331A20;
  --accent:#4CB8CE; --accent-2:#6FCADD; --accent-3:#8FD8E7; --accent-lo:#14313C;
  --ice:#8FD8E7;    --ice-dark:#4CB8CE;
  --ok:#4FC98F;     --ok-lo:#122F24;
  --warn:#E5A24A;   --warn-lo:#2E2413;
  --danger:#FF6B80; --danger-lo:#33161C;
  --amber:#E5A24A;  --green:#4FC98F; --red:#FF6B80;
  --violet:#9B8AF0; --teal:#4FBFAF;
  --chrome:#0E1A24; --chrome-2:#16242F; --chrome-3:#1B2C38; --chrome-line:#22323E;
  --chrome-grad:linear-gradient(180deg,#10202C 0%,#0C1720 100%);
  --nav:#0E1A24;
  --shadow:0 1px 1px rgba(0,0,0,.34), 0 2px 6px -1px rgba(0,0,0,.30);
  --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 20px 50px -12px rgba(0,0,0,.7);
  --shadow-lift:0 4px 14px -6px rgba(76,184,206,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--surface);color:var(--ink);
  font-size:13.5px;line-height:1.5;
  font-feature-settings:'tnum' 1;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--ice-dark);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--paper)}
@media(max-width:980px){.login{grid-template-columns:1fr}.login-right{display:none}}
.login-left{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;position:relative}
.login-lang{position:absolute;top:22px;right:24px;display:flex;border:1px solid var(--line);
  border-radius:6px;overflow:hidden}
.login-lang button{padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.login-lang button:hover{background:var(--surface)}
.login-lang button.on{background:var(--ink);color:var(--paper)}
.login-logo{height:30px;width:auto;margin-bottom:34px}
.login-card{width:100%;max-width:360px;border:1px solid var(--line);border-radius:10px;
  padding:26px 26px 22px;box-shadow:0 2px 10px rgba(10,10,13,.05)}
.login-t{font-size:16px;font-weight:600;text-align:center;margin-bottom:20px;letter-spacing:-.01em}
.login-l{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex}
.login-hint{margin-left:auto;color:var(--ice-dark)}
.login-in{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:5px;font-size:13.5px}
.login-in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,46,76,.15)}
.login-btn{width:100%;margin-top:16px;padding:10px;border-radius:5px;background:var(--brand);
  color:#fff;font-weight:600;font-size:14px}
.login-btn:hover{background:var(--brand-dark)}
.login-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.login-sep{border-top:1px solid var(--line-2);margin:14px 0 12px}
.login-link{font-size:12.5px;color:var(--ice-dark)}
.login-link:hover{text-decoration:underline}
.login-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:14px;
  background:var(--surface);border-radius:6px;padding:9px 11px}
.login-foot{position:absolute;bottom:22px;font-size:11.5px;color:var(--muted)}
.login-err{font-size:12px;color:var(--brand-dark);margin-top:9px;display:none}

.login-right{background:var(--nav);color:#fff;padding:52px 54px;display:flex;
  flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login-right::after{content:'';position:absolute;right:-80px;top:-80px;width:340px;height:340px;
  border-radius:50%;background:radial-gradient(circle,rgba(127,214,232,.18),transparent 68%)}
.lr-eyebrow{font-size:12px;color:var(--nav-2);letter-spacing:.08em;margin-bottom:20px;
  display:flex;align-items:center;gap:9px}
.lr-h{font-size:40px;font-weight:700;line-height:1.12;letter-spacing:-.03em;margin-bottom:18px}
.lr-h em{font-style:normal;color:var(--brand)}
.lr-p{font-size:14.5px;color:var(--on-chrome-2);line-height:1.6;max-width:460px;margin-bottom:30px}
.lr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:470px;
  border-top:1px solid rgba(255,255,255,.13);padding-top:22px;margin-bottom:26px}
.lr-n{font-size:23px;font-weight:700;letter-spacing:-.02em}
.lr-s{font-size:11.5px;color:var(--nav-2);margin-top:3px;line-height:1.4}
.lr-quote{font-size:15px;line-height:1.55;color:#e6e6ea;border-left:2px solid var(--brand);
  padding-left:15px;max-width:430px;margin-bottom:24px}
.lr-quote span{color:var(--nav-2);font-size:12px;display:block;margin-top:7px}
.lr-tags{display:flex;flex-wrap:wrap;gap:7px;max-width:470px}
.lr-tag{font-size:11px;color:var(--on-chrome-2);border:1px solid rgba(255,255,255,.16);
  padding:3px 10px;border-radius:12px}
.lr-link{margin-top:26px;font-size:12.5px;color:var(--ice)}
.lr-link:hover{text-decoration:underline}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:30}
.hrow{
  background:var(--chrome-grad),var(--chrome);height:58px;display:flex;align-items:center;gap:14px;
  padding:0 20px;
}
.hrow-in{display:flex;align-items:center;gap:14px;max-width:1600px;margin:0 auto;width:100%}
/* Wordmark HAUSTEK — bản trắng trên nền tối (LOGO-A). Không đổi màu, không viền, không đổ bóng. */
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;padding-right:6px}
.sigdot{width:7px;height:7px;border-radius:50%;background:#FF2E4C;flex:0 0 auto}
.brand-logo{height:18px;width:auto;display:block;flex:0 0 auto}
.brand-sep{width:1px;height:17px;background:rgba(255,255,255,.2);flex:0 0 auto}
.brand-crm{font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--nav-2);flex:0 0 auto}
@media(max-width:900px){.brand-sep,.brand-crm{display:none}}
.demo-tag{
  font-size:10.5px;color:var(--nav-2);border:1px solid rgba(255,255,255,.18);
  padding:2px 8px;border-radius:10px;white-space:nowrap;
}
@media(max-width:1420px){.demo-tag{display:none}}

.search{flex:1 1 260px;min-width:180px;max-width:380px;position:relative;margin-left:6px}
.search input{
  width:100%;padding:6px 11px 6px 32px;border:1px solid rgba(255,255,255,.16);
  border-radius:var(--radius);background:rgba(255,255,255,.1);font-size:13px;color:#fff;
}
.search input::placeholder{color:var(--on-chrome-3)}
.search input:focus{background:#fff;color:var(--ink);border-color:#fff;outline:none}
.search input:focus::placeholder{color:var(--muted)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--on-chrome-3)}
.search input:focus + svg,.search:focus-within svg{color:var(--muted)}

.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:var(--radius);overflow:hidden;margin-left:auto;flex:0 0 auto}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--on-chrome-2);letter-spacing:.02em}
.lang button:hover{background:rgba(255,255,255,.08)}
.lang button.on{background:#fff;color:var(--nav)}
.logout{width:28px;height:28px;border-radius:5px;color:var(--nav-2);display:grid;place-items:center;flex:0 0 auto}
.logout:hover{background:rgba(255,255,255,.1);color:#fff}
.me{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.16);flex:0 0 auto}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
.me-name{font-size:12.5px;font-weight:500;color:#fff;line-height:1.25}
.me-role{font-size:11px;color:var(--nav-2);line-height:1.25}

/* ---------- sidebar ----------
   Trước đây là dải tab ngang: 12 mục không đủ chỗ ở 1580px nên "Phân quyền"
   bị cắt cụt. Cột trái xếp được cả 12 mục, nhóm theo việc, và khớp đúng bố cục
   intranet bên portal — hai sản phẩm nhìn như một bộ. */
.shell{display:flex;flex:1;min-height:0;align-items:flex-start}
.side{
  width:var(--side);flex:0 0 var(--side);position:sticky;top:58px;
  height:calc(100vh - 58px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--chrome-grad),var(--chrome);color:var(--on-chrome-2);
  border-right:1px solid var(--chrome-line);padding:14px 10px 20px;
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:var(--chrome-3);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
.navgrp{
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--on-chrome-3);padding:14px 10px 6px;
}
.navgrp:first-child{padding-top:2px}
.tab{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;font-size:13px;
  color:var(--on-chrome-2);border-radius:var(--r-sm);text-align:left;line-height:1.35;
  border-left:2px solid transparent;
}
.tab:hover{background:var(--chrome-3);color:var(--on-chrome)}
.tab.active{background:var(--chrome-3);color:#fff;font-weight:600;border-left-color:var(--brand)}
.tab-ico{width:15px;height:15px;flex:0 0 auto;opacity:.65}
.tab.active .tab-ico{opacity:1}
.tab>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-count{
  font-size:10.5px;font-weight:600;color:var(--on-chrome-2);background:rgba(255,255,255,.1);
  padding:1px 6px;border-radius:9px;flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.tab:hover .tab-count{background:rgba(255,255,255,.16)}
.tab.active .tab-count{background:var(--brand-dark);color:var(--paper)}

.content{padding:22px 26px 40px;flex:1;min-width:0;max-width:1500px}

/* ---------- page head ---------- */
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ptitle{font-size:21px;font-weight:600;letter-spacing:-.02em}
.pmeta{font-size:12px;color:var(--muted);padding-bottom:3px}
.phead-actions{margin-left:auto;display:flex;gap:8px}
.btn{
  padding:7px 13px;border-radius:var(--radius);font-size:12.5px;font-weight:500;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
}
.btn:hover{border-color:var(--line-2);background:#fbfcfd}
.btn-primary{background:var(--brand-dark);border-color:var(--brand-dark);color:var(--paper);font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sm{padding:4px 9px;font-size:11.5px}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-t{font-size:13px;font-weight:600}
.card-note{font-size:11.5px;color:var(--muted);margin-left:auto}
.card-b{padding:14px 16px}

/* ---------- pipeline strip (hero) ---------- */
.funnel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 18px 14px;margin-bottom:16px}
.funnel-top{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.funnel-val{font-size:24px;font-weight:700;letter-spacing:-.025em}
.funnel-lbl{font-size:12.5px;color:var(--muted)}
.funnel-bar{display:flex;gap:3px;height:9px;border-radius:5px;overflow:hidden;margin-bottom:14px}
.funnel-seg{transition:opacity .15s}
.funnel-seg:hover{opacity:.75}
.funnel-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:2px}
.fl{padding:8px 10px;border-radius:5px;text-align:left;width:100%}
.fl:hover{background:var(--surface)}
.fl-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.fl-name{font-size:11.5px;color:var(--ink-2);font-weight:500}
.fl-num{font-size:14px;font-weight:600;letter-spacing:-.015em}
.fl-sub{font-size:11px;color:var(--muted)}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.stat-l{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.stat-v{font-size:17px;font-weight:600;letter-spacing:-.02em}
.stat-d{font-size:11px;color:var(--muted);margin-top:2px}

.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media(max-width:1080px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* ---------- attention list ---------- */
.att{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;align-items:flex-start}
.att:last-child{border-bottom:none}
.att:hover{background:var(--surface)}
.att-flag{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;min-height:30px}
.att-main{flex:1;min-width:0;display:block}
.att-name{font-size:13px;font-weight:500;margin-bottom:1px;display:block}
.att-why{font-size:11.5px;color:var(--muted);display:block}
.att-amt{font-size:12px;font-weight:600;white-space:nowrap;padding-top:2px}

/* ---------- table ---------- */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{
  padding:5px 11px;border:1px solid var(--line);background:var(--paper);border-radius:14px;
  font-size:12px;color:var(--ink-2);
}
.chip:hover{border-color:var(--line-2)}
/* Chip đang chọn dùng MỰC, không dùng đỏ. Signal Red là màu nhấn của thương
   hiệu — rải nó lên chip lọc, nút tạo, ô quyền và tab đang mở cùng lúc thì nó
   không còn nhấn được gì. Giữ đỏ cho hành động chính và trạng thái gấp. */
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-left:auto}
.seg button{padding:5px 12px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}

.tw{background:var(--paper);border:1px solid var(--card-line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  padding:8px 14px;border-bottom:1px solid var(--card-line);background:var(--head);white-space:nowrap;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arw{opacity:.5;font-size:9px;margin-left:3px}
td{padding:8px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--zebra);cursor:pointer}
.t-name{font-weight:500;color:var(--ice-dark)}
tbody tr:hover .t-name{text-decoration:underline}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.trunc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- bảng ảo hoá ----------
   Cố ý trông y hệt <table> ở trên: cùng nền đầu bảng, cùng đường kẻ, cùng
   padding 10px/14px và cỡ chữ 13px, nên đổi qua lại không thấy khác. */
.vt{background:var(--paper);border:1px solid var(--card-line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.vt-head{display:grid;background:var(--head);border-bottom:1px solid var(--card-line)}
.vt-head>span{padding:8px 14px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  letter-spacing:.06em;text-transform:uppercase}
.vt-head>span.sortable{cursor:pointer;user-select:none}
.vt-head>span.sortable:hover{color:var(--ink)}
.vt-head>span.num{text-align:right}
.vt-body{overflow-y:auto;overflow-x:hidden;position:relative;max-height:calc(100vh - 330px);min-height:280px}
.vt-spacer{position:relative;width:100%}
.vt-row{position:absolute;left:0;right:0;display:grid;align-items:center;
  border-bottom:1px solid var(--line-2);cursor:pointer;background:var(--paper)}
.vt-row:hover{background:var(--zebra)}
.vt-row:hover .t-name{text-decoration:underline}
.vt-row>div{padding:8px 14px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-row>div.num{text-align:right;font-variant-numeric:tabular-nums}
.vt-row>div.dim{color:var(--muted)}
.vt-note{padding:7px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);background:var(--zebra)}

/* ---------- command palette ---------- */
.pal-scrim{position:fixed;inset:0;background:rgba(10,10,13,.42);z-index:80;animation:fade .12s ease-out}
.pal{
  position:fixed;z-index:81;left:50%;top:14vh;transform:translateX(-50%);
  width:min(620px,calc(100vw - 32px));background:var(--paper);border-radius:12px;
  box-shadow:0 18px 50px rgba(10,10,13,.28),0 2px 8px rgba(10,10,13,.12);
  overflow:hidden;animation:palin .13s ease-out;
}
@keyframes palin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.pal-in svg{color:var(--muted);flex:0 0 auto}
.pal-in input{flex:1;border:0;outline:none;font-size:15px;background:transparent;min-width:0}
.pal-in input::placeholder{color:var(--muted-2)}
.pal-list{max-height:min(46vh,380px);overflow-y:auto;padding:5px}
.pal-row{
  display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:11px;align-items:baseline;
  width:100%;text-align:left;padding:8px 10px;border-radius:7px;
}
.pal-row.on{background:var(--brand-tint)}
.pal-kind{
  font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pal-row.on .pal-kind{color:var(--brand-dark)}
.pal-lab{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:230px;text-align:right}
.pal-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
.pal-foot{
  display:flex;gap:6px;align-items:center;padding:8px 14px;border-top:1px solid var(--line-2);
  background:var(--zebra);font-size:11px;color:var(--muted);
}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--surface);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2);
}
.pal-in kbd{flex:0 0 auto}
.search-k{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-family:var(--mono);font-size:10px;color:var(--on-chrome-3);border:1px solid rgba(255,255,255,.2);
  border-radius:4px;padding:1px 5px;
}
.search input:focus ~ .search-k{display:none}
@media(max-width:640px){.search-k{display:none}}

/* ---------- chọn hàng loạt + view đã lưu ---------- */
.selcell{width:36px;padding-left:12px!important;padding-right:0!important}
th.selcell{padding-left:12px!important}
.cbx{width:15px;height:15px;border:1.4px solid var(--line);border-radius:3px;display:inline-grid;
  place-items:center;font-size:10px;color:var(--paper);line-height:1;cursor:pointer;flex:0 0 auto;
  background:var(--paper);vertical-align:middle}
.cbx:hover{border-color:var(--ink-2)}
/* .cbx.on ở phần "home bottom sections" tô đỏ (việc cần làm đã xong — đỏ ở đó
   có nghĩa). Ô tích chọn hàng loạt thì không: chọn 3 dòng không phải chuyện gấp.
   Nâng độ cụ thể thay vì đổi rule kia, để hai chỗ giữ được hai ý nghĩa riêng. */
.selcell .cbx.on,th.selcell .cbx.on{background:var(--ink);border-color:var(--ink)}
.bulkbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;
  background:var(--ink);color:var(--paper);border-radius:var(--r-sm);padding:8px 12px;
  box-shadow:0 2px 10px rgba(10,10,13,.18);animation:bulkin .13s ease-out;
}
@keyframes bulkin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.bulk-n{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--accent);color:var(--paper);
  border-radius:5px;padding:2px 8px;font-variant-numeric:tabular-nums}
.bulk-l{font-size:12.5px;color:var(--paper);opacity:.72}
.bulk-warn{font-size:11.5px;color:#ffc9d2}
.bulk-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulkbar .btn{background:transparent;border-color:var(--muted);color:var(--paper)}
.bulkbar .btn:hover{background:var(--ink-2);border-color:var(--ink-2)}
.bulkbar .btn-primary{background:var(--brand-dark);border-color:var(--brand-dark);color:var(--paper)}
.bulkbar .btn-primary:hover{background:var(--brand-dark)}

.views{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.viewchip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--paper);
  border-radius:14px;overflow:hidden;font-size:12px}
.viewchip button{padding:4px 4px 4px 11px;color:var(--ink-2)}
.viewchip .viewx{padding:4px 9px 4px 5px;color:var(--muted-2);font-size:13px;line-height:1}
.viewchip .viewx:hover{color:var(--brand)}
.viewchip:hover{border-color:var(--line-2)}
.viewchip.on{background:var(--ink);border-color:var(--ink)}
.viewchip.on button{color:var(--paper)}
.viewchip.on .viewx{color:var(--paper);opacity:.55}
.viewchip.on .viewx:hover{color:var(--paper);opacity:1}
.viewadd{font-size:12px;color:var(--muted);padding:4px 10px;border:1px dashed var(--line);
  border-radius:14px}
.viewadd:hover{color:var(--ink);border-color:var(--line-2)}

.thrrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.thrrow .curin{max-width:210px}
.btnpair{display:flex;gap:6px;justify-content:flex-end}
.ct-link{display:inline-flex;align-items:center;gap:5px;margin-left:9px;font-size:11.5px;
  font-weight:500;color:var(--ice-dark);border:1px solid var(--line);border-radius:5px;
  padding:2px 8px;vertical-align:middle}
.ct-link:hover{border-color:var(--ice-dark);background:var(--surface);text-decoration:none}
.ct-sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.45}

/* ---------- chỉ số quan hệ ---------- */
.rel{display:flex;align-items:center;gap:8px;min-width:0}
.rel-bar{width:42px;height:4px;border-radius:2px;background:var(--line);flex:0 0 auto;overflow:hidden}
.rel-bar i{display:block;height:100%;border-radius:2px}
.rel-n{font-family:var(--mono);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  width:22px;text-align:right;flex:0 0 auto}
.rel-w{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cool-row{display:flex;align-items:center;gap:11px;padding:9px 16px;border-bottom:1px solid var(--line-2);
  width:100%;text-align:left}
.cool-row:last-child{border-bottom:none}
.cool-row:hover{background:var(--surface)}
.cool-main{flex:1;min-width:0}
.cool-n{font-size:12.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cool-s{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.cool-v{font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.cool-d{font-size:11px;font-weight:600;flex:0 0 auto;text-align:right;white-space:nowrap}

/* ---------- số và tiền ----------
   Portal dùng IBM Plex Mono cho mọi cột tiền để chữ số thẳng hàng theo cột;
   CRM trước đây chỉ bật 'tnum' trên Be Vietnam Pro, gần đúng nhưng không bằng.
   Gom hết ô mang chữ số về một chỗ để hai sản phẩm đọc giống nhau. */
/* CHỈ những ô chắc chắn mang chữ số. Trước đây danh sách này gồm cả .rec-m-v,
   .acres, .acsug — nhưng chúng chứa cả tên khách ("damnboy!") lẫn ngày tháng,
   và IBM Plex Mono làm tên người trông như mã máy. Số thì thẳng cột, chữ thì
   không — đừng gộp hai thứ vào một selector. */
.num,.vt-row>div.num,.stat-v,.kpi-num,.kpi-num b,.lr-n,.ubig,.kcard-a,.ar-amt,
.kcol-v,.t-amt,.hero-v,.tab-count{
  font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
/* trong thẻ tóm tắt bản ghi, chỉ ô tiền mới mono — tên và ngày giữ chữ thường */
.rec-m-v.is-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Tiêu đề lớn và wordmark dùng Archivo */
.ptitle,.lr-h,.hero-n,.sec-head{font-family:var(--disp);letter-spacing:-.025em}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11px;font-weight:500;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.rights{display:flex;gap:3px}
.rights{display:flex;gap:2px}
.r{
  width:19px;height:18px;border-radius:4px;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;background:transparent;color:var(--muted-2);border:1px solid var(--line);
}
.r.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.empty{padding:56px 20px;text-align:center}
.empty-t{font-size:14px;font-weight:500;margin-bottom:4px}
.empty-s{font-size:12.5px;color:var(--muted);margin-bottom:14px}

/* ---------- kanban ---------- */
.kan{display:grid;grid-template-columns:repeat(8,minmax(198px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--paper);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:214px}
.kcol-h{padding:10px 12px;border-bottom:1px solid var(--line-2);border-top:2px solid;border-radius:8px 8px 0 0}
.kcol-t{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kcol-n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.kcol-v{font-size:11.5px;color:var(--muted);margin-top:2px}
.kcol-b{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:70px}
.kcard{border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-align:left;width:100%;background:var(--paper)}
.kcard:hover{border-color:var(--line-2);box-shadow:0 1px 3px rgba(12,59,40,.1)}
.kcard-n{font-size:12.5px;font-weight:500;margin-bottom:3px}
.kcard-m{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.kcard-a{font-weight:600;color:var(--ink)}

/* ---------- report bars ---------- */
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:124px 1fr 148px;gap:11px;align-items:center}
.blabel{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{background:var(--line-2);border-radius:3px;height:17px;overflow:hidden}
.bfill{height:100%;border-radius:3px}
.bval{font-size:11.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- donut & funnel ---------- */
.chartrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-c{position:relative;flex:0 0 auto}
.donut-c svg{display:block}
.donut-seg{transition:opacity .15s}
.donut-seg:hover{opacity:.78}
.donut-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-v{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.donut-l{font-size:10.5px;color:var(--muted)}
.dlegend{flex:1;min-width:236px;display:flex;flex-direction:column;gap:8px}
.dl{display:flex;align-items:center;gap:8px;font-size:12px}
.dl-name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-n{margin-left:auto;font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl-p{font-size:11px;color:var(--muted);width:40px;text-align:right;font-variant-numeric:tabular-nums}

.fn{display:flex;flex-direction:column}
.fn-bar{
  height:42px;border-radius:5px;display:flex;align-items:center;gap:10px;
  padding:0 13px;color:#fff;min-width:112px;
}
.fn-lbl{font-size:12.5px;font-weight:500;opacity:.92}
.fn-n{font-size:17px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.fn-gap{display:flex;align-items:center;gap:7px;padding:6px 0 6px 14px;font-size:11.5px;color:var(--muted)}
.fn-gap svg{opacity:.45}
.fn-rate{font-weight:600;color:var(--ink-2)}

/* ---------- dashboard widgets ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:stretch}
.grid3>.card{display:flex;flex-direction:column}
.grid3>.card>.card-b{flex:1}
@media(max-width:1240px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.grid3{grid-template-columns:minmax(0,1fr)}}

.approve-bar{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.approve-h{padding:11px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px}
.approve-h .card-t{font-size:13px;font-weight:600}
.approve-n{background:var(--brand);color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.approve-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.approve-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.approve-row:last-child{border-bottom:none}
.approve-row:hover{background:var(--zebra)}
.ar-name{font-weight:500;font-size:12.5px;color:var(--ice-dark);cursor:pointer;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-acc{font-size:11.5px;color:var(--muted);width:170px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-amt{font-size:12px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.ar-btn{display:flex;gap:6px;flex:0 0 auto}
@media(max-width:760px){.ar-acc{display:none}}

.bignum{font-size:62px;font-weight:700;color:var(--brand);text-align:center;letter-spacing:-.04em;line-height:1.05;padding:14px 0 2px}
.bignum-l{text-align:center;font-size:12px;color:var(--muted);padding-bottom:10px}

.vchart{display:flex;gap:9px;align-items:stretch;height:206px}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column}
.vtrack{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.vval{font-size:9.5px;font-weight:600;text-align:center;line-height:1.2;word-break:break-word}
.vfill{width:100%;border-radius:4px 4px 0 0;min-height:3px}
.vlbl{font-size:10.5px;color:var(--muted);text-align:center;margin-top:7px;line-height:1.25}

.stable{max-height:218px;overflow-y:auto}
.stable table td{padding:7px 12px;font-size:12px}
.stable table th{padding:7px 12px;font-size:11px;position:sticky;top:0;z-index:1}
.tnote{padding:8px 14px;font-size:11.5px;color:var(--red);border-top:1px solid var(--line-2);background:#fdf5f4}

/* ---------- home bottom sections ---------- */
.sec3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1240px){.sec3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.sec3{grid-template-columns:minmax(0,1fr)}}
.sec-head{
  background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:13px 16px;margin-bottom:12px;font-size:15px;font-weight:600;letter-spacing:-.015em;
}
.colstack{display:flex;flex-direction:column;gap:14px}

.lv-h{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.lv-ico{width:34px;height:34px;border-radius:6px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.lv-h>span:nth-child(2){flex:1;min-width:0}
.lv-t{font-size:13px;font-weight:600;line-height:1.25;display:block}
.lv-s{font-size:11px;color:var(--muted);display:block}
.lv-more{margin-left:auto;font-size:12px;color:var(--ice-dark);font-weight:500;flex:0 0 auto}
.lv-more:hover{text-decoration:underline}

.rec{padding:11px 14px;border-bottom:1px solid var(--line-2)}
.rec:last-child{border-bottom:none}
.rec-n{font-size:13px;font-weight:600;color:var(--ice-dark);margin-bottom:6px;display:block;text-align:left}
.rec-n:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:4px 10px;font-size:12px;align-items:center}
.kv-k{color:var(--muted)}
.kv-v{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx{width:13px;height:13px;border:1.4px solid var(--line);border-radius:2px;display:inline-grid;place-items:center;font-size:9px;color:#fff;line-height:1}
.cbx.on{background:var(--brand);border-color:var(--brand)}

.ev{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.ev:last-child{border-bottom:none}
.ev:hover{background:var(--zebra)}
.ev-time{font-size:11.5px;font-weight:600;color:var(--ice-dark);width:44px;flex:0 0 auto;padding-top:1px}
.ev .tl-b{display:block;flex:1;min-width:0}
.ev-t{font-size:12.5px;font-weight:500;line-height:1.3;display:block}
.ev-s{font-size:11px;color:var(--muted);display:block}
.mini-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
.subhead{padding:8px 14px 4px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.cardfoot{border-top:1px solid var(--line-2)}
.cardfoot button{width:100%;padding:9px;font-size:12px;color:var(--ice-dark);font-weight:500}
.cardfoot button:hover{background:var(--surface)}

/* ---------- record form modal ---------- */
.mscrim{position:fixed;inset:0;background:rgba(20,22,26,.38);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:22px 16px;overflow-y:auto;animation:fade .14s ease-out}
.modal{background:var(--paper);border-radius:10px;width:min(1080px,100%);max-height:calc(100vh - 44px);
  display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(12,59,40,.3);animation:pop .18s cubic-bezier(.22,.61,.36,1)}
@keyframes pop{from{transform:translateY(10px);opacity:.5}to{transform:none;opacity:1}}
.modal-h{padding:15px 22px;border-bottom:1px solid var(--line);text-align:center;position:relative;flex:0 0 auto}
.modal-t{font-size:18px;font-weight:600;letter-spacing:-.015em}
.modal-x{position:absolute;right:12px;top:11px;width:28px;height:28px;border-radius:5px;color:var(--muted);
  display:grid;place-items:center;font-size:18px}
.modal-x:hover{background:var(--surface);color:var(--ink)}
.modal-b{overflow-y:auto;flex:1;padding-bottom:6px}
.req-note{text-align:right;padding:11px 22px 2px;font-size:11.5px;color:var(--muted)}
.fsec{background:var(--surface);padding:8px 22px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;padding:17px 22px 6px;align-items:start}
@media(max-width:860px){.fgrid{grid-template-columns:1fr;gap:0}}
.fgrid.one{grid-template-columns:1fr}
.frow{display:grid;grid-template-columns:138px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:13px}
@media(max-width:560px){.frow{grid-template-columns:1fr;gap:4px}}
.flabel{font-size:12.5px;color:var(--ink-2);padding-top:8px;display:flex;gap:5px;align-items:flex-start;line-height:1.35}
.star{color:var(--red);font-weight:700;line-height:1}
.fin{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:4px;font-size:13px;background:var(--paper)}
.fin:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,46,76,.13)}
.fin.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,65,58,.09)}
textarea.fin{min-height:64px;resize:vertical;font-family:inherit}
.ferr{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.subl{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.substack>div{margin-bottom:10px}
.substack>div:last-child{margin-bottom:0}
.fchk{display:flex;align-items:center;gap:8px;padding-top:8px;font-size:13px}
.fchk .cbox{cursor:pointer}
.info{width:14px;height:14px;border-radius:50%;background:#7d8794;color:#fff;font-size:9px;font-weight:700;
  display:inline-grid;place-items:center;cursor:help;position:relative;flex:0 0 auto;margin-top:2px}
.info:hover{background:#4c5563}
.info:hover::after{content:attr(data-tip);position:absolute;left:-10px;bottom:calc(100% + 9px);
  background:#16233a;color:#fff;padding:9px 12px;border-radius:6px;
  font-size:11.5px;font-weight:400;width:310px;line-height:1.45;z-index:9;text-align:left;
  box-shadow:0 4px 14px rgba(12,20,35,.3)}
/* cột phải: neo mép phải để không tràn khỏi hộp thoại */
.fgrid>div:last-child .info:hover::after{left:auto;right:-10px}
.modal-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:center;
  background:var(--zebra);border-radius:0 0 10px 10px;flex:0 0 auto}

/* ---------- import wizard ---------- */
.imp-hero{background:var(--brand-tint);display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:28px 30px;align-items:center}
@media(max-width:820px){.imp-hero{grid-template-columns:1fr;padding:20px}}
.imp-art{text-align:center}
.imp-t{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:14px 0 8px}
.imp-s{font-size:13px;color:var(--ink-2);line-height:1.55}
.imp-n{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.imp-opt{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:17px 18px;
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;margin-bottom:14px}
.imp-opt:last-child{margin-bottom:0}
.imp-opt:hover{border-color:var(--brand)}
.imp-opt.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,46,76,.18)}
.imp-opt>span:first-child{flex:1;min-width:0}
.imp-opt-t{font-size:14px;font-weight:600;margin-bottom:4px;display:block}
.imp-opt-d{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.imp-ico{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;margin-left:auto;
  flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em}
.imp-body{padding:22px 26px}
.drop{border:2px dashed var(--line-2);border-radius:8px;padding:32px 20px;text-align:center;cursor:pointer;background:#fbfcfd}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-tint)}
.drop-t{font-size:13px;font-weight:500;margin-top:9px}
.drop-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.imp-ok{background:var(--brand-tint);border:1px solid var(--line);border-radius:6px;padding:9px 13px;
  font-size:12.5px;color:var(--brand-dark);font-weight:500;margin-bottom:14px}
.imp-warn{background:#fdf5f4;border:1px solid #f0cdc9;border-radius:6px;padding:9px 13px;
  font-size:12.5px;color:var(--red);margin-bottom:14px}
.maptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.maptbl th{text-align:left;font-size:11.5px;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
.maptbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.maptbl select{width:100%;padding:5px 8px;border:1px solid var(--line-2);border-radius:4px;font-size:12.5px;background:var(--paper)}
.mapscroll{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:7px}
.imp-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;
  background:var(--zebra);border-radius:0 0 10px 10px;flex:0 0 auto}
.steps{display:flex;align-items:center;gap:0;flex:1;max-width:380px}
.sdot{width:11px;height:11px;border-radius:50%;background:#d3d9e0;flex:0 0 auto}
.sdot.on{background:var(--brand);box-shadow:0 0 0 3px rgba(255,46,76,.2)}
.sdot.done{background:var(--brand)}
.sline{height:2px;background:#e0e5ea;flex:1}
.sline.done{background:var(--brand)}

/* ---------- audit log ---------- */
.aud-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.aud-tools select,.aud-tools input[type=date]{padding:6px 9px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:12.5px;background:var(--paper);color:var(--ink)}
.aud-lbl{font-size:11.5px;color:var(--muted)}
.aud-note{display:flex;gap:8px;align-items:flex-start;background:#fffdf4;border:1px solid #f0e2b8;
  border-radius:7px;padding:9px 13px;font-size:12px;color:#7a6320;margin-bottom:14px;line-height:1.5}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.atag{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.a-create{background:#e9f4ee;color:#0a5c3b}
.a-update{background:#eef1f7;color:#3d444f}
.a-approve{background:#e9f4ee;color:#2b8f55}
.a-reject{background:#fdeceb;color:#c0413a}
.a-convert{background:#f0edfb;color:#5b45b8}
.a-import{background:#e8f4f6;color:#136c7d}
.a-note{background:#fdf3e8;color:#9a6410}
.a-login{background:#eef1f7;color:#6b7280}
.diff-old{color:var(--muted);text-decoration:line-through}
.diff-new{color:var(--ink);font-weight:500}
.hist{border-top:1px solid var(--line-2);margin-top:16px;padding-top:14px}
.chrow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-2);font-size:12px}
.chrow:last-child{border-bottom:none}
.htime{color:var(--muted);font-size:11px;line-height:1.35}
.hmeta{font-size:10.5px;color:var(--muted);margin-top:2px}

/* ---------- roles & permissions ---------- */
.me-pick{
  background:transparent;border:none;color:#fff;font-size:12.5px;font-weight:500;
  padding:0 18px 0 0;cursor:pointer;appearance:none;line-height:1.25;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239a9aa4' stroke-width='1.4' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right center;
}
.me-pick option{color:#14161a;background:#fff}
.me-pick:focus{outline:none;text-decoration:underline}
.rolechip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.r-manager{background:var(--brand-tint);color:var(--brand-dark)}
.r-ar{background:#e8f4f6;color:#136c7d}
.r-lm{background:#f0edfb;color:#5b45b8}
.permyes{color:var(--brand);font-weight:700}
.permno{color:#c8ced6}
.ro-note{background:#fdf8ec;border:1px solid #f0e0bd;border-radius:6px;padding:9px 12px;
  font-size:12px;color:#8a6512;margin-bottom:14px}
.noperm{padding:60px 20px;text-align:center}
.noperm-t{font-size:15px;font-weight:600;margin-bottom:5px}
.noperm-s{font-size:12.5px;color:var(--muted)}

/* ---------- opportunity form extras ---------- */
.calcv{font-size:13.5px;padding-top:7px}
.calcn{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px}
.dual{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:center}
.dual select{height:132px;border:1px solid var(--line-2);border-radius:4px;font-size:12.5px;padding:4px;background:var(--paper)}
.dual-b{display:flex;flex-direction:column;gap:6px}
.dual-b button{border:1px solid var(--line);border-radius:4px;padding:5px 0;background:var(--paper);font-size:11px}
.dual-b button:hover{border-color:var(--brand);color:var(--brand-dark)}
.dual-l{font-size:11px;color:var(--muted);margin-bottom:3px}
.pctin{position:relative}
.pctin input{padding-right:26px}
.pctin::after{content:'%';position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--muted);pointer-events:none}
.curin{position:relative}
.curin input{padding-left:42px}
.curin::before{content:attr(data-cur);position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:11.5px;color:var(--muted);pointer-events:none;font-weight:500}

/* ---------- kpi card ---------- */
.kpi-row{display:grid;grid-template-columns:150px 1fr 128px;gap:14px;align-items:center;padding:9px 0}
@media(max-width:760px){.kpi-row{grid-template-columns:1fr;gap:5px;padding:11px 0}}
.kpi-name{font-size:13px;font-weight:500}
.kpi-sub{font-size:11px;color:var(--muted)}
.kpi-track{background:var(--line-2);border-radius:4px;height:20px;overflow:hidden;position:relative}
.kpi-fill{height:100%;border-radius:4px}
.kpi-num{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-num b{font-size:15px}
.kpi-tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;margin-left:6px}
.kpi-conv{display:flex;align-items:center;gap:8px;padding:3px 0 3px 12px;font-size:11.5px;color:var(--muted);
  border-left:2px solid var(--line);margin-left:24px}
.kpi-conv b{color:var(--ink-2)}

/* ---------- usage card ---------- */
.uwrap{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media(max-width:760px){.uwrap{grid-template-columns:1fr;gap:16px}}
.ubig{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15;white-space:nowrap}
.ulbl{font-size:11.5px;color:var(--muted);margin-top:3px}
.umeta{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.ubars{display:flex;align-items:stretch;gap:7px;height:88px}
.ubar{flex:1;display:flex;flex-direction:column;min-width:0}
.ubar-t{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.ubar-f{width:100%;border-radius:3px 3px 0 0;background:var(--ice-dark);min-height:3px}
.ubar-f.now{background:var(--brand)}
.ubar-l{font-size:10px;color:var(--muted);text-align:center;margin-top:5px}
.unote{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:12px;
  border-top:1px solid var(--line-2);padding-top:10px}

/* ---------- advance calculation ---------- */
.acbox{background:var(--zebra);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 22px 16px}
.acbox-t{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:11px;
  letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.acmult{display:flex;gap:6px;margin-left:auto}
.acmult button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:3px 10px;font-size:11.5px}
.acmult button:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-tint)}
.acres{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:2px}
.acr{padding:8px 10px;border-radius:5px}
.acr:hover{background:var(--paper)}
.acr-l{font-size:11px;color:var(--muted);line-height:1.35;min-height:30px}
.acr-v{font-size:15px;font-weight:600;letter-spacing:-.015em;margin-top:2px}
.acr-v.good{color:var(--green)} .acr-v.bad{color:var(--brand-dark)}
.actrigs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
@media(max-width:820px){.actrigs{grid-template-columns:1fr}}
.actrig{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.actrig-h{font-size:12.5px;font-weight:600;margin-bottom:2px}
.actrig-s{font-size:11px;color:var(--muted);margin-bottom:10px}
.actrig-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
.actrig-row b{font-variant-numeric:tabular-nums}
.actrig-cap{border-top:1px solid var(--line-2);margin-top:8px;padding-top:8px}
.acwarn{font-size:11.5px;color:var(--warn);background:#fdf8ec;border:1px solid #f0e0bd;
  border-radius:5px;padding:8px 11px;margin-top:10px;line-height:1.5}

.acsug{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.acsug{grid-template-columns:repeat(2,1fr)}}
.acsug-c{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:11px 12px}
.acsug-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.acsug-a{font-size:15px;font-weight:600;letter-spacing:-.015em;margin:2px 0 8px}
.acsug-b{width:100%;margin-top:9px;padding:6px;border-radius:5px;border:1px solid;font-size:11.5px;font-weight:600}
.acsug-b:hover{filter:brightness(.96)}

/* ---------- opportunity record page ---------- */
.rec-wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:1180px){.rec-wrap{grid-template-columns:1fr}}
.rec-head{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.rec-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.rec-eyebrow{font-size:11.5px;color:var(--muted)}
.rec-title{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.rec-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.rec-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2)}
.rec-m-l{font-size:11px;color:var(--muted)}
.rec-m-v{font-size:13.5px;font-weight:500;margin-top:2px}

.path{display:flex;gap:3px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.path-s{
  flex:1;min-width:118px;background:#eceef1;color:var(--ink-2);font-size:12px;font-weight:500;
  padding:10px 10px 10px 22px;position:relative;white-space:nowrap;text-align:center;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%);
}
.path-s:first-child{clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);padding-left:12px}
.path-s.done{background:#cfd9e4;color:#2b3a4d}
.path-s.now{background:var(--nav);color:#fff;font-weight:600}
.path-s.lost{background:var(--red);color:#fff}
.path-s:hover{filter:brightness(.97)}

.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0;overflow-x:auto}
.rtab{padding:10px 14px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.rtab:hover{color:var(--ink);background:var(--surface)}
.rtab.on{color:var(--brand-dark);border-bottom-color:var(--brand);font-weight:600}

.dgrp{background:var(--surface);padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;padding:12px 16px}
@media(max-width:860px){.dgrid{grid-template-columns:1fr}}
.drow{display:grid;grid-template-columns:150px minmax(0,1fr) 22px;gap:10px;align-items:start;
  padding:7px 0;border-bottom:1px solid var(--line-2)}
.drow:last-child{border-bottom:none}
.dlab{font-size:12px;color:var(--muted);line-height:1.4}
.dval{font-size:13px;word-break:break-word}
.dval a{word-break:break-all}
.dpen{opacity:0;border:none;color:var(--muted);display:grid;place-items:center;width:20px;height:20px;border-radius:4px}
.drow:hover .dpen{opacity:1}
.dpen:hover{background:var(--surface);color:var(--brand-dark)}
.dedit{width:100%;padding:4px 7px;border:2px solid var(--brand);border-radius:4px;font-size:12.5px}

.actbar{display:flex;gap:2px;border-bottom:1px solid var(--line-2);padding:0 4px}
.actbtn{padding:8px 11px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.actbtn.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.actbtn:hover{color:var(--ink)}
.chat-in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;
  resize:vertical;min-height:62px;font-family:inherit}
.chat-in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,46,76,.15)}
.chat-foot{display:flex;align-items:center;gap:9px;margin-top:8px}
.chat-count{font-size:11px;color:var(--muted);margin-left:auto}
.chat-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.chat-item:last-child{border-bottom:none}
.chat-av{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-size:11px;font-weight:600;color:var(--ink-2);flex:0 0 auto}
.chat-who{font-size:12.5px;font-weight:600}
.chat-ts{font-size:11px;color:var(--muted)}
.chat-tx{font-size:13px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.guide{background:var(--zebra);border:1px solid var(--line-2);border-radius:7px;padding:12px 14px}
.guide-t{font-size:12.5px;font-weight:600;margin-bottom:7px}
.guide ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.75}

/* ---------- locked rows & transfers ---------- */
.srchnote{background:var(--zebra);border:1px solid var(--line);border-radius:7px;padding:9px 13px;
  font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;display:flex;gap:8px}
.srchnote svg{flex:0 0 auto;margin-top:2px;opacity:.6}
.srchfound{background:var(--brand-tint);border-color:#f3c0c8;color:var(--brand-dark)}
.lockcell{color:#b6bcc6;font-size:12px;letter-spacing:.06em}
tr.locked td{background:#fcfcfd}
tr.locked:hover td{background:#f7f8fa}
.lockbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dupitem{border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin-bottom:9px}
.dupitem b{font-size:13px}
.dupmeta{font-size:11.5px;color:var(--muted);margin-top:3px}
.dupfield{display:inline-block;background:var(--brand-tint);color:var(--brand-dark);
  font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;margin:3px 4px 0 0}

/* ---------- user sign-in analysis ---------- */
.ua-h{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.ua-n{font-size:24px;font-weight:700;letter-spacing:-.02em}
.ua-s{font-size:12px;color:var(--muted)}
.ua-legend{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px;font-size:11px;color:var(--muted)}
.ua-lg{display:flex;align-items:center;gap:5px}
.ua-sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.ua-row{padding:9px 0;border-bottom:1px solid var(--line-2)}
.ua-row:last-child{border-bottom:none}
.ua-top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.ua-ip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ua-loc{font-size:11px;color:var(--muted)}
.ua-pct{margin-left:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ua-bar{height:16px;background:var(--line-2);border-radius:3px;overflow:hidden}
.ua-fill{height:100%;border-radius:3px}
.ua-meta{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.ua-clk{cursor:pointer;color:var(--ice-dark);font-weight:500}
.ua-clk:hover{text-decoration:underline}

/* ---------- inline edit ---------- */
.icell{display:flex;align-items:center;gap:7px;min-height:22px}
.icell.num{justify-content:flex-end}
.ipen{
  opacity:0;border:1px solid var(--line);border-radius:4px;width:21px;height:21px;
  display:grid;place-items:center;background:var(--paper);flex:0 0 auto;color:var(--muted);
}
tbody tr:hover .ipen{opacity:1}
.ipen:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-tint)}
.ipen:focus-visible{opacity:1}
.iedit{
  width:100%;padding:4px 7px;border:2px solid var(--brand);border-radius:4px;
  font-size:12.5px;background:var(--paper);box-shadow:0 2px 8px rgba(255,46,76,.18);
}
.iedit:focus{outline:none}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.28);z-index:40;animation:fade .14s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(500px,94vw);background:var(--paper);
  z-index:41;display:flex;flex-direction:column;box-shadow:-3px 0 22px rgba(20,22,26,.16);
  animation:slide .2s cubic-bezier(.22,.61,.36,1);
}
@keyframes slide{from{transform:translateX(22px);opacity:.4}to{transform:none;opacity:1}}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-eyebrow{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.dr-title{font-size:17px;font-weight:600;letter-spacing:-.015em}
.dr-x{margin-left:auto;width:28px;height:28px;border-radius:5px;color:var(--muted);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.dr-x:hover{background:var(--surface);color:var(--ink)}
.dr-b{padding:16px 18px;overflow-y:auto;flex:1}
.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--zebra)}
.fld{margin-bottom:13px}
.fld-l{font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld-v{font-size:13.5px}
.in{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font-size:13px}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,46,76,.13)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sec{border-top:1px solid var(--line-2);margin-top:16px;padding-top:14px}
.sec-t{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:10px}
.rights-pick{display:flex;gap:7px;flex-wrap:wrap}
.rp{padding:6px 12px;border:1px solid var(--line);border-radius:15px;font-size:12px;color:var(--ink-2)}
.rp.on{background:var(--brand-tint);border-color:#9fd0b6;color:var(--brand-dark);font-weight:600}
.tl{display:flex;gap:10px;padding-bottom:13px;position:relative}
.tl:not(:last-child)::before{content:'';position:absolute;left:5px;top:15px;bottom:0;width:1px;background:var(--line)}
.tl-d{width:11px;height:11px;border-radius:50%;border:2px solid var(--paper);background:var(--line);flex:0 0 auto;margin-top:3px;z-index:1}
.tl-b{flex:1;min-width:0}
.tl-t{font-size:12.5px;margin-bottom:1px}
.tl-m{font-size:11px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.cbox{width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;color:#fff}
.cbox.on{background:var(--green);border-color:var(--green)}
.done{color:var(--muted);text-decoration:line-through}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 17px;border-radius:18px;font-size:12.5px;
  z-index:60;box-shadow:0 3px 14px rgba(20,22,26,.28);animation:up .2s ease-out;
}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

@media(max-width:900px){
  .content{padding:14px}
  .hrow{padding:0 12px;gap:10px}
  .tabs{padding:0 6px}
  .me-name,.me-role{display:none}
  .brand-sub{display:none}
  /* cho phép hàng trên xuống dòng ngay từ khổ tablet — dưới 900px tổng bề ngang
     của logo + tìm kiếm + USD/VND + VI/EN + Snapshot + người dùng đã vượt màn hình */
  .hrow{height:auto;padding-top:8px;padding-bottom:8px}
  .hrow-in{flex-wrap:wrap;row-gap:8px}
}

/* ---------- điện thoại ----------
   .hrow là flex KHÔNG wrap, và .search có min-width:180px, nên ở khổ 390px
   các con của .hrow-in tràn ra ngoài và đẩy scrollWidth của cả tài liệu lên
   ~814px: trang trượt ngang và thanh header dính bị trôi khỏi màn hình.
   Breakpoint nhỏ nhất trước đây là 560px nên không có gì đỡ cho điện thoại.
   Cho hàng trên xuống dòng và đẩy ô tìm kiếm thành một hàng riêng full-width.
   .tabs vốn đã có overflow-x:auto — nó chỉ tràn theo vì bị .hrow kéo rộng. */
/* Dưới 900px cột trái chuyển thành dải ngang cuộn được, dính dưới thanh trên —
   màn hẹp không đủ chỗ cho 212px cột mà vẫn còn chỗ đọc nội dung. */
@media(max-width:900px){
  .shell{display:block}
  .side{
    width:auto;flex:none;position:sticky;top:58px;height:auto;z-index:20;
    display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    border-right:0;border-bottom:1px solid var(--line);padding:7px 10px;
  }
  .side::-webkit-scrollbar{display:none}
  .navgrp{display:none}
  .tab{width:auto;flex:0 0 auto;border-left:0;padding:6px 11px}
  .tab.active{border-left:0}
  .content{max-width:none;padding:16px 14px 32px}
}
@media(max-width:640px){
  .hrow{height:auto;padding:8px 12px}
  .hrow-in{flex-wrap:wrap;gap:9px}
  .search{order:9;flex:1 1 100%;min-width:0;max-width:none;margin-left:0}
  .lang{margin-left:auto}
  .me{padding-left:9px;gap:6px}
  .content{padding:14px 12px}
  .phead-actions{margin-left:0;width:100%}
  /* tiêu đề thẻ là flex không wrap — tên dài cộng ghi chú bên phải đẩy min-content
     của cả thẻ vượt bề ngang màn hình, kéo theo cả lưới chứa nó */
  .card-h{flex-wrap:wrap;row-gap:4px}
  .card-note{margin-left:0}
  /* bảng và kanban vẫn được rộng hơn, nhưng phải cuộn trong khung của nó */
  .tw{max-width:100%}
  .kan{grid-auto-flow:column;grid-template-columns:none}
}
@media(max-width:430px){
  .stats{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .drawer{width:100%;max-width:100%}
}
</style>
</head>

function netOf(name){ const p=USER_NET[name]; return (p&&p.length)?p[0]:{ip:'—',dev:'—',loc:['—','—']}; }
function netPick(name, i){
  const p=USER_NET[name]; if(!p||!p.length) return {ip:'—',dev:'—',loc:['—','—']};
  const tot=p.reduce((a,b)=>a+b.w,0);
  let r=((i*41)+((i*i)%7))%tot;
  for(let j=0;j<p.length;j++){ if(r<p[j].w) return p[j]; r-=p[j].w; }
  return p[0];
}

function tickUsage(){
  const active = document.visibilityState==='visible' && (Date.now()-LAST_ACT) < 90000
                 && document.getElementById('app') && document.getElementById('app').style.display!=='none';
  USAGE_LIVE = !!active;
  if(active){
    SESSION++;
    const u = USAGE[ME]; if(u) u.today++;
  }
  paintUsage();
}
function paintUsage(){
  const u = USAGE[ME]; if(!u) return;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set('uToday', fmtDur(u.today));
  set('uSession', fmtDur(SESSION));
  const dot = document.getElementById('uDot');
  if(dot){
    dot.style.background = USAGE_LIVE ? 'var(--green)' : '#c3cad3';
    dot.title = USAGE_LIVE ? t('usageLive') : t('usageIdle');
  }
  const lab = document.getElementById('uState');
  if(lab) lab.textContent = USAGE_LIVE ? t('usageLive') : t('usageIdle');
}

}
function decideTransfer(trId, ok){
  const r = DB.transfers.find(x=>x.id===trId); if(!r) return;
  r.status = ok ? 'approved' : 'rejected';
  if(ok){
    const rec = r.objType==='opp' ? DB.opps.find(x=>x.id===r.objId) : DB.leads.find(x=>x.id===r.objId);
    if(rec){
      logDiff(r.objType, rec.id, rec.name, 'owner', rec.owner, r.to);
      rec.owner = r.to;
    }
    toast(t('transferOk',{n:r.objName, u:r.to}));
  } else toast(t('transferNo'));
  saveSoon();
  render();
}

function logAudit(o){
  const net = SEED_ON ? netPick(o.user||ME, SEED_I++) : netOf(o.user||ME);
  DB.audit.push({
    id:'g'+(++uid), ts:o.ts||nowTs(), user:o.user||ME, ip:net.ip, dev:net.dev, loc:net.loc,
    objType:o.objType, objId:o.objId||'', objName:o.objName||'', action:o.action,
    field:o.field||'', oldV:(o.oldV===undefined?'':o.oldV), newV:(o.newV===undefined?'':o.newV),
    note:o.note||''
  });
  saveSoon();
}
function logDiff(objType, objId, objName, field, oldV, newV, user){
  const same = (oldV instanceof Date && newV instanceof Date)
    ? oldV.getTime()===newV.getTime() : oldV===newV;
  if(same) return false;
  logAudit({objType,objId,objName,action:'update',field,oldV,newV,user});
  return true;
}

function fx(n){ return cur==='VND' ? n*FX : n; }

      .format((n||0)*FX)+' VND';

}

/* Thoát cả dấu nháy ĐƠN và backtick, không chỉ nháy kép. Bản đầu bỏ sót chúng và
   hồi đó chưa khai thác được vì không chuỗi dữ liệu nào rơi vào thuộc tính dùng
   nháy đơn. Giờ khác: đường dẫn hợp đồng do PHÍA KHÁC ghi vào localStorage sẽ đi
   thẳng vào href, và một URL chứa dấu nháy đơn là đủ để thoát ra ngoài thuộc tính.
   Danh mục tên thật cũng có dấu nháy đơn (nae & de'lay), nên đây còn là chuyện
   hiển thị đúng chứ không riêng bảo mật. */
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"'`]/g, c=>ESC_MAP[c]); }
function toast(msg){
  const el=document.getElementById('toast');
  el.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(window._tt); window._tt=setTimeout(()=>el.innerHTML='',2200);
}
