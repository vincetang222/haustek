function saveLeadForm(again){
  const req = ['lf_last','lf_title','lf_company','lf_status','lf_deal'];
  let ok = true, firstBad = null;
  req.forEach(id=>{
    const el = document.getElementById(id);
    const bad = !el.value.trim();
    el.classList.toggle('err', bad);
    const er = document.getElementById(id+'_err');
    if(er) er.style.display = bad ? 'block' : 'none';
    if(bad){ ok=false; if(!firstBad) firstBad=el; }
  });
  if(!ok){ firstBad.focus(); firstBad.scrollIntoView({block:'center'}); return; }

  const v = id => { const e=document.getElementById(id); return e? e.value.trim() : ''; };
  const n = id => { const x=parseInt(v(id)||'0',10); return isNaN(x)?0:x; };
  const full = [v('lf_sal'), v('lf_first'), v('lf_mid'), v('lf_last'), v('lf_suffix')]
    .filter(Boolean).join(' ');

  const cand = {
    id:'l'+(++uid), name:full, company:v('lf_company'), title:v('lf_title'),
    email:v('lf_email'), phone:v('lf_mobile'), status:v('lf_status'),
    source:v('lf_source')||'other', owner:ME, created:TODAY,
    contactPerson:v('lf_contact'), website:v('lf_web'), income:n('lf_income'), bu:v('lf_bu'),
    rights:{dist:chkOn('lf_dist'), pub:chkOn('lf_pub'), yt:chkOn('lf_yt')},
    dealType:v('lf_deal'), country:v('lf_country'), tier:v('lf_tier'), notes:v('lf_notes'),
    social:{spf:n('lf_spf'), igf:n('lf_igf'), spl:n('lf_spl'), yts:n('lf_yts'),
            sps:n('lf_sps'), ytv:n('lf_ytv'), ttf:n('lf_ttf'), fbf:n('lf_fbf')},
    links:{sp:v('lf_spu'), ig:v('lf_igu'), tt:v('lf_ttu'), yt:v('lf_ytu'), am:v('lf_amu')},
    addr:{street:v('lf_street'), city:v('lf_city'), state:v('lf_state'),
          zip:v('lf_zip'), country:v('lf_addrcountry')}
  };
  const finish = ()=>{
    DB.leads.unshift(cand);
    DB.acts.push({id:'v'+(++uid), refId:cand.id, type:'note',
      text:'Tạo lead thủ công.', date:TODAY, who:ME});
    logAudit({objType:'lead', objId:cand.id, objName:full, action:'create'});
    toast(t('created',{n:full}));
    state.view='leads'; state.leadFilter='all';
    if(again){ render(); openLeadForm(); } else { closeDrawer(); render(); }
  };
  const dups = dupFindLead(cand);
  if(dups.length) dupWarn(dups, finish); else finish();
}

   rồi Enter. Một ô duy nhất tìm cả bốn loại bản ghi và cả các lệnh điều hướng.

   Tôn trọng phân quyền: chỉ tìm trong phạm vi poolOpps/poolLeads/sAccounts/
   sContacts, đúng như các bảng. Palette không được là cửa sau để A&R thấy
   bản ghi của đồng nghiệp. */
let PAL = {open:false, q:'', sel:0, items:[]};
const PAL_MAX = 10;
function palMatch(s, q){ return String(s||'').toLowerCase().indexOf(q) >= 0; }
function palBuild(q){
  const out = [];
  if(!q){
    NAV.filter(it=>navAllowed(it.id)).forEach(it=>
      out.push({k:'go', id:it.id, lab:t(it.id), sub:t('palGo'), ico:it.icon}));
    return out.slice(0, 10);
  }
  /* Hạn ngạch theo TỪNG loại, không cắt theo tổng. Nếu cắt theo tổng thì loại
     nào quét trước sẽ ăn hết chỗ — với vài nghìn cơ hội, người dùng gõ tên một
     label sẽ chỉ thấy toàn deal và tưởng khách hàng đó không tồn tại. Luôn để
     dành chỗ cho mỗi loại, rồi mới cắt phần thừa. */
  const take = (list, n, fn)=>{
    const r = [];
    for(let i=0;i<list.length && r.length<n;i++){ const x = fn(list[i]); if(x) r.push(x); }
    return r;
  };
  const Q = 3;
  out.push(...take(poolOpps(), Q, o=>(palMatch(o.name,q)||palMatch(accName(o.accountId),q))
    ? {k:'opp', id:o.id, lab:o.name, sub:t('opps')+' · '+accName(o.accountId)+' · '+money(o.amount)} : null));
  out.push(...take(poolLeads(), Q, l=>(palMatch(l.name,q)||palMatch(l.company,q))
    ? {k:'lead', id:l.id, lab:l.name, sub:t('leads')+(l.company?' · '+l.company:'')} : null));
  out.push(...take(sAccounts(), Q, a=>palMatch(a.name,q)
    ? {k:'account', id:a.id, lab:a.name, sub:t('accounts')+' · '+t('ty_'+a.type)} : null));
  out.push(...take(sContacts(), Q, c=>(palMatch(c.name,q)||palMatch(c.email,q))
    ? {k:'contact', id:c.id, lab:c.name, sub:t('contacts')+(c.email?' · '+c.email:'')} : null));
  out.push(...take(NAV.filter(it=>navAllowed(it.id)), 2, it=>palMatch(t(it.id),q)
    ? {k:'go', id:it.id, lab:t(it.id), sub:t('palGo'), ico:it.icon} : null));
  return out.slice(0, PAL_MAX);
}
function palRender(){
  const el = document.getElementById('pal');
  if(!PAL.open){ el.innerHTML=''; return; }
  PAL.items = palBuild(PAL.q.trim().toLowerCase());
  if(PAL.sel >= PAL.items.length) PAL.sel = Math.max(0, PAL.items.length-1);
  const KIND = {opp:'opps', lead:'leads', account:'accounts', contact:'contacts', go:'palGo'};
  el.innerHTML =
    '<div class="pal-scrim" onclick="palClose()"></div>'+
    '<div class="pal" role="dialog" aria-modal="true" aria-label="'+esc(t('palTitle'))+'">'+
      '<div class="pal-in">'+
        '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">'+
          '<circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>'+
        '<input id="palQ" placeholder="'+esc(t('palPh'))+'" autocomplete="off" value="'+esc(PAL.q)+'">'+
        '<kbd>esc</kbd>'+
      '</div>'+
      (PAL.items.length
        ? '<div class="pal-list">'+PAL.items.map((it,i)=>
            '<button class="pal-row'+(i===PAL.sel?' on':'')+'" data-i="'+i+'">'+
              '<span class="pal-kind">'+esc(t(KIND[it.k]||'palGo'))+'</span>'+
              '<span class="pal-lab">'+esc(it.lab)+'</span>'+
              '<span class="pal-sub">'+esc(it.sub)+'</span>'+
            '</button>').join('')+'</div>'
        : '<div class="pal-empty">'+esc(t('palNone'))+'</div>')+
      '<div class="pal-foot"><kbd>↑</kbd><kbd>↓</kbd> '+esc(t('palMove'))+
        ' <kbd>↵</kbd> '+esc(t('palOpen'))+'</div>'+
    '</div>';
  const inp = document.getElementById('palQ');
  inp.focus(); inp.setSelectionRange(PAL.q.length, PAL.q.length);
  inp.oninput = ()=>{ PAL.q = inp.value; PAL.sel = 0; palRender(); };
  el.querySelectorAll('.pal-row').forEach(b=>{
    b.onmouseenter = ()=>{ PAL.sel = +b.dataset.i; el.querySelectorAll('.pal-row').forEach(x=>
      x.classList.toggle('on', x===b)); };
    b.onclick = ()=>palGo(+b.dataset.i);
  });
}
function palOpen(){ PAL.open=true; PAL.q=''; PAL.sel=0; palRender(); }
function palClose(){ PAL.open=false; palRender(); }
function palGo(i){
  const it = PAL.items[i]; if(!it) return;
  palClose();
  if(it.k==='go')       go(it.id);
  else if(it.k==='opp'){ closeDrawer(); openOpp(it.id); }
  else                   openDrawer(it.k, it.id);
}
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||'')) || e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(document.getElementById('app').style.display==='none') return;
    PAL.open ? palClose() : palOpen();
    return;
  }
  if(!PAL.open){
    /* "/" mở palette như Linear — nhưng không cướp phím khi đang gõ vào ô nhập */
    if(e.key==='/' && !typing && document.getElementById('app').style.display!=='none'){
      e.preventDefault(); palOpen();
    }
    return;
  }
  if(e.key==='Escape'){ e.preventDefault(); palClose(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); PAL.sel=Math.min(PAL.sel+1, PAL.items.length-1); palRender(); }
  else if(e.key==='ArrowUp'){   e.preventDefault(); PAL.sel=Math.max(PAL.sel-1, 0); palRender(); }
  else if(e.key==='Enter'){     e.preventDefault(); palGo(PAL.sel); }
});

        '<span class="login-hint">'+esc(t('lgAccounts'))+'</span></div>'+
      '<input class="login-in" id="loginUser" list="loginUsers" autocomplete="username" '+
        'value="'+esc(typed)+'" onkeydown="if(event.key===\'Enter\')doLogin()">'+
      '<datalist id="loginUsers">'+
        USERS.map(u=>'<option value="'+esc(u.email)+'">'+esc(u.name)+' — '+esc(t('role_'+u.role))+'</option>').join('')+
      '</datalist>'+
      '<button class="login-btn" onclick="doLogin()">'+esc(t('lgBtn'))+'</button>'+
      '<div class="login-err" id="loginErr">'+esc(t('lgErr'))+'</div>'+
      '<div class="login-row">'+
        '<span class="cbox on" id="rememberBox" data-on="1" onclick="togChk(\'rememberBox\')">✓</span>'+
        '<span>'+esc(t('lgRemember'))+'</span></div>'+
      '<div class="login-sep"></div>'+
      '<a class="login-link" href="#" onclick="return false">'+esc(t('lgForgot'))+'</a>'+
      '<div class="login-note">'+esc(t('lgNote'))+'<br>'+
        USERS.map(u=>'<b>'+esc(u.email.split('@')[0])+'</b> · '+esc(t('role_'+u.role))).join('<br>')+
      '</div>'+
    '</div>'+
    '<div class="login-foot">'+esc(t('lgFoot'))+'</div>'+
  '</div>'+
  '<div class="login-right">'+
    '<div class="lr-eyebrow"><span class="sigdot"></span>'+esc(t('lgEyebrow'))+'</div>'+
    '<div class="lr-h">'+esc(t('lgH1'))+'<em>'+esc(t('lgH2'))+'</em>'+esc(t('lgH3'))+'</div>'+
    '<div class="lr-p">'+esc(t('lgP'))+'</div>'+
    '<div class="lr-stats">'+
      '<div><div class="lr-n">200+</div><div class="lr-s">'+esc(t('lgS1'))+'</div></div>'+
      '<div><div class="lr-n">'+esc(t('lgN2'))+'</div><div class="lr-s">'+esc(t('lgS2'))+'</div></div>'+
      '<div><div class="lr-n">248</div><div class="lr-s">'+esc(t('lgS3'))+'</div></div>'+
    '</div>'+
    '<div class="lr-quote">'+esc(t('lgQuote'))+'<span>'+esc(t('lgQuoteBy'))+'</span></div>'+
    '<div class="lr-tags">'+
      ['Spotify','Apple Music','TikTok','YouTube Music','Zing MP3','NhacCuaTui',
       'TIDAL','SoundCloud','Beatport','Deezer'].map(x=>'<span class="lr-tag">'+x+'</span>').join('')+
    '</div>'+
    '<a class="lr-link" href="https://haustek-group.com/" target="_blank" rel="noopener">haustek-group.com →</a>'+
  '</div>';
}
function doLogin(){
  const raw = document.getElementById('loginUser').value.trim().toLowerCase();
  const u = USERS.find(x =>
    x.email.toLowerCase()===raw ||
    x.email.split('@')[0].toLowerCase()===raw ||
    x.name.toLowerCase()===raw);
  const err = document.getElementById('loginErr');
  if(!u){ err.style.display='block'; return; }
  err.style.display='none';
  ME = u.name;
  AUTHED = true;
  logAudit({objType:'system', objName:u.name, action:'login'});
  saveNow();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  state.view='home'; state.q=''; state.drawer=null;
  render();
}
function doLogout(){
  AUTHED = false;
  saveNow();
  closeDrawer();
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='grid';
  renderLogin();
  const f=document.getElementById('loginUser'); if(f) f.value = meUser().email;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
bootStore();
renderLogin();
if(AUTHED){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
}
render();
</script>
