/* ======================= bảng ảo hoá =======================
   Cùng ý tưởng với HAUSTEK.vtable trong portal/haustek-core.js (dòng 1621) và
   theo đúng yêu cầu của portal/screens/_CONTRACT.md mục 2. Chép sang đây chứ
   KHÔNG nạp haustek-core.js: file đó dựng 50.000 bản ghi mất 1,9 giây và 40MB
   heap, mà CRM không đụng tới danh mục doanh thu đó.

   Vì mọi VIEWS.* trả về CHUỖI html rồi render() gán một phát bằng innerHTML,
   không có chỗ nào cầm được element để gắn sự kiện cuộn. MOUNTS là hàng đợi:
   view đẩy hàm vào lúc dựng chuỗi, render() gọi chúng ngay sau khi gán xong. */
var MOUNTS = [];
function onMount(fn){ MOUNTS.push(fn); }
const VT_ROW_H = 37;    /* = padding 8+8 + dòng chữ 19.5 + viền 1, khớp <td> */
const VT_MIN   = 150;   /* dưới ngưỡng này giữ <table> thường cho nhẹ và đủ dùng */
let VT_SEQ = 0;
function vtable(opts){
  const body = opts.body, spacer = opts.spacer, head = opts.head;
  const RH = opts.rowHeight || VT_ROW_H;
  let rows = opts.rows || [], cols = opts.cols || [];
  const grid = ()=>cols.map(c=>c.w).join(' ');
  function paintHead(){
    if(!head) return;
    head.style.gridTemplateColumns = grid();
    head.innerHTML = cols.map(c=>{
      if(c.bulkHead) return '<span class="selcell"><span class="cbx'+(c.on?' on':'')+
        '" data-selall="1">'+(c.on?'✓':'')+'</span></span>';
      const on = c.k && opts.sortKey===c.k;
      return '<span class="'+(c.num?'num ':'')+(c.k?'sortable':'')+'"'+
        (c.k?' onclick="sortBy(\''+c.k+'\')"':'')+'>'+esc(c.lab)+
        (on?'<span class="arw">'+(opts.sortDir>0?'▲':'▼')+'</span>':'')+'</span>';
    }).join('');
  }
  function paint(){
    const top = body.scrollTop, h = body.clientHeight;
    const first = Math.max(0, Math.floor(top/RH)-4);
    const last  = Math.min(rows.length, Math.ceil((top+h)/RH)+4);
    let out = '';
    for(let r=first;r<last;r++){
      out += '<div class="vt-row'+(opts.rowCls?(' '+opts.rowCls(rows[r])):'')+'" data-r="'+r+'" '+
             'style="top:'+(r*RH)+'px;height:'+RH+'px;grid-template-columns:'+grid()+'">'+
             opts.rowHTML(rows[r], r)+'</div>';
    }
    spacer.innerHTML = out;
  }
  function refresh(nr,nc){
    if(nr) rows = nr; if(nc) cols = nc;
    spacer.style.height = (rows.length*RH)+'px';
    paintHead(); paint();
  }
  body.onscroll = ()=>{
    /* ô sửa tại chỗ nằm trong dòng bị vẽ lại khi cuộn — đóng nó trước cho khỏi
       mất chữ đang gõ giữa chừng */
    if(state.inline){ state.inline = null; }
    if(!body._raf) body._raf = requestAnimationFrame(()=>{ body._raf = 0; paint(); });
  };
  body.onclick = (e)=>{
    if(!opts.onRow) return;
    if(e.target.closest('.iedit,select,input,button')) return;
    const row = e.target.closest('.vt-row');
    if(row) opts.onRow(rows[+row.dataset.r]);
  };
  refresh();
  return {refresh, paint, rowAt:r=>rows[r]};
}
/* Dựng một bảng: dưới VT_MIN dòng thì trả <table> như cũ, trên thì trả khung
   ảo hoá. cells(row) trả mảng {c,s,h} dùng chung cho cả hai đường, nên markup
   của ô chỉ viết một lần. onRow là HÀM thật, cả hai đường đều gắn bằng uỷ
   quyền sự kiện — không nhét lời gọi vào thuộc tính onclick, vì dòng ảo hoá
   được vẽ lại liên tục và chuỗi trong thuộc tính sẽ phải qua eval. */
function listTable(cols, rows, cells, onRow, rowCls, bulk){
  const id = 'lt'+(++VT_SEQ);
  /* Cột chọn hàng loạt chèn ở đây chứ không bắt từng view tự dựng: bốn bảng
     dùng chung một ô tích, một luật "chọn hết trang", một chỗ đọc state.sel.
     Chép ra bốn nơi là bốn nơi sẽ lệch nhau sau vài lần sửa. */
  if(bulk){
    const ids = rows.map(r=>r.id);
    const allOn = ids.length && ids.every(x=>state.sel.ids.indexOf(x)>=0);
    cols = [{k:null, w:'36px', bulkHead:1, on:allOn, ids:ids}].concat(cols);
    const inner = cells;
    cells = (r)=>[{c:'selcell', h:'<span class="cbx'+(state.sel.ids.indexOf(r.id)>=0?' on':'')+
      '" data-sel="'+esc(r.id)+'">'+(state.sel.ids.indexOf(r.id)>=0?'✓':'')+'</span>'}].concat(inner(r));
  }
  const hit = (e)=>{
    if(!onRow) return null;
    if(e.target.closest('.iedit,select,input,button,a,[data-sel],[data-selall]')) return null;
    return e.target.closest('[data-r]');
  };
  /* Bấm ô tích không được mở bản ghi — bắt ở pha capture, trước handler mở dòng */
  const bindSel = (root)=>{
    if(!bulk || !root) return;
    root.addEventListener('click', (e)=>{
      const one = e.target.closest('[data-sel]');
      if(one){ e.stopPropagation(); selToggle(bulk, one.dataset.sel); return; }
      const all = e.target.closest('[data-selall]');
      if(all){ e.stopPropagation(); selToggleAll(bulk, rows.map(r=>r.id)); }
    }, true);
  };
  if(rows.length < VT_MIN){
    onMount(()=>{
      const el = document.getElementById(id); if(!el) return;
      bindSel(el);
      el.onclick = (e)=>{ const r = hit(e); if(r) onRow(rows[+r.dataset.r]); };
    });
    return '<div class="tw" id="'+id+'"><div class="tscroll"><table><thead><tr>'+
      cols.map(c=>c.bulkHead
                    ? '<th class="selcell"><span class="cbx'+(c.on?' on':'')+'" data-selall="1">'+
                      (c.on?'✓':'')+'</span></th>'
                    : c.k ? th(c.lab, c.k, c.num?'num':'')
                          : '<th'+(c.num?' class="num"':'')+'>'+esc(c.lab)+'</th>').join('')+
      '</tr></thead><tbody>'+
      rows.map((r,i)=>'<tr data-r="'+i+'" class="'+(rowCls?rowCls(r):'')+'">'+
        cells(r).map(c=>'<td class="'+(c.c||'')+'"'+(c.s?' style="'+c.s+'"':'')+'>'+c.h+'</td>').join('')+
        '</tr>').join('')+
      '</tbody></table></div></div>';
  }
  onMount(()=>{
    const bodyEl = document.getElementById(id+'b'); if(!bodyEl) return;
    bindSel(bodyEl);
    bindSel(document.getElementById(id+'h'));
    vtable({
      body: bodyEl, spacer: document.getElementById(id+'s'), head: document.getElementById(id+'h'),
      rows: rows, cols: cols, sortKey: state.sort.key, sortDir: state.sort.dir,
      rowCls: rowCls, onRow: onRow,
      rowHTML: (r)=>cells(r).map(c=>'<div class="'+(c.c||'')+'"'+(c.s?' style="'+c.s+'"':'')+'>'+c.h+'</div>').join('')
    });
  });
  return '<div class="vt"><div class="vt-head" id="'+id+'h"></div>'+
    '<div class="vt-body" id="'+id+'b"><div class="vt-spacer" id="'+id+'s"></div></div>'+
    '<div class="vt-note">'+esc(t('vtNote',{n:rows.length}))+'</div></div>';
}

/* ===================== chọn hàng loạt =====================
   state.sel giữ ĐÚNG MỘT loại bản ghi. Chọn 5 cơ hội rồi nhảy sang tab lead
   thì lựa chọn cũ bị bỏ, không mang theo — mang theo thì thanh hành động sẽ
   mời làm những việc không áp dụng được cho thứ đang chọn. */
function selClear(){ state.sel = {kind:null, ids:[]}; }
function selToggle(kind, id){
  if(state.sel.kind !== kind) state.sel = {kind:kind, ids:[]};
  const i = state.sel.ids.indexOf(id);
  if(i>=0) state.sel.ids.splice(i,1); else state.sel.ids.push(id);
  if(!state.sel.ids.length) state.sel.kind = null;
  render();
}
function selToggleAll(kind, ids){
  if(state.sel.kind !== kind) state.sel = {kind:kind, ids:[]};
  const on = ids.length && ids.every(x=>state.sel.ids.indexOf(x)>=0);
  state.sel.ids = on ? [] : ids.slice();
  state.sel.kind = state.sel.ids.length ? kind : null;
  render();
}
function selRows(){
  const k = state.sel.kind;
  const src = k==='opps' ? DB.opps : k==='leads' ? DB.leads
            : k==='accounts' ? DB.accounts : k==='contacts' ? DB.contacts : [];
  return state.sel.ids.map(id=>src.find(r=>r.id===id)).filter(Boolean);
}
/* Thanh hành động chỉ hiện việc LÀM ĐƯỢC với đúng thứ đang chọn và đúng quyền
   của người đang đăng nhập. Hiện nút rồi báo lỗi khi bấm là cách chắc chắn nhất
   để người ta mất niềm tin vào cái thanh này. */
function bulkBar(){
  const rows = selRows(); if(!rows.length) return '';
  const k = state.sel.kind;
  const mine = rows.filter(r=>canEdit(r.owner));
  const btn = (act,lab,cls)=>'<button class="btn btn-sm'+(cls?' '+cls:'')+
    '" onclick="bulkRun(\''+act+'\')">'+esc(lab)+'</button>';
  let acts = '';
  if(k==='opps'){
    const adv = rows.filter(o=>canAdvance(o));
    if(adv.length) acts += btn('advance', t('bulkAdvance',{n:adv.length}), 'btn-primary');
  }
  if(mine.length || can('editAll')) acts += btn('owner', t('bulkOwner'));
  if(k==='leads' && (mine.length||can('editAll'))) acts += btn('status', t('bulkStatus'));
  return '<div class="bulkbar">'+
    '<span class="bulk-n">'+rows.length+'</span>'+
    '<span class="bulk-l">'+esc(t('bulkSel'))+'</span>'+
    (mine.length < rows.length
      ? '<span class="bulk-warn">'+esc(t('bulkSkip',{n:rows.length-mine.length}))+'</span>' : '')+
    '<span class="bulk-acts">'+acts+
      '<button class="btn btn-sm" onclick="selClear();render()">'+esc(t('bulkClear'))+'</button></span>'+
  '</div>';
}
async function bulkRun(act){
  const rows = selRows(); if(!rows.length) return;
  if(act==='advance'){
    const list = rows.filter(o=>canAdvance(o));
    if(!list.length){ toast(t('noRight')); return; }
    list.forEach(o=>advance(o.id, 1));
    selClear(); toast(t('bulkDone',{n:list.length})); render(); return;
  }
  if(act==='owner'){
    const who = await pickOne(t('bulkOwner'), USERS.map(u=>[u.name,u.name]));
    if(!who) return;
    let n=0;
    rows.forEach(r=>{ if(!canEdit(r.owner)) return;
      logDiff(state.sel.kind==='opps'?'opp':'lead', r.id, r.name, 'owner', r.owner, who);
      r.owner = who; n++; });
    selClear(); toast(t('bulkDone',{n:n})); render(); return;
  }
  if(act==='status'){
    const st = await pickOne(t('bulkStatus'), LEAD_STATUS.map(x=>[x.id, t('ls_'+x.id)]));
    if(!st) return;
    let n=0;
    rows.forEach(r=>{ if(!canEdit(r.owner)) return;
      logDiff('lead', r.id, r.name, 'status', r.status, st); r.status = st; n++; });
    selClear(); toast(t('bulkDone',{n:n})); render();
  }
}
/* Hộp chọn một giá trị, dùng chung cho các hành động hàng loạt */
function pickOne(title, opts){
  return new Promise(resolve=>{
    document.getElementById('overlay').innerHTML = shell(t('bulkSel'), title,
      '<div class="fld"><select class="in" id="bulkPick">'+
        opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+
      '</select></div>',
      '<button class="btn" data-x="1">'+esc(t('cancel'))+'</button>'+
      '<button class="btn btn-primary" data-ok="1">'+esc(t('save'))+'</button>');
    const ov = document.getElementById('overlay');
    ov.querySelector('[data-ok]').onclick = ()=>{
      const v = document.getElementById('bulkPick').value; closeDrawer(); resolve(v); };
    ov.querySelector('[data-x]').onclick = ()=>{ closeDrawer(); resolve(null); };
  });
}

/* ===================== view đã lưu =====================
   Bộ lọc + từ khoá + thứ tự sắp xếp, đặt tên và lưu lại. Thứ người ta thật sự
   làm hằng ngày không phải "lọc theo giai đoạn" mà là "mở lại đúng cái danh
   sách tôi nhìn mỗi sáng" — Attio coi đây là trụ cột của CRM hiện đại. */
function viewsFor(kind){ return (state.views && state.views[kind]) || []; }
function viewSnap(kind){
  return {q:state.q, sort:{key:state.sort.key, dir:state.sort.dir},
          filter: kind==='opps' ? state.oppFilter : kind==='leads' ? state.leadFilter : 'all'};
}
function viewSame(kind, v){
  const c = viewSnap(kind);
  return v.filter===c.filter && (v.q||'')===(c.q||'') &&
         (v.sort.key||null)===(c.sort.key||null) && v.sort.dir===c.sort.dir;
}
function viewApply(kind, i){
  const v = viewsFor(kind)[i]; if(!v) return;
  state.q = v.q || '';
  const box = document.getElementById('q'); if(box) box.value = state.q;
  state.sort = {key:v.sort.key, dir:v.sort.dir};
  if(kind==='opps') state.oppFilter = v.filter; else if(kind==='leads') state.leadFilter = v.filter;
  selClear(); render();
}
async function viewSave(kind){
  const name = await pickName(t('viewSaveT'));
  if(!name) return;
  if(!state.views) state.views = {};
  if(!state.views[kind]) state.views[kind] = [];
  state.views[kind].push(Object.assign({name:name}, viewSnap(kind)));
  logAudit({objType:'system', objName:name, action:'create', note:'view'});
  toast(t('viewSaved',{n:name})); render();
}
function viewDrop(kind, i){
  const v = viewsFor(kind)[i]; if(!v) return;
  state.views[kind].splice(i,1);
  logAudit({objType:'system', objName:v.name, action:'update', note:'view-remove'});
  saveSoon(); render();
}
function pickName(title){
  return new Promise(resolve=>{
    document.getElementById('overlay').innerHTML = shell(t('viewsTitle'), title,
      '<div class="fld"><input class="in" id="vName" maxlength="40" placeholder="'+esc(t('viewPh'))+'"></div>',
      '<button class="btn" data-x="1">'+esc(t('cancel'))+'</button>'+
      '<button class="btn btn-primary" data-ok="1">'+esc(t('save'))+'</button>');
    const ov = document.getElementById('overlay');
    const inp = document.getElementById('vName'); inp.focus();
    const ok = ()=>{ const v=inp.value.trim(); closeDrawer(); resolve(v||null); };
    inp.onkeydown = e=>{ if(e.key==='Enter') ok(); };
    ov.querySelector('[data-ok]').onclick = ok;
    ov.querySelector('[data-x]').onclick = ()=>{ closeDrawer(); resolve(null); };
  });
}
function viewBar(kind){
  const list = viewsFor(kind);
  return '<div class="views">'+
    list.map((v,i)=>'<span class="viewchip'+(viewSame(kind,v)?' on':'')+'">'+
      '<button onclick="viewApply(\''+kind+'\','+i+')">'+esc(v.name)+'</button>'+
      '<button class="viewx" title="'+esc(t('viewDrop'))+'" onclick="viewDrop(\''+kind+'\','+i+')">×</button>'+
    '</span>').join('')+
    '<button class="viewadd" onclick="viewSave(\''+kind+'\')">+ '+esc(t('viewSave'))+'</button>'+
  '</div>';
}

/* ===================== trí tuệ quan hệ =====================
   Mô phỏng cách Affinity chấm điểm quan hệ: KHÔNG đếm số lần liên hệ trần,
   mà cân hai thứ — liên hệ GẦN ĐÂY tới mức nào, và ĐỀU tới mức nào. Một khách
   gọi 10 lần hồi tháng 3 rồi im bặt thì quan hệ đang nguội, dù tổng số cao;
   một khách vừa nói chuyện tuần trước thì đang ấm, dù mới quen.

   Độ gần đây tính bằng phân rã theo chu kỳ bán rã 30 ngày: sau 30 ngày không
   liên hệ, phần điểm này còn một nửa; sau 60 ngày còn một phần tư. Tần suất
   lấy số lần chạm trong 90 ngày, coi 6 lần là đủ đầy — trên mức đó không cộng
   thêm, vì gọi 20 lần một quý không có nghĩa quan hệ tốt gấp ba lần gọi 6 lần.

   Hoạt động gắn vào refId của cơ hội hoặc lead, không gắn thẳng vào khách
   hàng, nên phải map ngược qua opp.accountId. Chỉ quét MỘT vòng qua DB.acts
   rồi dựng chỉ mục, không lặp lại cho từng dòng bảng. */
const REL_HALFLIFE = 30, REL_FULL_TOUCHES = 6, REL_WINDOW = 90;
/* `var`, không phải `let`: seedAudit gọi logAudit hàng trăm lần lúc dựng dữ liệu,
   mà logAudit gọi saveSoon → relInvalidate. Tất cả chạy TRƯỚC dòng này, nên
   `let` sẽ vỡ vùng chết tạm thời và trang không boot nổi. */
var REL_CACHE = null;
function relInvalidate(){ REL_CACHE = null; }
function relIndex(){
  if(REL_CACHE) return REL_CACHE;
  const oppAcc = new Map();
  DB.opps.forEach(o=>oppAcc.set(o.id, o.accountId));
  const idx = new Map();
  const win = new Date(TODAY.getTime() - REL_WINDOW*86400000);
  for(let i=0;i<DB.acts.length;i++){
    const a = DB.acts[i];
    const accId = oppAcc.get(a.refId);
    if(!accId || !(a.date instanceof Date)) continue;
    let r = idx.get(accId);
    if(!r){ r = {last:null, n:0, n90:0, byType:{}}; idx.set(accId, r); }
    r.n++;
    if(!r.last || a.date > r.last) r.last = a.date;
    if(a.date >= win) r.n90++;
    r.byType[a.type] = (r.byType[a.type]||0) + 1;
  }
  idx.forEach(r=>{
    const days = r.last ? Math.max(0, daysBetween(r.last, TODAY)) : 9999;
    const recency = Math.pow(0.5, days / REL_HALFLIFE);
    const freq    = Math.min(1, r.n90 / REL_FULL_TOUCHES);
    r.days  = days;
    r.score = Math.round(100 * (0.6*recency + 0.4*freq));
  });
  REL_CACHE = idx;
  return idx;
}
function relOf(accountId){
  return relIndex().get(accountId) || {last:null, n:0, n90:0, days:9999, score:0, byType:{}};
}
/* Bốn mức, đặt tên theo việc cần làm chứ không theo con số */
function relBand(score){
  return score >= 55 ? ['hot',  'relHot',  'var(--green)']
       : score >= 28 ? ['warm', 'relWarm', 'var(--ice-dark)']
       : score >= 12 ? ['cool', 'relCool', 'var(--amber)']
                     : ['cold', 'relCold', 'var(--muted)'];
}
function relCell(accountId){
  const r = relOf(accountId), b = relBand(r.score);
  const when = r.last ? t('relDays',{n:r.days}) : t('relNever');
  return '<span class="rel"><span class="rel-bar"><i style="width:'+Math.max(4,r.score)+'%;background:'+b[2]+'"></i></span>'+
    '<span class="rel-n">'+r.score+'</span><span class="rel-w">'+esc(when)+'</span></span>';
}
/* Việc cần làm thật sự: khách CÓ deal đang mở mà quan hệ đã nguội. Đây là chỗ
   deal chết âm thầm — không phải vì mất, mà vì không ai gọi lại. */
function relCooling(){
  const openByAcc = new Map();
  DB.opps.forEach(o=>{
    if(!OPEN_STAGES.includes(o.stage) || !inScope(o.owner)) return;
    const cur = openByAcc.get(o.accountId) || {n:0, val:0, owner:o.owner};
    cur.n++; cur.val += (o.amount||0);
    openByAcc.set(o.accountId, cur);
  });
  const out = [];
  openByAcc.forEach((v,accId)=>{
    const r = relOf(accId);
    if(r.score >= 28) return;                 /* còn ấm thì chưa cần nhắc */
    out.push({accId, rel:r, open:v.n, val:v.val, owner:v.owner});
  });
  return out.sort((a,b)=> (b.val - a.val) || (b.rel.days - a.rel.days));
}

/* ============================ state ============================ */
const RECENT_SEED = ['Flyaway Records — Distribution 2026','Northern Reverie — Catalogue','Sofia — Single deal']
  .map(n=>{ const o=DB.opps.find(x=>x.name===n); return o?o.id:null; }).filter(Boolean);
const state = { view:'home', q:'', leadFilter:'all', oppFilter:'all', oppView:'table', inline:null, period:30,
  oppId:null, oppTab:'details', actTab:'call', detEdit:null,
  audUser:'all', audObj:'all', audAct:'all', audFrom:'', audTo:'',
  recentOpps:RECENT_SEED.slice(), recentLeads:[],
  sel:{kind:null, ids:[]}, views:{},
  taskFilter:'open', sort:{key:null,dir:1}, drawer:null };

/* ======================= lưu trạng thái (localStorage) =======================
   Cùng khuôn với store trong portal/haustek-core.js (dòng 381-402): một khoá,
   một hằng VERSION, nạp vào phải đúng phiên bản — sai thì bỏ qua chứ không vá.
   Khối này phải nằm SAU `const state` vì snapshot có đọc state.recentOpps.
   STORE_READY/SAVE_T khai báo bằng `var`: logAudit() chạy hàng trăm lần trong
   lúc seed (dòng 1660-1696), tức là trước khi tới đây — `let`/`const` sẽ vỡ TDZ. */
var STORE_READY = false, SAVE_T = null, AUTHED = false;

const STORE_KEY     = 'haustek.crm.v1';
const STORE_VERSION = '1.0.0';

/* MỌI trường kiểu Date trong DB. JSON.stringify biến Date thành chuỗi ISO;
   thiếu một dòng ở đây là .getMonth() / .toDateString() / phép trừ ngày vỡ
   âm thầm sau khi tải lại. opp.ext KHÔNG có mặt ở đây — các ô ngày trong ext
   vốn đã là chuỗi 'YYYY-MM-DD' (dòng 2359, 4310) và auditVal dòng 1338 đọc
   được cả hai kiểu; hồi sinh chúng sẽ làm hỏng phép so sánh ở dòng 2358. */
const DATE_FIELDS = {
  accounts:  [],
  contacts:  [],
  leads:     ['created'],
  opps:      ['closeDate','created','lastAct'],
  tasks:     ['due'],
  acts:      ['date'],
  events:    ['date'],
  audit:     ['ts'],
  transfers: ['date'],
  chat:      ['ts']
};
function toDate(v){
  if(v===null || v===undefined || v==='') return v;
  if(v instanceof Date) return v;
  const dd = new Date(v);
  return isNaN(dd.getTime()) ? null : dd;
}
function reviveDB(db){
  Object.keys(DATE_FIELDS).forEach(coll=>{
    const list = db[coll]; if(!Array.isArray(list)) return;
    const keys = DATE_FIELDS[coll];
    list.forEach(r=>{
      if(!r) return;
      keys.forEach(k=>{ if(k in r) r[k] = toDate(r[k]); });
      /* audit.oldV / audit.newV là Date khi field là trường ngày (closeDate) —
         logDiff dòng 1485 so sánh bằng instanceof, giữ đúng kiểu cho chắc. */
      if(coll==='audit' && FIELD_FMT[r.field]==='date'){
        r.oldV = toDate(r.oldV); r.newV = toDate(r.newV);
      }
    });
  });
  return db;
}
function snapshot(){
  return {
    v: STORE_VERSION, at: new Date().toISOString(),
    me: ME, auth: AUTHED, lang: lang, cur: cur, uid: uid, theme: THEME,
    usage: USAGE, goals: USER_GOALS, handoff: HANDOFF_BIND, inbox: INBOX_SEEN, thr: REGION_THRESHOLD,
    recentOpps: state.recentOpps, recentLeads: state.recentLeads, views: state.views,
    db: DB
  };
}
function applySnapshot(s){
  /* DB là const (dòng 1286) — thay ruột từng mảng, không gán lại. */
  Object.keys(DB).forEach(k=>{
    const rows = (s.db && Array.isArray(s.db[k])) ? s.db[k] : [];
    DB[k].length = 0;
    for(let i=0;i<rows.length;i++) DB[k].push(rows[i]);
  });
  reviveDB(DB);
  if(typeof s.uid === 'number' && s.uid > 0) uid = s.uid;
  if(s.lang==='vi' || s.lang==='en')   lang = s.lang;
  if(s.cur ==='USD'|| s.cur ==='VND')  cur  = s.cur;
  if(s.theme==='auto'||s.theme==='dark'||s.theme==='light') THEME = s.theme;
  if(s.usage) Object.keys(s.usage).forEach(n=>{ if(USAGE[n]) USAGE[n] = s.usage[n]; });
  if(s.goals) Object.keys(s.goals).forEach(n=>{ USER_GOALS[n] = s.goals[n]; });
  HANDOFF_BIND = (s.handoff && typeof s.handoff==='object') ? s.handoff : {};
  INBOX_SEEN   = (s.inbox   && typeof s.inbox  ==='object') ? s.inbox   : {};
  if(typeof s.thr === 'number' && s.thr >= 0) REGION_THRESHOLD = s.thr;

/* ===================== bàn giao sang portal =====================
   Deal "Đã ký" trong CRM chính là thứ sinh ra tỷ lệ chia và tạm ứng bên portal.
   Nhưng danh mục hai bên KHÔNG khớp nhau: portal có 900 nghệ sĩ + 40 label sinh
   từ bộ số giả ngẫu nhiên (label toàn tên hư cấu: "Nightform Records"…), CRM
   dùng tên thật ("Sconnect Music", "1DEE music"). Đối chiếu thử thì trùng đúng
   MỘT cái tên trên 23. Nên tuyệt đối không khớp tự động theo tên — mỗi deal
   phải được người thật gắn tay vào một partyKey của portal ("A:<id>" hoặc
   "L:<id>"), và trước khi gắn thì nó nằm ở trạng thái "chưa gắn".

   CRM KHÔNG BAO GIỜ ghi vào khoá 'haustek.portal.v1'. Portal là chủ sổ của nó;
   CRM chỉ đặt một khoá riêng của mình để portal đọc. Một chiều, không tranh chấp. */
const HANDOFF_KEY     = 'haustek.crm.handoff.v1';
const HANDOFF_VERSION = '1.0.0';
var HANDOFF_BIND = {};   /* dealId -> "A:<id>" | "L:<id>", do người gắn tay */

function isoDay(dt){
  if(!(dt instanceof Date) || isNaN(dt.getTime())) return null;
  const p = n=>String(n).padStart(2,'0');
  return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate());
}
function handoffOf(o){
  const a   = DB.accounts.find(x=>x.id===o.accountId) || {};
  const adv = (o.ext||{}).advCalcResult || null;
  const r   = o.rights || {};
  return {
    dealId:o.id, dealName:o.name,
    account:a.name||'', accountType:a.type||'', country:a.country||'',
    amountUSD:Math.round(o.amount||0),
    closeDate:isoDay(o.closeDate), owner:o.owner,
    rights:{dist:!!r.dist, pub:!!r.pub, yt:!!r.yt},
    /* điều khoản thương mại lấy từ máy tính advance (o.ext.advCalcResult) */
    terms: adv ? {
      artistSharePct:     Math.round((adv.artistShare||0)*1000)/10,
      initialAdvanceUSD:  Math.round(adv.initialAdvance||0),
      marketingFundUSD:   Math.round(adv.marketingFund||0),
      totalAdvanceUSD:    Math.round((adv.initialAdvance||0)+(adv.marketingFund||0)),
      termMonths:         adv.termMonths||0,
      exclusivityMonths:  adv.exclusivityMonths||0,
      findersFeePct:      adv.findersFeePct||0
    } : null,
    portalPartyKey: HANDOFF_BIND[o.id] || null
  };
}
function handoffRows(){
  /* Trình lên portal ở giai đoạn 'portal' — tức NGAY SAU khi chuỗi duyệt trong
     CRM xong, chứ không đợi tới lúc đã ký. Đợi tới 'won' thì CEO chẳng còn gì
     để duyệt: hợp đồng ký rồi mới đưa lên là trình cho có. */
  return DB.opps.filter(o=>o.stage==='portal' || PORTAL_STAGES.includes(o.stage)).map(handoffOf)
    .sort((x,y)=>String(y.closeDate||'').localeCompare(String(x.closeDate||'')));
}
function handoffPayload(){
  const rows = handoffRows();
  return {v:HANDOFF_VERSION, source:'haustek-crm', at:new Date().toISOString(),
          bound:rows.filter(r=>r.portalPartyKey).length, total:rows.length, deals:rows};
}
function handoffPublish(){
  try { localStorage.setItem(HANDOFF_KEY, JSON.stringify(handoffPayload())); return true; }
  catch(e){ return false; }
}
/* Hai lời gọi portal mà một deal đã gắn sẽ sinh ra. Chỉ DỰNG chuỗi để người
   vận hành đọc và đối chiếu — CRM không tự chạy chúng, vì portal mới là nơi
   có quyền ghi vào sổ tỷ lệ và sổ tạm ứng. */
function handoffCalls(r){
  if(!r.portalPartyKey) return [];
  const out = [];
  if(r.terms && r.terms.artistSharePct)
    out.push('A.rates.add("'+r.portalPartyKey+'", '+(r.terms.artistSharePct/100)+
             ', "<kỳ hiệu lực>", "'+r.owner+'", "CRM '+r.dealId+' — '+r.dealName+'")');
  if(r.terms && r.terms.totalAdvanceUSD)
    out.push('A.advances.set("'+r.portalPartyKey+'", '+r.terms.totalAdvanceUSD+
             ', "CRM '+r.dealId+' — ký '+(r.closeDate||'')+'")');
  return out;
}
/* ===================== kênh ngược: portal → CRM =====================
   Chiều đi (CRM → portal) là quyết định thương mại. Chiều về chỉ là TRẠNG THÁI,
   và CRM đọc chỉ-đọc: nó không sửa được hợp đồng, không ghi vào khoá này, và
   không suy diễn gì thêm. Portal là chủ của mọi thứ sau khi CEO duyệt.

   Vì sao vẫn cần chiều về: A&R phải thấy deal của mình đi tới đâu. Không có nó
   thì deal "biến mất" khỏi CRM lúc trình lên portal, và người dựng deal phải mở
   app khác để biết hợp đồng xong chưa — đúng kiểu quy trình làm người ta bỏ
   không cập nhật CRM nữa. */
const INBOX_KEY = 'haustek.portal.contracts.v1';
const INBOX_VERSION = '1.0.0';
/* Trạng thái portal gửi về → giai đoạn tương ứng trong CRM */
const INBOX_STAGE = {
  ceo_rejected:'negotiation', ceo_approved:'legal',
  drafting:'legal', ready:'signature', signed:'won'
};
/* Đường dẫn hợp đồng do PHÍA KHÁC ghi vào localStorage, nên CRM không được tin.
   Không kiểm bằng cách so tiền tố chuỗi: "javascript:" viết hoa lẫn lộn, chèn tab,
   xuống dòng hay khoảng trắng đầu đều lách qua kiểu kiểm đó. Đưa cho bộ phân tích
   URL của trình duyệt chuẩn hoá trước rồi mới xét giao thức — nó tự bóc các ký tự
   điều khiển, nên "java<tab>script:" hiện nguyên hình là javascript: và bị chặn.
   Đã thử tay các ca: mọi biến thể javascript:, data:, vbscript: đều rớt; đường dẫn
   tương đối vẫn giải đúng về origin đang chạy. */
function safeUrl(raw){
  if(typeof raw !== 'string' || !raw.trim()) return null;
  let u;
  try { u = new URL(raw, location.href); } catch(e){ return null; }
  if(u.protocol !== 'http:' && u.protocol !== 'https:') return null;
  return u.href;
}
function inboxRead(){
  try {
    const raw = localStorage.getItem(INBOX_KEY);
    if(!raw) return null;
    const j = JSON.parse(raw);
    if(!j || j.v !== INBOX_VERSION || !Array.isArray(j.deals)) return null;
    return j;
  } catch(e){ return null; }
}
var INBOX_SEEN = {};   /* dealId -> updatedAt đã áp dụng, để không áp lại mãi */
/* Áp trạng thái portal gửi về. Chỉ động vào deal ĐANG ở phần portal cầm lái —
   deal còn trong chuỗi duyệt CRM thì portal không có quyền kéo đi. */
function inboxApply(){
  const j = inboxRead(); if(!j) return 0;
  let n = 0;
  j.deals.forEach(d=>{
    const o = DB.opps.find(x=>x.id===d.dealId); if(!o) return;
    if(o.stage !== 'portal' && !PORTAL_STAGES.includes(o.stage)) return;
    if(INBOX_SEEN[d.dealId] === d.updatedAt) return;
    const to = INBOX_STAGE[d.status];
    o.contract = {status:d.status, at:d.updatedAt, note:d.note||'', by:d.by||'',
                  url: safeUrl(d.url)};   /* null nếu thiếu hoặc không an toàn */
    if(to && to !== o.stage){
      logAudit({objType:'opp',objId:o.id,objName:o.name,action:'update',
        field:'stage',oldV:o.stage,newV:to,note:'portal'});
      o.stage = to; o.lastAct = TODAY;
      DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
        text:L(['Portal cập nhật: '+t('ct_'+d.status),'Portal update: '+t('ct_'+d.status)]),
        date:TODAY, who:d.by||'portal'});
    }
    INBOX_SEEN[d.dealId] = d.updatedAt;
    n++;
  });
  if(n) saveSoon();
  return n;
}

/* Nút mở hợp đồng. target _blank kèm rel noopener để trang đích không với được
   window.opener của CRM; noreferrer để không rò đường dẫn nội bộ nếu link trỏ ra

function applySort(rows, map){
  const k=state.sort.key; if(!k||!map[k]) return rows;
  return rows.slice().sort((a,b)=>{
    const x=map[k](a), y=map[k](b);
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='number'||x instanceof Date) return (x-y)*state.sort.dir;
    return String(x).localeCompare(String(y),'vi')*state.sort.dir;
  });
}

   chỉ Deal đã ký suy ra bằng 50% mục tiêu Vào đàm phán.
   name = null nghĩa là tính trên toàn hệ thống. */
const GOAL_RATE = 0.5, GOAL_WEEKS = 52;
/* "Vào đàm phán" đếm deal ĐANG SỐNG có hoạt động trong kỳ (tồn kho), không phải
   deal MỚI vào giai đoạn đó (dòng chảy). Thực tế nó lớn hơn "Cơ hội mới", nên
   suy nó ra bằng opps×50% như cũ thì mục tiêu không bao giờ khớp nổi thực tế.
   Giờ nego là mục tiêu đặt tay; chỉ còn "Deal đã ký" suy ra từ nego. */
const GOAL_DEFAULT = {leads:5, opps:2, nego:2, yearUSD:500000};
/* Manager đặt riêng cho từng người ở tab Nhân sự */
const USER_GOALS = {
  /* Mỗi người một mục tiêu riêng — Manager sửa được ở tab Nhân sự.
     Hiệu chỉnh theo đúng nhịp A&R âm nhạc: cũ đặt 40–50 lead/tuần/người
     (~10 lead/ngày) trong khi cả hệ thống chỉ có 24 lead, nên mọi thanh đều
     đỏ "Chưa đạt". Bộ số dưới đây cho ra phổ đạt/gần/chưa thật sự. */
  'Ethan Nguyen':    {leads:7, opps:3, nego:4, yearUSD:900000},
  'Nguyen Ngoc Lam': {leads:5, opps:2, nego:4, yearUSD:550000},
  'Hannah Le':       {leads:4, opps:2, nego:2, yearUSD:500000},
  'Valeria Tinoco':  {leads:4, opps:1, nego:2, yearUSD:550000}
};
function goalFor(name){
  if(!USER_GOALS[name]) USER_GOALS[name] = Object.assign({}, GOAL_DEFAULT);
  const g = USER_GOALS[name];
  /* g.nego có thể vắng ở bản lưu cũ — khi đó quay về cách suy ra kiểu cũ. */
  const nego = (g.nego == null) ? Math.round(g.opps*GOAL_RATE) : g.nego;
  return {leads:g.leads, opps:g.opps, nego:nego, won:Math.round(nego*GOAL_RATE),
          yearUSD:g.yearUSD, weekUSD:Math.round(g.yearUSD/GOAL_WEEKS)};
}
function goalTargets(name){
  if(name){ const g=goalFor(name); return [g.leads,g.opps,g.nego,g.won,g.weekUSD]; }
  return USERS.reduce((acc,u)=>{
    const g=goalFor(u.name);
    return [acc[0]+g.leads, acc[1]+g.opps, acc[2]+g.nego, acc[3]+g.won, acc[4]+g.weekUSD];
  },[0,0,0,0,0]);
}
function goalCalc(name){
  const tg = goalTargets(name);
  const target = [tg[0], tg[1], tg[2], tg[3]];
  const w0 = weekStart();
  const L = name ? DB.leads.filter(x=>x.owner===name) : DB.leads;
  const O = name ? DB.opps.filter(x=>x.owner===name)  : DB.opps;
  const actual = [
    L.filter(l=>l.created>=w0).length,
    O.filter(o=>o.created && o.created>=w0).length,
    O.filter(o=>o.stage!=='lost' && o.lastAct>=w0).length,
    O.filter(o=>o.stage==='won' && o.closeDate>=w0 && o.closeDate<=TODAY).length
  ];
  const wonVal = O.filter(o=>o.stage==='won' && o.closeDate>=w0 && o.closeDate<=TODAY)
                  .reduce((a,b)=>a+b.amount,0);
  target.push(tg[4]);
  actual.push(wonVal);
  const pcts = actual.map((a,i)=>Math.min(100, Math.round(a/(target[i]||1)*100)));
  const overall = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
  return {target:target, actual:actual, pcts:pcts, overall:overall};
}

/* giá trị hiển thị của một trường */
function fVal(o, fd){
  const e = o.ext || {};
  if(fd.k==='name')       return o.name;
  if(fd.k==='account')    return accName(o.accountId);
  if(fd.k==='stage')      return t('st_'+o.stage);
  if(fd.k==='close')      return fdate(o.closeDate);
  if(fd.k==='owner')      return o.owner;
  if(fd.k==='dealValue')  return money(o.amount);
  if(fd.k==='createdBy'||fd.k==='createdBy2') return e.createdBy || o.owner;
  if(fd.k==='modifiedBy') return o.owner;
  const v = e[fd.k];
  if(fd.f==='chk')   return v ? '✓' : '—';
  if(fd.f==='dual')  return (v && v.length) ? v.join(', ') : '—';
  if(v===undefined || v==='' || v===null) return '—';
  if(fd.f==='money') return money(Number(v));
  if(fd.f==='pct')   return v+'%';
  if(fd.f==='sel'){
    if(fd.o==='USERS' || fd.o==='BU') return v;
    const hit = (fd.o||[]).find(x=>Array.isArray(x) ? x[1]===v : x===v);
    return hit ? (Array.isArray(hit) ? L(hit) : hit) : v;
  }
  return String(v);
}
function detRow(o, fd, rw){
  const editing = state.detEdit && state.detEdit.id===o.id && state.detEdit.k===fd.k;
  const ro = ['dealValue','createdBy','createdBy2','modifiedBy','owner','account'].indexOf(fd.k)>=0
             || fd.f==='calc' || fd.f==='dual';
  let cell;
  if(editing){
    const cur0 = (o.ext||{})[fd.k];
    if(fd.k==='stage'){
      cell = '<select class="dedit" onchange="detSave(\''+o.id+'\',\'stage\',this.value)">'+
        STAGES.map(x=>'<option value="'+x.id+'"'+(x.id===o.stage?' selected':'')+'>'+esc(t('st_'+x.id))+'</option>').join('')+
        '</select>';
    } else if(fd.k==='close'){
      cell = '<input class="dedit" type="date" value="'+o.closeDate.toISOString().slice(0,10)+
        '" onchange="detSave(\''+o.id+'\',\'close\',this.value)">';
    } else if(fd.f==='sel'){
      let opts;
      if(fd.o==='BU')         opts = BUSINESS_UNITS.map(x=>[x,x]);
      else if(fd.o==='USERS') opts = USERS.map(u=>[u.name,u.name]);
      else opts = (fd.o||[]).map(x=>Array.isArray(x)?[L(x),x[1]]:[x,x]);
      cell = '<select class="dedit" onchange="detSave(\''+o.id+'\',\''+fd.k+'\',this.value)">'+
        '<option value="">'+esc(t('none'))+'</option>'+
        opts.map(x=>'<option value="'+esc(x[1])+'"'+(x[1]===cur0?' selected':'')+'>'+esc(x[0])+'</option>').join('')+
        '</select>';
    } else if(fd.f==='ta'){
      cell = '<textarea class="dedit" rows="3" onblur="detSave(\''+o.id+'\',\''+fd.k+'\',this.value)">'+
        esc(cur0||'')+'</textarea>';
    } else {
      const ty = (fd.f==='money'||fd.f==='pct'||fd.f==='num') ? 'number' : 'text';
      cell = '<input class="dedit" type="'+ty+'" value="'+esc(cur0===undefined?'':cur0)+
        '" onblur="detSave(\''+o.id+'\',\''+fd.k+'\',this.value)" onkeypress="if(event.key===\'Enter\')this.blur()">';
    }
  } else {
    const raw = fVal(o, fd);
    cell = /^https?:\/\//i.test(raw)
      ? '<a href="'+esc(raw)+'" target="_blank" rel="noopener">'+esc(raw)+'</a>'
      : esc(raw);
  }
  const pen = (rw && !ro && !editing)
    ? '<button class="dpen" onclick="detEditOn(\''+o.id+'\',\''+fd.k+'\')">'+
      '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.4l2.4 2.4L5.4 13H3v-2.4z"/></svg></button>'
    : '<span></span>';
  return '<div class="drow"><div class="dlab">'+esc(L(fd.l))+'</div>'+
    '<div class="dval">'+cell+'</div>'+pen+'</div>';
}
function detEditOn(id,k){
  state.detEdit={id,k}; render();
  setTimeout(()=>{ const e=document.querySelector('.dedit'); if(e) e.focus(); },40);
}
function detSave(id,k,val){
  const o = DB.opps.find(x=>x.id===id);
  state.detEdit=null;
  if(!o || !canEdit(o.owner)){ render(); return; }
  if(k==='stage'){
    if(val!==o.stage){
      logDiff('opp',o.id,o.name,'stage',o.stage,val);
      DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
        text:t('st_'+o.stage)+' → '+t('st_'+val),date:TODAY,who:ME});
      o.stage=val; o.lastAct=TODAY;
    }
  } else if(k==='close'){
    const q=String(val||'').split('-');
    if(q.length===3){ const nd=new Date(+q[0],+q[1]-1,+q[2]);
      if(nd.getTime()!==o.closeDate.getTime()){ logDiff('opp',o.id,o.name,'closeDate',o.closeDate,nd); o.closeDate=nd; } }
  } else {
    o.ext = o.ext || {};
    const old = o.ext[k];
    if(String(old||'')!==String(val||'')){
      o.ext[k] = val;
      logAudit({objType:'opp',objId:o.id,objName:o.name,action:'update',field:k,oldV:old||'',newV:val||''});
      if(k==='name'){ o.name = val; }
      o.lastAct = TODAY;
    }
  }
  toast(t('saved')); render();
}

      text:subj+(g('av_note')?' — '+g('av_note'):''), date:TODAY, who:ME});

/* Gắn một deal vào một party của portal. Danh mục portal không có ở đây (CRM
   cố ý không nạp haustek-core.js), nên nhập tay partyKey — đúng hình thức
   "A:<id>" hoặc "L:<id>". Kiểm hình thức chứ không kiểm tồn tại: chỉ portal
   mới biết id nào có thật. */
function openBind(dealId){
  if(!can('approve')) return;
  const o = DB.opps.find(x=>x.id===dealId); if(!o) return;
  const r = handoffOf(o);
  const calls = handoffCalls(r);
  document.getElementById('overlay').innerHTML = shell(t('handoff'), r.dealName,
    '<div class="fld"><div class="fld-l">'+esc(t('hoParty'))+'</div>'+
      '<input class="in" id="bindKey" placeholder="A:123  /  L:7" value="'+esc(r.portalPartyKey||'')+'"></div>'+
    '<div class="unote">'+esc(t('hoBindHint'))+'</div>'+
    (calls.length ? '<div class="sec"><div class="sec-t">'+esc(t('hoCalls'))+'</div>'+
        '<pre style="font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;'+
        'background:var(--surface);border-radius:6px;padding:10px;line-height:1.6">'+
        esc(calls.join('\n'))+'</pre>'+
        '<div class="unote">'+esc(t('hoCallsNote'))+'</div></div>' : ''),
    '<button class="btn" onclick="closeDrawer()">'+esc(t('cancel'))+'</button>'+
    (r.portalPartyKey?'<button class="btn" onclick="saveBind(\''+dealId+'\',1)">'+esc(t('hoUnbind'))+'</button>':'')+
    '<button class="btn btn-primary" onclick="saveBind(\''+dealId+'\')">'+esc(t('save'))+'</button>');
}
function saveBind(dealId, clear){
  const o = DB.opps.find(x=>x.id===dealId); if(!o) return;
  const old = HANDOFF_BIND[dealId] || '';
  let key = '';
  if(!clear){
    const el = document.getElementById('bindKey');
    key = (el ? el.value : '').trim();
    if(key && !/^[AL]:[A-Za-z0-9_-]+$/.test(key)){ toast(t('hoBadKey')); return; }
  }
  if(key) HANDOFF_BIND[dealId] = key; else delete HANDOFF_BIND[dealId];
  logAudit({objType:'opp', objId:dealId, objName:o.name, action:'update',
            field:'portalPartyKey', oldV:old||'', newV:key||'', note:'handoff'});
  closeDrawer(); toast(key ? t('hoBound',{k:key}) : t('hoUnbound')); render();
}
function handoffExport(){
  const txt = JSON.stringify(handoffPayload(), null, 1);
  try {
    const url = URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'haustek-crm-handoff.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(t('hoExported'));
  } catch(e){ toast(e.message); }
}

function cellEdit(o, f, display, isNum){
  const on = state.inline && state.inline.id===o.id && state.inline.f===f;
  if(on){
    const stop = ' onclick="event.stopPropagation()" onkeydown="if(event.key===\'Escape\')inlineCancel()"';
    if(f==='stage')
      return '<select class="iedit"'+stop+' onchange="inlineSave(\''+o.id+'\',\'stage\',this.value)">'+
        STAGES.map(x=>'<option value="'+x.id+'"'+(x.id===o.stage?' selected':'')+'>'+esc(t('st_'+x.id))+'</option>').join('')+
        '</select>';
    if(f==='amount')
      return '<input class="iedit" type="number" value="'+Math.round(fx(o.amount))+'"'+stop+
        ' onblur="inlineSave(\''+o.id+'\',\'amount\',this.value)"'+
        ' onkeypress="if(event.key===\'Enter\')this.blur()">';
    if(f==='close')
      return '<input class="iedit" type="date" value="'+o.closeDate.toISOString().slice(0,10)+'"'+stop+
        ' onchange="inlineSave(\''+o.id+'\',\'close\',this.value)">';
  }
  const pen = canEdit(o.owner)
    ? '<button class="ipen" title="'+esc(t('save'))+'" onclick="event.stopPropagation();inlineEdit(\''+o.id+'\',\''+f+'\')">'+
      '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M11.2 2.4l2.4 2.4L5.4 13H3v-2.4z"/></svg></button>'
    : '';
  return '<span class="icell'+(isNum?' num':'')+'">'+display+pen+'</span>';
}
function inlineEdit(id,f){
  state.inline={id,f}; render();
  setTimeout(()=>{
    const e=document.querySelector('.iedit');
    if(e){ e.focus(); if(e.tagName==='SELECT' && e.showPicker){ try{e.showPicker();}catch(err){} } }
  },40);
}
function inlineCancel(){ state.inline=null; render(); }
function inlineSave(id,f,val){
  const o = DB.opps.find(x=>x.id===id);
  state.inline=null;
  if(!o || !canEdit(o.owner)){ render(); return; }
  let changed=false;
  if(f==='stage' && val!==o.stage){
    logDiff('opp',o.id,o.name,'stage',o.stage,val);
    DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
      text:t('st_'+o.stage)+' → '+t('st_'+val),date:TODAY,who:ME});
    o.stage=val; changed=true;
  }
  if(f==='amount'){
    const n = Math.round((parseFloat(val)||0)/(cur==='VND'?FX:1));
    if(n!==o.amount){ logDiff('opp',o.id,o.name,'amount',o.amount,n); o.amount=n; changed=true; }
  }
  if(f==='close' && val){
    const q=val.split('-');
    if(q.length===3){
      const nd=new Date(+q[0],+q[1]-1,+q[2]);
      if(nd.getTime()!==o.closeDate.getTime()){
        logDiff('opp',o.id,o.name,'closeDate',o.closeDate,nd); o.closeDate=nd; changed=true;
      }
    }
  }
  if(changed){ o.lastAct=TODAY; toast(t('saved')); }
  render();
}
function setOppF(f){ state.oppFilter=f; render(); }
function setOppV(v){ state.oppView=v; render(); }

VIEWS.tasks = function(){
  const rows = sTasks().filter(x=>
    (state.taskFilter==='all' || (state.taskFilter==='open'?!x.done:x.done)) &&
    (matches(x.subject)||matches(x.rel))
  ).sort((a,b)=>a.due-b.due);

  const chips = ['open','done','all'].map(f=>
    '<button class="chip'+(state.taskFilter===f?' on':'')+'" onclick="setTaskF(\''+f+'\')">'+
    esc(f==='all'?t('all'):t(f==='open'?'taskOpen':'taskDone'))+'</button>').join('');

  const body = rows.length ? '<div class="tw"><div class="card-b" style="padding:6px 16px">'+
    rows.map(x=>{
      const late = !x.done && x.due<TODAY;
      const isToday = x.due.toDateString()===TODAY.toDateString();
      return '<button class="check" onclick="toggleTask(\''+x.id+'\')">'+
        '<span class="cbox'+(x.done?' on':'')+'">'+(x.done?'✓':'')+'</span>'+
        '<span class="'+(x.done?'done':'')+'" style="flex:1">'+esc(x.subject)+
        '<span class="dim" style="font-size:11.5px;display:block">'+esc(x.rel)+'</span></span>'+
        '<span style="font-size:11.5px;'+(late?'color:var(--red);font-weight:500':'color:var(--muted)')+'">'+
        esc(late?t('overdue'):(isToday?t('today'):fdate(x.due)))+'</span></button>';
    }).join('')+'</div></div>' : emptyBox(t('noTasks'), t('noTasksSub'));

  return phead(t('tasks'), rows.length+' '+t('items'),
      '<button class="btn btn-primary" onclick="openNew(\'task\')">'+esc(t('newTask'))+'</button>')+
    '<div class="tools">'+chips+'</div>'+body;
};
function setTaskF(f){ state.taskFilter=f; render(); }
function toggleTask(id){
  const x=DB.tasks.find(y=>y.id===id);
  logAudit({objType:'task',objId:x.id,objName:x.subject,action:'update',field:'done',oldV:x.done,newV:!x.done});
  x.done=!x.done; render();
}

/* Bước kế tiếp của một deal trong chuỗi duyệt CRM, đã tính cả ngưỡng bỏ qua
   sếp vùng. Trả null nếu deal không còn ở phần CRM cầm lái. */
function nextStage(o){
  const step = APPROVAL[o.stage];
  if(!step) return null;
  /* Deal nhỏ: sếp country duyệt xong là trình thẳng portal, không qua sếp vùng.
     Nhưng deal CHƯA ĐIỀN giá trị thì không tính là nhỏ — amount 0 nghĩa là chưa
     ai định giá, không phải "đáng 0 đồng". Cho nó lọt cửa vì amount rỗng là mở
     đúng một đường để deal lớn né sếp vùng: bỏ trống ô giá trị. */
  if(o.stage==='waiting' && o.amount > 0 && o.amount < REGION_THRESHOLD) return 'portal';
  return step.next;
}
function canAdvance(o){
  if(!o || !APPROVAL[o.stage]) return false;
  const step = APPROVAL[o.stage];
  if(step.perm) return can(step.perm);
  return canEdit(o.owner);          /* A&R tự trình deal của mình lên sếp country */
}
/* Đẩy một deal đi tiếp một bước, hoặc từ chối. Mọi thay đổi giai đoạn do CRM
   điều khiển đều đi qua đây — để có đúng một chỗ ghi nhật ký và kiểm quyền. */
function advance(id, ok){
  const o = DB.opps.find(x=>x.id===id);
  if(!o) return;
  if(PORTAL_STAGES.includes(o.stage)){ toast(t('stagePortalOwned')); return; }
  if(!canAdvance(o)){ toast(t('noRight')); return; }
  const from = o.stage;
  if(!ok){
    logAudit({objType:'opp',objId:o.id,objName:o.name,action:'reject',
      field:'stage',oldV:from,newV:'negotiation'});
    /* Từ chối KHÔNG giết deal — trả về đàm phán để A&R sửa rồi trình lại.
       Bản cũ đẩy thẳng sang 'lost', tức là một cái lắc đầu của sếp là mất trắng
       cơ hội, không có đường quay lại. */
    o.stage = 'negotiation';
    DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
      text:L(['Không duyệt, trả lại đàm phán.','Sent back to negotiation.']),date:TODAY,who:ME});
    o.lastAct = TODAY;
    toast(t('sentBack',{n:o.name}));
    render(); return;
  }
  const to = nextStage(o);
  if(!to) return;
  logAudit({objType:'opp',objId:o.id,objName:o.name,action:'approve',
    field:'stage',oldV:from,newV:to});
  o.stage = to; o.lastAct = TODAY;
  const skipped = (from==='waiting' && to==='portal');
  DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
    text: to==='portal'
      ? L(['Trình lên portal chờ CEO duyệt.'+(skipped?' Dưới ngưỡng nên bỏ qua sếp vùng.':''),
           'Submitted to the portal for CEO approval.'+(skipped?' Below threshold, regional step skipped.':'')])
      : L(['Duyệt, chuyển sang '+t('st_'+to)+'.','Approved, moved to '+t('st_'+to)+'.']),
    date:TODAY,who:ME});
  toast(t(to==='portal'?'sentPortal':'approved',{n:o.name}));
  render();
}
/* giữ tên cũ: nhiều chỗ trong giao diện và bộ kiểm đang gọi decide() */
function decide(id, ok){ advance(id, ok); }

VIEWS.reports = function(){
  if(!can('reports')) return myReports();
  return managerReports();
};
function myReports(){
  const p0 = periodStart();
  const lbl = t(PERIODS.find(x=>x[0]===state.period)[1]);
  /* chỉ dữ liệu của chính người đang đăng nhập, lọc theo kỳ */
  const myL = DB.leads.filter(l=>l.owner===ME && l.created>=p0);
  const myO = DB.opps.filter(o=>o.owner===ME && o.created && o.created>=p0);
  const myW = DB.opps.filter(o=>o.owner===ME && o.stage==='won' && o.closeDate>=p0 && o.closeDate<=TODAY);
  const val = myW.reduce((a2,b2)=>a2+b2.amount,0);

  const kpiStrip = '<div class="stats">'+
    stat(t('rpMyLeads'), myL.length, lbl)+
    stat(t('rpMyOpps'), myO.length, lbl)+
    stat(t('rpMyWon'), myW.length, lbl)+
    stat(t('rpMyValue'), money(val), lbl)+
  '</div>';

  /* 1 — cơ cấu giá trị theo giai đoạn */
  const dStage = STAGES.map(x=>({
    label:t('st_'+x.id), color:x.raw,
    v:myO.filter(o=>o.stage===x.id).reduce((a2,b2)=>a2+b2.amount,0)
  })).filter(x=>x.v>0);
  const totStage = dStage.reduce((a2,b2)=>a2+b2.v,0);

  /* 2 — lead theo trạng thái */
  const dLead = LEAD_STATUS.map(x=>({
    label:t('ls_'+x.id), color:x.raw, v:myL.filter(l=>l.status===x.id).length
  })).filter(x=>x.v>0);

  /* 3 — phễu chuyển đổi */
  const nWait  = myO.filter(o=>o.stage==='waiting').length;
  const nLegal = myO.filter(o=>o.stage==='legal').length;
  const nSign  = myO.filter(o=>o.stage==='signature').length;
  const nWon   = myO.filter(o=>o.stage==='won').length;
  const funnel = [
    {label:t('fnAll'),   n:myO.length,                       color:'#062b35'},
    {label:t('fnAppr'),  n:nWait+nLegal+nSign+nWon,          color:'#0b6b80'},
    {label:t('fnLegal'), n:nLegal+nSign+nWon,                color:'#16899f'},
    {label:t('fnSign'),  n:nSign+nWon,                       color:'#2aa0b6'},
    {label:t('fnWon'),   n:nWon,                             color:'#3aa3b8'}
  ];

  /* 4 — doanh số đã ký theo tháng */
  const months={};
  myW.forEach(o=>{
    const k=o.closeDate.getFullYear()+'-'+String(o.closeDate.getMonth()+1).padStart(2,'0');
    months[k]=(months[k]||0)+o.amount;
  });
  const byMonth = Object.keys(months).sort().map(k=>({label:k, v:months[k], color:'#0b6b80'}));

  /* 5 — phân bổ quy mô deal */
  const buckets = [
    {lo:0, hi:1, label:'$0'}, {lo:1, hi:5000, label:'< $5K'},
    {lo:5000, hi:15000, label:'$5K – $15K'}, {lo:15000, hi:30000, label:'$15K – $30K'},
    {lo:30000, hi:1e9, label:'> $30K'}
  ].map(bk=>({label:bk.label, color:'#0b6b80', unit:'n',
              v:myO.filter(o=>o.amount>=bk.lo && o.amount<bk.hi).length}));

  /* 6 — lead theo nguồn */
  const bySrc = Object.keys(SOURCES).map(k=>({
    label:SOURCES[k][lang], unit:'n', color:'#3a6fb0', v:myL.filter(l=>l.source===k).length
  })).filter(x=>x.v>0).sort((a2,b2)=>b2.v-a2.v);

  const none = (arr, unit) => arr.length ? arr
    : [{label:'—', v:0, color:'#0b6b80', unit:unit}];

  /* mục tiêu & thời gian của riêng người này */
  const g = goalCalc(ME);
  const gName = [t('kpiK1'),t('kpiK2'),t('kpiK3'),t('kpiK4'),t('kpiK5')];
  const goalCard = '<div class="card"><div class="card-h"><span class="card-t">'+esc(t('kpiTitle'))+'</span>'+
    '<span class="card-note">'+esc(t('kpiWindow'))+' · '+g.overall+'%</span></div><div class="card-b">'+
    g.actual.map((a2,i)=>{
      const pct = g.pcts[i];
      const col = pct>=100?'var(--green)':(pct>=60?'#dd8a12':'var(--brand)');
      const show = (i===4) ? money(a2)+' / '+money(g.target[i]) : a2+' / '+g.target[i];
      return '<div class="kpi-row" style="grid-template-columns:150px 1fr 128px">'+
        '<div class="kpi-name">'+esc(gName[i])+'</div>'+
        '<div class="kpi-track"><div class="kpi-fill" style="width:'+Math.max(2,pct)+'%;background:'+col+'"></div></div>'+
        '<div class="kpi-num">'+esc(show)+'</div></div>';
    }).join('')+'</div></div>';

  const uu = USAGE[ME] || {days:[0,0,0,0,0,0], today:0};
  const uAll = uu.days.concat([uu.today]);
  const uMax = Math.max.apply(null, uAll.concat([1]));
  const usageCard = '<div class="card"><div class="card-h"><span class="card-t">'+esc(t('usageTitle'))+'</span>'+
    '<span class="card-note">'+esc(t('usageWeek'))+': '+esc(fmtDur(usageWeek(ME)))+
    ' · '+esc(t('usageAvg'))+' '+esc(fmtDur(Math.round(usageWeek(ME)/7)))+'</span></div>'+
    '<div class="card-b"><div class="ubars">'+uAll.map((v,i)=>
      '<div class="ubar"><div class="ubar-t"><div class="ubar-f'+(i===6?' now':'')+
      '" style="height:'+Math.max(4,(v/uMax)*100)+'%" title="'+esc(fmtDur(v))+'"></div></div>'+
      '<div class="ubar-l">'+esc(i===6?t('usageToday'):String(7-i)+'d')+'</div></div>').join('')+
    '</div><div class="unote">'+esc(t('usageNote'))+'</div></div></div>';

  return phead(t('myReport'), ME+' · '+lbl)+
    periodChips()+ kpiStrip+
    '<div class="grid2" style="margin-bottom:16px">'+
      donutCard(t('rpValueStage'), dStage, String(myO.length), t('deals'), true,
        t('totalLbl')+': '+money(totStage))+
      donutCard(t('rpLeadStatus'), dLead, String(myL.length), t('leadsN'), false, '')+
    '</div>'+
    '<div class="grid2" style="margin-bottom:16px">'+
      funnelCard(t('rpFunnel'), funnel)+
      barCard(t('rpMonth'), none(byMonth))+
    '</div>'+
    '<div class="grid2" style="margin-bottom:16px">'+
      barCard(t('rpSize'), buckets)+
      barCard(t('rpSource'), none(bySrc,'n'))+
    '</div>'+
    '<div class="grid2">'+ goalCard + usageCard +'</div>';
}

function barCard(title, rows, note){
  const max = Math.max.apply(null, rows.map(r=>r.v).concat([1]));
  return '<div class="card"><div class="card-h"><span class="card-t">'+esc(title)+'</span>'+
    (note?'<span class="card-note">'+esc(note)+'</span>':'')+'</div>'+
    '<div class="card-b"><div class="bars">'+rows.map(r=>
      '<div class="brow"><div class="blabel" title="'+esc(r.label)+'">'+esc(r.label)+'</div>'+
      '<div class="btrack"><div class="bfill" style="width:'+Math.max(1.5,(r.v/max)*100)+'%;background:'+r.color+'"></div></div>'+
      '<div class="bval">'+esc(r.unit==='n'?String(r.v):moneyShort(r.v))+'</div></div>').join('')+
    '</div></div></div>';
}

function arcPath(cx,cy,R,r,a0,a1){
  const big = (a1-a0) > Math.PI ? 1 : 0;
  const pt=(rad,a)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  const A=pt(R,a0), B=pt(R,a1), C=pt(r,a1), D=pt(r,a0);
  return 'M'+A[0]+' '+A[1]+' A'+R+' '+R+' 0 '+big+' 1 '+B[0]+' '+B[1]+
         ' L'+C[0]+' '+C[1]+' A'+r+' '+r+' 0 '+big+' 0 '+D[0]+' '+D[1]+' Z';
}
function donutCard(title, items, midVal, midLbl, isMoney, note){
  const total = items.reduce((a,b)=>a+b.v,0) || 1;
  const SZ=152, cx=SZ/2, cy=SZ/2, R=70, r=45;
  let a0 = -Math.PI/2, segs='';
  items.forEach(it=>{
    let sweep = (it.v/total) * Math.PI*2;
    if(sweep > Math.PI*1.999) sweep = Math.PI*1.999;
    const a1 = a0 + sweep;
    segs += '<path class="donut-seg" d="'+arcPath(cx,cy,R,r,a0,a1)+'" fill="'+it.color+'">'+
            '<title>'+esc(it.label)+' · '+esc(isMoney?moneyShort(it.v):String(it.v))+'</title></path>';
    a0 = a1;
  });
  const legend = items.map(it=>
    '<div class="dl"><span class="dot" style="background:'+it.color+'"></span>'+
    '<span class="dl-name">'+esc(it.label)+'</span>'+
    '<span class="dl-n">'+esc(isMoney?moneyShort(it.v):String(it.v))+'</span>'+
    '<span class="dl-p">'+Math.round(it.v/total*100)+'%</span></div>').join('');
  return '<div class="card"><div class="card-h"><span class="card-t">'+esc(title)+'</span>'+
    (note?'<span class="card-note">'+esc(note)+'</span>':'')+'</div>'+
    '<div class="card-b"><div class="chartrow">'+
      '<div class="donut-c"><svg width="'+SZ+'" height="'+SZ+'" viewBox="0 0 '+SZ+' '+SZ+'">'+segs+'</svg>'+
      '<div class="donut-mid"><div><div class="donut-v">'+esc(midVal)+'</div>'+
      '<div class="donut-l">'+esc(midLbl)+'</div></div></div></div>'+
      '<div class="dlegend">'+legend+'</div>'+
    '</div></div></div>';
}
function funnelCard(title, steps){
  const top = Math.max.apply(null, steps.map(x=>x.n).concat([1]));
  let html='';
  steps.forEach((st,i)=>{
    const w = Math.min(100, Math.max(26, (st.n/top)*100));
    html += '<div class="fn-bar" style="width:'+w+'%;background:'+st.color+'">'+
      '<span class="fn-lbl">'+esc(st.label)+'</span><span class="fn-n">'+st.n+'</span></div>';
    if(i<steps.length-1){
      const rate = Math.round(steps[i+1].n/(st.n||1)*100);
      html += '<div class="fn-gap">'+
        '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M4.5 9.5L8 13l3.5-3.5"/></svg>'+
        '<span class="fn-rate">'+rate+'%</span></div>';
    }
  });
  return '<div class="card"><div class="card-h"><span class="card-t">'+esc(title)+'</span></div>'+
    '<div class="card-b"><div class="fn">'+html+'</div></div></div>';
}

function audExport(){

                t('cAction'),t('cField'),t('cOld'),t('cNew')];

  const txt = el ? el.value.trim() : '';
  if(!txt) return;
  try { store.importJSON(txt); }
  catch(e){ toast(String((e && e.message) || t('snapBadVer'))); return; }
  if(store.available()){ location.reload(); return; }
  /* Safari mở bằng file:// chặn localStorage — không reload được, vẽ lại tại chỗ. */
  closeDrawer();
  if(AUTHED){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
  }
  renderLogin(); render(); toast(t('snapLoaded'));
}

function leadExtra(l){
  const rows=[];
  if(l.dealType) rows.push([t('fDealType'), t('dt_'+l.dealType)]);
  if(l.rights) rows.push([t('rightsNeg'),
    ['dist','pub','yt'].filter(k=>l.rights[k]).map(k=>t(k)).join(', ')||'—']);
  if(l.tier) rows.push([t('fTier'), l.tier]);
  if(l.country) rows.push([t('fCountryAL'), l.country]);
  if(l.bu) rows.push([t('fBU'), l.bu]);
  if(l.contactPerson) rows.push([t('fContactPerson'), l.contactPerson]);
  if(l.website) rows.push([t('fWebsite'), l.website]);
  if(l.income) rows.push([t('fIncome'), money(l.income)]);

             igf:'igFollowers',yts:'ytSubs',ytv:'ytViews',fbf:'fbFollowers'};
    Object.keys(m).forEach(k=>{ if(l.social[k]) soc.push([t(m[k]),

function uaBand(pct){
  if(pct>50)  return {c:'#2f6fd0'};
  if(pct>=25) return {c:'#e07b1f'};
  if(pct>=5)  return {c:'#dd8a12'};
  return          {c:'var(--brand)'};
}
function openUserAudit(name){
  state.drawer = {kind:'userAudit', id:name};
  const rows  = DB.audit.filter(a=>a.user===name);
  const total = rows.length || 1;
  const weekSec = usageWeek(name);
  const group = (keyFn) => {
    const m = {};
    rows.forEach(a=>{
      const k = keyFn(a); if(!k) return;
      if(!m[k]) m[k] = {k:k, n:0, first:a.ts, last:a.ts, meta:a};
      m[k].n++;
      if(a.ts < m[k].first) m[k].first = a.ts;
      if(a.ts > m[k].last)  m[k].last  = a.ts;
    });
    return Object.keys(m).map(k=>m[k]).sort((x,y)=>y.n-x.n);
  };
  const bar = (g, showMeta) => {
    const pct = g.n/total*100, bd = uaBand(pct);
    const hrs = weekSec*(g.n/total)/3600;
    return '<div class="ua-row">'+
      '<div class="ua-top"><span class="ua-ip">'+esc(g.k)+'</span>'+
        (showMeta && g.meta.loc ? '<span class="ua-loc">'+esc(L(g.meta.loc))+'</span>' : '')+
        '<span class="ua-pct" style="color:'+bd.c+'">'+pct.toFixed(1)+'%</span></div>'+
      '<div class="ua-bar"><div class="ua-fill" style="width:'+Math.max(1.5,pct)+'%;background:'+bd.c+'"></div></div>'+
      '<div class="ua-meta"><span>'+g.n+' '+esc(t('uaTimes'))+'</span>'+
        (showMeta ? '<span>'+esc(g.meta.dev)+'</span>' : '')+
        '<span>'+hrs.toFixed(1)+' '+esc(t('uaHours'))+'</span>'+
        '<span>'+esc(t('uaFirst'))+' '+esc(fdate(g.first))+'</span>'+
        '<span>'+esc(t('uaLast'))+' '+esc(fdate(g.last))+'</span></div></div>';
  };
  const legend = '<div class="ua-legend">'+
    [['uaL1','var(--brand)'],['uaL2','#dd8a12'],['uaL3','#e07b1f'],['uaL4','#2f6fd0']]
      .map(x=>'<span class="ua-lg"><span class="ua-sw" style="background:'+x[1]+'"></span>'+esc(t(x[0]))+'</span>')
      .join('')+'</div>';
  const u = USERS.find(x=>x.name===name);
  const body =
    '<div class="ua-h"><span class="ua-n">'+total+'</span>'+
      '<span class="ua-s">'+esc(t('uaLogins'))+' · '+esc(fmtDur(weekSec))+'</span></div>'+
    (u ? '<div class="ua-s">'+esc(u.email)+' · '+esc(t('role_'+u.role))+'</div>' : '')+
    legend+
    '<div class="sec"><div class="sec-t">'+esc(t('uaByIP'))+'</div>'+group(a=>a.ip).map(g=>bar(g,true)).join('')+'</div>'+
    '<div class="sec"><div class="sec-t">'+esc(t('uaByDev'))+'</div>'+group(a=>a.dev).map(g=>bar(g,false)).join('')+'</div>'+
    '<div class="unote">'+esc(t('uaNote'))+'</div>';
  document.getElementById('overlay').innerHTML =
    shell(t('uaTitle'), name, body, '<button class="btn" onclick="closeDrawer()">'+esc(t('cancel'))+'</button>');
}

function togRight(id,k){
  const o=DB.opps.find(x=>x.id===id);

function saveOpp(id){
  const o=DB.opps.find(x=>x.id===id);
  const ns=document.getElementById('f_stage').value;
  if(ns!==o.stage) DB.acts.push({id:'v'+(++uid),refId:o.id,type:'stage',
    text:t('st_'+o.stage)+' → '+t('st_'+ns),date:TODAY,who:ME});
  logDiff('opp',o.id,o.name,'stage',o.stage,ns);
  o.stage=ns;
  const na=Math.round((parseFloat(document.getElementById('f_amount').value||0))/(cur==='VND'?FX:1));
  logDiff('opp',o.id,o.name,'amount',o.amount,na);
  o.amount=na;
  const dv=document.getElementById('f_close').value;
  if(dv){ const p=dv.split('-'); const nd=new Date(+p[0],+p[1]-1,+p[2]);
    logDiff('opp',o.id,o.name,'closeDate',o.closeDate,nd); o.closeDate=nd; }
  const no=document.getElementById('f_owner').value;
  logDiff('opp',o.id,o.name,'owner',o.owner,no);
  o.owner=no;
  o.lastAct=TODAY;
  saveSoon();
  closeDrawer(); toast(t('saved')); render();
}
function saveLead(id){
  const l=DB.leads.find(x=>x.id===id);
  const ns=document.getElementById('f_status').value, no=document.getElementById('f_owner').value;
  logDiff('lead',l.id,l.name,'status',l.status,ns);
  logDiff('lead',l.id,l.name,'owner',l.owner,no);
  l.status=ns; l.owner=no;
  closeDrawer(); toast(t('saved')); render();
}
function convertLead(id){
  const l=DB.leads.find(x=>x.id===id);
  let a=DB.accounts.find(x=>x.name===l.company);
  if(!a){ a={id:'a'+(++uid),name:l.company,type:/label|records|entertainment|production|music/i.test(l.company)?'label':'artist',
    owner:l.owner,phone:l.phone,country:'VN'}; DB.accounts.push(a); }
  DB.contacts.push({id:'c'+(++uid),name:l.name,accountId:a.id,title:l.title,email:l.email,phone:l.phone,owner:l.owner});
  const o={id:'o'+(++uid),name:l.company+' — Distribution',accountId:a.id,stage:'negotiation',amount:0,
    closeDate:new Date(TODAY.getFullYear(),TODAY.getMonth()+2,0),owner:l.owner,
    rights:{dist:true,pub:false,yt:false},created:TODAY,lastAct:TODAY};
  DB.opps.push(o);
  DB.acts.push({id:'v'+(++uid),refId:o.id,type:'note',text:'Chuyển đổi từ lead '+l.name+'.',date:TODAY,who:l.owner});
  logAudit({objType:'lead',objId:l.id,objName:l.name,action:'convert',
    field:'status',oldV:l.status,newV:'converted',note:o.name});
  logAudit({objType:'opp',objId:o.id,objName:o.name,action:'create'});
  l.status='converted';
  closeDrawer(); toast(t('converted',{n:l.name})); state.view='opps'; state.oppFilter='negotiation'; render();
}

  const raw = parseFloat(e ? e.value : 0);
  if(isNaN(raw) || raw < 0){ toast(t('completeField')); return; }
  const usd = Math.round(cur==='VND' ? raw/FX : raw);
  const old = REGION_THRESHOLD;
  if(usd === old) return;
  REGION_THRESHOLD = usd;
  logAudit({objType:'system', objName:t('thrTitle'), action:'update',
            field:'thr', oldV:old, newV:usd});
  toast(t('thrSaved',{n:money(usd)})); render();
}
function saveGoal(name){
  const n = id => { const e=document.getElementById(id); const v=parseFloat(e?e.value:0); return isNaN(v)?0:v; };
  const old = goalFor(name);
  const nw = {leads:Math.round(n('g_leads')), opps:Math.round(n('g_opps')),
              nego:Math.round(n('g_nego')),
              yearUSD: Math.round(cur==='VND' ? n('g_value')/FX : n('g_value'))};
  [['leads','gLeads'],['opps','gOpps'],['nego','gNego'],['yearUSD','gValue']].forEach(k=>{
    const o = k[0]==='yearUSD' ? old.yearUSD : old[k[0]];
    if(o !== nw[k[0]])
      logAudit({objType:'system', objName:name, action:'update',
                field:k[1], oldV:o, newV:nw[k[0]]});
  });
  USER_GOALS[name] = nw;
  closeDrawer(); toast(t('goalSaved',{n:name})); render();
}

function ofField(fd){

  let ctrl = '';
  const d = fd.d || '';
  const ro = fd.ro ? ' readonly style="background:#f4f5f7;color:var(--ink-2)"' : '';
  const rc = fd.calc ? ' oninput="dealCalc()"' : '';
  if(fd.f==='text')  ctrl = '<input class="fin" id="'+id+'" value="'+esc(d)+'">';
  else if(fd.f==='num') ctrl = '<input class="fin" type="number" id="'+id+'" value="'+esc(d)+'">';
  else if(fd.f==='date')ctrl = '<input class="fin" type="date" id="'+id+'">';

    ctrl = '<div class="curin" data-cur="'+esc(cur)+'"><input class="fin" type="number" id="'+id+'" value="'+esc(d)+'"'+ro+rc+'></div>';

  else if(fd.f==='acc')
    ctrl = '<input class="fin" id="'+id+'" list="ofAccounts" placeholder="'+esc(L(['Tìm khách hàng…','Search accounts…']))+'">';
  else if(fd.f==='stage')
    ctrl = '<select class="fin" id="'+id+'"><option value="">'+esc(t('none'))+'</option>'+
      STAGES.map(x=>'<option value="'+x.id+'">'+esc(t('st_'+x.id))+'</option>').join('')+'</select>';
  else if(fd.f==='dual'){
    ctrl = '<div class="dual">'+

      '<select multiple id="'+id+'_b" style="width:100%"></select></div></div>';
  }
  else if(fd.f==='calc'){
    let v = d;
    if(fd.k==='owner' || fd.k==='createdBy' || fd.k==='createdBy2' || fd.k==='modifiedBy') v = ME;
    if(fd.k==='dealValue') v = fmtMoney(0,false);
    ctrl = '<div class="calcv" id="'+id+'">'+esc(v)+'</div>'+
      (fd.note?'<div class="calcn">'+esc(L(fd.note))+'</div>':
        '<div class="calcn">'+esc(L(['Hệ thống tự điền khi lưu','Filled by the system on save']))+'</div>');
  }
  else if(fd.f==='sel'){
    let opts;
    if(fd.o==='BU')          opts = BUSINESS_UNITS.map(x=>[x,x]);
    else if(fd.o==='USERS')  opts = USERS.map(u=>[u.name,u.name]);

function dualMove(id, toChosen){
  const from = document.getElementById(id+(toChosen?'_a':'_b'));

/* ========== Advance calculation — theo sheet "Catalog ROI." ==========
   avg   = doanh thu catalogue bình quân / tháng
   share = tỷ lệ chia cho nghệ sĩ (C2)          pass = pass-through (E2)
   net   = avg*(1-share)            [D3]  thu nhập HAUSTEK / tháng
   pt    = (avg-net)*pass           [E3]  pass-through
   recoup= avg-net-pt               [G3]  doanh thu thu hồi được / tháng
   bal1  = -advance+recoup          [H3]  số dư sau tháng đầu
   months= advance/recoup           [I3]  số tháng thu hồi
   total = net*term                 [D5]  tổng thu HAUSTEK toàn kỳ
   roi   = total/advance            [J5]        roiY = roi/term*12   [K5]
   finder= fee*(1-share)*avg*term   [J10]
   roiNet= (total-finder-mkt)/advance [J12]                                   */
const ADV_F = [
  {id:'ac_avg',  l:['Doanh thu catalogue / tháng','Monthly catalog income'], k:'money', d:'0', ro:1,
   tip:['Lấy tự động từ Thu nhập hàng tháng ở phần Chi tiết hợp đồng (YouTube + Audio).',

  {id:'ac_adv',  l:['Advance ban đầu','Initial advance'], k:'money', d:'0'},
  {id:'ac_mkt',  l:['Marketing fund','Marketing fund'], k:'money', d:'0',
   tip:['Cộng vào tổng advance và tính vào ROI.','Added to total advance and included in ROI.']},

  {id:'ac_excl', l:['Thời hạn độc quyền (tháng)','Exclusivity (months)'], k:'num', d:'36'},
  {id:'ac_fee',  l:['Finders fee','Finders fee'], k:'pct', d:'0'},
  {id:'ac_rate', l:['Ngưỡng kích hoạt trigger (% advance đã thu hồi)','Trigger threshold (% of advance recouped)'], k:'pct', d:'100'},
  {id:'ac_cap',  l:['Cap trigger (doanh thu 12 tháng cộng thêm %)','Trigger cap (12-month revenue plus %)'], k:'pct', d:'30'}

function advNum(id){ const e=document.getElementById(id); const v=parseFloat(e?e.value:0); return isNaN(v)?0:v; }
function acFmt(n){
  return new Intl.NumberFormat(cur==='VND'?'vi-VN':'en-US',
    cur==='VND'?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0})
    .format(n||0)+' '+cur;
}
function roiBand(pct){
  if(pct>=35) return {cls:'good', col:'var(--green)', bg:'#e8f5ee', fg:'#1f6b41'};
  if(pct>=25) return {cls:'warn', col:'#dd8a12',     bg:'#fdf3e0', fg:'#8a5606'};
  return          {cls:'bad',  col:'var(--brand)',  bg:'var(--brand-tint)', fg:'var(--brand-dark)'};
}
function advModel(advOverride){
  const avg=advNum('ac_avg'), share=advNum('ac_share')/100, pass=advNum('ac_pass')/100;
  const adv=(advOverride==null?advNum('ac_adv'):advOverride);
  const mkt=advNum('ac_mkt'), prod=advNum('ac_prod');
  const term=advNum('ac_term'), excl=advNum('ac_excl'), fee=advNum('ac_fee')/100;
  const totalAdv = adv + mkt + prod;
  const net    = avg*(1-share);
  const pt     = (avg-net)*pass;
  const recoup = avg-net-pt;
  const bal1   = -totalAdv+recoup;
  const months = recoup>0 ? totalAdv/recoup : 0;
  const total  = net*term;
  const roi    = totalAdv>0 ? total/totalAdv : 0;
  const roiY   = term>0 ? roi/term*12 : 0;
  const finder = fee*(1-share)*avg*term;
  const roiNet = totalAdv>0 ? (total-finder)/totalAdv : 0;
  return {avg,share,pass,adv,mkt,prod,totalAdv,term,excl,fee,net,pt,recoup,bal1,months,total,roi,roiY,finder,roiNet};
}
function advCalc(){
  const box = document.getElementById('acRes'); if(!box) return;
  const m = advModel();
  const bandY = roiBand(m.roiY*100);
  const rows = [
    [['Tổng advance (gồm marketing + production)','Total advance (incl. marketing + production)'], acFmt(m.totalAdv), ''],
    [['Thu nhập HAUSTEK / tháng','HAUSTEK monthly income'], acFmt(m.net), ''],
    [['Nghệ sĩ nhận trong kỳ thu hồi','Artist share during recoupment'], acFmt(m.pt), ''],
    [['Doanh thu thu hồi được / tháng','Recoupable royalties / month'], acFmt(m.recoup), ''],
    [['Số dư sau tháng đầu','Account balance after month 1'], acFmt(m.bal1), m.bal1>=0?'good':'bad'],
    [['Số tháng thu hồi vốn','Months to recoup'],
      (m.months?m.months.toFixed(1):'—')+' '+L(['tháng','months']),
      (m.months && m.months<=m.term)?'good':'bad'],
    [['Tổng thu HAUSTEK toàn kỳ','Total HAUSTEK income over term'], acFmt(m.total), ''],
    [['Finders fee','Finders fee'], acFmt(m.finder), ''],
    [['ROI toàn kỳ','Total deal ROI'], (m.roi*100).toFixed(0)+'%', m.roi>=1?'good':'bad'],
    [['ROI theo năm','ROI annual'], (m.roiY*100).toFixed(1)+'%', bandY.cls==='good'?'good':(bandY.cls==='bad'?'bad':'')],
    [['ROI sau chi phí','ROI after costs'], (m.roiNet*100).toFixed(0)+'%', m.roiNet>=1?'good':'bad']
  ];
  box.innerHTML = rows.map(r=>'<div class="acr"><div class="acr-l">'+esc(L(r[0]))+'</div>'+
    '<div class="acr-v '+r[2]+'"'+(L(r[0])===L(['ROI theo năm','ROI annual'])?' style="color:'+bandY.col+'"':'')+'>'+
    esc(r[1])+'</div></div>').join('');

  /* ----- gợi ý theo bội số ----- */
  const sug = document.getElementById('acSug');
  if(sug){
    const html = [12,15,16,18].map(mult=>{
      const a = m.avg*mult;
      const s2 = advModel(a);
      const bd = roiBand(s2.roiY*100);
      return '<div class="acsug-c" style="border-color:'+bd.col+'33">'+
        '<div class="acsug-h">×'+mult+'</div>'+
        '<div class="acsug-a">'+acFmt(a)+'</div>'+
        '<div class="actrig-row"><span>'+esc(L(['Tổng advance','Total advance']))+'</span><b>'+acFmt(s2.totalAdv)+'</b></div>'+
        '<div class="actrig-row"><span>'+esc(L(['Thu hồi','Recoup']))+'</span><b>'+
          (s2.months?s2.months.toFixed(1):'—')+' '+esc(L(['tháng','mo']))+'</b></div>'+
        '<div class="actrig-row"><span>'+esc(L(['ROI / năm','ROI / yr']))+'</span>'+
          '<b style="color:'+bd.col+'">'+(s2.roiY*100).toFixed(1)+'%</b></div>'+
        '<button type="button" class="acsug-b" style="background:'+bd.bg+';color:'+bd.fg+
          ';border-color:'+bd.col+'55" onclick="advApply('+mult+')">'+
          esc(L(['Chọn & áp dụng','Select & apply']))+'</button>'+
      '</div>';
    }).join('');
    /* chỉ vẽ lại khi nội dung thật sự đổi — tránh thay thẻ ngay lúc người dùng đang bấm */
    if(sug.getAttribute('data-html') !== html){
      sug.innerHTML = html;
      sug.setAttribute('data-html', html);
    }
  }

  /* ----- trigger ----- */
  const rate = advNum('ac_rate')/100, capPct = advNum('ac_cap')/100;
  const cap  = m.avg*12*(1+capPct);
  const gate = m.totalAdv*rate;
  const T = [{n:1,mult:15,add:24},{n:2,mult:12,add:18}].map(x=>{
    const amt = m.avg*x.mult;
    return {n:x.n, mult:x.mult, add:x.add, amt:amt, paid:Math.min(amt,cap), over:amt>cap};
  });
  document.getElementById('acTrig').innerHTML = T.map(x=>
    '<div class="actrig">'+
      '<div class="actrig-h">Trigger '+x.n+' — ×'+x.mult+'</div>'+
      '<div class="actrig-s">'+esc(L(['Kích hoạt khi đã thu hồi ','Fires once recouped ']))+
        advNum('ac_rate')+'% '+esc(L(['tổng advance = ','of total advance = ']))+acFmt(gate)+'</div>'+
      '<div class="actrig-row"><span>'+esc(L(['Advance trigger','Trigger advance']))+'</span><b>'+acFmt(x.amt)+'</b></div>'+
      '<div class="actrig-row"><span>'+esc(L(['Độc quyền cộng thêm','Exclusivity added']))+'</span><b>+'+x.add+' '+esc(L(['tháng','months']))+'</b></div>'+

function saveOppForm(again){

               'of_ytIncome','of_audioIncome','of_advance','of_mktBudget','of_prodFund'];

  /* đặt sau vòng lặp và dùng khoá riêng để không trùng với ô "Tiền tạm ứng" (advance) */

    const am = advModel();

      totalIncome:am.total, roi:am.roi, roiAnnual:am.roiY, roiAfterCosts:am.roiNet,
      triggerRatePct:advNum('ac_rate'), capPct:advNum('ac_cap'),

      trigger2:{mult:12, addMonths:18, amount:am.avg*12}
    };
  } catch(e){ ext.advCalcResult = null; }
  if(!bk('advanceDeal')) ext.advCalcResult = null;

  let acct = DB.accounts.find(a=>a.name === v('account'));
  if(!acct){
    acct = {id:'a'+(++uid), name:v('account'),
      type:/label|records|entertainment|production|music/i.test(v('account'))?'label':'artist',
      owner:ME, phone:'', country:'VN'};
    DB.accounts.push(acct);
    logAudit({objType:'account', objId:acct.id, objName:acct.name, action:'create'});
  }
  const monthly = toUSD(nn('monthlyIncome'));
  const cd = v('close').split('-');
  const o = {
    id:'o'+(++uid), name:v('name'), accountId:acct.id, stage:v('stage'),
    amount: monthly * 12,
    closeDate: cd.length===3 ? new Date(+cd[0],+cd[1]-1,+cd[2])
                             : new Date(TODAY.getFullYear(),TODAY.getMonth()+2,0),
    owner: ME, created: TODAY, lastAct: TODAY,
    rights:{dist:bk('tDist'), pub:bk('tPub'), yt:bk('tYT')},
    ext: ext
  };
  const finishO = ()=>{
    DB.opps.unshift(o);
    DB.acts.push({id:'v'+(++uid), refId:o.id, type:'note',
      text: lang==='vi' ? 'Tạo cơ hội thủ công.' : 'Opportunity created manually.',
      date:TODAY, who:ME});
    logAudit({objType:'opp', objId:o.id, objName:o.name, action:'create'});
    logAudit({objType:'opp', objId:o.id, objName:o.name, action:'update',
              field:'amount', oldV:0, newV:o.amount});
    toast(t('created',{n:o.name}));
    state.view='opps'; state.oppFilter='all';
    if(again){ render(); openOppForm(); } else { closeDrawer(); render(); }
  };
  const dupsO = dupFindOpp(o);
  if(dupsO.length) dupWarn(dupsO, finishO); else finishO();
}

  ['phone','cPhone'], ['status','cStatus'], ['source','fLeadSource'], ['dealType','fDealType'],
  ['country','fCountryAL'], ['tier','fTier'], ['website','fWebsite'],

];
const IMPORT_HINTS = {
  name:['name','ten','tên','họ và tên','ho va ten','fullname','full name'],
  company:['company','nghệ danh','nghe danh','label','artist','công ty','cong ty'],
  title:['title','vai trò','vai tro','role','chức danh'],
  email:['email','e-mail','mail'],

  dealType:['deal type','dealtype','loại hợp đồng','loai hop dong'],
  country:['country','quốc gia','quoc gia'],
  tier:['tier','hạng','hang'],
  website:['website','web','site'],
  contactPerson:['contact person','người liên hệ','nguoi lien he','contact'],
  income:['income','thu nhập','thu nhap','revenue'],
  notes:['notes','note','ghi chú','ghi chu']
};
let IMP = null;

function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    }
    else if(c==='"') q=true;
    else if(c===',' || c===';' || c==='\t'){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''))
             .map(r=>r.map(x=>String(x).trim()));
}
function autoMap(headers){
  const m={};
  headers.forEach((h,i)=>{
    const low = h.toLowerCase().trim();
    for(const f in IMPORT_HINTS){
      if(Object.values(m).indexOf(f)>=0) continue;
      if(IMPORT_HINTS[f].some(k=>low===k || low.indexOf(k)>=0)){ m[i]=f; break; }
    }
  });
  return m;
}

function onCsvText(txt){
  const rows = parseCSV(txt);
  if(rows.length<2){ toast(t('noRowsYet')); return; }
  IMP.headers = rows[0];
  IMP.rows    = rows.slice(1);
  IMP.map     = autoMap(IMP.headers);
  IMP.step    = 3;
  renderImport();
}
function onCsvFile(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => onCsvText(String(e.target.result));
  r.readAsText(f, 'utf-8');
}
function impDrop(ev){
  ev.preventDefault(); ev.currentTarget.classList.remove('over');
  const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => onCsvText(String(e.target.result));
  r.readAsText(f, 'utf-8');
}
function impSetMap(i, field){
  if(field) IMP.map[i]=field; else delete IMP.map[i];

function matchId(list, raw, labelFn, dflt){
  const v = String(raw||'').toLowerCase().trim();
  if(!v) return dflt;
  const hit = list.find(x => x===v || labelFn(x).toLowerCase()===v);
  return hit || dflt;
}

      (step<4

          ' onclick="'+(canNext?'impGo('+(step+1)+')':'')+'">'+esc(t('next'))+'</button>'
        : '<button class="btn btn-primary" onclick="doImport()">'+esc(t('finish'))+'</button>')+
    '</div></div>';

  document.getElementById('overlay').innerHTML =

/* Thu nhập tháng = YouTube + Audio; net = (tháng + bản mới) × tỷ lệ ròng */
function dealCalc(){
  const g = id => { const e=document.getElementById('of_'+id); const v=parseFloat(e?e.value:0); return isNaN(v)?0:v; };
  const monthly = g('ytIncome') + g('audioIncome');
  const mi = document.getElementById('of_monthlyIncome');
  if(mi) mi.value = Math.round(monthly*100)/100;
  const net = (monthly + g('newRelIncome')) * (g('netPct')/100);
  const ni = document.getElementById('of_netIncome');
  if(ni) ni.value = Math.round(net*100)/100;
  const avg = document.getElementById('ac_avg');
  if(avg){ avg.value = Math.round(monthly*100)/100; advCalc(); }
}
function chkOn(id){ const e=document.getElementById(id); return !!e && e.getAttribute('data-on')==='1'; }

/* ---------- chống trùng lặp ---------- */
function norm(x){ return String(x||'').trim().toLowerCase().replace(/\s+/g,' '); }
function normPhone(x){ return String(x||'').replace(/[^0-9]/g,'').replace(/^84/,'0'); }
function dupFindLead(c){
  const out=[];
  DB.leads.forEach(l=>{
    const f=[];
    if(norm(c.name)    && norm(l.name)===norm(c.name))       f.push(t('cName'));
    if(norm(c.company) && norm(l.company)===norm(c.company)) f.push(t('cCompany'));
    if(norm(c.email)   && norm(l.email)===norm(c.email))     f.push(t('cEmail'));
    if(normPhone(c.phone) && normPhone(l.phone)===normPhone(c.phone)) f.push(t('cPhone'));
    if(norm(c.contactPerson) && norm(l.contactPerson)===norm(c.contactPerson)) f.push(t('fContactPerson'));
    if(c.links && l.links){
      [['sp','spProfile'],['ig','igProfile'],['tt','ttProfile'],['yt','ytChannel'],['am','amProfile']]
        .forEach(k=>{ if(norm(c.links[k[0]]) && norm(l.links[k[0]])===norm(c.links[k[0]])) f.push(t(k[1])); });
    }
    if(f.length) out.push({rec:l, owner:l.owner, fields:f});
  });
  return out;
}
function dupFindOpp(c){
  const out=[];
  DB.opps.forEach(o=>{
    const f=[];
    if(norm(c.name) && norm(o.name)===norm(c.name)) f.push(t('cName'));
    if(c.accountId && o.accountId===c.accountId)    f.push(t('cAccount'));
    const ce=c.ext||{}, oe=o.ext||{};
    [['spProfile','spProfile'],['igProfile','igProfile'],['ttProfile','ttProfile'],
     ['ytChannel','ytChannel'],['amProfile','amProfile']].forEach(k=>{
      if(norm(ce[k[0]]) && norm(oe[k[0]])===norm(ce[k[0]])) f.push(t(k[1]));
    });
    if(f.length) out.push({rec:o, owner:o.owner, fields:f});
  });
  return out;
}
