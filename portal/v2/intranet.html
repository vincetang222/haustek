<script>
"use strict";
/* =====================================================================
   CỬA NỘI BỘ — giữ nguyên HAUSTEK.admin, không khoá cửa.
   Hai bí mật kinh doanh nạp ở đây, không nằm trong file lõi mà cổng
   khách cũng tải về.
   ===================================================================== */
var A = HAUSTEK.admin;
A.provideSecrets({
  code: 'DIST-1',
  name: 'Đối tác phân phối chính (tên thật điền khi triển khai)',
  grossRate: 0.86,
  contact: 'nội bộ · không hiển thị cho đối tác'
});
HT.setFx(A.fx.get().rate);

/* =====================================================================
   CỬA — dựng cổng chỉ sau khi có người đăng nhập.
   Trước vòng 25, trang này tự vào bằng nhân sự đầu danh sách và có một ô
   chọn người ở chân cột trái. Ô ấy làm nhật ký đăng nhập vô nghĩa và làm
   ma trận quyền trông như một công tắc. Giờ vai đến từ tài khoản đã vào,
   đúng như hệ thật.
   ===================================================================== */
HTCua.mo({
  ten: 'internal',
  tieuDe: HT.lang === 'en' ? 'Haustek internal' : 'Cổng nội bộ Haustek',
  phu: HT.lang === 'en'
    ? 'Your desk, your department queue, and the approvals that are yours to make.'
    : 'Bàn làm việc của bạn, hàng đợi của bộ phận, và những việc bạn có quyền duyệt.',
  dangNhap: function (email) { return A.staff.dangNhapBang(email); },
  mau: A.staff.list().filter(function (s) { return s.active !== false; }).map(function (s) {
    return { email: s.email, ten: s.name, phu: HT.lang === 'en' ? s.titleEn : s.title };
  }),
  /* Cột phải nói với NHÂN VIÊN. Ba con số đọc thẳng từ A.counts và danh
     sách nền tảng từ A.stores, nên không có số nào gõ tay ở đây: đổi
     CFG.N_TRACKS là cửa đổi theo. Một trang đăng nhập khoe con số bịa là
     thứ đầu tiên người xem soi ra. */
  phai: {
    nhan: HT.lang === 'en' ? 'Internal portal' : 'Cổng nội bộ',
    h: HT.lang === 'en'
      ? ['Every dollar ', 'traces back', ' to one track']
      : ['Mỗi đồng đều ', 'lần ngược được', ' về một bài hát'],
    p: HT.lang === 'en'
      ? 'Revenue arrives by period and by source, the split chain runs, and every figure on every page opens up until you reach the track that produced it.'
      : 'Doanh thu về theo từng kỳ và từng nguồn, chuỗi chia chạy, và mọi con số trên mọi trang đều mở ra được cho tới đúng bài hát sinh ra nó.',
    so: [
      { n: HT.fmt.n(A.counts.tracks),  s: HT.lang === 'en' ? 'tracks' : 'bài hát' },
      { n: HT.fmt.n(A.counts.artists), s: HT.lang === 'en' ? 'artists' : 'nghệ sĩ' },
      { n: HT.fmt.n(A.counts.labels),  s: HT.lang === 'en' ? 'labels' : 'label' }
    ],
    trich: HT.lang === 'en'
      ? 'A partner only ever sees NET. The fee, the gross figure and the distributor’s name do not exist on that side of the wall.'
      : 'Đối tác chỉ thấy số NET. Phí, số gộp và tên đơn vị phân phối không tồn tại ở phía bên kia bức tường.',
    trichAi: HT.lang === 'en' ? 'Design rule · guarded by test/api-guard.js'
                              : 'Nguyên tắc dựng hệ · có test/api-guard.js canh',
    the: A.stores.slice(0, 10)
  },
  xong: function () { dungCong(); }
});

function dungCong() {
HT.chay({
  ten: 'internal',
  A: A,
  /* chuông và tìm nhanh trên thanh trên: lõi tính, khung vẽ */
  thongBao: function () { return A.notifications(); },
  danhDauDoc: function (c, ids) { return A.markNotifications(ids); },
  tim: function (c, q) { return A.search(q, 6); },
  moBai: function (c, id) { var a = A.asset(id); HTS.moNgan(c, a, { noiBo: true, tien: c.tien2, tien0: c.tien, playlists: A.playlistsOf(id) }); },
  moDoiTac: function (c) { location.hash = '#doi-tac'; },
  kyDanhSach: function () {
    return A.periods.map(function (p) {
      /* Nhãn này hiện trong ô chọn kỳ ở thanh trên, nên nó là CHỮ GIAO
         DIỆN và phải đổi theo ngôn ngữ. HT.lang là nguồn duy nhất. */
      var en = HT.lang === 'en';
      return { k: p.k, label: p.label, idx: p.idx,
               nhan: A.isApproved(p.k) ? (en ? 'approved' : 'đã xét duyệt')
                                       : (en ? 'not approved' : 'chưa xét duyệt') };
    });
  },
  kyMacDinh: A.periods[A.periods.length - 1].k,
  ghiChu: function (c) {
    var f = A.fx.get();
    var khoa = f.locked[c.kyKey];
    return '1 USD = ' + HT.fmt.n(khoa ? khoa.rate : f.rate) + ' ₫'
      + (khoa ? '' : (c.lang === 'vi' ? ' · chưa chốt tỷ giá' : ' · not locked'));
  },
  chanTrai: function (c) {
    var me = A.staff.me;
    return '<b>' + HT.esc(me.email) + '</b><span>' + HT.esc(c.lang === 'vi' ? me.title : me.titleEn) + '</span>' +
      '<button type="button" class="btn sm ghost" data-ra style="margin-top:9px;width:100%">' +
      HT.esc(c.lang === 'vi' ? 'Đăng xuất' : 'Sign out') + '</button>';
  }
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('[data-ra]')) return;
  HTCua.raKhoi('internal');
  location.hash = '';
  location.reload();
});
}
</script>
</body>
</html>
