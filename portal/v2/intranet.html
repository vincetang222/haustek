<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Haustek · Cổng vận hành nội bộ</title>
<link rel="icon" href="../../favicon.svg">
<!-- Bộ chữ nạp từ chính máy chủ này, không gọi ra fonts.googleapis.com.
     Thẻ <link rel=stylesheet> CHẶN việc chạy script cho tới khi tải xong,
     mà mọi màn hình ở đây đều do script dựng ra — nên fonts.googleapis.com
     chậm hoặc bị chặn là trang đứng lại ở khoảng trắng, không báo lỗi gì. -->
<link rel="stylesheet" href="fonts-nhung.css">
<link rel="stylesheet" href="haustek-theme.css">
</head>
<body>
<script src="../haustek-core.js"></script>
<script src="haustek-shell.js"></script>
<script src="haustek-bieudo.js"></script>
<script src="haustek-man.js"></script>
<script src="haustek-taisan.js"></script>

<script src="man/ban-lam-viec.js"></script>
<script src="man/tong-quan.js"></script>
<script src="man/theo-doi.js"></script>
<script src="man/nap-du-lieu.js"></script>
<script src="man/khop-isrc.js"></script>
<script src="man/doi-chieu.js"></script>
<script src="man/phat-hanh.js"></script>
<script src="man/giao-nhan.js"></script>
<script src="man/sua-hang-loat.js"></script>
<script src="man/bang-gia.js"></script>
<script src="man/ke-toan.js"></script>
<script src="man/chi-tra.js"></script>
<script src="man/tam-ung.js"></script>
<script src="man/ty-le.js"></script>
<script src="man/danh-muc.js"></script>
<script src="man/nen-tang.js"></script>
<script src="man/doi-tac.js"></script>
<script src="man/ho-tro.js"></script>
<script src="man/quyen.js"></script>
<script src="man/quan-tri.js"></script>

<script>
"use strict";
/* =====================================================================
   CỬA NỘI BỘ — giữ nguyên HAUSTEK.admin, không khoá cửa.
   Hai bí mật kinh doanh nạp ở đây, không nằm trong file lõi mà cổng
   khách cũng tải về.
   ===================================================================== */
var A = HAUSTEK.admin;
try { var NV = sessionStorage.getItem('haustek.demo.nv'); if (NV) A.staff.setMe(NV); } catch (e) {}
A.provideSecrets({
  code: 'DIST-1',
  name: 'Đối tác phân phối chính (tên thật điền khi triển khai)',
  grossRate: 0.86,
  contact: 'nội bộ · không hiển thị cho đối tác'
});
HT.setFx(A.fx.get().rate);

HT.chay({
  ten: 'internal',
  A: A,
  kyDanhSach: function () {
    return A.periods.map(function (p) {
      /* Nhãn này hiện trong ô chọn kỳ ở thanh trên, nên nó là CHỮ GIAO
         DIỆN và phải đổi theo ngôn ngữ. HT.lang là nguồn duy nhất. */
      var en = HT.lang === 'en';
      return { k: p.k, label: p.label, idx: p.idx,
               nhan: A.isApproved(p.k) ? (en ? 'approved' : 'đã xét duyệt')
                                       : (en ? 'not approved' : 'chưa xét duyệt') };
    });
  },
  kyMacDinh: A.periods[A.periods.length - 1].k,
  ghiChu: function (c) {
    var f = A.fx.get();
    var khoa = f.locked[c.kyKey];
    return '1 USD = ' + HT.fmt.n(khoa ? khoa.rate : f.rate) + ' ₫'
      + (khoa ? '' : (c.lang === 'vi' ? ' · chưa chốt tỷ giá' : ' · not locked'));
  },
  chanTrai: function (c) {
    var me = A.staff.me;
    return '<b>' + HT.esc(me.email) + '</b><span>' + HT.esc(c.lang === 'vi' ? me.title : me.titleEn) + '</span>' +
      '<select class="inline-sel" data-nv style="margin-top:9px;width:100%">' + A.staff.list().map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === me.id ? ' selected' : '') + '>' + HT.esc(s.name + ' · ' + (c.lang === 'vi' ? s.title : s.titleEn)) + '</option>';
      }).join('') + '</select>' +
      '<span style="display:block;margin-top:7px;line-height:1.5">' + HT.esc(c.lang === 'vi'
        ? 'Bản mẫu: đổi nhân viên để xem bàn làm việc theo vai. Hệ thống thật lấy vai từ tài khoản đăng nhập.'
        : 'Prototype: switch staff to see each role’s desk. The real system takes the role from the login.') + '</span>';
  }
});
/* Nhân vật nhân viên: giữ qua lần nạp lại. Đặt TRƯỚC khi vẽ (HT.chay đã vẽ
   một lần; đổi xong thì nạp lại trang cho gọn, y như đổi tài khoản ở cổng
   đối tác). */
document.addEventListener('change', function (e) {
  var s = e.target.closest('[data-nv]');
  if (!s) return;
  try { sessionStorage.setItem('haustek.demo.nv', s.value); } catch (err) {}
  location.hash = '#ban-lam-viec';
  location.reload();
});
</script>
</body>
</html>
