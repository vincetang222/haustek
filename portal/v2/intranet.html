<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Haustek · Cổng nội bộ</title>
<link rel="icon" href="../../favicon.svg">
<!-- Bộ chữ nạp từ chính máy chủ này, không gọi ra fonts.googleapis.com.
     Thẻ <link rel=stylesheet> CHẶN việc chạy script cho tới khi tải xong,
     mà mọi trang ở đây đều do script dựng ra — nên fonts.googleapis.com
     chậm hoặc bị chặn là trang đứng lại ở khoảng trắng, không báo lỗi gì. -->
<link rel="stylesheet" href="fonts-nhung.css">
<link rel="stylesheet" href="haustek-theme.css">
</head>
<body>
<script src="../haustek-loi.js"></script>
<script src="haustek-shell.js"></script>
<script src="haustek-man.js"></script>
<script src="haustek-hoso.js"></script>

<script src="man/hom-nay.js"></script>
<script src="man/viec.js"></script>
<script src="man/doi-tac.js"></script>
<script src="man/thong-bao.js"></script>
<script src="man/quan-tri.js"></script>

<script>
"use strict";
/* =====================================================================
   CỬA NỘI BỘ — giữ nguyên HAUSTEK.admin, không khoá cửa.

   Portal là SỔ THEO DÕI VIỆC và KÊNH THÔNG BÁO. Việc thật diễn ra ở
   OneRPM, Believe, Warner và YouTube CMS. Ở đây không có tỷ giá, không có
   doanh thu, không có biểu đồ: mọi con số tiền đều là con số ghi trên
   bảng kê PDF mà kế toán đã tải lên, kèm nguồn.
   ===================================================================== */
var A = HAUSTEK.admin;
try { var NV = sessionStorage.getItem('haustek.nv'); if (NV) A.nhanSu.datToi(NV); } catch (e) {}

HT.chay({
  ten: 'internal',
  A: A,
  /* chuông và tìm nhanh trên thanh trên: lõi tính, khung vẽ */
  thongBao: function () { return A.chuong(); },
  danhDauDoc: function () { return true; },
  tim: function (c, q) {
    var kq = A.timKiem(q, 5);
    return kq.doiTac.map(function (d) { return { title: d.ten, sub: 'Đối tác', di: 'doi-tac' }; })
      .concat(kq.viec.map(function (v) { return { title: v.tieuDe, sub: v.doiTacTen + ' · việc', di: 'viec' }; }))
      .concat(kq.banPhatHanh.map(function (b) { return { title: b.ten, sub: 'Bản phát hành', di: 'viec' }; }));
  },
  ghiChu: function () {
    var hn = A.homNayCua(A.nhanSu.toi.id);
    return A.thuTrongTuan(hn.ngay) + ', ' + A.ngayVi(hn.ngay);
  },
  chanTrai: function () {
    var me = A.nhanSu.toi;
    return '<b>' + HT.esc(me.ten) + '</b><span>' + HT.esc(me.chucDanh) + '</span>' +
      '<select class="inline-sel" data-nv style="margin-top:9px;width:100%">' + A.nhanSu.list().map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === me.id ? ' selected' : '') + '>' +
          HT.esc(s.ten + ' · ' + s.chucDanh) + '</option>';
      }).join('') + '</select>' +
      '<span style="display:block;margin-top:7px;line-height:1.5">' + HT.esc(
        'Bản mẫu: đổi người để xem trang Hôm nay của từng vị trí. Hệ thống thật lấy người dùng từ tài khoản đăng nhập.') + '</span>';
  }
});
/* Đổi người: nhớ qua lần nạp lại, rồi nạp lại cho sạch trạng thái. */
document.addEventListener('change', function (e) {
  var s = e.target.closest('[data-nv]');
  if (!s) return;
  try { sessionStorage.setItem('haustek.nv', s.value); } catch (err) {}
  location.hash = '#hom-nay';
  location.reload();
});
</script>
</body>
</html>
