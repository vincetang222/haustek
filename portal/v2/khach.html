<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Haustek · Cổng báo cáo doanh thu</title>
<link rel="icon" href="../../favicon.svg">
<!-- Bộ chữ nạp từ chính máy chủ này, không gọi ra fonts.googleapis.com.
     Thẻ <link rel=stylesheet> CHẶN việc chạy script cho tới khi tải xong,
     mà mọi màn hình ở đây đều do script dựng ra — nên fonts.googleapis.com
     chậm hoặc bị chặn là trang đứng lại ở khoảng trắng, không báo lỗi gì. -->
<link rel="stylesheet" href="fonts-nhung.css">
<link rel="stylesheet" href="haustek-theme.css">
</head>
<body>
<script src="../haustek-core.js"></script>
<script>
/* Khoá cửa NGAY, trước khi nạp bất cứ màn hình nào. Sau dòng này
   HAUSTEK.admin không còn tồn tại trong trang. */
HAUSTEK.lockdown();
</script>
<script src="haustek-shell.js"></script>
<script src="haustek-cua.js"></script>
<script src="haustek-bieudo.js"></script>
<script src="haustek-man.js"></script>
<script src="haustek-taisan.js"></script>
<script src="haustek-them.js"></script>
<script src="haustek-hoso.js"></script>

<script src="man/k-toi.js"></script>
<script src="man/k-phan-chia.js"></script>
<script src="man/k-tong-quan.js"></script>
<script src="man/k-ban-ghi.js"></script>
<script src="man/k-danh-muc.js"></script>
<script src="man/k-nen-tang.js"></script>
<script src="man/k-du-bao.js"></script>
<script src="man/k-xu-huong.js"></script>
<script src="man/k-playlist.js"></script>
<script src="man/k-chat-luong.js"></script>
<script src="man/k-chia-se.js"></script>
<script src="man/k-chien-dich.js"></script>
<script src="man/k-phat-hanh.js"></script>
<script src="man/k-nghe-si.js"></script>
<script src="man/k-he-thong.js"></script>
<script src="man/k-vi.js"></script>
<script src="man/k-bang-ke.js"></script>
<script src="man/k-tam-ung.js"></script>
<script src="man/k-ho-tro.js"></script>
<script src="man/k-tai-lieu.js"></script>

<script>
"use strict";
/* =====================================================================
   CỔNG KHÁCH — chỉ có HAUSTEK.api.
   Từ vòng 25, cửa vào là một trang đăng nhập thật (haustek-cua.js): gõ
   email, lõi tra, sai thì bị từ chối và bị ghi vào nhật ký đăng nhập.
   Hệ thật khác đúng hai chỗ: có mật khẩu, và không có danh sách tài
   khoản mẫu.
   ===================================================================== */
var api = HAUSTEK.api;
var TK = api.demoLogins().accounts.filter(function (a) { return a.status === 'active'; });
/* Xem với tư cách label con: label mẹ chọn một label con thì phiên chuyển
   sang label con đó, còn tài khoản đăng nhập vẫn là label mẹ. Khoá này
   chỉ là ý muốn của người dùng; quyền thật kiểm bằng api.delegations. */
var XEM = 'haustek.demo.xemThay';
function xoaXem() { try { sessionStorage.removeItem(XEM); } catch (e) {} }
/* Ai đang vào: do CỬA quyết định, không phải ô chọn. Gán ở đúc() bên dưới. */
var toi = null;
/* =====================================================================
   CỬA — dựng cổng chỉ sau khi có người đăng nhập.
   Trước vòng 25, trang này tự vào bằng tài khoản đầu danh sách. Đó là
   thứ không hệ thật nào làm, và nó làm nhật ký đăng nhập vô nghĩa: mọi
   dòng đều là "tài khoản số 0". Giờ phiên do CỬA quyết định.
   ===================================================================== */
HTCua.mo({
  ten: 'portal',
  tieuDe: HT.lang === 'en' ? 'Partner portal' : 'Cổng đối tác',
  phu: HT.lang === 'en'
    ? 'What each period paid you, what is in your wallet, and everything in your catalogue.'
    : 'Từng kỳ trả bạn bao nhiêu, ví còn bao nhiêu, và danh mục bạn đang có.',
  dangNhap: function (email) { return api.dangNhapBang(email); },
  mau: TK.map(function (a) {
    return { email: a.email, ten: a.name,
             phu: a.kind === 'nhan' ? (HT.lang === 'en' ? 'Collaborator' : 'Người cộng tác')
                : a.kind === 'sublabel' ? (HT.lang === 'en' ? 'Sub-label' : 'Label con')
                : a.role === 'label' ? 'Label'
                : a.kind === 'artist-indie' ? (HT.lang === 'en' ? 'Independent artist' : 'Nghệ sĩ độc lập')
                : (HT.lang === 'en' ? 'Artist' : 'Nghệ sĩ') };
  }),
  /* Cột phải nói với NGHỆ SĨ VÀ LABEL. Khác cửa nội bộ ở chỗ không có ô
     số nào: trước khi đăng nhập, cổng này chỉ gọi được ba hàm trong lớp
     TRUOC_KHI_VAO, nên nó KHÔNG biết gì về danh mục để mà đếm. Thà bỏ
     trống ba ô số còn hơn bịa ra ba con số cho đẹp bố cục.
     Danh sách nền tảng gõ tay vì lý do y hệt — api chưa mở gì trước cửa.
     Đây là chữ giới thiệu, không phải số liệu. */
  phai: {
    nhan: HT.lang === 'en' ? 'Partner portal' : 'Cổng đối tác',
    h: HT.lang === 'en'
      ? ['Your money, ', 'explained', ' line by line']
      : ['Tiền của bạn, ', 'giải thích được', ' từng dòng'],
    p: HT.lang === 'en'
      ? 'What each period paid, which platform it came from, what is sitting in your wallet, and where a withdrawal has got to. The figures here are yours — nobody else’s are mixed in.'
      : 'Từng kỳ trả bao nhiêu, đến từ nền tảng nào, ví còn bao nhiêu, và lệnh rút đang đi tới đâu. Số ở đây là của bạn — không lẫn của ai khác.',
    trich: HT.lang === 'en'
      ? 'Every figure on this side is NET: what reaches you after the fee. You never have to work out what was taken off along the way.'
      : 'Mọi con số ở phía này đều là NET: phần về tới tay bạn sau khi trừ phí. Bạn không phải tự tính xem dọc đường đã trừ những gì.',
    trichAi: HT.lang === 'en' ? 'How this portal is built' : 'Cách cổng này được dựng',
    the: ['Spotify', 'YouTube Music', 'TikTok', 'Apple Music', 'Zing MP3',
          'NhacCuaTui', 'Facebook', 'Amazon Music', 'Deezer', 'SoundCloud']
  },
  xong: function (dt) { toi = { role: dt.role, partyId: dt.partyId, name: dt.ten, email: dt.email }; dungCong(); }
});

function dungCong() {
var thay = null;                                        /* {labelId, name, clientId} khi đang xem thay */
var phienCua = { role: toi.role, partyId: toi.partyId }; /* phiên thật sự dùng để gọi api */
(function () {
  var id = null;
  try { id = sessionStorage.getItem(XEM); } catch (e) {}
  if (id == null || id === '' || toi.role !== 'label') { xoaXem(); return; }
  var uy = null;
  try { uy = api.delegations(toi.role, toi.partyId); } catch (e) { uy = null; }
  var lc = uy ? uy.viewAs.filter(function (x) { return String(x.labelId) === String(id); })[0] : null;
  if (!lc) { xoaXem(); return; }
  thay = { labelId: lc.labelId, name: lc.name, clientId: lc.clientId };
  phienCua = { role: 'label', partyId: lc.labelId };
})();

function nạpPhien() {
  var s = api.session(phienCua.role, phienCua.partyId);
  var p = api.periods(phienCua.role, phienCua.partyId);
  return { me: s, kys: p.open, cho: p.waiting, kyTacQuyen: p.pubOpen, moiNhat: p.latest };
}
/* Cửa vào: ghi một dòng nhật ký đăng nhập trước khi dựng phiên. Nuốt lỗi
   để không đổi hành vi dựng cổng — nếu mã bên bị từ chối thì moPhien đã
   kịp ghi một dòng "bị từ chối" rồi mới ném, và nạpPhien() ngay dưới sẽ
   ném đúng như hôm nay.
   Ở bản mẫu, vai và mã bên do chính trình duyệt truyền lên. Trên máy chủ
   chúng đến từ thẻ phiên đã xác thực, còn địa chỉ IP đọc từ kết nối. */
try { api.moPhien(phienCua.role, phienCua.partyId); } catch (e) {}
var PHIEN = nạpPhien();

HT.chay({
  ten: 'portal',
  api: api,
  phien: PHIEN,
  thongBao: function () { return api.notifications(PHIEN.me.role, PHIEN.me.partyId); },
  danhDauDoc: function (c, ids) { return api.markNotifications(PHIEN.me.role, PHIEN.me.partyId, ids); },
  /* Tìm nhanh quét danh mục; bên không có danh mục thì không có gì để
     tìm, và gọi vào là lõi chặn đúng như bảng quyền đã khai. */
  tim: PHIEN.me.role === 'nhan' ? null
    : function (c, q) { return api.search(PHIEN.me.role, PHIEN.me.partyId, q, 6); },
  moBai: function (c, id) {
    var me = PHIEN.me, la = me.role === 'label', hs = api.trackAsset(me.role, me.partyId, id);
    HTS.moNgan(c, hs, { mineLabel: la ? HTS.t('label') : HTS.t('toi'), revenueLabel: la ? HTS.t('gop') : HTS.t('toi'), anMine: !la,
      tien: HT.fmt.usd, tien0: HT.fmt.usd0, playlists: HTS.plCua(c, id), hoTro: true });
  },
  moDoiTac: function (c) { location.hash = '#k-nghe-si'; },
  coTienTe: false,
  /* Bên "người cộng tác" không có trang nào đọc theo kỳ: phần chia và ví
     đều là cộng dồn. Trả danh sách rỗng để khung giấu ô chọn kỳ. */
  kyDanhSach: function () {
    if (PHIEN.me.role === 'nhan') return [];
    return PHIEN.kys.map(function (p) { return { k: p.k, label: p.label }; });
  },
  kyMacDinh: PHIEN.moiNhat,
  ghiChu: function () { return PHIEN.me.clientId; },
  /* Biểu ngữ ngay trên nội dung trang khi đang xem thay một label con. */
  bieuNgu: function (c) {
    if (!thay) return '';
    var vi = c.lang === 'vi';
    return '<div class="viewas">' + HT.icon('layers') + '<span>' +
      (vi ? 'Đang xem với tư cách label con <b>' + HT.esc(thay.name) + '</b> (' + HT.esc(thay.clientId) + '). Số liệu và bảng kê là của label con này.'
          : 'Viewing as sub-label <b>' + HT.esc(thay.name) + '</b> (' + HT.esc(thay.clientId) + '). Figures and statements belong to this sub-label.') +
      '</span><span class="sp"></span><button type="button" class="btn sm" data-thoi-xem>' +
      HT.esc(vi ? 'Trở về ' + toi.name : 'Back to ' + toi.name) + '</button></div>';
  },
  chanTrai: function (c) {
    var vi = c.lang === 'vi', me = PHIEN.me;
    var vai = toi.role === 'nhan' ? (vi ? 'Người cộng tác' : 'Collaborator')
      : toi.role !== 'label'
      ? (me.independent ? (vi ? 'Nghệ sĩ độc lập' : 'Independent artist') : (vi ? 'Nghệ sĩ' : 'Artist'))
      : me.parentLabel ? (vi ? 'Label con của ' + me.parentLabel.name : 'Sub-label of ' + me.parentLabel.name)
      : me.childLabels > 0 ? (vi ? 'Label mẹ · ' + me.childLabels + ' label con' : 'Parent label · ' + me.childLabels + ' sub-labels')
      : 'Label';
    return '<b>' + HT.esc(me.name) + '</b>' +
      '<span>' + HT.esc(vai) + '</span>' +
      (thay ? '<span style="display:block;margin-top:3px">' + HT.esc(vi ? 'đăng nhập: ' + toi.name : 'signed in as ' + toi.name) + '</span>' : '') +
      '<span style="display:block;margin-top:2px" class="mono">' + HT.esc(toi.email) + '</span>' +
      '<button type="button" class="btn sm ghost" data-ra style="margin-top:9px;width:100%">' +
      HT.esc(vi ? 'Đăng xuất' : 'Sign out') + '</button>';
  }
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('[data-ra]')) return;
  HTCua.raKhoi('portal');
  xoaXem();
  location.hash = '';
  location.reload();
});

/* Bấm "Xem cổng của label này" ở bất kỳ đâu (cây label, ngăn trượt) và
   "Trở về" trên biểu ngữ. Quyền kiểm ở api.canViewAs trước khi đổi phiên. */
document.addEventListener('click', function (e) {
  var x = e.target.closest('[data-xem-thay]');
  if (x) {
    var id = x.getAttribute('data-xem-thay'), ok = false;
    try { ok = !!api.canViewAs(toi.role, toi.partyId, id); } catch (err) { ok = false; }
    if (!ok) {
      HT.thongBao(HT.lang === 'vi' ? 'Bạn không được uỷ quyền xem label này.' : 'You are not authorised to view this label.', 'no');
      return;
    }
    try { sessionStorage.setItem(XEM, String(id)); } catch (err) {}
    location.hash = '#k-tong-quan';
    location.reload();
    return;
  }
  if (e.target.closest('[data-thoi-xem]')) {
    xoaXem();
    location.hash = '#k-he-thong';
    location.reload();
  }
});
}
</script>
</body>
</html>
