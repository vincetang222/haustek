<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Haustek · Cổng đối tác</title>
<link rel="icon" href="../../favicon.svg">
<!-- Bộ chữ nạp từ chính máy chủ này, không gọi ra fonts.googleapis.com.
     Thẻ <link rel=stylesheet> CHẶN việc chạy script cho tới khi tải xong,
     mà mọi trang ở đây đều do script dựng ra — nên fonts.googleapis.com
     chậm hoặc bị chặn là trang đứng lại ở khoảng trắng, không báo lỗi gì. -->
<link rel="stylesheet" href="fonts-nhung.css">
<link rel="stylesheet" href="haustek-theme.css">
</head>
<body>
<script src="../haustek-loi.js"></script>
<script>
/* Lấy danh sách tài khoản mẫu TRƯỚC khi khoá cửa, rồi khoá NGAY, trước
   khi nạp bất cứ trang nào. Sau dòng lockdown() thì HAUSTEK.admin không
   còn tồn tại trong trang này, kể cả khi một trang nào đó gọi nhầm. */
var TK = HAUSTEK.api.dangNhapMau();
HAUSTEK.lockdown();
</script>
<script src="haustek-shell.js"></script>
<script src="haustek-man.js"></script>
<script src="haustek-hoso.js"></script>

<script src="man/k-trang-chu.js"></script>
<script src="man/k-viec.js"></script>
<script src="man/k-nhac.js"></script>
<script src="man/k-thanh-toan.js"></script>
<script src="man/k-trao-doi.js"></script>
<script src="man/k-tai-khoan.js"></script>

<script>
"use strict";
/* =====================================================================
   CỔNG ĐỐI TÁC — chỉ có HAUSTEK.api.

   Ô chọn tài khoản ở chân cột trái là mô phỏng đăng nhập cho bản mẫu.
   Hệ thật không có nó: mỗi người chỉ vào được chính tài khoản của mình,
   và phiên đăng nhập trên máy chủ mới là thứ quyết định doiTacId.

   Điều hướng SINH TỪ DỊCH VỤ đối tác thật sự mua (mỗi trang tự khai
   khaDung). Một thương hiệu chỉ chạy chiến dịch digital sẽ thấy bốn
   trang, chứ không thấy một bức tường trang tiền trống trông như hỏng.
   ===================================================================== */
var api = HAUSTEK.api;
var CHON = 'haustek.doi-tac-mau';
/* Trang nội bộ "Xem cổng như đối tác này" ghi khoá này rồi mở cửa sau. */
var NHU = 'haustek.xem-nhu';

/* Mặc định mở đối tác có NHIỀU VIỆC NHẤT, chỉ khi chưa ai chọn gì. Danh
   sách xếp theo tên, nên đối tác đầu bảng có thể chỉ có một dòng, và người
   mở lần đầu sẽ thấy cổng rỗng nhất có thể rồi tưởng đó là tất cả. Xếp
   theo số dịch vụ cũng không đủ: mua bốn dịch vụ mà chưa chạy việc nào thì
   trang vẫn trống. Đây là lựa chọn mặc định của BẢN MẪU, không phải luật
   của hệ thật: hệ thật lấy đối tác từ phiên đăng nhập. */
function dayNhat(ds) {
  /* Ưu tiên đối tác thấy ĐỦ SÁU TRANG (có nhạc và có tiền về), trong số đó
     lấy người nhiều việc nhất. Chọn theo số việc thôi thì rơi vào một đối
     tác chỉ mua booking: mười bốn việc nhưng chỉ bốn mục điều hướng, và
     người xem lần đầu không biết là còn hai trang nữa. */
  var du = ds.filter(function (x) { return x.coNhac && x.coTien; });
  var nguon = du.length ? du : ds;
  return nguon.slice().sort(function (a, b) {
    return (b.soViec || 0) - (a.soViec || 0) || (b.dichVu || []).length - (a.dichVu || []).length;
  })[0] || ds[0];
}
function nhoLai() {
  var id = null;
  try { id = localStorage.getItem(NHU); if (id) localStorage.removeItem(NHU); } catch (e) {}
  if (!id) { try { id = sessionStorage.getItem(CHON); } catch (e) {} }
  var hit = TK.filter(function (t) { return t.doiTacId === id; })[0];
  return hit || dayNhat(TK);
}
var toi = nhoLai();
try { sessionStorage.setItem(CHON, toi.doiTacId); } catch (e) {}
var PHIEN = api.phien(toi.doiTacId);

HT.chay({
  ten: 'portal',
  api: api,
  phien: PHIEN,
  thongBao: function () {
    var ds = api.chuaDoc(PHIEN.doiTacId, PHIEN.nguoiDungId) || [];
    return { items: ds.map(function (d) {
      return { id: d.thongBaoId, title: d.tieuDe, body: d.noiDung || '', di: 'k-trao-doi' };
    }), unread: ds.length };
  },
  danhDauDoc: function (c, ids) {
    (ids === 'all' ? (api.chuaDoc(PHIEN.doiTacId, PHIEN.nguoiDungId) || []).map(function (d) { return d.thongBaoId; }) : ids)
      .forEach(function (id) { try { api.danhDauDaDoc(PHIEN.doiTacId, id, PHIEN.nguoiDungId); } catch (e) {} });
    return true;
  },
  ghiChu: function () { return PHIEN.ten; },
  chanTrai: function () {
    var opts = TK.map(function (t) {
      return '<option value="' + HT.esc(t.doiTacId) + '"' + (t.doiTacId === toi.doiTacId ? ' selected' : '') + '>' +
        HT.esc(t.ten) + '</option>';
    }).join('');
    var ns = PHIEN.nguoiPhuTrach;
    return '<b>' + HT.esc(PHIEN.ten) + '</b>' +
      '<span>' + HT.esc(ns ? 'Phụ trách: ' + ns.ten : 'Đối tác Haustek') + '</span>' +
      '<select class="inline-sel" data-ai style="margin-top:9px;width:100%">' + opts + '</select>' +
      '<span style="display:block;margin-top:7px;line-height:1.5">' + HT.esc(
        'Bản mẫu: đổi tài khoản để xem cổng của một đối tác khác. Hệ thống thật không có ô chọn này.') + '</span>';
  }
});

document.addEventListener('change', function (e) {
  var s = e.target.closest('[data-ai]');
  if (!s) return;
  try { sessionStorage.setItem(CHON, s.value); } catch (err) {}
  location.hash = '#k-trang-chu';
  location.reload();
});
</script>
</body>
</html>
