    if (!NHAP.noiDung.trim()) { c.thongBao('Nội dung đang trống.', 'warn'); return; }
    if (!nn.soDoiTac) { c.thongBao('Chưa chọn ai để gửi.', 'warn'); return; }
    if (nn.soDoiTac >= 2) { XEM_TRUOC = true; c.veLai(); return; }
    gui(c, nn);
  });
}

/* Người dùng gõ xong chưa kịp mất focus mà đã bấm nút thì chữ cuối chưa
   vào NHAP. Quét lại một lượt trước mọi thao tác đọc bản nháp. */
function giuChu(root) {
  var a = root.querySelector('[data-tieu-de]'), b = root.querySelector('[data-noi]');
  if (a) NHAP.tieuDe = a.value;
  if (b) NHAP.noiDung = b.value;
}

/* Bước xem trước: hiện ĐÚNG danh sách người nhận theo tên và ĐÚNG chữ họ
   sẽ đọc. Không có nút thu hồi ở đời thật, nên cái phanh nằm ở đây. */
function veXemTruoc(root, c, nn) {
  root.innerHTML = HM.the({
    h2: 'Xem trước trước khi gửi',
    p: 'Gửi rồi thì không thu hồi được. Đọc lại một lượt.',

        nn.soNguoiDung + ' người có tài khoản đọc được.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;max-height:150px;overflow:auto">' +
        nn.doiTac.map(function (d) { return HM.tag(d.ten, ''); }).join('') + '</div>' +
      '<div style="border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--band)">' +
        '<b style="display:block;font-size:14.5px;margin-bottom:8px">' + e(NHAP.tieuDe) + '</b>' +
        '<div style="white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--ink-2)">' + e(NHAP.noiDung) + '</div>' +
      '</div>' +
      (/\{[a-zA-Z]+\}/.test(NHAP.tieuDe + NHAP.noiDung)
        ? HM.ghi({ kieu: 'warn', tieuDe: 'Còn chỗ trống chưa thay',
            than: 'Trong thư còn dấu ngoặc nhọn như <b>{ten}</b>. Đối tác sẽ đọc đúng dấu ngoặc đó. Quay lại thay bằng chữ thật.' })
        : ''),
    chan: '<div class="sp"></div><div class="btnrow">' +
      '<button type="button" class="btn" data-quay-lai>Quay lại sửa</button>' +
      '<button type="button" class="btn pri" data-gui>Gửi cho ' + nn.soDoiTac + ' đối tác</button></div>'
  });
  HM.bam(root, '[data-quay-lai]', function () { XEM_TRUOC = null; c.veLai(); });
  HM.bam(root, '[data-gui]', function () { gui(c, nn); });
}

function gui(c, nn) {
  try {
    var kq = c.A.thongBao.gui({ tieuDe: NHAP.tieuDe.trim(), noiDung: NHAP.noiDung.trim(), guiToi: guiToiHienTai() });
    c.thongBao('Đã gửi tới ' + kq.soDoiTac + ' đối tác.', 'ok');
    NHAP = { kieu: 'chon', doiTacIds: [], dichVu: '', tieuDe: '', noiDung: '', mauId: '' };
    XEM_TRUOC = null;
    c.datLoc({ tab: 'da-gui' });

/* ---- man/k-nhac.js ---- */
function(){
/* =====================================================================
   CỔNG ĐỐI TÁC · NHẠC CỦA TÔI
   ---------------------------------------------------------------------
   Danh mục bản phát hành và bài hát, tồn tại độc lập với việc: nhạc đã
   lên nền tảng ba năm trước vẫn nằm ở đây dù không còn việc nào mở.

   KHÔNG có lượt nghe, không doanh thu, không biểu đồ. Những con số đó
   nằm ở Spotify for Artists, ở OneRPM, ở YouTube Studio, và ở đó chúng
   luôn đúng. Chép về đây là tạo ra bản thứ hai của cùng một con số, và
   bản thứ hai bao giờ cũng cũ hơn bản gốc.
   ===================================================================== */
"use strict";
(function () {

var e = function (x) { return HM.esc(x == null ? '' : String(x)); };
var NEN_TANG = [
  { k: 'spotify', ten: 'Spotify' },
  { k: 'apple',   ten: 'Apple Music' },
  { k: 'youtube', ten: 'YouTube Music' }
];

HT.dangKy({
  id: 'k-nhac', nav: 'Nhạc của tôi', icon: 'disc',
  chu: { vi: { nav: 'Nhạc của tôi' } },
  /* Chỉ hiện cho đối tác thật sự có nhạc. Một thương hiệu chỉ chạy chiến
     dịch digital mà thấy trang này trống trơn thì tưởng phần mềm hỏng. */
  khaDung: function (c) { return !!(c.phien && c.phien.coNhac); },
  ve: function (root, c) {
    var api = c.api, ph = c.phien;
    var ds = api.nhac(ph.doiTacId);
    var daLen = ds.filter(function (b) { return b.nenTang === 'da-len'; }).length;
    var soTrack = ds.reduce(function (s, b) { return s + (b.soTrack || 0); }, 0);

    /* Danh sách GỌN, mở từng bản một. Đổ cả bốn mươi bản phát hành kèm
       toàn bộ track ra một trang thì trang dài mười nghìn điểm ảnh, và
       người muốn tìm một bài phải cuộn qua ba mươi chín bản không liên
       quan. Mở cái đang cần, đóng phần còn lại. */
    var mo = c.loc.mo || '';
    var st = HM.nho(null, 'k-nhac.trang', function () { return { trang: 0 }; });
    var tr = HM.phanTrang(ds, st, 12);

    var dong = tr.page.map(function (b) {
      var dangMo = b.id === mo;
      var link = NEN_TANG.filter(function (n) { return b.duongDan && b.duongDan[n.k]; }).map(function (n) {
        return '<a href="' + e(b.duongDan[n.k]) + '" target="_blank" rel="noopener">' + HM.icon('out') +
          '<span>Nghe trên ' + e(n.ten) + '</span></a>';
      }).join('');
      var track = dangMo ? (b.track || []).map(function (t) {
        return '<div class="d" style="padding:6px 0;border-top:1px solid var(--line)">' +
          '<div class="c">' + t.thuTu + '. ' + e(t.ten) +
          (t.featuring ? ' <span class="khi">feat. ' + e(t.featuring) + '</span>' : '') +
          '<span class="khi">' + (t.isrc ? 'ISRC ' + e(t.isrc) : 'chưa cấp ISRC') + '</span></div></div>';
      }).join('') : '';

      return '<div class="d" style="align-items:flex-start;flex-wrap:wrap">' +
        '<div class="c"><b>' + e(b.ten) + '</b> ' +
          (b.nenTang === 'da-len' ? HM.tag(b.nenTangTen, 'ok') : HM.tag(b.nenTangTen, '')) +
          '<span class="khi">' + e(({ single: 'Single', ep: 'EP', album: 'Album' }[b.loai] || b.loai) +
            ' · ' + b.soTrack + ' bài · phát hành ' + api.ngayVi(b.ngayPhatHanh) +
            (b.upc ? ' · UPC ' + b.upc : '')) + '</span>' +
          (b.nenTang !== 'da-len' && b.nenTangCau ? '<span class="khi">' + e(b.nenTangCau) + '</span>' : '') +
          ((b.canBoSung || []).length ? '<span class="khi">Haustek đang chờ bạn: ' + e(b.canBoSung.join(', ')) + '.</span>' : '') +
          (dangMo
            ? (link ? '<div class="ngoai" style="margin-top:10px">' + link + '</div>' : '') +
              '<div style="margin-top:8px">' + track + '</div>' +
              '<div class="khi" style="margin-top:8px">Mã hồ sơ ' + e(b.id) + '</div>'
            : '') +
        '</div>' +
        '<div class="btnrow">' +
          ((b.canBoSung || []).length
            ? '<button type="button" class="btn pri sm" data-di="k-viec" data-loc-id="' + e(b.id) + '">Mở việc</button>'
            : b.nenTang !== 'da-len'
              ? '<button type="button" class="btn sm" data-hoi="' + e(b.id) + '">Hỏi Haustek</button>' : '') +
          '<button type="button" class="btn sm" data-mo="' + e(dangMo ? '' : b.id) + '">' +
            (dangMo ? 'Thu gọn' : 'Xem bài hát') + '</button>' +
        '</div></div>';
    }).join('');

    root.innerHTML = HM.dau({ h1: 'Nhạc của tôi' }) +
      '<div class="tomtat">Bạn có <b>' + ds.length + ' bản phát hành</b> và ' + soTrack + ' bài hát ở đây' +
        (daLen ? ', trong đó ' + daLen + ' bản đã lên nền tảng' : '') + '. ' +
        'Lượt nghe và doanh thu bạn xem thẳng trên Spotify for Artists, YouTube Studio hoặc tài khoản phân phối, ' +
        'nơi số liệu luôn là mới nhất.</div>' +
      (ds.length
        ? HM.the({ thoBody: true, than: '<div class="hang">' + dong + '</div>' + tr.chan })
        : HM.trong({
            tieuDe: 'Nhạc của bạn sẽ hiện ở đây',
            moTa: 'Ngay khi bản phát hành đầu tiên được gửi lên, bạn thấy nó ở trang này kèm mã ISRC và đường dẫn nghe.' }));

    HM.bam(root, '[data-mo]', function (el) { c.datLoc({ mo: el.getAttribute('data-mo') }); });
    HM.ganTrang(root, st, c.veLai);

    HM.bam(root, '[data-hoi]', function (el) {
      var ma = el.getAttribute('data-hoi');
      var b = ds.filter(function (x) { return x.id === ma; })[0];
      HM.hoiForm(c, {
        tieuDe: 'Hỏi về ' + (b ? b.ten : ma),
        moTa: 'Câu hỏi của bạn tới thẳng người phụ trách.',
        fields: [
          { k: 'tieuDe', l: 'Bạn muốn hỏi gì', req: true, rong: true, v: 'Hỏi tiến độ ' + (b ? b.ten : ma) },
          { k: 'noiDung', l: 'Nội dung', kieu: 'textarea', rows: 4, req: true, rong: true }
        ]
      }).then(function (f) {
        if (!f) return;
        try {
          var kq = api.guiYeuCau(ph.doiTacId, { dichVu: 'ho-tro', tieuDe: f.tieuDe, noiDung: f.noiDung + '\n\nMã hồ sơ: ' + ma });
          c.thongBao(kq.bienNhan, 'ok');
        } catch (err) { c.thongBao('Chưa gửi được. Bạn gọi thẳng người phụ trách giúp.', 'warn'); }
      });
    });
  }
});

})();

      (bk.length

            h2: bk.length + ' kỳ đã có bảng kê',

/* ---- man/k-trao-doi.js ---- */
function(){
/* =====================================================================
   CỔNG ĐỐI TÁC · TRAO ĐỔI
   ---------------------------------------------------------------------
   Một dòng duy nhất: tin nhắn hai chiều, thông báo Haustek gửi, tệp đã
   bàn giao, mốc đã qua. Cùng cách trình bày với dòng thời gian ở trang
   đối tác bên nội bộ, để hai phía của phần mềm trông như một phần mềm.

   Mọi dòng tới được đây đều đã có hienChoDoiTac = true từ trong lõi.
   Trang này không tự lọc thêm lần nữa: lọc hai nơi thì sớm muộn hai nơi
   lọc khác nhau, và chỗ lỏng hơn là chỗ rò.
   ===================================================================== */
"use strict";
(function () {

var e = function (x) { return HM.esc(x == null ? '' : String(x)); };
var TEN_LOAI = { 'tin-nhan': 'Tin nhắn', 'thong-bao': 'Thông báo Haustek gửi',
  'trang-thai': 'Cập nhật', 'moc': 'Chặng đã qua', 'bang-ke': 'Bảng kê', 'tep': 'Tệp' };

HT.dangKy({
  id: 'k-trao-doi', nav: 'Trao đổi', icon: 'chat',
  chu: { vi: { nav: 'Trao đổi' } },
  dem: function (c) {
    try { return { n: (c.api.chuaDoc(c.phien.doiTacId, c.phien.nguoiDungId) || []).length, muc: 'thuong' }; }
    catch (e) { return null; }
  },
  ve: function (root, c) {
    var api = c.api, ph = c.phien;
    var ds = api.traoDoi(ph.doiTacId);
    var tep = api.taiLieu(ph.doiTacId);
    var chuaDoc = {};
    (api.chuaDoc(ph.doiTacId, ph.nguoiDungId) || []).forEach(function (x) { chuaDoc[x.thongBaoId] = true; });

    /* Mở ra 25 dòng. Đổ tám mươi dòng một lúc thì trang cao tám nghìn
       điểm ảnh và tin nhắn hôm nay nằm lẫn với lịch sử hai năm trước.
       Mười lăm dòng là vừa một màn hình rưỡi. */
    var soHien = +(c.loc.dong || 15);
    var ngayTruoc = '', ra = ['<div class="dt">'];
    ds.slice(0, soHien).forEach(function (x) {
      var ngay = String(x.luc).slice(0, 10);
      if (ngay !== ngayTruoc) {
        ngayTruoc = ngay;
        ra.push('<div class="ngay">' + e(ngay === api.homNay() ? 'Hôm nay' : api.thuTrongTuan(ngay) + ', ' + api.ngayVi(ngay)) + '</div>');
      }
      var cuaBan = x.boi && x.boi.kieu === 'nguoiDung';
      ra.push('<div class="m ta"' + (x.thongBaoId ? ' data-tb="' + e(x.thongBaoId) + '"' : '') + '>' +
        '<div class="h"><b>' + e(x.tieuDe) + '</b>' +
        '<time>' + e(api.gioVi(x.luc)) + '</time>' +
        '<span class="ai">' + e(cuaBan ? 'Bạn gửi' : (TEN_LOAI[x.loai] || '') + (x.boi && x.boi.ten ? ' · ' + x.boi.ten : '')) + '</span>' +
        (x.thongBaoId && chuaDoc[x.thongBaoId] ? HM.tag('mới', 'ok') : '') + '</div>' +
        (x.noiDung ? '<p>' + e(x.noiDung) + '</p>' : '') + '</div>');
    });
    ra.push('</div>');

    root.innerHTML = HM.dau({ h1: 'Trao đổi' }) +
      '<div class="doi-2"><div>' +
        HM.the({
          h2: 'Mọi trao đổi giữa bạn và Haustek',
          p: 'Tin nhắn, thông báo, tệp và các chặng đã qua, xếp theo thời gian.',
          thoBody: true,
          than: '<div class="card-b">' + (ds.length ? ra.join('') : HM.trong({
            tieuDe: 'Chưa có trao đổi nào',
            moTa: 'Bạn nhắn một câu bên dưới là Haustek nhận được ngay.' })) +
            (ds.length > soHien ? '<div class="btnrow" style="justify-content:center;margin-top:6px">' +
              '<button type="button" class="btn" data-them-dong="' + (soHien + 30) + '">Xem thêm ' +
              Math.min(30, ds.length - soHien) + ' dòng nữa</button></div>' : '') + '</div>' +
            '<div class="soan"><label class="fld">Nhắn cho Haustek</label>' +
            '<textarea class="in" data-noi rows="3" placeholder="Bạn cần gì, hoặc muốn hỏi gì."></textarea>' +
            '<div class="ft"><span class="hint">' +
              e(ph.nguoiPhuTrach ? ph.nguoiPhuTrach.ten + ' đọc và trả lời tin của bạn.' : 'Haustek đọc và trả lời tin của bạn.') +
              '</span><button type="button" class="btn pri" data-gui>Gửi</button></div></div>'
        }) +
      '</div><div>' +
        HM.the({
          h2: 'Tài liệu', p: 'Tệp Haustek đã gửi cho bạn.', thoBody: true,
          than: '<div class="card-b" style="padding-top:2px">' + (tep.length
            ? tep.slice(0, 20).map(function (t) {
                return '<div class="d" style="padding:9px 0;border-top:1px solid var(--line)">' +
                  '<div class="c">' + e(t.ten) + '<span class="khi">' +
                  e(api.ngayVi(t.luc) + ' · ' + t.co + ' · ' + t.boiTen + ' gửi') + '</span></div></div>';
              }).join('')
            : '<p class="say">Tệp Haustek bàn giao cho bạn sẽ hiện ở đây.</p>') + '</div>'
        }) +
        (ph.nguoiPhuTrach ? HM.the({ h2: 'Người phụ trách của bạn',
          than: '<p style="font-size:14px;line-height:1.7"><b>' + e(ph.nguoiPhuTrach.ten) + '</b><br>' +
            e(ph.nguoiPhuTrach.chucDanh) + '<br>' +
            '<a href="tel:' + e(ph.nguoiPhuTrach.dienThoai) + '">' + e(ph.nguoiPhuTrach.dienThoai) + '</a><br>' +
            '<a href="mailto:' + e(ph.nguoiPhuTrach.email) + '">' + e(ph.nguoiPhuTrach.email) + '</a></p>' }) : '') +
      '</div></div>';

    /* Đánh dấu đã đọc khi người dùng THẬT SỰ mở thông báo ra, không phải
       lúc trang vừa nạp. Đánh dấu hộ lúc nạp thì cột "đã xem" bên nội bộ
       nói dối, và cả tính năng mất nghĩa. */
    HM.bam(root, '[data-them-dong]', function (el) { c.datLoc({ dong: el.getAttribute('data-them-dong') }); });
    HM.bam(root, '[data-tb]', function (el) {
      var id = el.getAttribute('data-tb');
      try { api.danhDauDaDoc(ph.doiTacId, id, ph.nguoiDungId); } catch (err) {}
      el.classList.remove('moi');
      var tag = el.querySelector('.tag'); if (tag) tag.remove();
    });
    HM.bam(root, '[data-gui]', function () {
      var o = root.querySelector('.soan [data-noi]'), chu = o ? o.value.trim() : '';
      if (!chu) { c.thongBao('Bạn viết vài chữ rồi gửi nhé.', 'warn'); return; }
      var v = api.viec(ph.doiTacId).filter(function (x) { return x.trangThai !== 'xong'; })[0];
      try {
        if (v) { api.traLoi(ph.doiTacId, v.id, chu, ph.nguoiDungId); c.thongBao('Đã gửi cho Haustek.', 'ok'); }
        else {
          var kq = api.guiYeuCau(ph.doiTacId, { dichVu: 'ho-tro', tieuDe: chu.split('\n')[0].slice(0, 80), noiDung: chu });
          c.thongBao(kq.bienNhan, 'ok');
        }
        c.veLai();
      } catch (err) { c.thongBao('Chưa gửi được. Bạn thử lại, hoặc gọi thẳng người phụ trách.', 'warn'); }
    });
  }
});

})();

              '<div class="c"><b>' + e(x.ten) + '</b>' + (x.laChinh ? ' ' + HM.tag('liên hệ chính', 'ok') : '') +
              '<span class="khi">' + e(x.vaiTro || '') + (x.gioTienGoi ? ' · tiện gọi ' + e(String(x.gioTienGoi).toLowerCase()) : '') + '</span>' +
              '<span class="khi">' + e(x.dienThoai) + (x.email ? ' · ' + e(x.email) : '') + '</span></div></div>';

        (camKet ? HM.the({ h2: 'Haustek hứa gì với bạn',

          thoBody: true, than: '<div class="card-b" style="padding-top:2px">' + camKet + '</div>' }) : '') +
      '</div><div>' +
        HM.the({ h2: 'Hợp đồng', than: HM.kv([
          ['Thời hạn', api.ngayVi(d.hopDong.tuNgay) + ' đến ' + api.ngayVi(d.hopDong.denNgay)],
          ['Nhịp bảng kê', d.hopDong.nhipBaoCao === 'thang' ? 'hằng tháng' : 'hằng quý']

<script>
"use strict";
(function () {

/* Bản gói một trang chạy trong khung cách ly của trình xem: tải file bị
   chặn. Bật cờ để nút nào có xuất file thì nói thật thay vì im lặng. */
window.HAUSTEK_XEM_ONLINE = true;

var K_CUA = 'haustek.cua', K_TK = 'haustek.doi-tac-mau', K_NV = 'haustek.nv';
function lay(k, mac) { try { return localStorage.getItem(k) || mac; } catch (e) { return mac; } }
function dat(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

var cua = lay(K_CUA, 'noi-bo');

function oChonCua(phu) {
  return '<div class="cua-chon"><div class="seg" data-cua>' +
    '<button type="button" data-c2="noi-bo"' + (cua === 'noi-bo' ? ' class="on"' : '') + '>Nội bộ</button>' +
    '<button type="button" data-c2="khach"' + (cua === 'khach' ? ' class="on"' : '') + '>Cổng đối tác</button></div>' +
    (phu || '') + '</div>';
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-c2]');
  if (!b) return;
  dat(K_CUA, b.getAttribute('data-c2'));
  location.hash = '';
  location.reload();
});

if (cua === 'khach') {
  /* Lấy danh sách tài khoản mẫu TRƯỚC, rồi khoá cửa TRƯỚC khi trang nào
     chạy — y như khach.html. */
  var TK = HAUSTEK.api.dangNhapMau();
  HAUSTEK.lockdown();
  MAN_KHACH.forEach(function (f) { f(); });

  var api = HAUSTEK.api;
  var id0 = lay(K_TK, '');
  /* Mặc định chọn đối tác dùng nhiều dịch vụ nhất, chỉ khi chưa ai chọn.
     Danh sách xếp theo tên, nên đối tác đầu bảng có thể chỉ mua một dịch
     vụ và người mở lần đầu sẽ thấy cổng mỏng nhất rồi tưởng đó là tất cả. */
  var toi = TK.filter(function (t) { return t.doiTacId === id0; })[0]
         || TK.slice().sort(function (a, b) { return (b.dichVu || []).length - (a.dichVu || []).length; })[0];
  dat(K_TK, toi.doiTacId);
  var PHIEN = api.phien(toi.doiTacId);

  HT.chay({
    ten: 'portal', api: api, phien: PHIEN,
    thongBao: function () {
      var ds = api.chuaDoc(PHIEN.doiTacId, PHIEN.nguoiDungId) || [];
      return { items: ds.map(function (d) {
        return { id: d.thongBaoId, title: d.tieuDe, body: d.noiDung || '', di: 'k-trao-doi' };
      }), unread: ds.length };
    },
    danhDauDoc: function (c, ids) {
      (ids === 'all' ? (api.chuaDoc(PHIEN.doiTacId, PHIEN.nguoiDungId) || []).map(function (d) { return d.thongBaoId; }) : ids)
        .forEach(function (x) { try { api.danhDauDaDoc(PHIEN.doiTacId, x, PHIEN.nguoiDungId); } catch (e) {} });
      return true;
    },
    ghiChu: function () { return PHIEN.ten; },
    chanTrai: function () {
      var opts = TK.map(function (t) {
        return '<option value="' + HT.esc(t.doiTacId) + '"' + (t.doiTacId === toi.doiTacId ? ' selected' : '') + '>' +
          HT.esc(t.ten) + '</option>';
      }).join('');
      var ns = PHIEN.nguoiPhuTrach;
      return '<b>' + HT.esc(PHIEN.ten) + '</b>' +
        '<span>' + HT.esc(ns ? 'Phụ trách: ' + ns.ten : 'Đối tác Haustek') + '</span>' +
        '<select class="inline-sel" data-ai style="margin-top:9px;width:100%">' + opts + '</select>' +
        oChonCua('<p>' + HT.esc(
          'Bản mẫu: đổi đối tác hoặc đổi cửa để xem theo góc nhìn khác. Hệ thống thật không có hai ô chọn này.') + '</p>');
    }
  });

  document.addEventListener('change', function (e) {
    var s = e.target.closest('[data-ai]');
    if (!s) return;
    dat(K_TK, s.value);
    location.hash = '#k-trang-chu';
    location.reload();
  });

} else {
  MAN_NOIBO.forEach(function (f) { f(); });
  var A = HAUSTEK.admin;
  try { var NV = lay(K_NV, ''); if (NV) A.nhanSu.datToi(NV); } catch (e) {}

  HT.chay({
    ten: 'internal', A: A,
    thongBao: function () { return A.chuong(); },
    danhDauDoc: function () { return true; },
    tim: function (c, q) {
      var kq = A.timKiem(q, 5);
      return kq.doiTac.map(function (d) { return { title: d.ten, sub: 'Đối tác', di: 'doi-tac' }; })
        .concat(kq.viec.map(function (v) { return { title: v.tieuDe, sub: v.doiTacTen + ' · việc', di: 'viec' }; }))
        .concat(kq.banPhatHanh.map(function (b) { return { title: b.ten, sub: 'Bản phát hành', di: 'viec' }; }));
    },
    ghiChu: function () {
      var hn = A.homNayCua(A.nhanSu.toi.id);
      return A.thuTrongTuan(hn.ngay) + ', ' + A.ngayVi(hn.ngay);
    },
    chanTrai: function () {
      var me = A.nhanSu.toi;
      return '<b>' + HT.esc(me.ten) + '</b><span>' + HT.esc(me.chucDanh) + '</span>' +
        '<select class="inline-sel" data-nv style="margin-top:9px;width:100%">' + A.nhanSu.list().map(function (s) {
          return '<option value="' + s.id + '"' + (s.id === me.id ? ' selected' : '') + '>' +
            HT.esc(s.ten + ' · ' + s.chucDanh) + '</option>';
        }).join('') + '</select>' +
        oChonCua('<p>' + HT.esc(
          'Bản mẫu: đổi người để xem trang Hôm nay của từng vị trí, hoặc đổi sang cổng đối tác để xem phía bên kia.') + '</p>');
    }
  });
  document.addEventListener('change', function (e) {
    var s = e.target.closest('[data-nv]');
    if (!s) return;
    dat(K_NV, s.value);
    location.hash = '#hom-nay';
    location.reload();
  });
}

})();
</script>
