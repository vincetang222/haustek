  return hoiThoai({ tieuDe: tieuDe, moTa: moTa, dong: nhan, nguyHiem: nguyHiem }).then(function (r) { return !!r; });
}

/* Ngăn trượt bên phải — dùng cho mọi màn hình có "bấm một dòng xem chi tiết" */
function nganTruot(noiDung, opt) {
  /* Dựng thẻ mới mỗi lần mở, vì khiMo() gắn sự kiện lên chính thẻ ngăn.
     Dùng lại thẻ cũ là chồng sự kiện của lần mở trước lên lần này. */
  var cu = document.querySelector('.drawer');
  if (cu) cu.remove();
  var dr = document.createElement('aside');
  dr.className = 'drawer';
  document.body.appendChild(dr);
  var bd = document.querySelector('.backdrop');
  if (!bd) {
    bd = document.createElement('div'); bd.className = 'backdrop'; document.body.appendChild(bd);
    bd.addEventListener('click', dongNgan);
    document.addEventListener('keydown', function (e) {
      var d = document.querySelector('.drawer.on');
      if (e.key === 'Escape' && d) dongNgan();
    });
  }
  dr.innerHTML = '<div class="drawer-h"><div style="flex:1;min-width:0">' +
      '<h3>' + esc((opt && opt.tieuDe) || '') + '</h3>' +
      ((opt && opt.phu) ? '<p>' + esc(opt.phu) + '</p>' : '') +
    '</div><button type="button" class="x" data-dong>' + icon('x') + '</button></div>' +
    '<div class="drawer-b">' + noiDung + '</div>';
  dr.querySelector('[data-dong]').addEventListener('click', dongNgan);
  /* Bật lớp ở khung hình sau, để trình duyệt kịp nhận thẻ mới rồi mới
     chạy hiệu ứng trượt — đặt ngay thì thẻ hiện ra không có chuyển động. */
  requestAnimationFrame(function () { dr.classList.add('on'); bd.classList.add('on'); });
  if (opt && opt.khiMo) opt.khiMo(dr);
}
function dongNgan() {
  var dr = document.querySelector('.drawer'), bd = document.querySelector('.backdrop');
  if (dr) dr.classList.remove('on');
  if (bd) bd.classList.remove('on');
}

/* ---------------------------------------------------------------------
   Bảng có sắp xếp + phân trang — dùng lại ở nhiều màn, viết một lần
   --------------------------------------------------------------------- */
/* Gắn .fit cho khung bảng vừa khít với thẻ: khi đó CSS bỏ cuộn ngang và cho
   đầu cột dính theo trang. Bảng rộng hơn khung giữ cuộn ngang như cũ. Gọi sau
   mỗi lần vẽ và khi đổi cỡ cửa sổ. */
function canhBang(scope) {
  (scope || document).querySelectorAll('.tw').forEach(function (tw) {
    tw.classList.remove('fit');
    if (tw.scrollWidth <= tw.clientWidth + 1) tw.classList.add('fit');
  });
}
var _canhHen = null;
if (global.addEventListener) global.addEventListener('resize', function () { clearTimeout(_canhHen); _canhHen = setTimeout(function () { canhBang(); }, 120); });

function bang(o) {
  /* o: { cot:[{k,l,num,s,w}], dong:[], sort, dir, trang, co, veDong(d,i), chon(d),
          khiDoi(st)            ← gọi sau mỗi lần đổi sắp xếp / trang / cỡ trang, để màn nhớ lại
          chonNhieu:{ nut:[{k,l,pri}], khi(k, rows, api) }  ← cột ô chọn + thanh hành động
          khoa(d,i)             ← khoá nhận diện dòng khi chọn nhiều (mặc định d.id hay chỉ số)
          hanhDong, chan(rows), chanChu(rows), rongTieuDe, rongMoTa, rongNut } */
  var st = { sort: o.sort, dir: o.dir == null ? -1 : o.dir, trang: o.trang || 0, co: o.co || 25, chon: {} };
  var host = o.host, loc = o.loc || function (d) { return d; };
  var khoa = o.khoa || function (d, i) { return d && d.id != null ? String(d.id) : 'i' + i; };
  var dense = docKho('haustek.bang.dense', '') === '1';
  var api = {
    st: st,
    ve: ve,
    dong: function () { return loc(o.dong()); },
    chon: function () { return (api.rows || []).filter(function (d, i) { return st.chon[khoa(d, i)]; }); },
    xoaChon: function () { st.chon = {}; ve(); }
  };
  function sapXep(rows) {
    if (!st.sort) return rows;
    return rows.slice().sort(function (a, b) {
      var x = a[st.sort], y = b[st.sort];
      if (x == null) x = typeof y === 'string' ? '' : 0;
      if (y == null) y = typeof x === 'string' ? '' : 0;
      if (typeof x === 'string') return x.localeCompare(y, 'vi') * st.dir;
      return (x - y) * st.dir;
    });
  }
  function muiTen() {
    return '<span class="ar"><svg viewBox="0 0 16 16">' + (st.dir > 0 ? '<path d="M4 10l4-4 4 4"/>' : '<path d="M4 6l4 4 4-4"/>') + '</svg></span>';
  }
  /* số trang: 1 … c-1 c c+1 … n, tối đa bảy nút */
  function soTrang(het) {
    var n = het + 1, c = st.trang, out = [];
    if (n <= 7) { for (var i = 0; i < n; i++) out.push(i); return out; }
    out.push(0);
    var a = Math.max(1, c - 1), b = Math.min(n - 2, c + 1);
    if (c <= 2) { a = 1; b = 3; } else if (c >= n - 3) { a = n - 4; b = n - 2; }
    if (a > 1) out.push('…');
    for (var j = a; j <= b; j++) out.push(j);
    if (b < n - 2) out.push('…');
    out.push(n - 1);
    return out;
  }
  function ve() {
    var rows = sapXep(loc(o.dong()));
    var het = Math.max(0, Math.ceil(rows.length / st.co) - 1);
    if (st.trang > het) st.trang = het;
    var a = st.trang * st.co, page = rows.slice(a, a + st.co);
    var nhieu = !!o.chonNhieu;
    var daChon = nhieu ? rows.filter(function (d, i) { return st.chon[khoa(d, i)]; }) : [];
    var trangHet = nhieu && page.length > 0 && page.every(function (d, i) { return st.chon[khoa(d, a + i)]; });
    var th = (nhieu ? '<th class="sel"><input type="checkbox" data-chon-het aria-label="' + esc(CHU[lang].selAll) + '"' + (trangHet ? ' checked' : '') + '></th>' : '') +
      o.cot.map(function (c) {
        var on = st.sort === c.k;
        return '<th class="' + (c.num ? 'num ' : '') + (c.s === false ? '' : 's ') +
          (on ? 'sorted band' : '') + '"' + (c.s === false ? '' : ' data-sx="' + esc(c.k) + '"') +
          (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.l) +
          (on ? muiTen() : '') + '</th>';
      }).join('');
    var tb = page.map(function (d, i) {
      var k = khoa(d, a + i), on = nhieu && st.chon[k];
      return '<tr class="' + (o.chon ? 'pick' : '') + (on ? ' on' : '') + '" data-r="' + (a + i) + '">' +
        (nhieu ? '<td class="sel"><input type="checkbox" data-chon="' + esc(k) + '"' + (on ? ' checked' : '') + '></td>' : '') +
        o.veDong(d, a + i, st) + '</tr>';
    }).join('');
    var bulk = daChon.length
      ? '<div class="bulk">' + icon('check') + esc(CHU[lang].selected.replace('{n}', fmt.n(daChon.length))) + '<span class="sp"></span>' +
        (o.chonNhieu.nut || []).map(function (n) { return '<button type="button" class="btn sm' + (n.pri ? ' pri' : '') + '" data-bulk="' + esc(n.k) + '">' + esc(n.l) + '</button>'; }).join('') +
        '<button type="button" class="btn sm ghost" data-bo-chon>' + esc(CHU[lang].clearSel) + '</button></div>'
      : '';
    var pager = '<div class="pager">' +
      '<button type="button" class="pg" data-tr="-1" ' + (st.trang === 0 ? 'disabled' : '') + ' aria-label="' + esc(CHU[lang].page) + ' −1">' + icon('left') + '</button>' +
      soTrang(het).map(function (i) {
        return i === '…' ? '<span class="pg-dots">…</span>' :
          '<button type="button" class="pg' + (i === st.trang ? ' on' : '') + '" data-trang="' + i + '">' + (i + 1) + '</button>';
      }).join('') +
      '<button type="button" class="pg" data-tr="1" ' + (a + st.co >= rows.length ? 'disabled' : '') + ' aria-label="' + esc(CHU[lang].page) + ' +1">' + icon('right') + '</button>' +
      '</div>';
    var densBtn = '<button type="button" class="dens' + (dense ? ' on' : '') + '" data-dense title="' + esc(CHU[lang].dense) + '" aria-label="' + esc(CHU[lang].dense) + '">' +
      '<svg viewBox="0 0 16 16">' + (dense ? '<path d="M2 3h12M2 6h12M2 9h12M2 12h12"/>' : '<path d="M2 4h12M2 8h12M2 12h12"/>') + '</svg></button>';
    host.innerHTML =
      (o.hanhDong ? '<div class="card-h" style="padding-bottom:12px"><div class="sp"></div>' + o.hanhDong + '</div>' : '') +
      bulk +
      (rows.length
        ? '<div class="tw"><table class="t' + (dense ? ' dense' : '') + '"><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody>' +
          (o.chan ? '<tfoot>' + o.chan(rows) + '</tfoot>' : '') + '</table></div>'
        : '<div class="empty">' + icon('empty') + '<b>' + esc(o.rongTieuDe || '—') + '</b>' +
          '<span>' + esc(o.rongMoTa || '') + '</span>' +
          (o.rongNut ? '<div class="btnrow">' + o.rongNut + '</div>' : '') + '</div>') +
      '<div class="card-f">' +
        '<div class="range">' + (rows.length ? fmt.n(a + 1) + '–' + fmt.n(Math.min(rows.length, a + st.co)) : '0') +
          ' ' + CHU[lang].of + ' ' + fmt.n(rows.length) + '</div>' +
        (het > 0 ? pager : '') +
        (o.chanChu ? '<span>' + o.chanChu(rows) + '</span>' : '') +
        '<span class="sp" style="flex:1"></span>' + densBtn + CHU[lang].showing +
        ' <select class="inline-sel" data-co aria-label="' + esc(CHU[lang].rows) + '">' + [12, 25, 50, 100].map(function (n) {
          return '<option value="' + n + '"' + (n === st.co ? ' selected' : '') + '>' + n + '</option>';
        }).join('') + '</select> ' + CHU[lang].rows + '</div>';
    api.rows = rows;
    canhBang(host);
  }
  function doi() { if (o.khiDoi) o.khiDoi(st); }
  host.addEventListener('click', function (e) {
    var th = e.target.closest('[data-sx]');
    if (th) {
      var k = th.getAttribute('data-sx');
      if (st.sort === k) st.dir = -st.dir;
      else { st.sort = k; var c = o.cot.filter(function (x) { return x.k === k; })[0]; st.dir = (c && c.num) ? -1 : 1; }
      st.trang = 0; ve(); return doi();
    }
    var tr = e.target.closest('[data-tr]');
    if (tr) { st.trang += +tr.getAttribute('data-tr'); ve(); return doi(); }
    var tg = e.target.closest('[data-trang]');
    if (tg) { st.trang = +tg.getAttribute('data-trang'); ve(); return doi(); }
    if (e.target.closest('[data-dense]')) { dense = !dense; ghiKho('haustek.bang.dense', dense ? '1' : '0'); return ve(); }
    var bk = e.target.closest('[data-bulk]');
    if (bk) { if (o.chonNhieu && o.chonNhieu.khi) o.chonNhieu.khi(bk.getAttribute('data-bulk'), api.chon(), api); return; }
    if (e.target.closest('[data-bo-chon]')) { st.chon = {}; return ve(); }
    if (e.target.closest('td.sel, th.sel')) return;          /* ô chọn: xử lý ở change */
    var row = e.target.closest('tr[data-r]');
    if (row && o.chon) { var d = api.rows[+row.getAttribute('data-r')]; if (d) o.chon(d); }
  });
  host.addEventListener('change', function (e) {
    var s = e.target.closest('[data-co]');
    if (s) { st.co = +s.value; st.trang = 0; ve(); return doi(); }
    var c1 = e.target.closest('[data-chon]');
    if (c1) { var k = c1.getAttribute('data-chon'); if (c1.checked) st.chon[k] = 1; else delete st.chon[k]; return ve(); }
    var ch = e.target.closest('[data-chon-het]');
    if (ch) {
      var a = st.trang * st.co;
      api.rows.slice(a, a + st.co).forEach(function (d, i) { var k = khoa(d, a + i); if (ch.checked) st.chon[k] = 1; else delete st.chon[k]; });
      return ve();
    }
  });
  return api;
}

/* ---------------------------------------------------------------------
   Khởi động một cửa (intranet hoặc cổng khách)
   --------------------------------------------------------------------- */
function chay(cauHinh) {
  /* cauHinh: { ten, A, thongBao, danhDauDoc, tim, moBai, ghiChu, chanTrai } */
  /* Gọi lúc trình duyệt còn đang đọc phần đầu trang thì document.body chưa
     tồn tại. Ở bản nhiều file điều đó không xảy ra vì thẻ script nằm trong
     body; ở bản gói một trang thì có. Đợi rồi chạy lại, thay vì ném lỗi. */
  if (!document.body) {
    document.addEventListener('DOMContentLoaded', function () { chay(cauHinh); });
    return null;
  }
  var cur = 'USD';
  var manHienTai = null;

  function t(k) { return (CHU[lang] && CHU[lang][k]) || k; }

  function ctx() {
    var man = MAN.filter(function (m) { return m.id === manHienTai; })[0];
    return {
      lang: lang, cur: cur,
      /* Bộ lọc đọc thẳng từ địa chỉ. Trang không giữ trạng thái lọc riêng,
         nên một đường dẫn dán cho đồng nghiệp mở ra đúng thứ mình đang xem. */
      loc: docLoc(location.hash),
      fmt: fmt, esc: esc, icon: icon, CHU: CHU,
      tien: function (v) { return fmt.tien(v, cur); },
      tien2: function (v) { return fmt.tien2(v, cur); },
      /* Chuỗi hai thứ tiếng đến từ TẦNG DỮ LIỆU: tên luồng, điều kiện
         duyệt, từng chặng trong chuỗi tiền của khách. Chúng không nằm
         trong từ điển của màn hình vì màn hình không sinh ra chúng —
         nên lấy bằng hàm này: c.song(o, 'label') trả về o.labelEn khi
         đang ở EN và có bản EN, còn lại trả về o.label. */
      song: function (o, khoa) {
        if (!o) return '';
        if (lang === 'en') {
          var kEn = khoa + 'En';
          if (o[kEn] != null && o[kEn] !== '') return o[kEn];
        }
        return o[khoa] == null ? '' : o[khoa];
      },
      /* chữ của màn hình, thiếu thì rơi về chữ của khung */
      t: function (k) {
        if (man && man.chu && man.chu[lang] && man.chu[lang][k] != null) return man.chu[lang][k];
        return t(k);
      },
      /* c.di('viec') hoặc c.di('viec', { dichVu:'phat-hanh' }) */
      di: function (id, loc) { location.hash = hashLoc(id, loc).slice(1) ? hashLoc(id, loc) : '#' + id; },
      /* Đổi một phần bộ lọc, giữ nguyên phần còn lại và giữ nguyên trang. */
      docLoc: function () { return docLoc(location.hash); },
      datLoc: function (moi) {
        var hien = docLoc(location.hash);
        Object.keys(moi || {}).forEach(function (k) {
          if (moi[k] == null || moi[k] === '') delete hien[k]; else hien[k] = moi[k];
        });
        location.hash = hashLoc(manHienTai, hien).slice(1);
      },
      veLai: ve,
      thongBao: thongBao, hoiThoai: hoiThoai, xacNhan: xacNhan,
      nganTruot: nganTruot, dongNgan: dongNgan, bang: bang,
      A: cauHinh.A || null, api: cauHinh.api || null, phien: cauHinh.phien || null
    };
  }

  /* ---- khung HTML ----
     KHÔNG ghi đè document.body.innerHTML.

     Bản nhiều file để <style> và <link> trong <head>, nên ghi đè body
     không đụng tới chúng. Nhưng bản gói một trang thì toàn bộ nội dung —
     kể cả thẻ <style> mang cả hệ giao diện lẫn bộ chữ nhúng — nằm trong
     <body>, vì trình xem artifact bọc nội dung vào body. Ghi đè body ở
     đó là ứng dụng tự xoá mất bảng màu của chính nó: DOM vẫn dựng đủ,
     nhưng không còn một dòng CSS nào. Trang ra một mớ chữ trần và mấy ô
     đen to bằng nửa màn hình — chính là mấy ô vuông đen.

     Nên chỉ thay đúng phần tử gốc của ứng dụng, không đụng anh em bên
     cạnh. Cách này đúng ở cả hai chỗ, không cần biết tài sản nằm ở đâu. */
  var cuGoc = document.querySelector('.app');
  if (cuGoc) cuGoc.remove();
  var goc = document.createElement('div');
  goc.className = 'app';
  document.body.appendChild(goc);
  /* Hai cụm nút sáng/tối và VI/EN được vẽ HAI LẦN: một ở thanh trên (màn
     rộng), một trong cột điều hướng (điện thoại, thanh trên không còn chỗ).
     CSS quyết định cụm nào hiện; cả hai cùng bắt sự kiện qua data-th /
     data-l nên không cần biết mình đang ở đâu. */
  /* Không có ô chọn tiền tệ. Portal không quy đổi gì cả: số tiền duy nhất
     nó hiện là con số ghi trên bảng kê PDF, bằng đúng đơn vị ghi trên đó.
     Một nút đổi USD sang VND ở đây là mời người dùng tin vào một con số
     mà không chứng từ nào đỡ. */
  function oCaiDat(tren) {
    return (tren ? '<button type="button" class="top-ico" data-th-cycle>' + icon('auto') + '</button>' :
      '<div class="seg" data-theme-sw>' +
        '<button type="button" data-th="auto" title="' + esc(t('themeAuto')) + '">' + icon('auto') + '</button>' +
        '<button type="button" data-th="light" title="' + esc(t('themeLight')) + '">' + icon('sun') + '</button>' +
        '<button type="button" data-th="dark" title="' + esc(t('themeDark')) + '">' + icon('moon') + '</button>' +
      '</div>') +
      '';
    /* Không có nút VI / EN. Phase 1 chỉ có tiếng Việt, và một cái nút bấm
       vào thì nửa giao diện hiện ra khoá từ điển thô còn tệ hơn là không
       có nút. Khung vẫn giữ nguyên cơ chế song ngữ để bật lại khi có bản
       dịch thật. */
  }
  goc.innerHTML =
      '<aside class="side" data-side>' +
        '<div class="side-top"><div class="brand"><i></i>HAUSTEK <em data-ten></em></div>' +
          '<button type="button" class="menu-x" data-menu-dong>' + icon('x') + '</button></div>' +
        '<nav class="nav" data-nav></nav>' +
        '<div class="side-ctl"><span data-ctl-l></span>' + oCaiDat() + '</div>' +
        '<div class="side-foot" data-chan></div>' +
      '</aside>' +
      '<div class="menu-bg" data-menu-dong></div>' +
      '<div class="body">' +
        '<header class="top">' +
          '<button type="button" class="menu-btn" data-menu aria-expanded="false">' + icon('menu') + '</button>' +
          '<div class="crumb" data-crumb></div>' +
          '<div class="sp"></div>' +
          '<div class="top-note" data-note></div>' +
          '<button type="button" class="top-ico" data-tim-nhanh>' + icon('tim') + '</button>' +
          '<button type="button" class="top-ico" data-chuong>' + icon('bell') + '<b class="badge" data-chuong-so hidden></b></button>' +
          oCaiDat(true) +
        '</header>' +
        '<div class="popover" data-chuong-panel hidden></div>' +
        '<div class="palette-bg" data-palette hidden><div class="palette" role="dialog" aria-modal="true">' +
          '<div class="pal-in">' + icon('tim') + '<input type="text" data-pal-in autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>' +
          '<div class="pal-kq" data-pal-kq></div></div></div>' +
        '<main data-main></main>' +
      '</div>';

  /* Cột điều hướng ở màn hẹp là một ngăn trượt từ trái. */
  function moMenu(mo) {
    goc.classList.toggle('menu-mo', !!mo);
    document.body.classList.toggle('menu-mo', !!mo);
    var nut = goc.querySelector('[data-menu]');
    if (nut) nut.setAttribute('aria-expanded', mo ? 'true' : 'false');
  }

  var $ = function (s) { return document.querySelector(s); };

  /* Chữ của MỘT màn cụ thể.
     ctx().t() tra trong từ điển của màn ĐANG MỞ — đúng cho nội dung bên
     trong màn, nhưng sai cho cột điều hướng: cột đó liệt kê cả mười lăm
     màn, mà mỗi màn chỉ mang từ điển của chính nó. Tra bằng ctx().t() thì
     đứng ở màn Tổng quan sẽ thấy "navKeToan", "nhomTien" nằm nguyên trên
     màn hình. Nên ở đây tra theo từng màn một. */
  function chuCua(m, k) {
    if (m && m.chu && m.chu[lang] && m.chu[lang][k] != null) return m.chu[lang][k];
    return (CHU[lang] && CHU[lang][k]) || k;
  }
  /* Tên nhóm do một màn nào đó trong nhóm khai — lấy màn đầu tiên có khai. */
  function chuNhom(k) {
    for (var i = 0; i < MAN.length; i++) {
      var m = MAN[i];
      if (m.chu && m.chu[lang] && m.chu[lang][k] != null) return m.chu[lang][k];
    }
    return (CHU[lang] && CHU[lang][k]) || k;
  }

  /* Một trang có thể chỉ dành cho một vai (danh sách nghệ sĩ chỉ có ở
     label). Trang khai khaDung(c) trả về false thì không hiện ở cột trái
     và gõ thẳng #hash cũng không mở được. */
  function dungDuoc(m, c) {
    /* Trang tự khai `khaDung(c)`. Cổng đối tác dùng nó để chỉ hiện những
       trang ứng với dịch vụ đối tác thật sự mua: một thương hiệu chỉ chạy
       digital không phải nhìn trang Thanh toán trống trơn như hỏng.
       Không hỏi lõi bất cứ ma trận quyền nào: hỏi một hàm không còn tồn
       tại thì mọi trang biến mất mà không một lời báo lỗi nào. */
    if (!m.khaDung) return true;
    try { return !!m.khaDung(c); } catch (e) { return false; }
  }
  function veNav() {
    /* Xếp phẳng. Sáu mục là hết. Nhóm thu gọn chỉ có nghĩa khi danh sách
       dài tới mức phải giấu bớt, mà danh sách dài tới mức ấy là dấu hiệu
       phần mềm đang làm quá phần việc của nó. */
    var c = ctx();
    $('[data-nav]').innerHTML = MAN.filter(function (m) { return dungDuoc(m, c); }).map(function (m) {
      if (m.di) {
        return '<a href="' + esc(hashLoc(m.di, m.loc)) + '" class="' + (m.di === manHienTai && khopLoc(m.loc) ? 'on' : '') + '">' +
          icon(m.icon || 'grid') + '<span>' + esc(chuCua(m, m.nav || m.id)) + '</span></a>';
      }
      /* Huy hiệu: { n, muc } với muc là 'thuong' | 'hom-nay' | 'tre'.
         Ba mức, ba lớp, không có mức thứ tư và không có màu đỏ báo động
         cho một con số chỉ đang đếm việc. */
      var d = null;
      try { d = m.dem ? m.dem(c) : null; } catch (e) { d = null; }
      if (typeof d === 'number') d = { n: d, muc: 'thuong' };
      var hv = d && d.n > 0
        ? '<span class="c' + (d.muc === 'tre' ? ' tre' : d.muc === 'hom-nay' ? ' hom-nay' : '') + '">' + esc(String(d.n)) + '</span>'
        : '';
      return '<a href="#' + m.id + '" class="' + (m.id === manHienTai ? 'on' : '') + '">' +
        icon(m.icon || 'grid') + '<span>' + esc(chuCua(m, m.nav || m.id)) + '</span>' + hv + '</a>';
    }).join('');
  }
  /* Lối tắt sáng đèn khi bộ lọc trên địa chỉ đúng bằng bộ lọc của nó. */
  function khopLoc(loc) {
    if (!loc) return false;
    var hien = docLoc(location.hash);
    return Object.keys(loc).every(function (k) { return String(hien[k] || '') === String(loc[k]); });
  }

  function ve() {
    /* Địa chỉ mang được bộ lọc: #viec?dichVu=phat-hanh&tab=han-tiep-nhan.
       Trang đọc bộ lọc qua c.loc, nên một lối tắt trên thanh điều hướng
       không cần một dòng mã danh sách nào của riêng nó. */
    var hash = location.hash || '';
    var id = hash.replace('#', '').split('?')[0] || (MAN[0] && MAN[0].id);
    var man = MAN.filter(function (m) { return m.id === id && !m.di; })[0]
           || MAN.filter(function (m) { return !m.di; })[0];
    if (!man) return;
    var c0 = ctx();
    if (!dungDuoc(man, c0)) man = MAN.filter(function (m) { return dungDuoc(m, c0); })[0] || man;
    /* gõ #hash của màn bị cấm: về màn đầu tiên được phép và sửa luôn địa chỉ, không bắn hashchange */
    if (man.id !== id) { try { history.replaceState(null, '', '#' + man.id); } catch (e) {} }
    manHienTai = man.id;
    var c = ctx();

    $('[data-ten]').textContent = c.t(cauHinh.ten);
    $('[data-crumb]').innerHTML = '<b>' + esc(c.t(cauHinh.ten)) + '</b><i>/</i><span>' +
      esc(chuCua(man, man.nav || man.id)) + '</span>';
    $('[data-menu]').setAttribute('aria-label', c.t('menu'));
    $('[data-menu]').setAttribute('title', c.t('menu'));
    $('.menu-x').setAttribute('aria-label', c.t('closeMenu'));
    $('[data-ctl-l]').textContent = c.t('display');
    $('[data-note]').textContent = cauHinh.ghiChu ? cauHinh.ghiChu(c) : '';
    $('[data-tim-nhanh]').setAttribute('title', c.t('timNhanh') + ' · ' + c.t('phimTat'));
    $('[data-tim-nhanh]').setAttribute('aria-label', c.t('timNhanh'));
    $('[data-chuong]').setAttribute('title', c.t('ntf')); $('[data-chuong]').setAttribute('aria-label', c.t('ntf'));
    $('[data-pal-in]').setAttribute('placeholder', c.t('timGoiY'));
    _ntfCache = null; veChuong();
    $('[data-chan]').innerHTML = cauHinh.chanTrai ? cauHinh.chanTrai(c) : '';

    document.querySelectorAll('[data-th]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.th === theme);
    });
    document.querySelectorAll('[data-th-cycle]').forEach(function (b) {
      var nhan = theme === 'dark' ? 'themeDark' : theme === 'light' ? 'themeLight' : 'themeAuto';
      b.innerHTML = icon(theme === 'dark' ? 'moon' : theme === 'light' ? 'sun' : 'auto');
      b.setAttribute('title', c.t(nhan) + ' · ' + c.t('themeCycle')); b.setAttribute('aria-label', c.t(nhan));
    });
    document.querySelectorAll('[data-l]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.l === lang);
    });

    veNav();
    dongNgan();
    /* Thay hẳn thẻ <main> chứ không chỉ xoá ruột nó.
       Màn hình gắn sự kiện theo uỷ nhiệm lên chính thẻ này (HM.bam). Nếu
       giữ lại thẻ cũ, mỗi lần vẽ lại là chồng thêm một bộ sự kiện nữa lên
       cùng một thẻ — bấm một lần mở ba hộp thoại. Thay thẻ thì bộ cũ chết
       theo thẻ cũ, không phải nhớ gỡ tay ở mười lăm màn. */
    var cu = $('[data-main]');
    var root = document.createElement('main');
    root.setAttribute('data-main', '');
    cu.replaceWith(root);
    try { man.ve(root, c); canhBang(root); }
    catch (e) {
      root.innerHTML = '<div class="card"><div class="card-b"><h2>' + esc(c.t('errScreen')) +
        '</h2><p class="muted" style="margin:6px 0 10px">' + esc(e && e.message) + '</p>' +
        '<pre class="mono" style="white-space:pre-wrap;font-size:11px;color:var(--faint)">' +
        esc((e && e.stack || '').split('\n').slice(0, 6).join('\n')) + '</pre></div></div>';
      if (global.console) console.error(e);
    }
  }

  /* ---- chuông thông báo: sự kiện mới, mỗi vấn đề một dòng, ba mức ----
     Số liệu do cửa cung cấp qua cauHinh.thongBao(c); nhớ tạm 20 giây vì
     tính cho toàn danh mục nội bộ mất gần một phần mười giây. */
  var _ntfCache = null, _ntfAt = 0;
  function layThongBao() {
    if (!cauHinh.thongBao) return null;
    var now = Date.now();
    if (_ntfCache && now - _ntfAt < 20000) return _ntfCache;
    try { _ntfCache = cauHinh.thongBao(ctx()); } catch (e) { _ntfCache = { unread: 0, items: [] }; if (global.console) console.error(e); }
    _ntfAt = now; return _ntfCache;
  }
  function veChuong() {
    var so = $('[data-chuong-so]'), nut = $('[data-chuong]');
    if (!cauHinh.thongBao) { nut.hidden = true; return; }
    var d = layThongBao();
    so.hidden = !d || !d.unread; so.textContent = d && d.unread > 9 ? '9+' : (d ? String(d.unread) : '');
    var pn = $('[data-chuong-panel]'); if (!pn.hidden) vePanelChuong();
  }
  function vePanelChuong() {
    var c = ctx(), d = layThongBao() || { items: [] }, pn = $('[data-chuong-panel]');
    var tuoi = function (at) { if (!at) return ''; var dd = Math.round((Date.now() - new Date(at + (at.length === 10 ? 'T00:00:00' : '')).getTime()) / 864e5); return dd <= 0 ? (lang === 'en' ? 'today' : 'hôm nay') : dd === 1 ? (lang === 'en' ? 'yesterday' : 'hôm qua') : (lang === 'en' ? dd + ' days ago' : dd + ' ngày trước'); };
    pn.innerHTML = '<div class="pop-h"><b>' + esc(c.t('ntf')) + '</b><span class="sp"></span>' +
      (d.unread ? '<button type="button" class="btn link" data-ntf-het>' + esc(c.t('ntfDocHet')) + '</button>' : '') + '</div>' +
      (d.items.length ? '<div class="ntfs">' + d.items.map(function (n) {
        return '<button type="button" class="ntf ' + esc(n.tier) + (n.read ? '' : ' moi') + '" data-ntf="' + esc(n.id) + '"' + (n.di ? ' data-ntf-di="' + esc(n.di) + '"' : '') + '>' +
          '<i class="dot ' + (n.tier === 'critical' ? 'no' : n.tier === 'warn' ? 'warn' : 'ok') + '"></i><span class="ntf-b"><b>' + esc(lang === 'en' && n.titleEn ? n.titleEn : n.title) + '</b>' +
          ((lang === 'en' ? n.bodyEn : n.body) ? '<span>' + esc(lang === 'en' ? n.bodyEn : n.body) + '</span>' : '') +
          '<em>' + esc(tuoi(n.at)) + '</em></span></button>';
      }).join('') + '</div>'
      : '<div class="empty" style="padding:28px 16px">' + icon('bell') + '<b>' + esc(c.t('ntfTrong')) + '</b><span>' + esc(c.t('ntfTrongMo')) + '</span></div>');
  }
  function moChuong(mo) {
    var pn = $('[data-chuong-panel]');
    pn.hidden = !mo; $('[data-chuong]').classList.toggle('on', !!mo);
    if (mo) vePanelChuong();
  }
  /* ---- tìm nhanh Ctrl K: bài hát, đối tác, hồ sơ, trang ---- */
  var _palChon = 0, _palKq = [];
  function moPalette(mo) {
    var pb = $('[data-palette]');
    pb.hidden = !mo;
    if (mo) { moChuong(false); var inp = $('[data-pal-in]'); inp.value = ''; veKq(''); setTimeout(function () { inp.focus(); }, 10); }
  }
  function veKq(q) {
    var c = ctx(), host = $('[data-pal-kq]'); q = String(q || '').trim(); _palKq = []; _palChon = 0;
    var qq = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
    var trang = [];
    document.querySelectorAll('.nav a').forEach(function (a2) {
      var ten = a2.textContent.replace(/\s+/g, ' ').trim().replace(/\s*\d+$/, '');
      var key = ten.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
      if (!qq || key.indexOf(qq) >= 0) trang.push({ ten: ten, href: a2.getAttribute('href') });
    });
    var kq = { tracks: [], parties: [], docs: [] };
    if (qq.length >= 2 && cauHinh.tim) { try { kq = cauHinh.tim(c, q) || kq; } catch (e) { if (global.console) console.error(e); } }
    var html = '';
    function nhom(tieuDe, items, ve) {
      if (!items.length) return;
      html += '<div class="pal-g">' + esc(tieuDe) + '</div>' + items.map(function (it) { var i = _palKq.length; _palKq.push(it); return '<button type="button" class="pal-item' + (i === 0 ? ' on' : '') + '" data-pal-i="' + i + '">' + ve(it) + '</button>'; }).join('');
    }
    nhom(c.t('nhomBai'), kq.tracks.map(function (x) { return { loai: 'bai', id: x.id, x: x }; }), function (it) { return HM.bia(it.x.id, it.x.title, 'sm') + '<span class="pal-t"><b>' + esc(it.x.title) + '</b><span>' + esc(it.x.artist + ' · ' + it.x.isrc) + '</span></span><em>' + esc(fmt.n(it.x.streamsMonth)) + '</em>'; });
    nhom(c.t('nhomDoiTac'), kq.parties.map(function (x) { return { loai: 'dt', x: x }; }), function (it) { return HM.hinh(it.x.name, it.x.clientId, 'sm') + '<span class="pal-t"><b>' + esc(it.x.name) + '</b><span>' + esc(it.x.clientId + ' · ' + it.x.kind) + '</span></span>'; });
    nhom(c.t('nhomTaiLieu'), kq.docs.map(function (x) { return { loai: 'hs', x: x }; }), function (it) { return '<span class="pal-ico">' + icon('file') + '</span><span class="pal-t"><b>' + esc(it.x.id) + '</b><span>' + esc(it.x.title) + '</span></span>'; });
    nhom(c.t('nhomTrang'), trang.slice(0, qq ? 8 : 6).map(function (x) { return { loai: 'trang', x: x }; }), function (it) { return '<span class="pal-ico">' + icon('grid') + '</span><span class="pal-t"><b>' + esc(it.x.ten) + '</b></span>'; });
    if (!html) html = '<div class="pal-trong">' + esc(qq.length < 2 ? c.t('goTiep') : c.t('khongKq')) + '</div>';
    host.innerHTML = html;
  }
  function chonPal(i) {
    var it = _palKq[i]; if (!it) return;
    var c = ctx();
    moPalette(false);
    if (it.loai === 'trang') { location.hash = it.x.href; return; }
    if (it.loai === 'bai') { if (cauHinh.moBai) cauHinh.moBai(c, it.id); return; }
    if (it.loai === 'dt') { if (cauHinh.moDoiTac) cauHinh.moDoiTac(c, it.x); else location.hash = '#doi-tac'; return; }
    if (it.loai === 'hs' && it.x.di) location.hash = '#' + it.x.di;
  }
  function danhDauPal() {
    document.querySelectorAll('[data-pal-i]').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-pal-i') === _palChon); });
    var on = document.querySelector('[data-pal-i].on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('click', function (e) {
    /* Uỷ nhiệm cho `data-di` gắn ở TẦNG DOCUMENT, đúng một lần, không gắn
       vào <main>. Mỗi lần vẽ shell thay hẳn thẻ <main> để giết handler cũ;
       gắn vào <main> thì mọi ô số, mọi thẻ bấm được sẽ chết im lặng ngay
       sau lần điều hướng đầu tiên. Ở đây thì bấm bao nhiêu lần cũng chạy. */
    var dd = e.target.closest('[data-di]');
    if (dd) {
      var dich = dd.getAttribute('data-di');
      if (dich) {
        e.preventDefault();
        var loc = {};
        Array.prototype.forEach.call(dd.attributes, function (a) {
          if (a.name.indexOf('data-loc-') === 0) loc[a.name.slice(9)] = a.value;
        });
        location.hash = hashLoc(dich, loc).slice(1);
        return;
      }
    }
    if (e.target.closest('[data-chuong]')) { moChuong($('[data-chuong-panel]').hidden); return; }
    if (!e.target.closest('[data-chuong-panel]')) moChuong(false);
    var nt = e.target.closest('[data-ntf]');
    if (nt) {
      var id = nt.getAttribute('data-ntf'), di = nt.getAttribute('data-ntf-di');
      if (cauHinh.danhDauDoc) { try { cauHinh.danhDauDoc(ctx(), [id]); } catch (err) {} }
      _ntfCache = null; veChuong(); moChuong(false);
      if (di) location.hash = '#' + di;
      return;
    }
    if (e.target.closest('[data-ntf-het]')) { if (cauHinh.danhDauDoc) { try { cauHinh.danhDauDoc(ctx(), 'all'); } catch (err) {} } _ntfCache = null; veChuong(); vePanelChuong(); return; }
    if (e.target.closest('[data-tim-nhanh]')) { moPalette(true); return; }
    var pi = e.target.closest('[data-pal-i]');
    if (pi) { chonPal(+pi.getAttribute('data-pal-i')); return; }
    if (e.target.closest('[data-palette]') && !e.target.closest('.palette')) { moPalette(false); return; }
    if (e.target.closest('[data-menu]')) { moMenu(!goc.classList.contains('menu-mo')); return; }
    if (e.target.closest('[data-th-cycle]')) { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme] || 'auto'; ghiKho(LS_THEME, theme); apTheme(); return ve(); }
    if (e.target.closest('[data-menu-dong]') || e.target.closest('.nav a')) moMenu(false);
    var th = e.target.closest('[data-th]');
    if (th) { theme = th.dataset.th; ghiKho(LS_THEME, theme); apTheme(); return ve(); }
    var l = e.target.closest('[data-l]');
    if (l) { lang = l.dataset.l; ghiKho(LS_LANG, lang); return ve(); }
  });
  global.addEventListener('hashchange', function () { moMenu(false); ve(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); moPalette($('[data-palette]').hidden); return; }
    var pb = $('[data-palette]');
    if (pb && !pb.hidden) {
      if (e.key === 'Escape') { moPalette(false); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); _palChon = Math.min(_palKq.length - 1, _palChon + 1); danhDauPal(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); _palChon = Math.max(0, _palChon - 1); danhDauPal(); return; }
      if (e.key === 'Enter') { e.preventDefault(); chonPal(_palChon); return; }
    }
    if (e.key === 'Escape' && !$('[data-chuong-panel]').hidden) { moChuong(false); return; }
    if (e.key === 'Escape' && goc.classList.contains('menu-mo')) moMenu(false);
  });
  document.addEventListener('input', function (e) {
    if (e.target.closest('[data-pal-in]')) veKq(e.target.value);
  });
  /* đổi cài đặt sáng/tối của máy khi đang để "theo máy" */
  if (global.matchMedia) {
    var mq = global.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (theme === 'auto') ve(); });
  }

  ve();
  _veLai = ve;
  return { veLai: ve, ctx: ctx };
}
var _veLai = null;

global.HT = {
  dangKy: dangKy, man: MAN, chay: chay,
  fmt: fmt, esc: esc, icon: icon, IC: IC, CHU: CHU,
  thongBao: thongBao, hoiThoai: hoiThoai, xacNhan: xacNhan,
  nganTruot: nganTruot, dongNgan: dongNgan, bang: bang, canhBang: canhBang,
  setFx: setFx,
  get lang() { return lang; },
  get theme() { return theme; },
  /* đặt chế độ từ ngoài (kiểm thử, cửa): auto | light | dark */
  datGiaoDien: function (th) { theme = th === 'dark' || th === 'light' ? th : 'auto'; ghiKho(LS_THEME, theme); apTheme(); if (_veLai) _veLai(); }
};

})(window);

</script>
<script>
/* =====================================================================
   HAUSTEK PORTAL v2 — TIỆN ÍCH CHO MÀN HÌNH
   ---------------------------------------------------------------------
   Mười lăm màn hình dùng chung một bộ khuôn: đầu trang, dải ô số, thẻ,
   tab, ô trống, ô ghi chú. Viết một lần ở đây thay vì chép mười lăm lần —
   chép mười lăm lần thì sửa một chỗ là quên mười bốn chỗ.
   ===================================================================== */
"use strict";
(function (global) {

var esc = HT.esc, icon = HT.icon;

function dai(s, n) {
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ---- đầu trang ---- */
/* o.nut: nút hành động chính của trang, đứng bên phải tiêu đề — một chỗ
   cho mọi màn, thay cho mỗi màn tự đặt nút một kiểu dưới dải ô số. */
/* Câu giải thích không in ra nữa: một dấu ? cạnh tiêu đề, rê chuột hoặc
   bấm để đọc. Chữ đã được màn hình escape sẵn nên đặt thẳng vào thuộc tính. */
function giup(chu) {
  if (!chu) return '';
  var nhan = HT.lang === 'en' ? 'What is this?' : 'Giải thích';
  return '<button type="button" class="help" data-giup="' + chu + '" aria-label="' + nhan + '" title="">?</button>';
}
function dau(o) {
  return '<div class="page"><div><h1>' + (o.h1 || '') + giup(o.mo) + '</h1></div>' +
    (o.so && o.so.length ? '<div class="page-kpis">' + o.so.map(function (k) {
      return '<div class="page-kpi"><div class="l">' + esc(k.l) + '</div>' +
        '<div class="v"' + (k.mau ? ' style="color:' + k.mau + '"' : '') + '>' + esc(k.v) + '</div></div>';
    }).join('') + '</div>' : '') +
    (o.nut ? '<div class="page-act">' + o.nut + '</div>' : '') + '</div>';
}

/* ---- dải ô số ---- */

/* ---------------------------------------------------------------------
   Xuất CSV
   Dấu phân cách là chấm phẩy và có BOM ở đầu: Excel bản tiếng Việt mở
   file dấu phẩy không có BOM thì dồn hết vào một cột và mất dấu.

function csv(ten, cot, dong) {
  var q = function (v) {
    if (v == null) return '';
    var s = String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var txt = '\uFEFF' + cot.map(q).join(';') + '\n' +
    dong.map(function (r) { return r.map(q).join(';'); }).join('\n');
  var vi = HT.lang !== 'en';
  var soDong = dong.length.toLocaleString(vi ? 'vi-VN' : 'en-US');
  var baoXong = function () {
    HT.thongBao(vi ? 'Đã xuất ' + ten + ' · ' + soDong + ' dòng' : 'Exported ' + ten + ' · ' + soDong + ' rows', 'ok');
  };
  var baoKhongTai = function () {
    HT.thongBao(vi ? 'Trình xem này không cho phép lưu file. Mở bản mã nguồn để xuất ' + ten
                   : 'This viewer does not allow saving files. Open the source build to export ' + ten, 'no');
  };

  /* Tải thẳng: bản nhiều file, hoặc bản gói mở thẳng từ repo. */
  function taiThang() {
    try {
      var b = new Blob([txt], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = ten;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      /* Khung cách ly của trình xem chặn mọi lượt tải file: không báo lỗi,
         chỉ đơn giản không có gì xảy ra. Nói ra còn hơn để người dùng bấm
         ba lần rồi tưởng nút hỏng. */
      if (global.HAUSTEK_XEM_ONLINE) baoKhongTai(); else baoXong();
    } catch (e) {
      HT.thongBao((vi ? 'Trình duyệt chặn tải file: ' : 'The browser blocked the download: ') + e.message, 'no');
    }
  }

  /* Trong trình xem artifact, trang không được tải file thẳng, nhưng được
     ĐƯA file cho người xem qua claude.use('downloads'): người xem thấy hộp
     xác nhận tên file và cỡ, đồng ý thì mới lưu. Có đường đó thì đi đường
     đó; không có (bản nhiều file, hay trình xem không cấp) thì tải thẳng. */
  var claude = global.claude;
  if (!claude || typeof claude.use !== 'function') { taiThang(); return; }
  claude.use('downloads').then(function (dl) {
    if (!dl) { taiThang(); return; }
    return dl.save({ filename: ten, data: txt }).then(baoXong, function (e) {
      var ma = e && e.code;
      if (ma === 'declined') return;   /* người xem đã từ chối, không cần nói thêm */
      if (ma === 'rate_limited') {
        HT.thongBao(vi ? 'Một hộp thoại lưu file đang chờ trả lời. Trả lời xong rồi bấm lại.'
                       : 'A save prompt is still open. Answer it, then try again.', 'no');
        return;
      }
      baoKhongTai();
    });
  }, taiThang);
}

/* ---------------------------------------------------------------------
   So sánh hai kỳ — trả về chuỗi "▲ 12,4% so với 05/2026"
   --------------------------------------------------------------------- */
function lech(nay, truoc, nhanTruoc) {
  if (truoc == null || !truoc) return null;
  var d = (nay - truoc) / truoc;
  var pt = Math.abs(d * 100).toFixed(1);
  if (HT.lang !== 'en') pt = pt.replace('.', ',');
  var s = (d >= 0 ? '▲ ' : '▼ ') + pt + '%';
  var noi = HT.lang === 'en' ? ' vs ' : ' so với ';
  return { chu: s + (nhanTruoc ? noi + nhanTruoc : ''), duong: d >= 0, ty: d };
}

  var l = lech(nay, truoc, nhanTruoc);

  return '<span class="' + (l.duong ? 'pos' : 'neg') + '">' + esc(l.chu) + '</span>';
}


/* ---------------------------------------------------------------------
   Nhớ tạm kết quả nặng
   Tổng hợp một kỳ là quét 50.000 bản ghi. Vẽ biểu đồ 12 kỳ tách theo ba

/* Hết việc là tin vui, và phải trông ra tin vui: con số trong ngày của

function khoi1Xong(c, hn) {
  var t = hn.cuaToiHomNay, g = hn.imLang[0], moTa, nutXong;
  if (g) {
    moTa = cauImLang(g) + ' Gửi một dòng cập nhật?';
    nutXong = '<button type="button" class="btn pri" data-di="thong-bao" data-loc-soan="' + HM.esc(g.doiTacId) + '">' + HM.esc(T('soanTb')) + '</button>';
  } else {
    moTa = HM.esc(T('xongDoi'));
    nutXong = '<button type="button" class="btn" data-so="tuan">' + HM.esc(T('xemTuan')) + '</button>';
  }
  return HM.the({ thoBody: true, than: HM.trong({
    xong: true, tieuDe: T('xongTieuDe'), moTaHtml: moTa, nut: nutXong,
    /* Chỉ khoe những con số khác không. Một thẻ khen mà có "0 việc đã
       xong" trong đó thì nó thôi là lời khen. */
    diem: [{ n: t.viec, l: T('xongViec') }, { n: t.thongBao, l: T('xongTb') }, { n: t.lienLac, l: T('xongLl') }]
      .filter(function (x) { return x.n > 0; })
  }) });
}

/* =====================================================================
   Khối 2 · Việc bạn đang chạy
   Bảng gọn, đã sắp theo hạn bước tiếp từ lõi. Cũ quá bảy ngày thì nhắc
   nhẹ bằng một nhãn xám, không phải một lời cảnh báo.
   ===================================================================== */
function khoi2(c, hn) {
  var A = c.A, ds = hn.dangChay;
  if (!ds.length) return HM.the({ h2: HM.esc(T('k2')), thoBody: true,
    than: HM.trong({ tieuDe: T('k2Trong'), moTa: T('k2TrongMo') }) });
  var than = '<div class="tw"><table class="t"><thead><tr>' +
    '<th>' + HM.esc(T('cDoiTac')) + '</th><th>' + HM.esc(T('cViec')) + '</th><th>' + HM.esc(T('cBuoc')) + '</th>' +
    '<th>' + HM.esc(T('cHan')) + '</th><th>' + HM.esc(T('cCapNhat')) + '</th></tr></thead><tbody>' +
    ds.slice(0, 8).map(function (v) {
      var bt = v.buocTiep, cu = v.capNhatLuc ? A.cachNgay(v.capNhatLuc) : null;
      return '<tr class="pick" data-di="viec" data-loc-id="' + HM.esc(v.id) + '">' +
        '<td>' + HM.esc(v.doiTacTen) + '</td>' +
        '<td><div class="t-ttl">' + HM.esc(v.tieuDe) + '</div>' + HM.tag(v.dichVuTen) + '</td>' +
        '<td>' + (bt ? HM.esc(HM.dai(bt.viec, 52)) : '<span class="muted">' + HM.esc(T('chuaDat')) + '</span>') + '</td>' +
        '<td>' + (bt && bt.hanNgay ? HM.esc(A.ngayGonVi(bt.hanNgay)) : '<span class="muted">' + HM.esc(T('chuaCoHan')) + '</span>') + '</td>' +
        '<td>' + (v.capNhatLuc ? HM.esc(A.ngayGonVi(v.capNhatLuc)) : '') +
          (cu != null && cu > 7 ? ' ' + HM.tag('chưa cập nhật ' + cu + ' ngày') : '') + '</td>' +
        '</tr>';
    }).join('') + '</tbody></table></div>';
  return HM.the({ h2: HM.esc(T('k2')), than: than, thoBody: true,
    chan: '<button type="button" class="btn link" data-so="cuaToi">' + HM.esc(T('soViec')) + '</button>' });
}

/* =====================================================================
   Khối 3 · Đang chờ bên ngoài
   Thu gọn sẵn, đếm trơn, không bao giờ tô màu: chờ người khác không phải
   lỗi của nhân viên, kể cả khi đã chờ ba mươi ngày.
   ===================================================================== */
function khoi3(c, hn) {
  var A = c.A, ds = hn.choBenNgoai;
  if (!ds.length) return '';
  var dong = ds.map(function (v) {
    var cho = (v.canDoiTac && v.canDoiTac.viec) || (v.buocTiep && v.buocTiep.viec) || v.tieuDe;
    var ngay = v.capNhatLuc ? A.cachNgay(v.capNhatLuc) : 0;
    var dt = A.doiTac.get(v.doiTacId), lh = dt && dt.lienHe && dt.lienHe[0];
    var them = '';
    if (ngay > 14 && lh && lh.dienThoai) {
      them = '<span class="khi">' + HM.esc(T('lauQua')) + ' ' +
        '<a href="tel:' + HM.esc(String(lh.dienThoai).replace(/\s/g, '')) + '">' + HM.esc(T('goi') + ' ' + lh.dienThoai) + '</a></span>';
    }
    return '<div class="d"><div class="c">' + HM.esc(cho) + ' · <b>' + HM.esc(v.doiTacTen) + '</b> · đã chờ ' + ngay + ' ngày.' + them + '</div>' +
      '<div class="btnrow"><button type="button" class="btn sm" data-di="thong-bao" data-loc-soan="' + HM.esc(v.doiTacId) + '">' + HM.esc(T('nhacLai')) + '</button></div></div>';
  }).join('');
  return HM.the({ than: '<details class="hoc"><summary>' + HM.esc(T('k3') + ' (' + ds.length + ')') + '</summary>' +
    '<div><div class="hang">' + dong + '</div></div></details>' });
}

/* =====================================================================
   Khối 4 · Mới về từ đối tác
   Hồ sơ mới nghĩa là đối tác gửi việc tới, nên đây là tin tốt: đếm trơn,
   không màu. Không có gì mới thì ẩn hẳn khối, không hiện trạng thái rỗng.
   ===================================================================== */
function docMoi(A, meId) {
  var khoa = 'haustek.homnay.lanCuoi.' + meId;
  if (MOC[meId] === undefined) {
    try { MOC[meId] = localStorage.getItem(khoa) || ''; } catch (e) { MOC[meId] = ''; }
    try { localStorage.setItem(khoa, A.bayGio()); } catch (e2) {}
  }
  return { tuLuc: MOC[meId], ds: A.moiVeTuDoiTac(MOC[meId] || null) };
}
function khoi4(c, moi) {
  var A = c.A, ds = moi.ds.slice(0, 6);
  if (!ds.length) return '';
  var phu = moi.tuLuc
    ? 'Đối tác gửi tới từ ' + A.ngayGonVi(moi.tuLuc) + ' lúc ' + A.gioVi(moi.tuLuc) + '.'
    : 'Đối tác gửi tới gần đây.';
  var dong = ds.map(function (m, i) {
    var d = m.dong;
    var b = m.chuaGan && m.viecId
      ? nut(T('nhanViec'), 'moi4', String(i))
      : (m.viecId ? '<button type="button" class="btn sm" data-di="viec" data-loc-id="' + HM.esc(m.viecId) + '">' + HM.esc(T('moViec')) + '</button>' : '');
    return '<div class="d"><div class="c"><b>' + HM.esc(m.doiTacTen) + '</b> · ' + HM.esc(HM.dai(d.tieuDe, 96)) +
      '<span class="khi">' + HM.esc(gio2(d.luc) + ' ngày ' + A.ngayGonVi(d.luc) +
        (m.viecTieuDe && m.viecTieuDe !== d.tieuDe ? ' · ' + m.viecTieuDe : '')) + '</span></div>' +
      (b ? '<div class="btnrow">' + b + '</div>' : '') + '</div>';
  }).join('');
  return HM.the({ h2: HM.esc(T('k4') + ' (' + moi.ds.length + ')'), thoBody: true,
    than: '<div class="card-b"><p class="say">' + HM.esc(phu) + '</p></div><div class="hang">' + dong + '</div>' });
}

/* =====================================================================
   Khối 5 · Đội đã làm hôm nay
   Khối duy nhất trong sản phẩm có nền màu. Đây là lý do trang này đọc ra
   tích cực: danh sách trên ngắn dần trong khi khối này dài ra.
   ===================================================================== */
function chipDoi(A, d) {
  var ra = [];
  (d.dsViec || []).forEach(function (v) {
    var ns = A.nhanSu.get(v.nguoiPhuTrachId), dt = A.doiTac.get(v.doiTacId);
    ra.push({ luc: v.xongLuc, chu: tenNgan(ns ? ns.ten : '') + ' đã xong ' + v.tieuDe, dt: dt ? dt.ten : '' });
  });
  (d.dsThongBao || []).forEach(function (t) {
    var ns = A.nhanSu.get(t.nguoiGuiId);
    ra.push({ luc: t.guiLuc, chu: tenNgan(ns ? ns.ten : '') + ' đã gửi thông báo · ' + t.tieuDe, dt: '' });
  });
  (d.dsLienLac || []).forEach(function (x) {
    var dt = A.doiTac.get(x.doiTacId);
    ra.push({ luc: x.luc, chu: x.tieuDe, dt: dt ? dt.ten : '' });
  });
  return ra.sort(function (a, b) { return khoaLuc(a.luc) < khoaLuc(b.luc) ? 1 : -1; }).slice(0, 5);
}
function khoi5(c, hn) {
  var A = c.A, d = hn.daXongHomNay, tuan = hn.daXongTuanNay;
  var trong = !d.viec && !d.thongBao && !d.lienLac;
  var gio = +String(A.bayGio()).slice(11, 13);
  var cau;
  if (trong && gio >= 17) cau = 'Tuần này đội đã xong ' + so(tuan.viec + ' việc', 'xong') + '.';
  else if (trong) cau = HM.esc(T('sang'));
  else {
    /* Chỉ kể những thứ THẬT SỰ có. "gửi 0 thông báo" là một mệnh đề nói về
       cái không xảy ra, và nó làm câu khoe thành câu kiểm điểm. */
    var y = [];
    if (d.viec) y.push('xong ' + so(String(d.viec), 'xong') + ' việc');
    if (d.thongBao) y.push('gửi ' + so(String(d.thongBao), 'thongBao') + ' thông báo');
    if (d.lienLac) y.push('ghi ' + so(String(d.lienLac), 'lienLac') + ' cuộc liên lạc');
    cau = 'Hôm nay đội đã ' + (y.length > 1 ? y.slice(0, -1).join(', ') + ' và ' + y[y.length - 1] : y[0]) + '.';
  }
  var chips = chipDoi(A, d);
  var than = '<div class="tomtat">' + cau + '</div>' +
    (chips.length ? '<div class="chips">' + chips.map(function (m) {
      return '<span class="chip"><b>' + HM.esc(gio2(m.luc)) + '</b>' + HM.esc(HM.dai(m.chu, 68) + (m.dt ? ' · ' + m.dt : '')) + '</span>';
    }).join('') + '</div>' : '');
  return HM.the({ h2: HM.esc(T('k5')), than: than });
}

/* =====================================================================
   Khối 6 · Lâu chưa có tin
   Khối làm nhân viên mở portal vào một ngày không có việc gấp, nên nó
   nằm trên trang chủ của mọi vai. Không ô số nào đếm khối này.
   ===================================================================== */
function khoi6(c, hn) {
  var A = c.A, ds = hn.imLang.slice(0, 5);
  if (!ds.length) return HM.the({ h2: HM.esc(T('k6')), thoBody: true,
    than: HM.trong({ xong: true, tieuDe: T('k6Trong'), moTa: T('k6TrongMo') }) });
  var dong = ds.map(function (g) {
    var khi = g.lanCuoi ? 'Lần cuối ' + A.ngayGonVi(g.lanCuoi) + (g.tomTat ? ' · ' + HM.dai(g.tomTat, 60) : '')
      : 'Nhịp cập nhật của dịch vụ đối tác này mua là ' + g.nhip + ' ngày.';
    return '<div class="d"><div class="c">' + cauImLang(g) + ' Gửi một dòng cập nhật?' +
      '<span class="khi">' + HM.esc(khi) + '</span></div>' +
      '<div class="btnrow"><button type="button" class="btn sm" data-di="thong-bao" data-loc-soan="' + HM.esc(g.doiTacId) + '">' + HM.esc(T('soanTb')) + '</button></div></div>';
  }).join('');
  return HM.the({ h2: HM.esc(T('k6')), than: '<div class="hang">' + dong + '</div>', thoBody: true });
}

/* =====================================================================
   Khối 7 · Sắp tới · mười bốn ngày, bốn nguồn, không tô màu dòng nào
   ===================================================================== */
function khoi7(c, hn) {
  var A = c.A, ds = hn.sapToi.slice(0, 5);
  if (!ds.length) return HM.the({ h2: HM.esc(T('k7')), thoBody: true,
    than: HM.trong({ tieuDe: T('k7Trong'), moTa: T('k7TrongMo') }) });
  var dong = ds.map(function (x) {
    return '<div class="d"><div class="c"><b>' + HM.esc(A.ngayGonVi(x.ngay)) + '</b> · ' + HM.esc(x.cau) +
      (x.doiTacTen ? ' · ' + HM.esc(x.doiTacTen) : '') + '</div></div>';
  }).join('');
  return HM.the({ h2: HM.esc(T('k7')), than: '<div class="hang">' + dong + '</div>', thoBody: true });
}

/* =====================================================================
   Khối 8 · Dải quản lý · cuối trang, không màu
   Cặp "mới / đã xong" chính là thế cân bằng; không có thẻ nào tên là
   "Quá hạn và Khẩn".
   ===================================================================== */
function khoi8(c, hn) {
  var A = c.A, t0 = dauTuan(A, hn.ngay, hn.thu);
  var moiTuan = A.viec.list({}).filter(function (v) { return v.moLuc && String(v.moLuc).slice(0, 10) >= t0; }).length;
  /* Dùng ĐÚNG danh sách của khối 6, không tự đặt ngưỡng 30 ngày riêng.
     Hai con số cùng tên mà khác ngưỡng, nằm cách nhau một màn hình, là
     cách chắc chắn nhất để người đọc thôi tin cả hai. */
  var im30 = hn.imLang.length;
  return HM.the({ h2: HM.esc(T('k8')), than: HM.kv([
    { t: T('m8Moi'), v: so(String(moiTuan), 'moi'), vHtml: true },
    { t: T('m8Xong'), v: so(String(hn.daXongTuanNay.viec), 'xong'), vHtml: true },
    { t: T('m8Chay'), v: so(String(hn.deme.dangMo), 'doi'), vHtml: true },
    { t: T('m8ImLang'), v: so(String(im30), 'imLang'), vHtml: true }
  ]) });
}

/* =====================================================================
   Sự kiện
   ===================================================================== */
function ganSuKien(root, c, hn, moi, me) {
  var A = c.A;

  HM.bam(root, '[data-so]', function (el) {
    var k = el.getAttribute('data-so');
    if (k === 'cuaToi') c.di('viec', { nguoiPhuTrachId: me.id, trangThai: 'dang-mo' });
    else if (k === 'doi') c.di('viec', { trangThai: 'dang-mo' });
    else if (k === 'moi') c.di('viec', { trangThai: 'moi' });
    else if (k === 'thongBao') c.di('thong-bao', { tab: 'da-gui' });
    else if (k === 'lienLac') c.di('doi-tac', {});
    else if (k === 'imLang') c.di('doi-tac', { imLang: '1' });
    else c.di('viec', { trangThai: 'xong' });
  });

  HM.bam(root, '[data-bung]', function () { MO_HET = true; c.veLai(); });

  /* Một dòng khối 1 xử lý xong thì biến khỏi khối 1 và số trong câu tình
     hình giảm đi một. Đó là toàn bộ cơ chế tích cực của trang. */
  HM.bam(root, '[data-lam]', function (el) {
    var r = hn.canToi[+el.getAttribute('data-lam')];
    if (!r) return;
    var h = (r.nut || {}).hanh;
    try {
      if (h === 'nhan') { A.viec.nhan(r.viecId); c.thongBao(T('daNhan') + ' · ' + r.doiTacTen, 'ok'); c.veLai(); return; }
      if (h === 'chuyen') { A.bangKe.danhDauDaChuyen(r.nut.id, A.homNay()); c.thongBao(T('daChuyen'), 'ok'); c.veLai(); return; }
      /* Lõi còn trả di:'thanh-toan', là tên trang v2 đã bị gỡ. Bảng kê
         nay nằm ở tab Bảng kê của trang thong-bao, nên đổi hướng ở đây
         để nút không dẫn vào một trang không tồn tại. */
      if (h === 'di') {
        if (r.di === 'thanh-toan') c.di('thong-bao', { tab: 'bang-ke' });
        else c.di(r.di || 'viec', {});
        return;
      }
      c.di('viec', { id: r.viecId });
    } catch (e) { c.thongBao(loiNguoi(e), 'warn'); }
  });

  HM.bam(root, '[data-moi4]', function (el) {
    var m = moi.ds[+el.getAttribute('data-moi4')];
    if (!m || !m.viecId) return;
    try { A.viec.nhan(m.viecId); c.thongBao(T('daNhan') + ' · ' + m.doiTacTen, 'ok'); c.veLai(); }
    catch (e) { c.thongBao(loiNguoi(e), 'warn'); }
  });
}

/* =====================================================================
   Đăng ký
   ===================================================================== */
HT.dangKy({
  id: 'hom-nay', nav: 'Hôm nay', icon: 'cal',
  chu: CHU,
  khaDung: function (c) { return !!c.A; },
  /* Ba mức, không có mức thứ tư và không có màu đỏ: quá hạn là một sự
     thật cần nói, không phải một tai nạn cần hét. */
  dem: function (c) {
    if (!c.A) return null;
    var A = c.A, ds = A.homNayCua(A.nhanSu.toi.id).canToi, hnay = A.homNay();
    var muc = 'thuong';
    if (ds.some(function (r) { return r.bac <= 1; })) muc = 'tre';
    else if (ds.some(function (r) { return String(r.ngay).slice(0, 10) === hnay; })) muc = 'hom-nay';
    return { n: ds.length, muc: muc };
  },
  ve: function (root, c) {
    var A = c.A, me = A.nhanSu.toi;
    var hn = A.homNayCua(me.id);
    var moi = docMoi(A, me.id);
    if (hn.canToi.length <= CAP1) MO_HET = false;
    root.innerHTML =
      dauTrang(c, hn) +
      khoi1(c, hn) +
      khoi2(c, hn) +
      khoi3(c, hn) +
      khoi4(c, moi) +
      khoi5(c, hn) +
      khoi6(c, hn) +
      khoi7(c, hn) +
      (me.vai === 'quan-ly' ? khoi8(c, hn) : '');
    ganSuKien(root, c, hn, moi, me);
  }
});

})();

},
/* ---- man/viec.js ---- */
function(){
/* =====================================================================
   NỘI BỘ · VIỆC · hàng đợi chung cho cả mười mảng dịch vụ
   ---------------------------------------------------------------------
   Một dòng hàng đợi là một câu tiếng Việt đọc được: đối tác nào, việc gì,
   ai nợ ai cái gì, hạn ngày nào, và đúng một nút cho việc phải làm tiếp.
   Không phải một hàng bảng sáu cột bắt người đọc tự ghép nghĩa.

   Ngăn chi tiết có thứ tự bắt buộc, và thứ tự ấy chính là màn hình:
     1 tóm tắt · 2 bước tiếp · 3 mốc · 4 số liệu · 5 dòng thời gian ·
     6 ô soạn ghim dưới cùng.
   Số liệu đứng SAU câu chữ, vì người mở việc lúc chín giờ sáng cần biết
   phải làm gì trước, chứ không cần biết bao nhiêu phần trăm.

   Ghi một cuộc gọi vừa xong phải mất dưới mười lăm giây, nên ô soạn luôn
   hiện, không nằm sau hộp thoại nào, và tab mặc định là "Ghi liên lạc".

   Cửa nhận hồ sơ phát hành nằm ở đây: dán JSON do biểu mẫu công khai
   xuất ra, mã hồ sơ giữ nguyên làm mã việc. Portal không sinh mã.
   ===================================================================== */
"use strict";
(function () {

/* ---------------------------------------------------------------------
   Hằng số của màn
   --------------------------------------------------------------------- */
/* Tab đọc thẳng từ A.viec.dem(): mỗi tab một khoá đếm có sẵn trong lõi,
   không tự đếm lại ở đây. Đếm hai nơi là hai con số, và con số thứ hai
   luôn là con số sai. */
var TAB = [
  { k: 'cua-toi',     l: 'Của tôi',                  d: 'cuaToi' },
  { k: 'tre',         l: 'Đã quá hạn',               d: 'tre' },
  { k: 'chua-gan',    l: 'Chưa có người phụ trách',  d: 'chuaGan' },
  { k: 'dang-lam',    l: 'Đang làm',                 d: 'dangLam' },
  { k: 'cho-doi-tac', l: 'Chờ đối tác',              d: 'choDoiTac' },
  { k: 'dang-mo',     l: 'Tất cả đang mở',           d: 'dangMo' },
  { k: 'xong',        l: 'Đã xong',                  d: 'xong' }
];

var KENH = [['goi', 'Gọi điện'], ['zalo', 'Nhắn Zalo'], ['email', 'Gửi email'], ['gap', 'Gặp trực tiếp']];
var KET_QUA = [['da-chot', 'Đã chốt'], ['cho-doi-tac', 'Chờ đối tác trả lời'], ['goi-lai', 'Hẹn gọi lại']];

var SOAN_TAB = [
  { k: 'lien-lac',   l: 'Ghi liên lạc' },

  } else if (soanTab === 'ghi-chu') {

    nut = 'Lưu ghi chú';
    goi = 'Ghi chú nội bộ không có đường nào lộ sang cổng đối tác.';
  } else {
    than = '<div class="fldrow two-up">' +
      '<div class="fgrp"><label class="fld">Trạng thái</label>' +
      chonHtml('data-soan-tt', A.trangThaiViec.map(function (x) { return [x.id, x.vi]; }), v.trangThai) + '</div>' +
      '</div>' +
      '<textarea class="in" data-soan-noi rows="2" placeholder="Lý do đổi trạng thái (không bắt buộc)."></textarea>';
    nut = 'Đổi trạng thái';
    goi = 'Đổi trạng thái sinh một dòng đối tác đọc được.';
  }
  return '<div class="soan">' + HM.tabs(SOAN_TAB, soanTab) + than +
    '<div class="ft"><span class="hint">' + e(goi) + '</span>' +
    '<button type="button" class="btn pri" data-luu-soan>' + e(nut) + '</button></div></div>';
}

/* ---------------------------------------------------------------------
   Ngăn chi tiết · thân đầy đủ, đúng thứ tự bắt buộc
   --------------------------------------------------------------------- */
function thanNgan(c, v) {
  var A = c.A;
  var html = '';

  /* 1 · tóm tắt. Đứng đầu vì đây là câu người mới nhận việc cần đọc. */
  html += '<div class="tomtat">' + e(v.tomTat || 'Việc này chưa có tóm tắt.') + '</div>' +
    '<div class="btnrow"><button type="button" class="btn sm ghost" data-sua-tomtat>Sửa tóm tắt</button>' +
    '<button type="button" class="btn sm ghost" data-loc-doi-tac="' + e(v.doiTacId) + '">Mọi việc của ' + e(v.doiTacTen) + '</button></div>';

  /* 2 · bước tiếp: ai nợ ai cái gì, hạn ngày nào. */
  html += '<h4 class="sec">Bước tiếp</h4>';
  if (v.canDoiTac) {
    html += '<p class="say">Đối tác cần làm: <b>' + e(v.canDoiTac.viec) + '</b>, ' + e(cauHan(A, v.canDoiTac.han)) +
      '. Việc đã ở trạng thái chờ đối tác ' + A.cachNgay(v.capNhatLuc) + ' ngày.</p>';
  } else if (v.buocTiep) {
    html += '<p class="say">' + (v.buocTiep.aiLam === 'doi-tac' ? 'Đối tác cần làm' : 'Haustek cần làm') +
      ': <b>' + e(v.buocTiep.viec) + '</b>, ' + e(cauHan(A, v.buocTiep.hanNgay)) + '.</p>';
  } else if (v.trangThai === 'xong') {
    html += '<p class="say">Việc đã xong ngày ' + e(A.ngayVi(v.xongLuc || v.capNhatLuc)) + ', không còn bước tiếp.</p>';
  } else {
    html += '<p class="say">Chưa đặt bước tiếp. Đặt một câu ngắn kèm ngày để việc không nằm im.</p>';
  }
  if (v.trangThai !== 'xong' && v.trangThai !== 'huy') {
    html += '<div class="btnrow">' +
      '<button type="button" class="btn sm" data-buoc-tiep>Đặt bước tiếp của Haustek</button>' +
      '<button type="button" class="btn sm" data-can-doi-tac>Chuyển sang chờ đối tác</button>' +
      (v.nguoiPhuTrachId ? '' : '<button type="button" class="btn sm pri" data-nhan-ngan>Nhận việc</button>') +
      '</div>';
  }
  html += '<p class="hint">' + e('Hạn phản hồi ' + A.ngayVi(v.hanPhanHoi) + ' · cam kết ' +
    A.dvCua(v.dichVu).camKetPhanHoi + ' ngày làm việc của mảng ' + v.dichVuTen.toLowerCase() +
    (v.hanGiao ? ' · hẹn giao ' + A.ngayVi(v.hanGiao) : '')) + '</p>';

  /* 3 · mốc. Tiến độ là một thanh, không phải một biểu đồ. */
  html += '<h4 class="sec">Mốc</h4>';
  var moc = v.moc || [];
  if (!moc.length) {
    html += '<p class="hint">Việc này không chia mốc.</p>';
  } else {
    var xong = 0;
    moc.forEach(function (m) { if (m.xongLuc) xong++; });
    html += HM.thanh(xong, moc.length, 'Mốc') +
      '<p class="hint">' + xong + ' trong ' + moc.length + ' mốc đã xong.</p>' +
      '<div class="hang">' + moc.map(function (m) {
        return '<div class="d">' +
          '<span class="n">' + (m.xongLuc ? HM.icon('check') : HM.icon('clock')) + '</span>' +
          '<div class="c">' + e(m.ten) + '<span class="khi">' +
          (m.xongLuc ? e('xong ngày ' + A.ngayGonVi(m.xongLuc)) : e(cauHan(A, m.han))) + '</span></div>' +
          '<div class="btnrow">' + (m.xongLuc ? '' :
            '<button type="button" class="btn sm ghost" data-xong-moc="' + e(m.id) + '">Đánh dấu xong</button>') + '</div>' +
          '</div>';
      }).join('') + '</div>';
  }

  /* 4 · số liệu, chỉ sau khi đã nói xong việc phải làm. */
  html += '<h4 class="sec">' + (v.dichVu === 'phat-hanh' ? 'Bản phát hành' : v.dichVu === 'su-kien' ? 'Đêm diễn' : 'Chi tiết việc') + '</h4>';
  html += veChiTiet(A, v);
  if (v.baoGia && v.baoGia.tong != null) {
    html += '<h4 class="sec">Báo giá đã chốt</h4>' + HM.kv([
      { t: 'Tổng', v: A.tien0(v.baoGia.tong) },
      { t: 'Đặt cọc', v: v.baoGia.coc ? A.tien0(v.baoGia.coc) : 'không có' },
      { t: 'Hạn xác nhận', v: v.baoGia.hanXacNhan ? A.ngayVi(v.baoGia.hanXacNhan) : 'chưa đặt' },
      { t: 'Đã xác nhận', v: v.baoGia.xacNhanLuc ? A.ngayVi(v.baoGia.xacNhanLuc) : 'chưa xác nhận' }
    ]) + '<p class="hint">Báo giá ở đây chỉ là dấu vết đã chốt phạm vi. Hoá đơn và công nợ nằm ở phần mềm kế toán.</p>';
  }

  /* 5 · dòng thời gian của riêng việc này. */
  html += '<h4 class="sec">Dòng thời gian của việc</h4>' + veDongThoiGian(A, v);

  /* 6 · ô soạn, ghim dưới cùng, luôn hiện. */
  html += veSoan(A, v);
  return html;
}

/* ---------------------------------------------------------------------
   Mở, vẽ lại và gắn sự kiện cho ngăn
   Vẽ lại RUỘT ngăn chứ không mở lại ngăn: mở lại là chạy lại hiệu ứng
   trượt và mất chỗ cuộn, ghi một cuộc gọi sẽ không còn dưới mười lăm giây.
   --------------------------------------------------------------------- */
function veLaiNgan(c) {
  var dr = document.querySelector('.drawer');
  if (!dr || !nganId) return;
  var v = c.A.viec.get(nganId);
  if (!v) return;
  var than = dr.querySelector('.drawer-b');
  if (than) than.innerHTML = thanNgan(c, v);
}
function moNgan(c, id, opt) {
  var A = c.A, v = A.viec.get(id);
  if (!v) { c.thongBao('Không tìm thấy việc này.', 'no'); return; }
  nganId = id;
  chiDoiTacThay = false;
  soanTab = (opt && opt.soanTab) || 'lien-lac';
  c.nganTruot(thanNgan(c, v), {
    tieuDe: v.tieuDe,
    phu: v.doiTacTen + ' · ' + v.dichVuTen + ' · mã ' + v.id,
    khiMo: function (dr) {
      ganNgan(dr, c);
      if (opt && opt.soan) {
        var o = dr.querySelector('.soan textarea');
        if (o) o.focus();
      }
    }
  });
}
function ganNgan(dr, c) {
  var A = c.A;
  function lamMoi() { veLaiNgan(c); if (veTrangLai) veTrangLai(); }
  function viec() { return A.viec.get(nganId); }

  HM.bam(dr, '.soan [data-tab]', function (el) {
    soanTab = el.getAttribute('data-tab');
    veLaiNgan(c);
    var o = dr.querySelector('.soan textarea');
    if (o) o.focus();
  });

  HM.bam(dr, '[data-luu-soan]', function () {
    var v = viec(); if (!v) return;
    var chu = (giaTri(dr, '[data-soan-noi]') || '').trim();
    try {
      if (soanTab === 'lien-lac') {
        if (!chu) { c.thongBao('Cần một câu tóm tắt cuộc liên lạc.', 'no'); return; }
        A.dong.ghiLienLac({ doiTacId: v.doiTacId, viecId: v.id, tomTat: chu,
          kenh: giaTri(dr, '[data-soan-kenh]'), ketQua: giaTri(dr, '[data-soan-ketqua]') });
        c.thongBao('Đã ghi liên lạc.', 'ok');
      } else if (soanTab === 'nhan') {
        if (!chu) { c.thongBao('Cần nội dung trước khi gửi.', 'no'); return; }
        A.dong.nhanChoDoiTac({ doiTacId: v.doiTacId, viecId: v.id, noiDung: chu });
        c.thongBao('Đã gửi cho đối tác.', 'ok');
      } else if (soanTab === 'ghi-chu') {
        if (!chu) { c.thongBao('Cần nội dung trước khi lưu.', 'no'); return; }
        A.dong.ghiChuNoiBo({ doiTacId: v.doiTacId, viecId: v.id, noiDung: chu });
        c.thongBao('Đã lưu ghi chú nội bộ.', 'ok');
      } else {
        var tt = giaTri(dr, '[data-soan-tt]');
        A.viec.doiTrangThai(v.id, tt, chu);
        c.thongBao('Đã chuyển sang ' + tenTrangThai(A, tt).toLowerCase() + '.', 'ok');
      }
      lamMoi();
    } catch (err) { c.thongBao(loiChu(err), 'no'); }
  });

  HM.doi(dr, '[data-chi-dt]', function (el) {
    chiDoiTacThay = !!el.checked;
    veLaiNgan(c);
  });

  HM.bam(dr, '[data-sua-tomtat]', function () {
    var v = viec(); if (!v) return;
    HM.hoiForm(c, {
      tieuDe: 'Sửa tóm tắt việc', dong: 'Lưu tóm tắt',
      moTa: 'Một đoạn cho người nhận bàn giao: đối tác muốn gì, đã thống nhất tới đâu.',
      fields: [{ k: 'tomTat', l: 'Tóm tắt', kieu: 'textarea', rows: 4, v: v.tomTat, req: true, rong: true }]
    }).then(function (f) {
      if (!f) return;
      try { A.viec.suaTomTat(v.id, f.tomTat); c.thongBao('Đã lưu tóm tắt.', 'ok'); lamMoi(); }
      catch (err) { c.thongBao(loiChu(err), 'no'); }
    });
  });

  HM.bam(dr, '[data-buoc-tiep]', function () {
    var v = viec(); if (!v) return;
    var cu = v.buocTiep && v.buocTiep.aiLam === 'haustek' ? v.buocTiep : null;
    HM.hoiForm(c, {
      tieuDe: 'Bước tiếp của Haustek', dong: 'Lưu bước tiếp',
      moTa: 'Một câu ngắn và một ngày. Không có hai thứ đó thì việc nằm im mà không ai biết.',
      fields: [
        { k: 'viec', l: 'Haustek cần làm gì', v: cu ? cu.viec : '', req: true, rong: true },
        { k: 'hanNgay', l: 'Hạn', kieu: 'date', v: cu ? cu.hanNgay : A.hanLamViec(A.homNay(), 2), kbb: false }
      ]
    }).then(function (f) {
      if (!f) return;
      try {
        A.viec.datBuocTiep(v.id, { viec: f.viec, aiLam: 'haustek', hanNgay: f.hanNgay });
        c.thongBao('Đã đặt bước tiếp.', 'ok'); lamMoi();
      } catch (err) { c.thongBao(loiChu(err), 'no'); }
    });
  });

  HM.bam(dr, '[data-can-doi-tac]', function () {
    var v = viec(); if (!v) return;
    HM.hoiForm(c, {
      tieuDe: 'Chuyển sang chờ đối tác', dong: 'Chuyển sang chờ đối tác',
      moTa: 'Câu này hiện nguyên văn ở khối "Việc cần bạn" của cổng đối tác, nên viết như đang nói với họ.',
      fields: [
        { k: 'viec', l: 'Đối tác cần làm gì', v: v.canDoiTac ? v.canDoiTac.viec : '', req: true, rong: true },
        { k: 'hanNgay', l: 'Hẹn ngày', kieu: 'date', v: v.canDoiTac ? v.canDoiTac.han : A.hanLamViec(A.homNay(), 3), kbb: false }
      ]
    }).then(function (f) {
      if (!f) return;
      try {
        A.viec.datBuocTiep(v.id, { viec: f.viec, aiLam: 'doi-tac', hanNgay: f.hanNgay });
        c.thongBao('Việc đã chuyển sang chờ đối tác.', 'ok'); lamMoi();
      } catch (err) { c.thongBao(loiChu(err), 'no'); }
    });
  });

  HM.bam(dr, '[data-nhan-ngan]', function () {
    var v = viec(); if (!v) return;
    try { A.viec.nhan(v.id); c.thongBao('Bạn đã nhận việc này.', 'ok'); lamMoi(); }
    catch (err) { c.thongBao(loiChu(err), 'no'); }
  });

  HM.bam(dr, '[data-xong-moc]', function (el) {
    var v = viec(); if (!v) return;
    try { A.viec.xongMoc(v.id, el.getAttribute('data-xong-moc')); c.thongBao('Đã đánh dấu mốc xong.', 'ok'); lamMoi(); }
    catch (err) { c.thongBao(loiChu(err), 'no'); }
  });

  HM.bam(dr, '[data-nen-tang]', function (el) {
    var v = viec(); if (!v) return;
    var b = v.banPhatHanh || (v.banPhatHanhId ? A.banPhatHanh.get(v.banPhatHanhId) : null);
    if (!b) { c.thongBao('Việc này chưa gắn bản phát hành nào.', 'no'); return; }
    var tt = el.getAttribute('data-nen-tang');
    HM.hoiForm(c, {
      tieuDe: 'Trạng thái nền tảng · ' + b.ten, dong: 'Lưu trạng thái',
      moTa: 'Trạng thái này và ngày cập nhật hiện cùng nhau ở cả hai cổng.',
      fields: [{ k: 'ghiChu', l: 'Ghi chú cho đối tác', kieu: 'textarea', rows: 2, v: b.nenTangGhiChu || '', rong: true }]
    }).then(function (f) {
      if (!f) return;
      try {
        A.banPhatHanh.datNenTang(b.id, tt, f.ghiChu);
        c.thongBao('Đã cập nhật trạng thái nền tảng.', 'ok'); lamMoi();
      } catch (err) { c.thongBao(loiChu(err), 'no'); }
    });
  });

  HM.bam(dr, '[data-loc-doi-tac]', function (el) {
    c.datLoc({ doiTacId: el.getAttribute('data-loc-doi-tac'), tab: 'dang-mo' });
  });
}

/* ---------------------------------------------------------------------
   Ô nhận hồ sơ phát hành
   --------------------------------------------------------------------- */
function veNhanHoSo(A) {
  var ds = A.doiTac.list({ trangThai: 'dang-hop-tac' }).sort(function (a, b) { return a.ten.localeCompare(b.ten, 'vi'); });
  return HM.the({
    h2: 'Nhận hồ sơ phát hành',
    p: 'Dán nguyên tệp JSON mà biểu mẫu metadata công khai xuất ra.',
    than: '<div class="fldrow two-up">' +
      '<div class="fgrp"><label class="fld">Đối tác gửi hồ sơ</label>' +
      chonHtml('data-hs-doi-tac', ds.map(function (d) { return [d.id, d.ten]; }), '') + '</div>' +
      '</div>' +
      '<textarea class="in" data-hs-json rows="6" placeholder=\'{"submission_id": "HSTK-2609-001", "ten": "Tên bản phát hành", "track": []}\'></textarea>' +
      '<p class="hint">Mã hồ sơ (submission_id) trong tệp JSON trở thành mã việc và mã bản phát hành; portal giữ nguyên mã đó và không tự sinh mã mới.</p>',
    chan: '<div class="btnrow"><button type="button" class="btn pri" data-hs-luu>Nhận hồ sơ</button>' +
      '<button type="button" class="btn ghost" data-hs-dong>Đóng ô này</button></div>'
  });
}

/* ---------------------------------------------------------------------
   Đăng ký trang
   --------------------------------------------------------------------- */
HT.dangKy({
  id: 'viec', nav: 'Việc', icon: 'list',

  dem: function (c) {
    var d = c.A.viec.dem();
    if (d.tre > 0) return { n: d.tre, muc: 'tre' };
    if (d.chuaGan > 0) return { n: d.chuaGan, muc: 'hom-nay' };
    return { n: d.cuaToi, muc: 'thuong' };
  },

  ve: function (root, c) {
    var A = c.A;
    var lm = docLocMan(c);
    var khoa = [lm.tab, lm.dichVu, lm.nguoiPhuTrachId, lm.doiTacId, lm.q].join('|');
    if (khoa !== khoaTrang) { khoaTrang = khoa; trang.trang = 0; }

    function veTrang(giuTim) {
      var dem = A.viec.dem();
      var ds = A.viec.list(locChoLoi(c, lm));
      if (lm.tab === 'tre') {
        ds = ds.sort(function (a, b) {
          var x = (a.buocTiep && a.buocTiep.hanNgay) || a.hanPhanHoi || '9999';
          var y = (b.buocTiep && b.buocTiep.hanNgay) || b.hanPhanHoi || '9999';
          return x < y ? -1 : x > y ? 1 : 0;
        });
      }
      var dtIx = {};
      A.doiTac.list().forEach(function (d) { dtIx[d.id] = d; });
      var hn = A.homNayCua(A.nhanSu.toi.id);

      var html = HM.dau({
        h1: 'Việc',
        mo: e('Một hàng đợi cho cả mười mảng dịch vụ. Mỗi dòng là một việc và một bước tiếp; bấm vào dòng để mở ngăn ghi liên lạc.'),
        nut: '<button type="button" class="btn' + (moNhanHoSo ? ' pri' : '') + '" data-mo-nhan>' +
          HM.icon('disc') + 'Nhận hồ sơ</button>'
      });

      /* Thanh lọc. Đọc từ địa chỉ, ghi bằng datLoc, không giữ trạng thái riêng. */
      html += '<div class="bar">' +
        '<div class="srch">' + HM.icon('tim') +
        '<input type="search" data-q value="' + e(lm.q) + '" placeholder="Tìm theo tên việc, mã hồ sơ hoặc tên đối tác"></div>' +
        chonHtml('data-loc-dv', [['', 'Tất cả dịch vụ']].concat(A.dichVu.map(function (d) { return [d.id, d.vi]; })), lm.dichVu) +
        chonHtml('data-loc-nguoi', [['', 'Tất cả người phụ trách']].concat(A.nhanSu.list().map(function (n) { return [n.id, n.ten]; })), lm.nguoiPhuTrachId) +
        '</div>';

      var chip = [];
      if (lm.doiTacId) {
        var dtc = dtIx[lm.doiTacId];
        chip.push('<span class="chip">Đối tác <b>' + e(dtc ? dtc.ten : lm.doiTacId) + '</b>' +
          '<button type="button" data-bo-loc="doiTacId" aria-label="Bỏ lọc đối tác">' + HM.icon('x') + '</button></span>');
      }
      if (lm.q) chip.push('<span class="chip q">Từ khoá <b>' + e(lm.q) + '</b>' +
        '<button type="button" data-bo-loc="q" aria-label="Bỏ từ khoá">' + HM.icon('x') + '</button></span>');
      if (lm.dichVu) chip.push('<span class="chip">Dịch vụ <b>' + e(A.dvCua(lm.dichVu).vi) + '</b>' +
        '<button type="button" data-bo-loc="dichVu" aria-label="Bỏ lọc dịch vụ">' + HM.icon('x') + '</button></span>');
      if (chip.length) html += '<div class="chips">' + chip.join('') + '</div>';

      if (moNhanHoSo) html += veNhanHoSo(A);

      html += HM.tabs(TAB.map(function (t) { return { k: t.k, l: t.l, dem: dem[t.d] }; }), lm.tab);

      var pt = HM.phanTrang(ds, trang, 20);
      var coLoc = !!(lm.q || lm.dichVu || lm.doiTacId || lm.nguoiPhuTrachId);
      var than;
      if (!ds.length && coLoc) {
        than = HM.trong({
          tieuDe: 'Không có việc nào khớp bộ lọc này.',
          moTa: 'Bỏ bớt một bộ lọc hoặc đổi tab để thấy phần còn lại của hàng đợi.',
          nut: '<button type="button" class="btn sm" data-bo-het>Bỏ hết bộ lọc</button>'
        });
      } else if (!ds.length) {
        than = HM.trong({
          xong: true,
          tieuDe: 'Không còn việc nào trong danh sách này.',
          moTa: 'Đội đã dọn sạch phần này. Đổi tab để xem phần còn lại.',

function(){
/* =====================================================================

   phải một bộ lọc tiện tay: người viết ghi chú nội bộ phải nhìn tận mắt

"use strict";
(function () {

function cauQuanHe(A, d) {
  var cau = [];
  /* Người đã tự viết tóm tắt thì không nhắc lại chuyện họ vừa viết. Hai câu
     nói cùng một thứ nằm cạnh nhau đọc như phần mềm không nghe ai cả. */
  if (!d.tomTat) {
    var nam = A.cachNgay(d.hopDong.tuNgay);
    var lauCau = nam >= 730 ? Math.round(nam / 365) + ' năm' : nam >= 60 ? Math.round(nam / 30) + ' tháng' : nam + ' ngày';
    var dv = d.dichVu.map(function (x) { return A.dvCua(x).vi.toLowerCase(); });
    cau.push('Đồng hành ' + lauCau + ', từ ' + A.ngayVi(d.hopDong.tuNgay) + '.');
    if (dv.length === 1) cau.push('Haustek làm ' + dv[0] + ' cho họ.');
    else if (dv.length) cau.push('Haustek làm ' + dv.slice(0, -1).join(', ') + ' và ' + dv[dv.length - 1] + ' cho họ.');
  }

  var mo = d.viecDangMo.length;
  if (!mo) cau.push('Hiện không có việc nào đang chạy.');
  else {
    var gap = d.viecDangMo.filter(function (v) { return v.treHanPhanHoi || v.treBuocTiep; });
    cau.push('Đang có ' + mo + ' việc chạy' + (gap.length ? ', trong đó ' + gap.length + ' việc đã quá hạn' : '') + '.');
  }
  var cho = d.canDoiTac.length;
  if (cho) {
    var g0 = d.canDoiTac[0];
    cau.push('Haustek đang chờ họ ' + g0.viec.toLowerCase() + (cho > 1 ? ' và ' + (cho - 1) + ' việc nữa' : '') +
      ', đã chờ ' + g0.soNgayCho + ' ngày.');
  }
  if (d.lienLacCuoi) {
    cau.push('Lần cuối nói chuyện là ' + A.ngayVi(d.lienLacCuoi.luc) + ', ' + A.cachNgay(d.lienLacCuoi.luc) + ' ngày trước.');
  } else {
    cau.push('Chưa ai ghi lại cuộc liên lạc nào với họ.');
  }
  if (d.conHan != null && d.conHan < 0) cau.push('Hợp đồng đã hết hạn ' + A.ngayVi(d.hopDong.denNgay) + '.');
  else if (d.conHan != null && d.conHan <= 60) cau.push('Hợp đồng còn ' + d.conHan + ' ngày.');
  return cau.join(' ');

/* Dòng thời gian, gom theo ngày. Dựng bằng một mảng rồi join: một đối tác

function veDong(A, ds) {

      ra.push('<div class="ngay">' + e(nhan) + '</div>');
    }
    ra.push('<div class="m' + (x.hienChoDoiTac ? ' ta' : '') + '">' +

        '<time>' + e(A.gioVi(x.luc)) + '</time>' +
        '<span class="ai">' + e(TEN_LOAI[x.loai] || x.loai) + (x.boi && x.boi.ten ? ' · ' + e(x.boi.ten) : '') + '</span>' +
        (x.hienChoDoiTac ? '' : '<span class="rieng">nội bộ</span>') +
      '</div>' +
      (x.noiDung ? '<p>' + e(x.noiDung) + '</p>' : '') +
      (x.daXem ? '<span class="dax">' + e(x.daXem.ten + ' đã xem ' + A.ngayGonVi(x.daXem.luc)) + '</span>' : '') +
      '</div>');
  }
  ra.push('</div>');
  return ra.join('');
}

/* Ô soạn ghim dưới dòng thời gian, LUÔN hiện. Ghi một cuộc gọi vừa xong
   phải mất vài giây; mở hộp thoại đã hết ba giây rồi. */
function veSoan(A, d) {
  var than, nut;
  if (SOAN === 'lien-lac') {
    than = '<div class="fldrow two-up">' +
      '<div class="fgrp"><label class="fld">Kênh</label>' + chonHtml('data-kenh', KENH, 'goi') + '</div>' +
      '<div class="fgrp"><label class="fld">Kết quả</label>' + chonHtml('data-ketqua', KET_QUA, 'da-chot') + '</div></div>' +
      '<textarea class="in" data-noi rows="2" placeholder="Vừa gọi ai, chốt được gì."></textarea>';
    nut = 'Ghi liên lạc';
  } else if (SOAN === 'nhan') {
    than = '<textarea class="in" data-noi rows="3" placeholder="Nội dung gửi cho ' + e(d.ten) + '."></textarea>';
    nut = 'Gửi cho đối tác';
  } else if (SOAN === 'ghi-chu') {
    than = '<textarea class="in" data-noi rows="3" placeholder="Ghi cho đồng nghiệp đọc. Đối tác không bao giờ thấy dòng này."></textarea>';

  } else {
    than = '<textarea class="in" data-noi rows="3" placeholder="Một đoạn kể lại quan hệ với đối tác này.">' + e(d.tomTat || '') + '</textarea>';

    : SOAN === 'tom-tat' ? 'Tóm tắt hiện ở đầu trang này, chỉ nội bộ đọc.'
    : 'Ghi lại để người sau không phải gọi lại hỏi cùng một câu.';
  return '<div class="soan">' + HM.tabs(SOAN_TAB, SOAN) + than +

}

function veCotPhai(A, c, d) {
  var lh = (d.lienHe || []).map(function (x) {
    return '<div class="d" style="padding:10px 0;border-top:1px solid var(--line)">' +
      '<div class="c"><b>' + e(x.ten) + '</b>' + (x.laChinh ? ' ' + HM.tag('liên hệ chính', 'ok') : '') +

/* ---- man/thong-bao.js ---- */
function(){
/* =====================================================================

   ---------------------------------------------------------------------
   Thông báo ở đây là THƯ DO NGƯỜI VIẾT, không phải chuông hệ thống tự
   bắn. Ba cách gửi, một hộp soạn duy nhất.

   Gửi cho hai đối tác trở lên thì BẮT BUỘC xem trước. Một lá thư đi tới
   ba mươi đối tác không có nút thu hồi, nên bước xem trước ở đây là cái
   phanh, không phải một màn hình thừa.

   Tab Bảng kê là bàn của kế toán: lưới đối tác nhân kỳ, ô nào trống thì
   thấy ngay. Số tiền hiện ra là số GHI TRÊN BẢNG KÊ PDF kèm nguồn, portal

"use strict";
(function () {

var e = function (x) { return HM.esc(x == null ? '' : String(x)); };

  { k: 'soan',    l: 'Soạn thông báo' },

];

var NHAP = { kieu: 'chon', doiTacIds: [], dichVu: '', tieuDe: '', noiDung: '', mauId: '' };

function chonHtml(khoa, ds, gt) {

function loiNguoi(err) {

          '<div class="fgrp span2"><label class="fld">Nội dung *</label>' +

    });

  HM.doi(root, '[data-kieu]', function (el) { NHAP.kieu = el.value; c.veLai(); });
  HM.doi(root, '[data-dv]', function (el) { NHAP.dichVu = el.value; c.veLai(); });
  HM.doi(root, '[data-mau]', function (el) {

    giuChu(root);
