          '<td class="mono">' + HM.esc(r.fromLabel) +
            (A.isApproved(r.from) ? '<div class="t-sub">' + HM.esc(c.lang === 'vi' ? 'kỳ đã duyệt' : 'approved') + '</div>' : '') + '</td>' +
          '<td>' + (r.note ? HM.esc(HM.dai(r.note, 46)) : '<span class="nil">—</span>') +
            '<div class="t-sub">' + HM.esc(r.by) + ' · ' + HM.esc(HT.fmt.ngay(r.at)) + '</div></td>' +
          '<td>' + (r.dangAp ? HM.tag(c.ky.label, 'ok') : '<span class="nil">—</span>') + '</td>';
      },
      chon: function (r) { moLichSu(c, r); },
      rongTieuDe: t('khong'),
      rongMoTa: c.lang === 'vi' ? 'Đổi bộ lọc, hoặc thêm một dòng tỷ lệ mới.' : 'Change the filters, or add a rate row.'
    });
    b.ve();
    HB.gan(root);

    HM.nhap(root, '[data-tim]', function (el) { LOC.tim = el.value; c.veLai(); });
    HM.doi(root, '[data-loai]', function (el) { LOC.loai = el.value; c.veLai(); });
    HM.bam(root, '[data-chidoi]', function () { LOC.chiDoi = !LOC.chiDoi; c.veLai(); });
    HM.bam(root, '[data-them]', function () { hoiTyLe(c, null); });
    HM.bam(root, '[data-xuat]', function () {
      HM.csv('ty-le-chia.csv',
        ['Mã bên nhận', 'Tên', 'Loại', 'Tỷ lệ bên nhận', 'Hiệu lực từ kỳ', 'Người đặt', 'Đặt lúc', 'Ghi chú'],
        loc.map(function (r) {
          return [r.ma, r.ten, r.loai, (r.rate * 100).toFixed(1).replace('.', ',') + '%',
                  r.fromLabel, r.by, r.at, r.note];
        }));
    });
  }
});

/* =====================================================================
   Lịch sử tỷ lệ của một bên
   ===================================================================== */
function moLichSu(c, r) {
  var A = c.A;
  var lich = A.rates.scheduleFor(r.key);
  var la = r.loai === 'label';
  var id = +r.key.slice(2);

  /* tỷ lệ áp cho từng kỳ — nhìn thấy được là hiểu ngay vì sao cần bảng */
  var theoKy = A.periods.map(function (p) { return A.rates.rateFor(r.key, p.k); });

  c.nganTruot(
    HM.so([
      { l: c.lang === 'vi' ? 'Tỷ lệ đang áp cho kỳ ' + c.ky.label : 'Rate for ' + c.ky.label,
        v: HT.fmt.pct(A.rates.rateFor(r.key, c.kyKey)), lon: true },
      { l: c.lang === 'vi' ? 'Số dòng tỷ lệ' : 'Rate rows', v: String(lich.length) }
    ]) +
    '<h4 class="sec">' + HM.esc(c.t('lichSu')) + '</h4>' +
    '<div class="steps">' + lich.slice().reverse().map(function (x, i) {
      return '<div class="s ' + (i === 0 ? 'now' : 'ok') + '">' +
        '<b>' + HM.esc(HT.fmt.pct(x.rate)) + ' ' +
        HM.esc(c.lang === 'vi' ? 'từ kỳ ' : 'from ') +
        HM.esc(A.periods[A.pIndexOf(x.from)] ? A.periods[A.pIndexOf(x.from)].label : x.from) + '</b>' +
        '<span>' + HM.esc(x.note || (c.lang === 'vi' ? '(không ghi chú)' : '(no note)')) + '</span>' +
        '<div class="tm">' + HM.esc(x.by) + ' · ' + HM.esc(HT.fmt.ngay(x.at)) + '</div>' +
        (A.isApproved(x.from) ? '' :
          '<div class="btnrow" style="margin-top:8px"><button type="button" class="btn sm dang" ' +
          'data-xoa="' + HM.esc(r.key) + '|' + HM.esc(x.from) + '">' + HM.esc(c.t('xoaDong')) + '</button></div>') +
        '</div>';
    }).join('') + '</div>' +
    '<h4 class="sec">' + (c.lang === 'vi' ? 'Tỷ lệ áp cho từng kỳ' : 'Rate applied per period') + '</h4>' +
    '<div class="tw"><table class="t" style="min-width:0"><thead><tr>' +
      '<th>' + (c.lang === 'vi' ? 'Kỳ' : 'Period') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Tỷ lệ' : 'Rate') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Bên này nhận' : 'This party earned') + '</th>' +
      '<th>' + (c.lang === 'vi' ? 'Sổ' : 'Books') + '</th></tr></thead><tbody>' +
      A.periods.slice().reverse().map(function (p) {
        var g = A.agg(la ? 'label' : 'artist', id, p.idx, 'rec');
        var doi = p.idx > 0 && theoKy[p.idx] !== theoKy[p.idx - 1];
        return '<tr' + (doi ? ' style="box-shadow:inset 3px 0 0 var(--warn)"' : '') + '>' +
          '<td class="mono">' + HM.esc(p.label) + '</td>' +
          '<td class="num">' + HM.esc(HT.fmt.pct(theoKy[p.idx])) +
            (doi ? ' <span class="tag warn">' + HM.esc(c.lang === 'vi' ? 'đổi' : 'change') + '</span>' : '') + '</td>' +
          '<td class="num">' + HM.esc(c.tien(g.total)) + '</td>' +
          '<td>' + (A.isApproved(p.k) ? HM.tag(c.lang === 'vi' ? 'đã khoá' : 'closed', 'ok')
            : HM.tag(c.lang === 'vi' ? 'đang mở' : 'open', 'warn')) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '<div class="btnrow" style="margin-top:18px">' +
      '<button type="button" class="btn pri" data-them2="' + HM.esc(r.key) + '">' + HM.esc(c.t('them')) + '</button>' +
    '</div>',
    { tieuDe: r.ten, phu: r.ma + ' · ' + (la ? 'Label' : (c.lang === 'vi' ? 'Nghệ sĩ độc lập' : 'Independent artist')),
      khiMo: function (dr) {
        HM.bam(dr, '[data-them2]', function (el) { c.dongNgan(); hoiTyLe(c, el.getAttribute('data-them2')); });
        HM.bam(dr, '[data-xoa]', function (el) {
          var v = el.getAttribute('data-xoa').split('|');
          c.xacNhan(c.t('xoaDong'),
            HM.esc(c.lang === 'vi'
              ? 'Xoá dòng này thì các kỳ từ ' + v[1] + ' trở đi quay lại tỷ lệ của dòng trước đó. Kỳ đã duyệt không đổi.'
              : 'Deleting this row returns periods from ' + v[1] + ' onwards to the previous row’s rate. Approved periods are unaffected.'),
            c.t('xoaDong'), true).then(function (ok) {
              if (!ok) return;
              A.rates.remove(v[0], v[1]);
              c.dongNgan(); c.thongBao(c.lang === 'vi' ? 'Đã xoá dòng tỷ lệ' : 'Rate row deleted');
              HM.quenHet(); c.veLai();
            });
        });
      } });
}

/* =====================================================================
   Thêm dòng tỷ lệ
   ===================================================================== */
function hoiTyLe(c, key) {
  var A = c.A;
  var kyMo = A.periods.filter(function (p) { return !A.isApproved(p.k); });
  if (!kyMo.length) {
    c.thongBao(c.lang === 'vi' ? 'Mọi kỳ đều đã duyệt — không đặt được tỷ lệ hiệu lực vào kỳ nào' : 'Every period is approved', 'no');
    return;
  }
  var hienTai = key ? A.rates.rateFor(key, kyMo[0].k) : 0.8;

  c.hoiThoai({
    tieuDe: c.t('them'),
    moTa: HM.esc(c.t('chiKyMo')),
    than: (key
      ? '<label class="fld">' + HM.esc(c.t('cBen')) + '</label>' +
        '<input class="in" value="' + HM.esc(A.partyName(key) + ' · ' + A.partyClientId(key)) + '" disabled>' +
        '<input type="hidden" data-o="key" value="' + HM.esc(key) + '">'
      : '<label class="fld">' + (c.lang === 'vi' ? 'Chọn bên nhận' : 'Pick a payee') + '</label>' +
        '<input class="in" data-timben placeholder="' + HM.esc(c.lang === 'vi' ? 'Gõ tên label hoặc nghệ sĩ độc lập' : 'Type a label or independent artist') + '">' +
        '<input type="hidden" data-o="key" value="">' +
        '<div data-kq style="margin-top:8px;max-height:190px;overflow:auto"></div>') +
      '<div class="fldrow two-up" style="margin-top:14px">' +
        '<div><label class="fld">' + HM.esc(c.t('hoiTyLe')) + '</label>' +
        '<input class="in" data-o="rate" type="number" min="1" max="99" step="0.5" value="' + (hienTai * 100).toFixed(1) + '"></div>' +
        '<div><label class="fld">' + HM.esc(c.t('hoiTu')) + '</label>' +
        '<select class="in" data-o="from">' + kyMo.map(function (p) {
          return '<option value="' + p.k + '"' + (p.k === c.kyKey ? ' selected' : '') + '>' + HM.esc(p.label) + '</option>';
        }).join('') + '</select></div></div>' +
      '<div class="hint">' + HM.esc(c.lang === 'vi'
        ? 'Con số này là phần BÊN NHẬN giữ, tính trên doanh thu sau khi trừ phí Haustek ' + HT.fmt.pct(A.cfg.HAUSTEK_FEE) + '. Phần còn lại là của label, hoặc của Haustek nếu nghệ sĩ độc lập.'
        : 'This is the share the PAYEE keeps, of revenue after the ' + HT.fmt.pct(A.cfg.HAUSTEK_FEE) + ' Haustek fee. The rest goes to the label, or to Haustek for an independent artist.') + '</div>' +
      '<label class="fld" style="margin-top:12px">' + HM.esc(c.t('hoiGhi')) + '</label>' +
      '<input class="in" data-o="note" placeholder="' +
        HM.esc(c.lang === 'vi' ? 'VD: Phụ lục 02 hợp đồng HT-2024-118, ký 12.06.2026' : '') + '">',
    dong: c.t('them'),
    khiMo: function (bg) {
      if (key) return;
      var o = bg.querySelector('[data-timben]'), kq = bg.querySelector('[data-kq]');
      var an = bg.querySelector('[data-o=key]');
      var hen = null;
      o.addEventListener('input', function () {
        clearTimeout(hen);
        hen = setTimeout(function () {
          var s = o.value.trim().toLowerCase();
          if (s.length < 2) { kq.innerHTML = ''; return; }
          var hit = [];
          A.labels.forEach(function (l) {
            if (hit.length < 24 && (l.name.toLowerCase().indexOf(s) >= 0 || l.clientId.toLowerCase().indexOf(s) >= 0))
              hit.push({ key: l.key, ten: l.name, ma: l.clientId, loai: 'Label' });
          });
          A.artists.forEach(function (a) {
            if (hit.length < 24 && a.labelId < 0 &&
                (a.name.toLowerCase().indexOf(s) >= 0 || a.clientId.toLowerCase().indexOf(s) >= 0))
              hit.push({ key: a.key, ten: a.name, ma: a.clientId, loai: c.lang === 'vi' ? 'Độc lập' : 'Independent' });
          });
          kq.innerHTML = hit.length
            ? '<div class="bars pick">' + hit.map(function (h) {
                return '<div class="row" data-pick="' + HM.esc(h.key) + '" style="grid-template-columns:minmax(0,1fr) auto">' +
                  '<div class="nm"><b>' + HM.esc(HM.dai(h.ten, 32)) + '</b><em>' + HM.esc(h.ma) + '</em></div>' +
                  '<div class="vv" style="font-size:12px">' + HM.esc(h.loai) + '</div></div>';
              }).join('') + '</div>'
            : '<p class="hint">' + HM.esc(c.lang === 'vi'
                ? 'Không tìm thấy. Nghệ sĩ thuộc label không có dòng riêng — tìm label của họ.'
                : 'Not found. Artists under a label have no own row — search for their label.') + '</p>';
        }, 200);
      });
      kq.addEventListener('click', function (e) {
        var el = e.target.closest('[data-pick]');
        if (!el) return;
        an.value = el.getAttribute('data-pick');
        o.value = el.querySelector('b').textContent;
        kq.innerHTML = '<p class="hint pos">' + HM.esc(c.lang === 'vi' ? 'Đã chọn: ' : 'Selected: ') + HM.esc(an.value) + '</p>';
      });
    }
  }).then(function (r) {
    if (!r) return;
    if (!r.key) { c.thongBao(c.lang === 'vi' ? 'Phải chọn một bên nhận' : 'Pick a payee', 'no'); return; }
    var v = parseFloat(r.rate) / 100;
    try {
      A.rates.add(r.key, v, r.from, 'ops@haustek-group.com', r.note);
      c.thongBao((c.lang === 'vi' ? 'Đã đặt ' : 'Set ') + HT.fmt.pct(v) + (c.lang === 'vi' ? ' từ kỳ ' : ' from ') +
        A.periods[A.pIndexOf(r.from)].label, 'ok');
      HM.quenHet(); c.veLai();
    } catch (e) { c.thongBao(e.message, 'no'); }
  });
}

})();

/* ---- man/danh-muc.js ---- */
function(){
/* =====================================================================
   NỘI BỘ · DANH MỤC BẢN GHI
   ---------------------------------------------------------------------
   Năm mươi nghìn bản ghi. Màn này phải làm được đúng những gì các nền
   tảng tham chiếu làm: tìm, lọc, sắp xếp, và mở một dòng ra xem tiền của
   riêng nó đi đâu — mà không đứng hình.

   Cách làm: lọc và sắp xếp trên mảng chỉ số, chỉ dựng HTML cho đúng số
   dòng đang nhìn thấy. Dựng 50.000 dòng rồi để trình duyệt cuộn là cách
   nhanh nhất để một máy tính văn phòng treo bốn giây.
   ===================================================================== */
"use strict";
(function () {

var LOC = { tim: '', loai: '', chu: '', coTien: true, maPhu: false, sap: 'gross', huong: -1, trang: 0, co: 25 };

HT.dangKy({

  chu: {

      mo: 'Toàn bộ bản ghi Haustek đang phân phối. Bấm một dòng để xem tiền của bài đó đi đâu.',
      tong: 'Tổng bản ghi', coTien: 'Có doanh thu kỳ này', nghesi: 'Nghệ sĩ', labelKho: 'Label',
      tim: 'Tìm mã ISRC, tên bài, tên nghệ sĩ…',
      moiLoai: 'Mọi loại', moiChu: 'Mọi chủ sở hữu', thuocLabel: 'Thuộc label', docLap: 'Độc lập',
      locCoTien: 'Chỉ bài có doanh thu kỳ này', locMaPhu: 'Chỉ bài có mã ISRC thứ hai',
      cBai: 'Bản ghi', cLoai: 'Loại', cChu: 'Chủ sở hữu', cPh: 'Phát hành',
      cLuot: 'Lượt nghe', cGop: 'Doanh thu gộp', cNs: 'Về tay nghệ sĩ', cTyLe: 'Tỷ lệ',
      khong: 'Không có bản ghi nào khớp',
      khongMo: 'Thử bỏ bớt bộ lọc, hoặc tìm bằng mã ISRC.',
      ctGop: 'Doanh thu gộp kỳ này', ctChuoi: 'Tiền của bài này đi đâu',
      ctKy: 'Doanh thu 12 kỳ', ctCh: 'Theo cửa hàng', ctLt: 'Theo lãnh thổ',
      ctTt: 'Thông tin bản ghi', ctSt: 'Phần sáng tác', ctLuong: 'Theo luồng dữ liệu',
      maPhuMo: 'Bài này mang hai mã ISRC. Báo cáo về theo từng mã riêng và phải gộp lại — không gộp thì một bài hiện thành hai dòng rời rạc, và mỗi dòng chỉ có một nửa tiền. Đây là câu hỏi số 2 còn treo.',
      xuat: 'Xuất CSV', hienThi: 'Đang hiện'
    },
    en: {
      nhomDuLieu: 'Data', navDanhMuc: 'Catalogue', h1: 'Recording catalogue',
      mo: 'Every recording Haustek distributes. Open a row to see where that track’s money went.',
      tong: 'Recordings', coTien: 'Earning this period', nghesi: 'Artists', labelKho: 'Labels',
      tim: 'Search ISRC, title, artist…',
      moiLoai: 'All types', moiChu: 'All owners', thuocLabel: 'Under a label', docLap: 'Independent',
      locCoTien: 'Only tracks earning this period', locMaPhu: 'Only tracks with a second ISRC',
      cBai: 'Recording', cLoai: 'Type', cChu: 'Owner', cPh: 'Released',
      cLuot: 'Streams', cGop: 'Gross', cNs: 'To artist', cTyLe: 'Rate',
      khong: 'No recording matches',
      khongMo: 'Drop a filter, or search by ISRC.',
      ctGop: 'Gross this period', ctChuoi: 'Where this track’s money went',
      ctKy: 'Revenue, 12 periods', ctCh: 'By store', ctLt: 'By territory',
      ctTt: 'Recording details', ctSt: 'Writer split', ctLuong: 'By data feed',
      maPhuMo: 'This track carries two ISRCs. Reports arrive against each code separately and must be merged — unmerged, one track shows as two disconnected rows, each with half the money. This is open question 2.',
      xuat: 'Export CSV', hienThi: 'Showing'
    }
  },

  ve: function (root, c) {
    var A = c.A, t = c.t, pi = c.ky.idx;

    /* ---- lọc: chạy trên chỉ số, không dựng đối tượng ---- */
    var tim = LOC.tim.trim().toLowerCase();
    var idx = [];
    for (var i = 0; i < A.trackCount; i++) {
      if (LOC.loai && A.typeOf(i) !== LOC.loai) continue;
      var lb = A.labelOf(i);
      if (LOC.chu === 'label' && !lb) continue;
      if (LOC.chu === 'indie' && lb) continue;
      var g = A.grossRec(i, pi);
      if (LOC.coTien && g <= 0) continue;
      if (LOC.maPhu && !A.track(i).isrcAlt) continue;
      if (tim) {
        if (A.isrcOf(i).toLowerCase().indexOf(tim) < 0 &&
            A.titleOf(i).toLowerCase().indexOf(tim) < 0 &&
            A.artistOf(i).name.toLowerCase().indexOf(tim) < 0) continue;
      }
      idx.push(i);
    }

    /* ---- sắp xếp ---- */
    var khoa = LOC.sap, huong = LOC.huong;
    var gia = function (i) {
      if (khoa === 'gross') return A.grossRec(i, pi);
      if (khoa === 'streams') return A.streamsOf(i, pi);
      if (khoa === 'title') return A.titleOf(i);
      if (khoa === 'artist') return A.artistOf(i).name;
      if (khoa === 'isrc') return A.isrcOf(i);
      if (khoa === 'release') return A.track(i).releasePeriod;
      return 0;
    };
    idx.sort(function (a, b) {
      var x = gia(a), y = gia(b);
      if (typeof x === 'string') return x.localeCompare(y, 'vi') * huong;
      return (x - y) * huong;
    });

    var het = Math.max(0, Math.ceil(idx.length / LOC.co) - 1);
    if (LOC.trang > het) LOC.trang = het;
    var dau = LOC.trang * LOC.co;
    var trang = idx.slice(dau, dau + LOC.co);

    var tongGop = 0;
    for (var k = 0; k < idx.length; k++) tongGop += A.grossRec(idx[k], pi);

    var demCoTien = HM.nho(A, 'demCoTien:' + pi, function () {
      var n = 0;
      for (var i2 = 0; i2 < A.trackCount; i2++) if (A.grossRec(i2, pi) > 0) n++;
      return n;
    });

    var html = HM.dau({
      h1: HM.esc(t('h1')), mo: HM.esc(t('mo')),
      so: [
        { l: t('tong'), v: HT.fmt.n(A.trackCount) },
        { l: t('coTien'), v: HT.fmt.n(demCoTien) },
        { l: t('nghesi'), v: HT.fmt.n(A.counts.artists) },
        { l: t('labelKho'), v: HT.fmt.n(A.counts.labels) }
      ]
    });

    /* ---- thanh lọc ---- */
    html += '<div class="bar">' +
      '<div class="srch">' + HM.icon('tim') + '<input type="search" data-tim placeholder="' +
        HM.esc(t('tim')) + '" value="' + HM.esc(LOC.tim) + '"></div>' +
      '<select class="in" data-loai style="width:auto;height:34px">' +
        '<option value="">' + HM.esc(t('moiLoai')) + '</option>' +
        ['Single', 'EP', 'Album'].map(function (x) {
          return '<option value="' + x + '"' + (LOC.loai === x ? ' selected' : '') + '>' + x + '</option>';
        }).join('') + '</select>' +
      '<select class="in" data-chu style="width:auto;height:34px">' +
        '<option value="">' + HM.esc(t('moiChu')) + '</option>' +
        '<option value="label"' + (LOC.chu === 'label' ? ' selected' : '') + '>' + HM.esc(t('thuocLabel')) + '</option>' +
        '<option value="indie"' + (LOC.chu === 'indie' ? ' selected' : '') + '>' + HM.esc(t('docLap')) + '</option></select>' +
      '<button type="button" class="pill' + (LOC.coTien ? ' on' : '') + '" data-cotien>' + HM.esc(t('locCoTien')) + '</button>' +
      '<button type="button" class="pill' + (LOC.maPhu ? ' on' : '') + '" data-maphu>' + HM.esc(t('locMaPhu')) + '</button>' +
      '<div class="sp"></div>' +
      '<button type="button" class="btn sm" data-xuat>' + HM.icon('down2') + HM.esc(t('xuat')) + '</button>' +
      '</div>';

    /* ---- chip cho biết đang lọc gì ---- */
    var chip = [];
    if (LOC.tim) chip.push(['tim', '"' + LOC.tim + '"']);
    if (LOC.loai) chip.push(['loai', LOC.loai]);
    if (LOC.chu) chip.push(['chu', LOC.chu === 'label' ? t('thuocLabel') : t('docLap')]);
    if (LOC.coTien) chip.push(['cotien', t('locCoTien')]);
    if (LOC.maPhu) chip.push(['maphu', t('locMaPhu')]);
    if (chip.length) {
      html += '<div class="chips">' + chip.map(function (x) {
        return '<span class="chip"><b>' + HM.esc(x[1]) + '</b>' +

function moBanGhi(c, i) {
  var A = c.A, tr = A.track(i), pi = c.ky.idx;
  var g = A.grossRec(i, pi);
  var sp = A.splitRec(i, g, c.kyKey);
  var P = HB.dayMau();

  var boc = function (w, ten, n) {
    if (g <= 0) return [];
    var pt = A.splitDim(i, g, w);
    return ten.map(function (x, j) { return { ten: x, gt: Math.round(pt[j] * 100) / 100, mau: P[j % 8] }; })
      .sort(function (a, b) { return b.gt - a.gt; }).slice(0, n)
      .filter(function (x) { return x.gt > 0.004; });
  };

  var buoc = [
    { l: c.lang === 'vi' ? 'Gộp' : 'Gross', v: sp.gross, kind: 'top' },
    { l: c.lang === 'vi' ? 'Phí' : 'Fee', v: -sp.fee, kind: 'out', nt: HT.fmt.pct(A.cfg.HAUSTEK_FEE) },
    { l: tr.label ? 'Label' : 'Haustek', v: -sp.labelCut, kind: 'out',
      nt: tr.label || (c.lang === 'vi' ? 'phần giữ thêm với nghệ sĩ độc lập' : 'extra share on independents') }
  ];
  if (sp.producer > 0.004) buoc.push({ l: 'Producer', v: -sp.producer, kind: 'out', nt: HT.fmt.pct(tr.producerPts) });
  buoc.push({ l: c.lang === 'vi' ? 'Nghệ sĩ' : 'Artist', v: sp.artist, kind: 'final' });

  c.nganTruot(
    (tr.isrcAlt ? HM.ghi({ kieu: 'warn',
      tieuDe: HM.esc(c.lang === 'vi' ? 'Bài này có hai mã ISRC' : 'Two ISRCs on this track'),
      than: '<span class="mono">' + HM.esc(tr.isrc) + '</span> · <span class="mono">' + HM.esc(tr.isrcAlt) + '</span><br>' +
        HM.esc(c.t('maPhuMo')) }) : '') +
    HM.so([
      { l: c.t('ctGop'), v: c.tien2(g), lon: true },
      { l: c.lang === 'vi' ? 'Lượt nghe' : 'Streams', v: HT.fmt.n(A.streamsOf(i, pi)) }
    ]) +
    '<h4 class="sec">' + HM.esc(c.t('ctChuoi')) + '</h4>' +
    (g > 0
      ? HB.o({ loai: 'thac', cao: 190, buoc: buoc }) +
        '<div class="hint">' + HM.esc(c.lang === 'vi'
          ? 'Tỷ lệ áp cho kỳ ' + c.ky.label + ': ' + HT.fmt.pct(sp.rate) + ' — lấy từ bảng tỷ lệ có ngày hiệu lực, không phải từ một cột trên bảng nghệ sĩ.'
          : 'Rate for ' + c.ky.label + ': ' + HT.fmt.pct(sp.rate) + ' — read from the dated rate table, not a column on the artist row.') + '</div>'
      : '<p class="hint">' + HM.esc(c.lang === 'vi'
          ? 'Bài này không phát sinh doanh thu trong kỳ ' + c.ky.label + '.'
          : 'This track earned nothing in ' + c.ky.label + '.') + '</p>') +
    '<h4 class="sec">' + HM.esc(c.t('ctLuong')) + '</h4>' +
    HB.o({ loai: 'thanh', hang: A.feeds.map(function (f, fi) {
      return { ten: f.short, gt: A.grossRecByFeed(i, pi, f.id), mau: P[fi],
               phu: A.feedLoaded(pi, f.id) ? '' : (c.lang === 'vi' ? 'chưa nạp cho kỳ này' : 'not loaded') };
    }) }) +
    '<h4 class="sec">' + HM.esc(c.t('ctKy')) + '</h4>' +
    HB.o({ loai: 'cot', cao: 160, anTruc: true, chuThich: false,
      truc: A.periods.map(function (p) { return p.label.slice(0, 2); }),
      tieuDeTip: function (k) { return 'Kỳ ' + A.periods[k].label; },
      ghiChuTip: function (k) { return HT.fmt.n(A.streamsOf(i, k)) + (c.lang === 'vi' ? ' lượt nghe' : ' streams'); },
      chuoi: [{ ten: c.lang === 'vi' ? 'Doanh thu gộp' : 'Gross',
        gt: A.periods.map(function (p, k) { return A.grossRec(i, k); }) }],
      noiBat: pi }) +
    (g > 0 ? '<h4 class="sec">' + HM.esc(c.t('ctCh')) + '</h4>' +
      HB.o({ loai: 'thanh', hang: boc(A.storeW, A.stores, 8) }) +
      '<h4 class="sec">' + HM.esc(c.t('ctLt')) + '</h4>' +
      HB.o({ loai: 'thanh', hang: boc(A.territoryW, A.territories, 8) }) : '') +
    '<h4 class="sec">' + HM.esc(c.t('ctTt')) + '</h4>' +
    HM.kv([
      { t: 'ISRC', v: tr.isrc },
      tr.isrcAlt ? { t: 'ISRC (Optional 1)', v: tr.isrcAlt } : null,
      { t: 'UPC', v: tr.upc },
      { t: c.lang === 'vi' ? 'Loại' : 'Type', v: tr.type },
      { t: c.lang === 'vi' ? 'Nghệ sĩ chính' : 'Main artist', v: tr.artist + ' · ' + A.artists[tr.artistId].clientId },
      { t: c.lang === 'vi' ? 'Chủ sở hữu' : 'Owner',
        v: tr.label ? tr.label + ' · ' + A.labels[tr.labelId].clientId : (c.lang === 'vi' ? 'Nghệ sĩ độc lập' : 'Independent') },
      { t: c.lang === 'vi' ? 'Kỳ phát hành' : 'Released', v: tr.releasePeriod },
      { t: c.lang === 'vi' ? 'Điểm producer' : 'Producer points',
        v: tr.producerPts ? HT.fmt.pct(tr.producerPts) + (c.lang === 'vi' ? ' — trừ vào phần nghệ sĩ' : ' — off the artist share') : '—' }
    ]) +
    '<h4 class="sec">' + HM.esc(c.t('ctSt')) + '</h4>' +
    HM.kv([
      { t: tr.writer1, v: HT.fmt.pct(tr.writer1Share) },
      tr.writer2 ? { t: tr.writer2, v: HT.fmt.pct(1 - tr.writer1Share) } : null
    ]) +
    '<div class="hint">' + HM.esc(c.lang === 'vi'
      ? 'Tác quyền chảy theo bảng này, tách hẳn khỏi doanh thu bản ghi bên trên, và KHÔNG đi qua label.'
      : 'Publishing follows this table, entirely separate from the recording revenue above, and never passes through a label.') + '</div>',
    { tieuDe: tr.title, phu: tr.isrc + ' · ' + tr.artist,
      khiMo: function (dr) { HB.gan(dr); } });
}

})();

function chayProbe(c, root) {
  var api = HAUSTEK.api, A = c.A;
  var kyDuyet = A.periods.filter(function (p) { return A.isApproved(p.k); });
  var pk = kyDuyet.length ? kyDuyet[kyDuyet.length - 1].k : null;
  var chuaDuyet = A.periods.filter(function (p) { return !A.isApproved(p.k); })[0];

  var thu = function (ten, mong, fn) {
    var kq;
    try { var v = fn(); kq = { chan: false, mo: c.lang === 'vi' ? 'Trả về được dữ liệu' : 'Returned data', v: v }; }
    catch (e) { kq = { chan: true, mo: e.message }; }
    return { ten: ten, mongChan: mong, dat: kq.chan === mong, mo: kq.mo };
  };

  var ds = [
    thu(c.lang === 'vi' ? 'Label đọc dòng tiền tác quyền' : 'A label reads the publishing stream', true,
      function () { return api.summary('label', 0, pk, 'pub'); }),
    thu(c.lang === 'vi' ? 'Label lấy xu hướng tác quyền 12 kỳ' : 'A label pulls a 12-period publishing trend', true,
      function () { return api.trend('label', 0, 'pub'); }),
    thu(c.lang === 'vi' ? 'Label bóc tác quyền theo tổ chức' : 'A label breaks publishing down by CMO', true,
      function () { return api.breakdown('label', 0, pk, 'pub', 'src'); }),
    thu(c.lang === 'vi' ? 'Khách đọc kỳ chưa duyệt' : 'A client reads an unapproved period', true,
      function () { return api.summary('artist', 0, chuaDuyet ? chuaDuyet.k : pk, 'rec'); }),

  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        HAUSTEK.storage.importJSON(String(r.result));
        c.thongBao(c.lang === 'vi' ? 'Đã nhập trạng thái — đang nạp lại' : 'State imported — reloading', 'ok');

/* =====================================================================
   Kỳ tác quyền trống — nói cho hết câu
   ===================================================================== */
function veTacQuyenTrong(c) {
  var t = c.t, me = c.phien.me, api = c.api, P = HB.dayMau();
  var kyCo = c.phien.kyTacQuyen || [];

  var soLieu = kyCo.map(function (p) {
    try { return { k: p.k, label: p.label, v: api.summary(me.role, me.partyId, p.k, 'pub').total }; }

  }).filter(Boolean);
  var tong = soLieu.reduce(function (s, x) { return s + x.v; }, 0);

  var html = '<div class="grid g3">' +
    HM.the({
      h2: HM.esc(t('nhipTq')),
      than: '<p class="say">' + t('nhipTq1') + '</p>' +
        '<p class="say">' + t('nhipTq2') + '</p>' +
        '<p class="say">' + t('nhipTq3') + '</p>' +
        (soLieu.length
          ? '<div style="margin-top:16px">' + HB.o({
              loai: 'cot', cao: 170, hienGiaTri: true, chuThich: false,
              truc: soLieu.map(function (x) { return x.label; }),
              tieuDeTip: function (i) { return (c.lang === 'vi' ? 'Kỳ ' : 'Period ') + soLieu[i].label; },
              chuoi: [{ ten: c.lang === 'vi' ? 'Tác quyền' : 'Publishing',
                        gt: soLieu.map(function (x) { return x.v; }), mau: P[3] }]
            }) + '</div>'
          : '')
    }) +
    HM.the({
      h2: HM.esc(t('kyCoTq')), p: HM.esc(t('kyCoTqMo')),
      than: HM.so([
        { l: t('soSangTac'), v: HT.fmt.n(me.compositionCount) },
        { l: t('tongTq'), v: HT.fmt.usd0(tong) }
      ]) +
      (kyCo.length
        ? '<div class="btnrow" style="margin-top:14px">' + kyCo.slice().reverse().map(function (p) {
            return '<button type="button" class="pill" data-kyto="' + HM.esc(p.k) + '">' +
              HM.esc(p.label) + '</button>';
          }).join('') + '</div>'
        : '<p class="hint" style="margin-top:12px">' + HM.esc(c.lang === 'vi'
            ? 'Chưa kỳ nào có báo cáo tác quyền được chốt sổ.'
            : 'No period has a closed publishing report yet.') + '</p>')
    }) + '</div>';

  return html;
}

/* =====================================================================
   Thẻ "khi nào tiền vào tài khoản"
   ===================================================================== */
function veKhiNao(c, s) {
  var t = c.t, P = HB.dayMau();
  var p = s.payout;
  var than = '';

  if (!p) {
    than = '<p class="say">' + HM.esc(c.lang === 'vi'
      ? 'Kỳ này chưa có bảng chi trả.'
      : 'No payout record for this period.') + '</p>';
  } else if (p.payable > 0) {
    than = HM.so([{ l: t('seChi'), v: HT.fmt.usd(p.payable), lon: true, mau: HB.mau('ok') }]) +
      '<p class="say" style="margin-top:12px">' + HM.esc(c.lang === 'vi'
        ? 'Khoản này sẽ được chuyển trong kỳ chi trả tới.'
        : 'This will be transferred in the next payout run.') + '</p>';
  } else if (p.carryOut > 0) {
    than = HM.so([{ l: t('duoiNguong'), v: HT.fmt.usd(p.carryOut), lon: true, mau: HB.mau('warn') }]) +
      '<p class="say" style="margin-top:12px">' +
      HM.esc(t('duoiNguongMo').replace('{n}', HT.fmt.usd0(p.threshold))) + '</p>' +
      '<div class="meter" style="margin-top:10px"><i style="width:' +
        Math.min(100, p.carryOut / p.threshold * 100).toFixed(1) + '%;background:' + P[4] + '"></i></div>' +
      '<div class="hint">' + HM.esc(HT.fmt.usd(p.carryOut) + ' / ' + HT.fmt.usd0(p.threshold)) + '</div>';
  } else {
    than = '<p class="say">' + HM.esc(c.lang === 'vi'
      ? 'Kỳ này toàn bộ phần bạn kiếm được đi trừ vào khoản tạm ứng, nên chưa có khoản chuyển đi.'
      : 'Everything you earned this period went against your advance, so there is no transfer.') + '</p>';
  }

  if (p && p.coversBothStreams) {
    than += '<div class="hint" style="margin-top:10px">' + HM.esc(c.lang === 'vi'
      ? 'Con số chi trả này tính trên CẢ doanh thu bản ghi lẫn tác quyền cộng lại — không chỉ dòng tiền bạn đang xem. Tổng kiếm được cả hai dòng kỳ này: ' + HT.fmt.usd(p.earnedAllStreams) + '.'
      : 'This payout covers BOTH recording and publishing combined, not just the stream you are viewing. Total earned across both: ' + HT.fmt.usd(p.earnedAllStreams) + '.') + '</div>';
  }
  if (p && p.carryIn > 0) {
    than += '<div class="hint">' + HM.esc(c.lang === 'vi'
      ? 'Đã cộng ' + HT.fmt.usd(p.carryIn) + ' dồn từ kỳ trước.'
      : HT.fmt.usd(p.carryIn) + ' carried in from the previous period is included.') + '</div>';
  }

  /* Lịch sử chi trả vài kỳ gần nhất. Thẻ này nếu chỉ có một con số thì
     bỏ trống hơn nửa chiều cao, mà câu hỏi "kỳ trước tôi được bao nhiêu"
     là câu hỏi ngay sau đó — trả lời luôn ở đây thay vì bắt đi tìm. */
  var gan = c.kys.slice(-4).reverse().map(function (kp) {
    try {
      var x = c.api.summary(c.phien.me.role, c.phien.me.partyId, kp.k, 'rec');
      return { k: kp.k, label: kp.label, p: x.payout };
    } catch (e) { return null; }
  }).filter(function (x) { return x && x.p; });

  if (gan.length) {
    than += '<h4 class="sec">' + HM.esc(t('lichChi')) + '</h4>' +
      '<div class="tw"><table class="t" style="min-width:0"><thead><tr>' +
      '<th>' + HM.esc(t('kyChi')) + '</th><th class="num">' + HM.esc(t('soChi')) + '</th>' +
      '</tr></thead><tbody>' + gan.map(function (x) {
        return '<tr' + (x.k === c.kyKey ? ' style="box-shadow:inset 3px 0 0 var(--accent)"' : '') + '>' +
          '<td class="mono">' + HM.esc(x.label) + '</td>' +
          '<td class="num">' + (x.p.payable > 0
            ? HM.esc(HT.fmt.usd(x.p.payable))
            : '<span class="muted">' + HM.esc(x.p.carryOut > 0 ? t('donTiep') : t('truUng')) + '</span>') +
          '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  than += '<h4 class="sec">' + HM.esc(t('nguongLa').replace('{n}',
      HT.fmt.usd0(p ? p.threshold : 50))) + '</h4>' +
    '<p class="say" style="font-size:12.5px">' + HM.esc(t('nguongLaMo')) + '</p>' +
    '<div class="btnrow" style="margin-top:12px">' +
    '<button type="button" class="btn sm" data-di="k-bang-ke">' + HM.esc(t('xemBangKe')) + '</button></div>';

  if (s.advance) {
    than += '<h4 class="sec">' + HM.esc(t('tamUng')) + '</h4>' +
      HM.kv([
        { t: c.lang === 'vi' ? 'Đã ứng' : 'Advanced', v: HT.fmt.usd0(s.advance.opening) },
        { t: c.lang === 'vi' ? 'Trừ kỳ này' : 'Recouped this period', v: HT.fmt.usd(s.advance.recoupedThisPeriod) },
        { t: c.lang === 'vi' ? 'Còn lại' : 'Left', v: HT.fmt.usd(s.advance.left), manh: true }
      ]) +
      '<div class="meter" style="margin-top:8px"><i style="width:' +
      Math.max(0, Math.min(100, (1 - s.advance.left / Math.max(s.advance.opening, 1)) * 100)).toFixed(1) +
      '%;background:' + P[6] + '"></i></div>' +
      '<div class="btnrow" style="margin-top:12px">' +
      '<button type="button" class="btn sm" data-di="k-tam-ung">' + HM.esc(t('xemUng')) + '</button></div>';
  }

  return HM.the({ h2: HM.esc(t('chiTra')), than: than });
}

/* =====================================================================
   Ngăn trượt — một bài
   ===================================================================== */
function moBai(c, id, luong) {
  var api = c.api, me = c.phien.me, P = HB.dayMau();
  var d;
  try { d = api.trackDetail(me.role, me.partyId, c.kyKey, luong, id); }
  catch (e) { c.thongBao(e.message, 'no'); return; }

  c.nganTruot(
    HM.so([
      { l: c.lang === 'vi' ? 'Về tay bạn' : 'Yours', v: HT.fmt.usd(d.mine), lon: true },
      d.streams != null ? { l: c.lang === 'vi' ? 'Lượt nghe' : 'Streams', v: HT.fmt.n(d.streams) } : null
    ].filter(Boolean)) +
    '<h4 class="sec">' + (c.lang === 'vi' ? 'Tiền của bài này' : 'This track’s money') + '</h4>' +
    '<div class="wf">' + d.steps.map(function (st) {
      return '<div class="st ' + (st.strong ? 'fin' : (st.value != null && st.value < 0 ? 'out' : '')) + '">' +
        '<div class="mk"></div><div><div class="lbl">' + HM.esc(st.label) + '</div></div>' +
        '<div class="amt">' + HM.esc(st.value != null ? HT.fmt.usd(st.value) : st.text) + '</div></div>';
    }).join('') + '</div>' +
    (d.byStore.length ? '<h4 class="sec">' + (c.lang === 'vi' ? 'Nghe ở đâu' : 'Where it was played') + '</h4>' +
      HB.o({ loai: 'thanh', hang: d.byStore.map(function (x, i) { return { ten: x.name, gt: x.value, mau: P[i % 8] }; }) }) : '') +
    (d.byTerritory.length ? '<h4 class="sec">' + (c.lang === 'vi' ? 'Từ nước nào' : 'From where') + '</h4>' +
      HB.o({ loai: 'thanh', hang: d.byTerritory.map(function (x, i) { return { ten: x.name, gt: x.value, mau: P[i % 8] }; }) }) : ''),
    { tieuDe: d.title, phu: d.isrc + ' · ' + d.type,
      khiMo: function (dr) { HB.gan(dr); } });
}

})();

        kq.rows.map(function (r) {
          return [r.isrc, r.title, r.type, r.artist, r.streams == null ? '' : r.streams,
                  r.gross.toFixed(2), r.mine.toFixed(2)];
        }));
    });

    var s;

      root.innerHTML = HM.dau({ h1: HM.esc(t('h1')) }) +

          Math.min(100, pc * 100).toFixed(1) + '%;background:' + P[6] + '"></i></div>' +

      }) + '</div>';

    html += HM.the({
      h2: HM.esc(t('lichSu')),
      thoBody: true,
      than: coTru.length
        ? '<div class="tw"><table class="t" style="min-width:0"><thead><tr>' +
          '<th>' + HM.esc(t('cKy')) + '</th>' +
          '<th class="num">' + HM.esc(t('cTru')) + '</th>' +
          '<th class="num">' + HM.esc(t('cCon')) + '</th>' +

        : HM.trong({ icon: 'clock', tieuDe: t('chuaTru'), moTa: t('chuaTruMo') })

    html += veGiaiThich(c);

      dap5: 'Not quite. It is before tax and before transfer fees. The difference is itemised on each transfer voucher.',
      hoi6: 'I see a track that is not mine, or one of mine is missing?',
      dap6: 'Send that track’s ISRC with your client ID to ops@haustek-group.com. This is a catalogue matching error and it is fixable — but the ISRC is essential, because titles repeat constantly.',
      hoi7: 'Why is the most recent period not open?',
      dap7: 'A period opens only when all three revenue sources have arrived and the system total matches the source files to the cent. Opening a period that is missing a source hands you an incomplete figure that looks complete.',
      lienHe: 'Need help',
      lienHeMo: 'Include these three and the exact row is found in minutes: your client ID, the reporting period, and the ISRC of the track in question.'
    }
  },

  ve: function (root, c) {
    var api = c.api, me = c.phien.me, t = c.t;

    var html = HM.dau({
      h1: HM.esc(t('h1')), mo: HM.esc(t('mo')),
      so: [
        { l: t('tBk'), v: HT.fmt.n(c.kys.length) },
        { l: c.lang === 'vi' ? 'Mã khách hàng' : 'Client ID', v: me.clientId }
      ]
    });

    html += HM.tabs([
      { k: 'bangke', l: t('tBk'), icon: 'file', dem: c.kys.length },
      { k: 'hopdong', l: t('tHd'), icon: 'book' },
      { k: 'cauhoi', l: t('tCh'), icon: 'ask' }
    ], TAB);

    if (TAB === 'bangke') html += veBangKe(c);
    if (TAB === 'hopdong') html += veHopDong(c);
    if (TAB === 'cauhoi') html += veCauHoi(c);

    root.innerHTML = html;
    HB.gan(root);

    HM.bam(root, '[data-tab]', function (el) { TAB = el.getAttribute('data-tab'); c.veLai(); });
    HM.bam(root, '[data-mo]', function (el) { c.doiKy(el.getAttribute('data-mo')); c.di('k-bang-ke'); });
    HM.bam(root, '[data-tai]', function (el) { taiMotKy(c, el.getAttribute('data-tai')); });
    HM.bam(root, '[data-taihet]', function () { taiTatCa(c); });
    HM.bam(root, '[data-di]', function (el) { c.di(el.getAttribute('data-di')); });
  }
});

/* =====================================================================
   TAB 1 — BẢNG KÊ CÁC KỲ
   ===================================================================== */
function veBangKe(c) {
  var api = c.api, me = c.phien.me, t = c.t;

  if (!c.kys.length) {
    return HM.the({ than: HM.trong({ icon: 'file', tieuDe: t('chuaCo'), moTa: t('chuaCoMo') }) }) + veCho(c);
  }

  var ds = c.kys.map(function (p) {
    var o = { k: p.k, label: p.label, tong: null, chi: null, chot: null };
    try {
      var s = api.summary(me.role, me.partyId, p.k, 'rec');
      o.tong = s.total; o.chot = s.approvedAt;
      o.chi = s.payout ? s.payout.payable : null;
      if (me.hasPublishing) {
        try { var q = api.summary(me.role, me.partyId, p.k, 'pub'); o.tong += q.total; } catch (e) {}
      }
    } catch (e) {}
    return o;
  }).reverse();

  return HM.the({
    h2: HM.esc(t('tBk')),
    p: c.lang === 'vi'
      ? 'Mỗi kỳ đã chốt sổ có một bảng kê. Con số trong đó là con số đã dùng để chuyển tiền, không tính lại theo tỷ giá hôm nay.'
      : 'Every closed period has a statement. Its figures are the ones money moved on, not recomputed at today’s rate.',
    hanhDong: '<button type="button" class="btn sm pri" data-taihet>' + HM.icon('down2') + HM.esc(t('taiHet')) + '</button>',
    thoBody: true,
    than: '<div class="tw"><table class="t"><thead><tr>' +
      '<th>' + HM.esc(t('cKy')) + '</th>' +
      '<th>' + HM.esc(t('cChot')) + '</th>' +
      '<th class="num">' + HM.esc(t('cVe')) + '</th>' +
      '<th class="num">' + HM.esc(t('cChi')) + '</th>' +
      '<th style="width:180px"></th></tr></thead><tbody>' +
      ds.map(function (r) {
        return '<tr' + (r.k === c.kyKey ? ' style="box-shadow:inset 3px 0 0 var(--accent)"' : '') + '>' +
          '<td><div class="t-ttl">' + HM.esc(r.label) + '</div></td>' +
          '<td class="mono muted">' + HM.esc(HT.fmt.ngay(r.chot)) + '</td>' +
          '<td class="num">' + (r.tong != null ? HM.esc(HT.fmt.usd(r.tong)) : '<span class="nil">—</span>') + '</td>' +
          '<td class="num">' + (r.chi != null && r.chi > 0
            ? HM.esc(HT.fmt.usd(r.chi))
            : '<span class="muted">' + HM.esc(c.lang === 'vi' ? 'dồn tiếp' : 'carried') + '</span>') + '</td>' +
          '<td><div class="btnrow">' +
            '<button type="button" class="btn sm" data-mo="' + HM.esc(r.k) + '">' + HM.esc(t('xem')) + '</button>' +
            '<button type="button" class="btn sm ghost" data-tai="' + HM.esc(r.k) + '">' + HM.icon('down2') + '</button>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table></div>'
  }) + veCho(c);
}

function veCho(c) {
  var cho = c.phien.cho || [];
  if (!cho.length) return '';
  return HM.the({
    dai: { kieu: 'info', icon: 'clock', chu: HM.esc(c.t('choKy')) },
    h2: HM.esc(c.t('choKy')),
    p: HM.esc(c.t('choKyMo')),
    than: '<div class="btnrow">' + cho.map(function (p) {
      return '<span class="chip q">' + HM.esc(p.label) + '</span>';
    }).join('') + '</div>' +
      '<p class="hint" style="margin-top:12px">' + HM.esc(c.lang === 'vi'
        ? 'Một kỳ chỉ mở khi cả ba nguồn dữ liệu doanh thu đã về đủ và tổng hệ thống khớp tổng trên file gốc tới từng xu.'
        : 'A period opens only when all three revenue sources have arrived and the system total matches the source files to the cent.') + '</p>'
  });
}

/* =====================================================================
   TAB 2 — HỢP ĐỒNG & CHỨNG TỪ  (ô trống có nói lý do)
   ===================================================================== */
function veHopDong(c) {
  var t = c.t, me = c.phien.me;
  return HM.the({
    than: HM.trong({ icon: 'book', tieuDe: t('hdTrong'), moTa: t('hdTrongMo') })
  }) +
  HM.the({
    h2: c.lang === 'vi' ? 'Những gì sẽ có ở đây' : 'What will live here',
    p: c.lang === 'vi'
      ? 'Danh sách này viết ra để bạn biết cổng còn thiếu gì, chứ không phải để hứa.'
      : 'This list is here so you know what the portal is still missing — not as a promise.',
    than: [
      [c.lang === 'vi' ? 'Hợp đồng phân phối và các phụ lục' : 'The distribution agreement and its annexes',
       c.lang === 'vi' ? 'Kèm ngày ký, để đối chiếu với tỷ lệ chia đang áp cho từng kỳ.'
                       : 'With signature dates, to check against the split rate applied in each period.'],
      [c.lang === 'vi' ? 'Chứng từ mỗi lần chuyển tiền' : 'A voucher for each transfer',
       c.lang === 'vi' ? 'Số tiền trước thuế, phần khấu trừ, phí chuyển khoản, và số thực nhận.'
                       : 'Amount before tax, withholding, transfer fee, and what actually landed.'],
      [c.lang === 'vi' ? 'Chứng từ khấu trừ thuế' : 'Tax withholding certificates',
       c.lang === 'vi' ? 'Thứ bạn cần khi quyết toán thuế thu nhập cá nhân.'
                       : 'What you need when filing personal income tax.'],
      [c.lang === 'vi' ? 'Giấy xác nhận khoản tạm ứng' : 'Advance acknowledgements',
       c.lang === 'vi' ? 'Số đã ứng, ngày ứng, và tiến độ trừ.' : 'Amount advanced, date, and recoupment progress.']
    ].map(function (x) {
      return '<div class="stat" style="align-items:flex-start"><b style="max-width:none">' + HM.esc(x[0]) +
        '<p>' + HM.esc(x[1]) + '</p></b>' +
        '<span class="v"><span class="tag warn">' + HM.esc(c.lang === 'vi' ? 'chưa có' : 'not yet') + '</span></span></div>';
    }).join(''),
    chan: HM.esc(c.lang === 'vi'
      ? 'Cần một bản ngay bây giờ: gửi mã khách hàng ' + me.clientId + ' về ops@haustek-group.com.'
      : 'Need a copy now: send client ID ' + me.clientId + ' to ops@haustek-group.com.')
  });
}

/* =====================================================================
   TAB 3 — CÂU HỎI THƯỜNG GẶP
   ===================================================================== */
function veCauHoi(c) {
  var t = c.t, me = c.phien.me;
  var hoi = [];
  for (var i = 1; i <= 7; i++) hoi.push([t('hoi' + i), t('dap' + i)]);

  return hoi.map(function (h, i) {
    return HM.the({
      h2: (i + 1) + '. ' + HM.esc(h[0]),
      than: '<p class="say">' + HM.esc(h[1]) + '</p>' +
        (i === 1 ? '<div class="btnrow" style="margin-top:12px">' +
          '<button type="button" class="btn sm" data-di="k-ban-ghi">' +
          HM.esc(c.lang === 'vi' ? 'Mở một bài xem chi tiết' : 'Open a track') + '</button></div>' : '') +
        (i === 3 ? '<div class="btnrow" style="margin-top:12px">' +
          '<button type="button" class="btn sm" data-di="k-tam-ung">' +
          HM.esc(c.lang === 'vi' ? 'Xem trang tạm ứng' : 'Open the advance page') + '</button></div>' : '')
    });
  }).join('') +
  HM.the({
    dai: { kieu: 'info', icon: 'info', chu: HM.esc(t('lienHe')) },
    h2: HM.esc(t('lienHe')),
    than: '<p class="say">' + HM.esc(t('lienHeMo')) + '</p>' +
      HM.kv([
        { t: c.lang === 'vi' ? 'Mã khách hàng của bạn' : 'Your client ID', v: me.clientId, manh: true },
        { t: c.lang === 'vi' ? 'Kỳ đang xem' : 'Period in view', v: c.ky ? c.ky.label : '—' },
        { t: 'Email', v: 'ops@haustek-group.com' }
      ])
  });
}

/* =====================================================================
   TẢI VỀ
   ===================================================================== */
function taiMotKy(c, pk) {
  var api = c.api, me = c.phien.me;
  var p = c.kys.filter(function (x) { return x.k === pk; })[0];
  try {
    var s = api.summary(me.role, me.partyId, pk, 'rec');
    var d = s.chain.map(function (b) {
      return [me.clientId, me.name, p.label, s.approvedAt, s.fx.rate,
              'Doanh thu bản ghi', b.label, b.value.toFixed(2), Math.round(b.value * s.fx.rate), b.note || ''];
    });
    if (me.hasPublishing) {
      try {
        var q = api.summary(me.role, me.partyId, pk, 'pub');
        q.chain.forEach(function (b) {
          d.push([me.clientId, me.name, p.label, q.approvedAt, q.fx.rate,
                  'Tác quyền', b.label, b.value.toFixed(2), Math.round(b.value * q.fx.rate), b.note || '']);
        });
      } catch (e) {}
    }
    if (s.payout) {
      d.push([me.clientId, me.name, p.label, s.approvedAt, s.fx.rate, 'Chi trả', 'Dồn từ kỳ trước',
              s.payout.carryIn.toFixed(2), Math.round(s.payout.carryIn * s.fx.rate), '']);
      d.push([me.clientId, me.name, p.label, s.approvedAt, s.fx.rate, 'Chi trả', 'Số thực chi',
              s.payout.payable.toFixed(2), Math.round(s.payout.payable * s.fx.rate), s.payout.note || '']);
      d.push([me.clientId, me.name, p.label, s.approvedAt, s.fx.rate, 'Chi trả', 'Dồn sang kỳ sau',
              s.payout.carryOut.toFixed(2), Math.round(s.payout.carryOut * s.fx.rate), '']);
    }
    HM.csv('bang-ke-' + me.clientId + '-' + pk + '.csv',
      ['Mã khách hàng', 'Bên nhận', 'Kỳ', 'Chốt sổ', 'Tỷ giá', 'Dòng tiền', 'Khoản mục', 'Số tiền USD', 'Quy đổi VND', 'Ghi chú'], d);
  } catch (e) { c.thongBao(e.message, 'no'); }
}

function taiTatCa(c) {
  var api = c.api, me = c.phien.me;
  var d = [];
  c.kys.forEach(function (p) {
    try {
      var s = api.summary(me.role, me.partyId, p.k, 'rec');
      var pub = 0;
      if (me.hasPublishing) { try { pub = api.summary(me.role, me.partyId, p.k, 'pub').total; } catch (e) {} }
      d.push([me.clientId, me.name, p.label, s.approvedAt, s.fx.rate,
              s.gross.toFixed(2), s.total.toFixed(2), pub.toFixed(2),
              (s.total + pub).toFixed(2),
              s.payout ? s.payout.carryIn.toFixed(2) : '',
              s.advance ? s.advance.recoupedThisPeriod.toFixed(2) : '',
              s.payout ? s.payout.payable.toFixed(2) : '',
              s.payout ? s.payout.carryOut.toFixed(2) : '',
              s.streams == null ? '' : s.streams, s.tracks]);
    } catch (e) {}
  });
  HM.csv('bang-ke-tat-ca-ky-' + me.clientId + '.csv',
    ['Mã khách hàng', 'Bên nhận', 'Kỳ', 'Chốt sổ', 'Tỷ giá', 'Doanh thu gộp bản ghi',
     'Về tay bạn (bản ghi)', 'Tác quyền', 'Cộng phát sinh', 'Dồn từ kỳ trước',
     'Trừ tạm ứng', 'Số thực chi', 'Dồn sang kỳ sau', 'Lượt nghe', 'Số bài'], d);
}

})();

}
];
</script>

<script>
"use strict";
(function () {

/* Bản gói một trang chạy trong khung cách ly của trình xem: tải file bị
   chặn. Bật cờ để nút Xuất CSV nói thật thay vì im lặng. */
window.HAUSTEK_XEM_ONLINE = true;

var K_CUA = 'haustek.cua', K_TK = 'haustek.demo.tk';
function lay(k, mac) { try { return localStorage.getItem(k) || mac; } catch (e) { return mac; } }
function dat(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

var cua = lay(K_CUA, 'noi-bo');

function oChonCua(lang, phu) {
  return '<div class="cua-chon"><div class="seg" data-cua>' +
    '<button type="button" data-c2="noi-bo"' + (cua === 'noi-bo' ? ' class="on"' : '') + '>' +
      (lang === 'vi' ? 'Nội bộ' : 'Internal') + '</button>' +
    '<button type="button" data-c2="khach"' + (cua === 'khach' ? ' class="on"' : '') + '>' +
      (lang === 'vi' ? 'Cổng khách' : 'Client') + '</button></div>' +
    (phu || '') + '</div>';
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-c2]');
  if (!b) return;
  dat(K_CUA, b.getAttribute('data-c2'));
  location.hash = '';
  location.reload();
});

if (cua === 'khach') {
  /* Khoá cửa TRƯỚC khi màn hình nào chạy — y như khach.html. */
  HAUSTEK.lockdown();
  MAN_KHACH.forEach(function (f) { f(); });

  var api = HAUSTEK.api;
  var TK = api.demoLogins().accounts.filter(function (a) { return a.status === 'active'; });
  var i0 = 0;
  try { var v = +localStorage.getItem(K_TK); if (v >= 0 && v < TK.length) i0 = v; } catch (e) {}
  var toi = TK[i0];

  function nạpPhien() {
    var s = api.session(toi.role, toi.partyId);
    var p = api.periods(toi.role, toi.partyId);
    return { me: s, kys: p.open, cho: p.waiting, kyTacQuyen: p.pubOpen, moiNhat: p.latest };
  }
  var PHIEN = nạpPhien();

  HT.chay({
    ten: 'portal', api: api, phien: PHIEN, coTienTe: false,
    kyDanhSach: function () { return PHIEN.kys.map(function (p) { return { k: p.k, label: p.label }; }); },
    kyMacDinh: PHIEN.moiNhat,
    ghiChu: function () { return PHIEN.me.clientId; },
    chanTrai: function (c) {
      var opts = TK.map(function (a, i) {
        return '<option value="' + i + '"' + (a === toi ? ' selected' : '') + '>' + HT.esc(a.name) + '</option>';
      }).join('');
      return '<b>' + HT.esc(PHIEN.me.name) + '</b><span>' + HT.esc(toi.role === 'label' ? 'Label'
          : (PHIEN.me.independent ? (c.lang === 'vi' ? 'Nghệ sĩ độc lập' : 'Independent artist')
                                  : (c.lang === 'vi' ? 'Nghệ sĩ' : 'Artist'))) + '</span>' +
        '<select class="inline-sel" data-ai style="margin-top:9px;width:100%">' + opts + '</select>' +
        oChonCua(c.lang, '<p>' + HT.esc(c.lang === 'vi'
          ? 'Bản mẫu: đổi tài khoản hoặc đổi cửa để xem góc nhìn khác. Hệ thật không có hai ô này.'
          : 'Prototype: switch account or door to see another view. The real system has neither control.') + '</p>');
    }
  });

  document.addEventListener('change', function (e) {
    var s = e.target.closest('[data-ai]');
    if (!s) return;
    dat(K_TK, s.value);
    location.hash = '#k-tong-quan';
    location.reload();
  });

} else {
  MAN_NOIBO.forEach(function (f) { f(); });
  var A = HAUSTEK.admin;
  A.provideSecrets({
    code: 'DIST-1',
    name: 'Đối tác phân phối chính (tên thật điền khi triển khai)',
    grossRate: 0.86,
    contact: 'nội bộ · không hiển thị cho khách'
  });
  HT.setFx(A.fx.get().rate);

  HT.chay({
    ten: 'internal', A: A,
    kyDanhSach: function () {
      return A.periods.map(function (p) {
        return { k: p.k, label: p.label, idx: p.idx, nhan: A.isApproved(p.k) ? 'đã duyệt' : 'chưa duyệt' };
      });
    },
    kyMacDinh: A.periods[A.periods.length - 1].k,
    ghiChu: function (c) {
      var f = A.fx.get();
      return '1 USD = ' + HT.fmt.n(f.locked[c.kyKey] ? f.locked[c.kyKey].rate : f.rate) + ' ₫' +
        (f.locked[c.kyKey] ? '' : ' · chưa chốt');
    },
    chanTrai: function (c) {
      return '<b>ops@haustek-group.com</b><span>' +
        HT.esc(c.lang === 'vi' ? 'Tài khoản vận hành' : 'Operations account') + '</span>' +
        oChonCua(c.lang, '<p>' + HT.esc(c.lang === 'vi'
          ? 'Duyệt một kỳ ở đây rồi đổi sang cổng khách: kỳ đó hiện ra bên ấy.'
          : 'Approve a period here, then switch to the client portal: it appears there.') + '</p>');
    }
  });
}

})();
