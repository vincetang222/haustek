function napPub(c, pi) {
  var A = c.A, p = A.periods[pi];

    tieuDe: (c.lang === 'vi' ? 'Nạp báo cáo tác quyền · ' : 'Load publishing report · ') + p.label,

      ? HM.esc(c.lang === 'vi' ? 'Cuối quý ' + p.quarter + '/' + p.year + ' — đúng kỳ chốt tác quyền.'
                               : 'End of Q' + p.quarter + ' ' + p.year + ' — the correct publishing period.')
      : '<span class="neg">' + HM.esc(c.lang === 'vi'

        : 'Month ' + p.month + ' is not a quarter end. Publishing settles quarterly — loading a quarterly report here puts a whole quarter of money in the wrong period, and nobody notices because the figure still "exists".') + '</span>',
    than: '<label class="fld">' + (c.lang === 'vi' ? 'Tên file' : 'File name') + '</label>' +
      '<input class="in" data-o="file" value="vcpmc-quy' + p.quarter + '-' + p.year + '.xlsx">' +
      (cuoiQuy ? '' : '<label class="opt" style="margin-top:12px"><input type="checkbox" data-buoc>' +
        '<div><b>' + (c.lang === 'vi' ? 'Vẫn nạp vào kỳ này' : 'Load into this period anyway') + '</b>' +
        '<span>' + (c.lang === 'vi' ? 'Chỉ chọn khi biết chắc báo cáo này thật sự thuộc tháng ' + p.month + '.'
                                    : 'Only if this report genuinely belongs to month ' + p.month + '.') + '</span></div></label>'),
    dong: c.t('nap'),
    khiMo: function (bg) {
      var nut = bg.querySelector('[data-act=ok]'), cb = bg.querySelector('[data-buoc]');
      if (!cuoiQuy && cb) { nut.disabled = true; cb.addEventListener('change', function () { nut.disabled = !cb.checked; }); }
    }
  }).then(function (r) {
    if (!r) return;
    try {
      A.ingest.loadPub(pi, { file: r.file, force: !cuoiQuy });
      c.thongBao((c.lang === 'vi' ? 'Đã nạp tác quyền quý ' : 'Publishing loaded, Q') + p.quarter + '/' + p.year, 'ok');
      HM.quenHet(); c.veLai();
    } catch (e) { c.thongBao(e.message, 'no'); }
  });
}

function goPub(c, pi) {

  c.xacNhan((c.lang === 'vi' ? 'Gỡ báo cáo tác quyền · ' : 'Unload publishing · ') + p.label,

    c.t('go'), true).then(function (ok) {
      if (!ok) return;
      try { A.ingest.unloadPub(pi); c.thongBao(c.lang === 'vi' ? 'Đã gỡ' : 'Unloaded'); HM.quenHet(); c.veLai(); }
      catch (e) { c.thongBao(e.message, 'no'); }
    });
}

})();

    var ds = loc(A, c);
    if (DANG_CHON && !ds.some(function (q) { return q.id === DANG_CHON; })) DANG_CHON = null;
    if (!DANG_CHON && ds.length) DANG_CHON = ds[0].id;

    var html = HM.dau({
      h1: HM.esc(t('h1')), mo: HM.esc(t('mo')),
      so: [
        { l: t('treo'), v: HT.fmt.n(cho.length) },
        { l: t('tienTreo'), v: c.tien(A.queue.pendingTotal()) },
        { l: c.ky.label + ' · ' + t('pct'), v: HT.fmt.pct(tyLe, 2),
          mau: tyLe > A.cfg.BLACKBOX_CAP ? HB.mau('danger') : '' }
      ]
    });

    if (tyLe > A.cfg.BLACKBOX_CAP) {
      html += HM.ghi({ kieu: 'no',
        tieuDe: HM.esc(c.lang === 'vi'
          ? 'Tiền treo của kỳ ' + c.ky.label + ' vượt ngưỡng ' + HT.fmt.pct(A.cfg.BLACKBOX_CAP, 1)
          : 'Held money in ' + c.ky.label + ' exceeds the ' + HT.fmt.pct(A.cfg.BLACKBOX_CAP, 1) + ' threshold'),
        than: HM.esc(c.lang === 'vi'
          ? 'Kỳ này không duyệt được cho tới khi phần treo giảm xuống dưới ngưỡng. Đây là chặn cứng, không phải lời nhắc.'
          : 'The period cannot be approved until the held amount drops below the threshold. This is a hard block, not a reminder.') });
    }

    /* ---- thanh lọc ---- */
    html += '<div class="bar">' +
      '<div class="srch">' + HM.icon('tim') +
        '<input type="search" data-q placeholder="' + HM.esc(t('tim')) + '" value="' + HM.esc(LOC.q) + '"></div>' +
      '<select class="in" data-f="ky" style="width:auto;height:34px">' +
        '<option value="">' + HM.esc(t('tatCaKy')) + '</option>' +
        '<option value="ky-nay"' + (LOC.ky === 'ky-nay' ? ' selected' : '') + '>' + HM.esc(t('kyNay')) + ' · ' + HM.esc(c.ky.label) + '</option>' +
        A.periods.slice().reverse().map(function (p) {
          return '<option value="' + p.k + '"' + (LOC.ky === p.k ? ' selected' : '') + '>' + HM.esc(p.label) + '</option>';
        }).join('') + '</select>' +
      '<select class="in" data-f="luong" style="width:auto;height:34px">' +
        '<option value="">' + HM.esc(t('moiLuong')) + '</option>' +
        A.feeds.map(function (f) {
          return '<option value="' + f.id + '"' + (LOC.luong === String(f.id) ? ' selected' : '') + '>' + HM.esc(f.short) + '</option>';
        }).join('') + '</select>' +
      ['pending', 'matched', 'parked', ''].map(function (s) {
        var nhan = s === 'pending' ? t('treo') : s === 'matched' ? t('daKhop') : s === 'parked' ? t('deLai') : (c.lang === 'vi' ? 'Tất cả' : 'All');
        var dem = s ? het.filter(function (q) { return q.status === s; }).length : het.length;
        return '<button type="button" class="pill' + (LOC.trangThai === s ? ' on' : '') + '" data-tt="' + s + '">' +
          HM.esc(nhan) + ' <b>' + dem + '</b></button>';
      }).join('') +
      '<div class="sp"></div>' +
      '<button type="button" class="btn sm" data-xuat>' + HM.icon('down2') + HM.esc(t('xuat')) + '</button>' +
      '</div>';

    /* ---- hai cột ---- */
    html += '<div class="two">' +
      HM.the({ thoBody: true, than: '<div data-bang></div>' }) +
      '<div data-ct></div>' + '</div>';

    root.innerHTML = html;

    /* ---- bảng bên trái ---- */
    var host = root.querySelector('[data-bang]');
    var b = c.bang({
      host: host, dong: function () { return ds; }, sort: 'amount', dir: -1, co: 12,
      /* Cột hẹp: bảng này nằm ở nửa trái của khung hai cột, nên bốn cột
         đầy đủ là đẩy cột tiền ra ngoài tầm nhìn — mà cột tiền mới là
         thứ người ta nhìn để quyết định xử dòng nào trước. Dồn luồng và
         trạng thái xuống dòng phụ. */
      cot: [
        { k: 'isrc', l: t('cot_ma'), w: '160px' },
        { k: 'title', l: t('cot_bai') },
        { k: 'amount', l: t('cot_tien'), num: true, w: '118px' }
      ],
      veDong: function (q) {
        return '<td' + (q.id === DANG_CHON ? ' class="band"' : '') + '>' +
            (q.isrc ? '<span class="mono">' + HM.esc(q.isrc) + '</span>'
                    : '<span class="nil">' + HM.esc(c.lang === 'vi' ? 'thiếu mã' : 'no code') + '</span>') +
            '<div class="t-sub">' + HM.esc(A.periods[A.pIndexOf(q.periodKey)].label) + ' · ' +
            HM.esc(A.feeds[q.feedId].short) + '</div></td>' +
          '<td><div class="t-ttl">' + HM.esc(HM.dai(q.title, 26)) + '</div>' +
            '<div class="t-sub">' + HM.esc(HM.dai(q.artist, 22)) + ' · ' +
            (q.status === 'pending' ? HM.esc(c.lang === 'vi' ? 'treo' : 'held')
              : q.status === 'matched' ? '<span class="pos">' + HM.esc(t('daKhop')) + '</span>'
              : '<span class="muted">' + HM.esc(t('deLai')) + '</span>') + '</div></td>' +
          '<td class="num">' + HM.esc(c.tien2(q.amount)) +
            '<div class="t-sub">' + HM.esc(HT.fmt.n(q.streams)) + '</div></td>';
      },
      chon: function (q) { DANG_CHON = q.id; c.veLai(); },
      chan: function (rows) {
        return '<tr><td colspan="2">' + HM.esc(c.lang === 'vi' ? 'Tổng theo bộ lọc' : 'Filtered total') + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(rows.reduce(function (s, q) { return s + q.amount; }, 0))) + '</td></tr>';
      },
      rongTieuDe: t('khongCoDong'), rongMoTa: t('khongCoDongMo')
    });
    b.ve();

    veChiTiet(root, c);

    /* ---- sự kiện ---- */
    HM.bam(root, '[data-tt]', function (el) { LOC.trangThai = el.getAttribute('data-tt'); DANG_CHON = null; c.veLai(); });
    HM.doi(root, '[data-f]', function (el) { LOC[el.getAttribute('data-f')] = el.value; DANG_CHON = null; c.veLai(); });
    HM.nhap(root, '[data-q]', function (el) { LOC.q = el.value; DANG_CHON = null; c.veLai(); });
    HM.bam(root, '[data-xuat]', function () {
      HM.csv('hang-cho-khop-isrc.csv',
        ['ID', 'Kỳ', 'Luồng', 'Mã trong file', 'Tên bài', 'Nghệ sĩ', 'Cửa hàng', 'Lãnh thổ', 'Lượt', 'Số tiền USD', 'Lý do', 'Trạng thái'],
        ds.map(function (q) {
          return [q.id, A.periods[A.pIndexOf(q.periodKey)].label, A.feeds[q.feedId].short, q.isrc,
                  q.title, q.artist, q.store, q.territory, q.streams,
                  q.amount.toFixed(2).replace('.', ','), q.reason, q.status];
        }));
    });
  }
});

function loc(A, c) {
  var l = A.queue.list();
  if (LOC.ky === 'ky-nay') l = l.filter(function (q) { return q.periodKey === c.kyKey; });
  else if (LOC.ky) l = l.filter(function (q) { return q.periodKey === LOC.ky; });
  if (LOC.luong !== '') l = l.filter(function (q) { return String(q.feedId) === LOC.luong; });
  if (LOC.trangThai) l = l.filter(function (q) { return q.status === LOC.trangThai; });
  if (LOC.q) {
    var s = LOC.q.toLowerCase();
    l = l.filter(function (q) {
      return (q.isrc || '').toLowerCase().indexOf(s) >= 0 ||
             (q.title || '').toLowerCase().indexOf(s) >= 0 ||
             (q.artist || '').toLowerCase().indexOf(s) >= 0 ||
             q.id.toLowerCase().indexOf(s) >= 0;
    });
  }
  return l;
}

/* =====================================================================
   CỘT PHẢI — chi tiết một dòng
   ===================================================================== */
function veChiTiet(root, c) {
  var A = c.A, t = c.t;
  var host = root.querySelector('[data-ct]');
  var q = DANG_CHON ? A.queue.list().filter(function (x) { return x.id === DANG_CHON; })[0] : null;

  if (!q) {
    host.innerHTML = HM.the({ than: HM.trong({ icon: 'ask', tieuDe: t('chonDong'), moTa: t('chonDongMo') }) });
    return;
  }

  var dat = A.queue.landingPeriod(q.id);
  var goiY = q.status === 'pending' ? A.queue.suggest(q.id) : [];

  var html = HM.the({
    dai: q.status === 'matched'
      ? { kieu: 'ok', icon: 'check', chu: HM.esc(t('daKhop') + ' → ' + A.titleOf(q.resolvedTo) + ' · ' + HT.fmt.luc(q.at)) }
      : q.status === 'parked'
        ? { kieu: 'warn', icon: 'clock', chu: HM.esc(t('deLai') + (q.note ? ' · ' + q.note : '')) }
        : { kieu: 'no', icon: 'alert', chu: HM.esc(q.reason) },
    h2: HM.esc(q.title || (c.lang === 'vi' ? '(file không ghi tên bài)' : '(no title in file)')),
    p: HM.esc(q.id + ' · ' + A.feeds[q.feedId].name),
    than: HM.kv([
      { t: t('cot_ma'), v: q.isrc || (c.lang === 'vi' ? 'thiếu hẳn' : 'missing'), vHtml: false },
      { t: c.lang === 'vi' ? 'Nghệ sĩ trong file' : 'Artist in file', v: q.artist },
      { t: c.lang === 'vi' ? 'Cửa hàng · lãnh thổ' : 'Store · territory', v: q.store + ' · ' + q.territory },
      { t: c.lang === 'vi' ? 'Lượt nghe' : 'Streams', v: HT.fmt.n(q.streams) },
      { t: t('cot_tien'), v: c.tien2(q.amount), manh: true },
      { t: t('cot_ky'), v: A.periods[A.pIndexOf(q.periodKey)].label +
          (A.isApproved(q.periodKey) ? ' · ' + (c.lang === 'vi' ? 'đã duyệt' : 'approved') : '') }
    ])
  });

  /* khoản truy thu — nói TRƯỚC khi bấm */
  if (q.status === 'pending' && dat && dat.adjustment) {
    html += HM.ghi({ kieu: 'warn', tieuDe: HM.esc(t('truyThu')),
      than: HM.esc(t('truyThuMo')) + '<br><b>' + HM.esc(t('vaoKy')) + ': ' + HM.esc(dat.label) + '</b>' });
  }
  if (q.status === 'pending' && !dat) {
    html += HM.ghi({ kieu: 'no', tieuDe: HM.esc(t('khongCon')), than: '' });
  }

  if (q.status === 'pending') {
    html += HM.the({
      h2: HM.esc(t('goiY')),
      p: c.lang === 'vi'
        ? 'Hệ thống chấm điểm và xếp hạng, rồi dừng. Quyết định cuối là của người — tự khớp là cách nhanh nhất để trả tiền cho nhầm người.'
        : 'The system scores and ranks, then stops. A person decides — auto-matching is the fastest way to pay the wrong person.',
      than: goiY.length ? '<div class="bars pick">' + goiY.map(function (g) {
        var tr = A.track(g.i);
        return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto;gap:10px">' +
          '<div class="nm"><b>' + HM.esc(HM.dai(tr.title, 30)) + '</b>' +
            '<em>' + HM.esc(tr.isrc) + ' · ' + HM.esc(HM.dai(tr.artist, 24)) +
            (tr.label ? ' · ' + HM.esc(HM.dai(tr.label, 20)) : ' · ' + (c.lang === 'vi' ? 'độc lập' : 'independent')) + '</em>' +
            '<div class="bar" style="margin-top:6px"><i style="width:' + g.score + '%"></i></div>' +
            '<em style="margin-top:4px">' + HM.esc(g.why) + ' · ' + g.score + ' ' + HM.esc(t('diem')) + '</em></div>' +
          '<button type="button" class="btn sm" data-xem="' + g.i + '">' + HM.icon('info') + '</button>' +
          '<button type="button" class="btn sm pri" data-khop="' + g.i + '">' + HM.esc(t('khop')) + '</button>' +
          '</div>';
      }).join('') + '</div>'
        : HM.trong({ tieuDe: c.lang === 'vi' ? 'Không có gợi ý nào' : 'No suggestion',
            moTa: c.lang === 'vi' ? 'Mã trong file không giống mã nào trong danh mục, và tên bài cũng không khớp. Tìm tay bên dưới, hoặc để lại chờ đối tác xác nhận.'
                                  : 'The code in the file matches nothing in the catalogue, and the title does not match either. Search by hand below, or park it pending the partner.' }),
      chan: '<button type="button" class="btn sm" data-park>' + HM.icon('clock') + HM.esc(t('deLaiNut')) + '</button>'
    });

    html += HM.the({
      h2: HM.esc(t('timTay')), p: HM.esc(t('timTayMo')),
      than: '<div class="srch" style="flex:1 1 100%;max-width:none">' + HM.icon('tim') +
        '<input type="search" data-tay placeholder="VN25… / ' + HM.esc(c.lang === 'vi' ? 'tên bài' : 'title') + '"></div>' +
        '<div data-ketqua style="margin-top:12px"></div>'
    });
  } else {
    html += HM.the({
      h2: c.lang === 'vi' ? 'Đã xử lý' : 'Resolved',
      than: HM.kv([
        { t: c.lang === 'vi' ? 'Trạng thái' : 'Status', v: q.status === 'matched' ? t('daKhop') : t('deLai') },
        q.resolvedTo != null ? { t: c.lang === 'vi' ? 'Khớp vào bản ghi' : 'Matched to',
          v: A.titleOf(q.resolvedTo) + ' · ' + A.isrcOf(q.resolvedTo) } : null,
        q.intoPeriod ? { t: t('vaoKy'), v: A.periods[A.pIndexOf(q.intoPeriod)].label + ' · ' + t('truyThu'), manh: true } : null,
        { t: c.lang === 'vi' ? 'Lúc' : 'When', v: HT.fmt.luc(q.at) },
        q.by ? { t: c.lang === 'vi' ? 'Người làm' : 'By', v: q.by } : null,
        q.note ? { t: c.lang === 'vi' ? 'Ghi chú' : 'Note', v: q.note } : null
      ]),
      chan: '<button type="button" class="btn sm dang" data-unpark>' + HM.icon('swap') + HM.esc(t('traLai')) + '</button>'
    });
  }

  host.innerHTML = html;

  HM.bam(host, '[data-khop]', function (el) { xacNhanKhop(c, q, +el.getAttribute('data-khop')); });
  HM.bam(host, '[data-xem]', function (el) { xemBanGhi(c, +el.getAttribute('data-xem')); });
  HM.bam(host, '[data-park]', function () {
    c.hoiThoai({ tieuDe: t('deLaiNut'), moTa: HM.esc(c.lang === 'vi'
      ? 'Dòng ra khỏi hàng chờ nhưng tiền vẫn treo — nó vẫn được đếm vào phần treo của kỳ và vẫn chặn duyệt nếu vượt ngưỡng. Để lại chờ không phải là xoá.'
      : 'The row leaves the working queue but the money stays held — it still counts towards the period’s held total and still blocks approval above the threshold. Parking is not deleting.'),
      than: '<label class="fld">' + (c.lang === 'vi' ? 'Ghi chú (đang chờ ai, chờ gì)' : 'Note (waiting on whom, for what)') + '</label>' +
        '<textarea class="in" data-o="note" rows="3" placeholder="' +
        HM.esc(c.lang === 'vi' ? 'VD: đã gửi mail cho đối tác YouTube ngày 20.08, chờ họ xác nhận mã' : '') + '"></textarea>',
      dong: c.lang === 'vi' ? 'Để lại chờ' : 'Park' }).then(function (r) {
        if (!r) return;
        A.queue.park(q.id, r.note); c.thongBao(c.lang === 'vi' ? 'Đã để lại chờ ' + q.id : 'Parked ' + q.id);
        HM.quenHet(); c.veLai();
      });
  });
  HM.bam(host, '[data-unpark]', function () {
    try { A.queue.unpark(q.id); c.thongBao(c.lang === 'vi' ? 'Đã trả về hàng chờ' : 'Returned to queue'); HM.quenHet(); c.veLai(); }
    catch (e) { c.thongBao(e.message, 'no'); }
  });
  HM.nhap(host, '[data-tay]', function (el) { timTay(host, c, q, el.value); }, 240);
}

/* tìm tay trong danh mục — quét thẳng, không dựng chỉ mục cho một lần gõ */
function timTay(host, c, q, s) {
  var A = c.A, o = host.querySelector('[data-ketqua]');
  s = (s || '').trim().toLowerCase();
  if (s.length < 2) { o.innerHTML = ''; return; }
  var hit = [];
  for (var i = 0; i < A.trackCount && hit.length < 20; i++) {
    if (A.isrcOf(i).toLowerCase().indexOf(s) >= 0 || A.titleOf(i).toLowerCase().indexOf(s) >= 0) hit.push(i);
  }
  if (!hit.length) {
    o.innerHTML = '<p class="hint">' + HM.esc(c.lang === 'vi' ? 'Không có bản ghi nào khớp.' : 'No recording matches.') + '</p>';
    return;
  }
  o.innerHTML = '<div class="bars pick">' + hit.map(function (i) {
    var tr = A.track(i);
    return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto;gap:10px">' +
      '<div class="nm"><b>' + HM.esc(HM.dai(tr.title, 32)) + '</b>' +
      '<em>' + HM.esc(tr.isrc) + ' · ' + HM.esc(HM.dai(tr.artist, 26)) + '</em></div>' +
      '<button type="button" class="btn sm pri" data-khop="' + i + '">' + HM.esc(c.t('khop')) + '</button></div>';
  }).join('') + '</div>';
}

function xemBanGhi(c, i) {
  var A = c.A, tr = A.track(i);
  var gt = A.periods.map(function (p, pi) { return A.grossRec(i, pi); });
  c.nganTruot(
    HM.kv([
      { t: 'ISRC', v: tr.isrc },
      tr.isrcAlt ? { t: 'ISRC (Optional 1)', v: tr.isrcAlt } : null,
      { t: 'UPC', v: tr.upc },
      { t: c.lang === 'vi' ? 'Nghệ sĩ' : 'Artist', v: tr.artist },
      { t: c.lang === 'vi' ? 'Chủ sở hữu' : 'Owner', v: tr.label || (c.lang === 'vi' ? 'Nghệ sĩ độc lập' : 'Independent') },
      { t: c.lang === 'vi' ? 'Loại' : 'Type', v: tr.type },
      { t: c.lang === 'vi' ? 'Phát hành' : 'Released', v: tr.releasePeriod },
      { t: c.lang === 'vi' ? 'Điểm producer' : 'Producer points', v: tr.producerPts ? HT.fmt.pct(tr.producerPts) : '—' }
    ]) +
    '<h4 class="sec">' + (c.lang === 'vi' ? 'Doanh thu 12 kỳ' : 'Revenue, 12 periods') + '</h4>' +
    HB.o({ loai: 'cot', cao: 150, anTruc: true, chuThich: false,
      truc: A.periods.map(function (p) { return p.label.slice(0, 2); }),
      tieuDeTip: function (k) { return 'Kỳ ' + A.periods[k].label; },
      chuoi: [{ ten: c.lang === 'vi' ? 'Doanh thu gộp' : 'Gross', gt: gt }] }),
    { tieuDe: tr.title, phu: tr.isrc, khiMo: function (dr) { HB.gan(dr); } });
}

function xacNhanKhop(c, q, i) {
  var A = c.A, tr = A.track(i);
  var dat = A.queue.landingPeriod(q.id);
  c.hoiThoai({
    tieuDe: c.t('xacKhop'),
    moTa: '<b>' + HM.esc(q.amount.toFixed(2)) + ' USD</b> ' + HM.esc(c.lang === 'vi' ? 'sẽ được ghi về bản ghi ' : 'will be booked to ') +
      '<b>' + HM.esc(tr.title) + '</b> (' + HM.esc(tr.isrc) + ') — ' + HM.esc(tr.artist) + '.' +
      (dat && dat.adjustment
        ? '<br><br><span class="neg">' + HM.esc(c.t('truyThuMo')) + '</span>'
        : ''),
    than: HM.kv([
      { t: c.lang === 'vi' ? 'Dòng trong file' : 'Row in file', v: (q.isrc || '—') + ' · ' + q.title },
      { t: c.lang === 'vi' ? 'Kỳ của dòng' : 'Row’s period', v: A.periods[A.pIndexOf(q.periodKey)].label },
      { t: c.t('vaoKy'), v: dat ? dat.label + (dat.adjustment ? ' · ' + c.t('truyThu') : '') : '—', manh: true },
      { t: c.lang === 'vi' ? 'Bên nhận tiền này' : 'Payee', v: A.partyName(tr.partyKey) + ' · ' + A.partyClientId(tr.partyKey) }
    ]),
    dong: c.t('khop')
  }).then(function (r) {
    if (!r) return;
    try {
      A.queue.resolve(q.id, i, 'ops@haustek-group.com');
      c.thongBao((c.lang === 'vi' ? 'Đã khớp ' : 'Matched ') + q.id + ' → ' + tr.isrc, 'ok');
      DANG_CHON = null; HM.quenHet(); c.veLai();
    } catch (e) { c.thongBao(e.message, 'no'); }
  });
}

})();

},
/* ---- man/doi-chieu.js ---- */
function(){
/* =====================================================================
   NỘI BỘ · ĐỐI CHIẾU & DUYỆT KỲ
   ---------------------------------------------------------------------
   Đây là cánh cửa duy nhất mở số liệu cho khách. Trước khi bấm nút đó,
   bốn điều kiện phải xanh hết, và bốn điều kiện đó không phải trang trí:
   ba trong bốn cái là chặn cứng.

   Đối chiếu nghĩa là: tổng trên file gốc = phần đã khớp + phần treo.
   Lệch một xu cũng là lệch — hoặc parser sai, hoặc file thiếu dòng. Cả
   hai đều không được để lọt sang bước duyệt. Muốn bỏ qua thì phải GHI
   NHẬN chênh lệch bằng tay, có ghi chú, có tên người ghi.
   ===================================================================== */
"use strict";
(function () {

var TAB = 'doi';

HT.dangKy({
  id: 'doi-chieu', nav: 'navDoi', nhom: 'nhomVanHanh', icon: 'check',

  chu: {
    vi: {
      navDoi: 'Đối chiếu & duyệt kỳ', h1: 'Đối chiếu & duyệt kỳ',
      mo: 'Tổng trên file gốc phải bằng phần đã khớp cộng phần treo — tới từng xu. Kỳ chưa duyệt thì khách chưa thấy con số nào.',
      tDoi: 'Đối chiếu theo luồng', tDk: 'Điều kiện duyệt', tTg: 'Tỷ giá', tXem: 'Xem trước chi trả', tLs: 'Các kỳ',
      luong: 'Luồng', ttFile: 'Tổng trên file gốc', daKhop: 'Đã khớp về bản ghi',
      treo: 'Đang treo', lech: 'Chênh lệch', truyThu: 'Truy thu kỳ khác',
      ghiNhan: 'Ghi nhận chênh lệch', daGhiNhan: 'Đã ghi nhận',
      khop: 'khớp', chuaNap: 'chưa nạp',
      duyetKy: 'Duyệt kỳ', thuHoi: 'Thu hồi duyệt', daDuyet: 'Kỳ đã duyệt',
      chotTg: 'Chốt tỷ giá kỳ', doiTg: 'Đổi tỷ giá hiện hành',
      tgKhoa: 'Đã khoá', tgChua: 'Chưa chốt',
      xemTruoc: 'Bảng chi trả nếu duyệt bây giờ',
      seChi: 'Sẽ chi', donSang: 'Dồn sang kỳ sau', thuTamUng: 'Trừ vào tạm ứng', giuLai: 'Giữ lại (producer)',
      benNhan: 'bên nhận', boQua: 'Duyệt mà bỏ qua điều kiện chưa đạt',
      canhBoQua: 'Bỏ qua một điều kiện là ghi lại vĩnh viễn trong hồ sơ duyệt kỳ, kèm tên người bỏ qua. Chỉ làm khi đã biết chắc lý do và chấp nhận trách nhiệm.',
      lyDo: 'Lý do', nguoiDuyet: 'Người duyệt'
    },
    en: {
      navDoi: 'Reconcile & approve', h1: 'Reconcile & approve period',
      mo: 'The source file total must equal matched plus held — to the cent. Until a period is approved, clients see nothing.',
      tDoi: 'Reconciliation by feed', tDk: 'Approval conditions', tTg: 'FX rate', tXem: 'Payout preview', tLs: 'All periods',
      luong: 'Feed', ttFile: 'Source file total', daKhop: 'Matched to recordings',
      treo: 'Held', lech: 'Variance', truyThu: 'Back-claims from other periods',
      ghiNhan: 'Accept variance', daGhiNhan: 'Accepted',
      khop: 'balanced', chuaNap: 'not loaded',
      duyetKy: 'Approve period', thuHoi: 'Revoke approval', daDuyet: 'Period approved',
      chotTg: 'Lock the period FX rate', doiTg: 'Change the working rate',
      tgKhoa: 'Locked', tgChua: 'Not locked',
      xemTruoc: 'Payout table if approved now',
      seChi: 'Payable', donSang: 'Carried to next period', thuTamUng: 'Recouped against advances', giuLai: 'Held (producer)',
      benNhan: 'payees', boQua: 'Approve, overriding unmet conditions',
      canhBoQua: 'An override is written permanently into the approval record, with the name of whoever made it. Only do this knowing exactly why, and accepting the consequence.',
      lyDo: 'Reason', nguoiDuyet: 'Approved by'
    }
  },

  dem: function (c) {
    var n = c.A.periods.filter(function (p, i) { return !c.A.isApproved(p.k) && c.A.canApprove(i); }).length;
    return n ? String(n) : '';
  },

  ve: function (root, c) {
    var A = c.A, t = c.t, pi = c.ky.idx, pk = c.kyKey;
    var r = A.recon(pi);
    var dk = A.approvalChecks(pi);
    var duyet = A.isApproved(pk);
    var hong = dk.filter(function (x) { return !x.ok; });
    var nay = HM.nho(A, 'agg:' + pi, function () { return A.agg('admin', 0, pi, 'rec'); });

    var html = HM.dau({
      h1: HM.esc(t('h1')) + ' <span>' + HM.esc(c.ky.label) + '</span>',
      mo: HM.esc(t('mo')),
      so: [
        { l: t('ttFile'), v: c.tien(r.control) },
        { l: t('lech'), v: c.tien2(r.diff),
          mau: Math.abs(r.diff) > 0.005 ? HB.mau('danger') : HB.mau('ok') },
        { l: c.lang === 'vi' ? 'Trạng thái' : 'Status', v: duyet ? t('daDuyet') : (hong.length ? String(hong.length) + (c.lang === 'vi' ? ' vướng' : ' blocked') : (c.lang === 'vi' ? 'sẵn sàng' : 'ready')),
          mau: duyet ? HB.mau('ok') : hong.length ? HB.mau('warn') : HB.mau('accent') }
      ]
    });

    /* ---- dải hành động chính ---- */
    if (duyet) {
      var ap = A.approvalOf(pk);
      html += HM.ghi({ kieu: 'ok',
        tieuDe: HM.esc(t('daDuyet')) + ' · ' + HM.esc(HT.fmt.luc(ap.at)),
        than: HM.esc(t('nguoiDuyet')) + ': ' + HM.esc(ap.by) +
          (ap.note ? ' · ' + HM.esc(ap.note) : '') +
          (ap.overrides && ap.overrides.length
            ? '<br><span class="neg">' + HM.esc(c.lang === 'vi' ? 'Bỏ qua điều kiện: ' : 'Overrode: ') +
              HM.esc(ap.overrides.join(', ')) + '</span>' : ''),
        nut: '<button type="button" class="btn sm dang" data-thuhoi>' + HM.esc(t('thuHoi')) + '</button>' });
    } else if (!hong.length) {
      html += HM.ghi({ kieu: 'ok',
        tieuDe: HM.esc(c.lang === 'vi' ? 'Đủ bốn điều kiện — kỳ ' + c.ky.label + ' duyệt được' : 'All four conditions met — ' + c.ky.label + ' can be approved'),
        than: HM.esc(c.lang === 'vi'
          ? 'Duyệt xong thì bảng chi trả được ghi vào sổ, tạm ứng bị trừ, phần dưới ngưỡng dồn sang kỳ sau, và label với nghệ sĩ nhìn thấy kỳ này.'
          : 'On approval the payout table is written, advances are recouped, sub-threshold amounts carry forward, and labels and artists can see the period.'),
        nut: '<button type="button" class="btn go" data-duyet>' + HM.icon('check') + HM.esc(t('duyetKy')) + '</button>' });
    } else {
      html += HM.ghi({ kieu: 'warn',
        tieuDe: HM.esc(c.lang === 'vi' ? hong.length + ' điều kiện chưa đạt' : hong.length + ' conditions not met'),
        than: hong.map(function (x) { return '<b>' + HM.esc(x.label) + '</b> — ' + HM.esc(x.detail); }).join('<br>'),
        nut: '<button type="button" class="btn sm dang" data-boqua>' + HM.esc(t('boQua')) + '</button>' });
    }

    html += HM.tabs([
      { k: 'doi', l: t('tDoi'), icon: 'check' },
      { k: 'dk', l: t('tDk'), icon: 'list', dem: dk.filter(function (x) { return x.ok; }).length + '/' + dk.length },
      { k: 'tg', l: t('tTg'), icon: 'swap' },
      { k: 'xem', l: t('tXem'), icon: 'cash' },
      { k: 'ls', l: t('tLs'), icon: 'cal' }
    ], TAB);

    if (TAB === 'doi') html += veDoi(c, r);
    if (TAB === 'dk') html += veDk(c, dk, nay);
    if (TAB === 'tg') html += veTg(c);
    if (TAB === 'xem') html += veXem(c);
    if (TAB === 'ls') html += veLs(c);

    root.innerHTML = html;
    HB.gan(root);

    HM.bam(root, '[data-tab]', function (el) { TAB = el.getAttribute('data-tab'); c.veLai(); });
    HM.bam(root, '[data-duyet]', function () { duyetKy(c, false); });
    HM.bam(root, '[data-boqua]', function () { duyetKy(c, true); });
    HM.bam(root, '[data-thuhoi]', function () { thuHoi(c); });
    HM.bam(root, '[data-ghinhan]', function (el) { ghiNhanLech(c, +el.getAttribute('data-ghinhan')); });
    HM.bam(root, '[data-chottg]', function () { chotTyGia(c); });
    HM.bam(root, '[data-di]', function (el) { c.di(el.getAttribute('data-di')); });
    HM.bam(root, '[data-kyto]', function (el) { c.doiKy(el.getAttribute('data-kyto')); });
    HM.bam(root, '[data-xuat]', function () {
      HM.csv('doi-chieu-' + c.kyKey + '.csv',
        ['Luồng', 'Trạng thái', 'Tổng trên file', 'Đã khớp', 'Truy thu kỳ khác', 'Từ file kỳ này', 'Đang treo', 'Chênh lệch', 'Đã ghi nhận'],
        A.recon(c.ky.idx).rows.map(function (x) {
          return [x.feed.name, x.status, x.control.toFixed(2), x.attributed.toFixed(2),
                  x.adjustments.toFixed(2), x.fromFile.toFixed(2), x.pending.toFixed(2),
                  x.diff.toFixed(2), x.accepted ? x.accepted.note || 'có' : ''];
        }));
    });
  }
});

/* =====================================================================
   TAB — ĐỐI CHIẾU
   ===================================================================== */
function veDoi(c, r) {
  var A = c.A, t = c.t, P = HB.dayMau();
  var duyet = A.isApproved(c.kyKey);

  /* Cột hành động chỉ dựng khi có việc để làm. Luôn dựng thì kỳ nào sạch
     cũng để lại một dải trống 170px bên phải, và bảng trông như thiếu số. */
  var coViec = r.rows.some(function (x) { return x.accepted || (Math.abs(x.diff) > 0.005 && !duyet); });
  var than = '<div class="tw"><table class="t"><thead><tr>' +
    '<th>' + HM.esc(t('luong')) + '</th>' +
    '<th class="num">' + HM.esc(t('ttFile')) + '</th>' +
    '<th class="num">' + HM.esc(t('daKhop')) + '</th>' +
    '<th class="num">' + HM.esc(t('truyThu')) + '</th>' +
    '<th class="num">' + HM.esc(t('treo')) + '</th>' +
    '<th class="num band">' + HM.esc(t('lech')) + '</th>' +
    (coViec ? '<th style="width:170px"></th>' : '') + '</tr></thead><tbody>' +
    r.rows.map(function (x) {
      var lech = Math.abs(x.diff) > 0.005;
      return '<tr><td><div class="t-ttl">' + HM.esc(x.feed.name) + '</div>' +
          '<div class="t-sub">' + (x.status === 'loaded' ? HM.esc(x.file) : HM.esc(t('chuaNap'))) + '</div></td>' +
        '<td class="num">' + (x.status === 'loaded' ? HM.esc(c.tien2(x.control)) : '<span class="nil">—</span>') + '</td>' +
        '<td class="num">' + (x.status === 'loaded' ? HM.esc(c.tien2(x.attributed)) : '<span class="nil">—</span>') + '</td>' +
        '<td class="num">' + (x.adjustments > 0.004 ? '−' + HM.esc(c.tien2(x.adjustments)) : '<span class="nil">—</span>') + '</td>' +
        '<td class="num">' + (x.pending > 0.004 ? '<span class="tag warn">' + HM.esc(c.tien2(x.pending)) + '</span>' : '<span class="nil">—</span>') + '</td>' +
        '<td class="num band">' + (x.status !== 'loaded' ? '<span class="nil">—</span>'
          : lech ? '<span class="neg">' + HM.esc(c.tien2(x.diff)) + '</span>'
                 : '<span class="pos">' + HM.esc(t('khop')) + '</span>') + '</td>' +
        (coViec ? '<td>' + (x.accepted
          ? HM.tag(t('daGhiNhan'), 'info')
          : (lech && !duyet ? '<button type="button" class="btn sm dang" data-ghinhan="' + x.feed.id + '">' +
              HM.esc(t('ghiNhan')) + '</button>' : '')) + '</td>' : '') + '</tr>';
    }).join('') + '</tbody>' +
    '<tfoot><tr><td>' + (c.lang === 'vi' ? 'Cả kỳ' : 'Period total') + '</td>' +
      '<td class="num">' + HM.esc(c.tien2(r.control)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien2(r.attributed)) + '</td>' +
      '<td class="num">' + (r.adjustments > 0.004 ? '−' + HM.esc(c.tien2(r.adjustments)) : '—') + '</td>' +
      '<td class="num">' + HM.esc(c.tien2(r.pending)) + '</td>' +
      '<td class="num band">' + HM.esc(c.tien2(r.diff)) + '</td>' +
      (coViec ? '<td></td>' : '') + '</tr></tfoot></table></div>';

  var html = HM.the({
    h2: HM.esc(t('tDoi')),
    p: c.lang === 'vi'
      ? 'Phép tính là: <b>tổng trên file gốc − phần từ file đã khớp − phần treo = 0</b>. Cột "truy thu kỳ khác" bị trừ ra khỏi phần đã khớp, vì khoản đó không nằm trong file của kỳ này.'
      : 'The identity is: <b>source total − matched from this file − held = 0</b>. Back-claims are subtracted from the matched figure, because they were never in this period’s file.',
    hanhDong: '<button type="button" class="btn sm" data-xuat>' + HM.icon('down2') +
      (c.lang === 'vi' ? 'Xuất CSV' : 'Export CSV') + '</button>',
    thoBody: true, than: than
  });

  /* chỗ chênh lệch đã ghi nhận */
  var daGhi = r.rows.filter(function (x) { return x.accepted; });
  if (daGhi.length) {
    html += HM.the({
      h2: c.lang === 'vi' ? 'Chênh lệch đã ghi nhận' : 'Accepted variances',
      p: c.lang === 'vi' ? 'Ghi nhận không làm chênh lệch biến mất. Nó nói: chúng tôi biết, đây là lý do, và đây là người chịu trách nhiệm.'
                         : 'Accepting does not make a variance disappear. It records: we know, this is why, and this is who is accountable.',
      than: daGhi.map(function (x) {
        return '<div class="stat"><b>' + HM.esc(x.feed.name) + '<p>' + HM.esc(x.accepted.note || (c.lang === 'vi' ? '(không ghi chú)' : '(no note)')) + '</p></b>' +
          '<span class="v">' + HM.esc(c.tien2(x.accepted.amount)) + '<em>' + HM.esc(HT.fmt.luc(x.accepted.at)) + '</em></span></div>';
      }).join('')
    });
  }

  /* biểu đồ ba luồng của kỳ */
  html += '<div class="grid g2">' +
    HM.the({
      h2: c.lang === 'vi' ? 'Ba luồng của kỳ ' + c.ky.label : 'The three feeds, ' + c.ky.label,
      than: HB.o({ loai: 'thanh', hang: r.rows.map(function (x, i) {
        return { ten: x.feed.short, gt: x.attributed, mau: P[i],
                 phu: x.status === 'loaded' ? x.file : t('chuaNap') };
      }) })
    }) +
    HM.the({
      h2: c.lang === 'vi' ? 'Đường đi của tiền trong kỳ' : 'Where the period’s money sits',
      than: HM.kv([
        { t: t('ttFile'), v: c.tien2(r.control), manh: true },
        { t: t('daKhop'), v: c.tien2(r.attributed) },
        { t: t('truyThu'), v: r.adjustments > 0.004 ? '−' + c.tien2(r.adjustments) : '—' },
        { t: c.lang === 'vi' ? 'Từ file kỳ này, đã khớp' : 'From this file, matched', v: c.tien2(r.fromFile) },
        { t: t('treo'), v: c.tien2(r.pending), mau: r.pending > 0.004 ? 'neg' : '' },
        { t: t('lech'), v: c.tien2(r.diff), manh: true, mau: Math.abs(r.diff) > 0.005 ? 'neg' : 'pos' }
      ]) +
      (r.pending > 0.004
        ? '<div style="margin-top:14px">' + HM.ghi({ kieu: 'warn',
            tieuDe: HM.esc(c.lang === 'vi' ? 'Phần treo vẫn là tiền của người khác' : 'Held money still belongs to someone'),
            than: HM.esc(c.lang === 'vi'
              ? 'Nó không mất, nhưng cũng chưa về tay ai. Mỗi kỳ đóng lại mà phần này còn nguyên là thêm một lớp tiền không chủ.'
              : 'It is not lost, but nobody has received it. Every period closed with this untouched adds another layer of ownerless money.'),
            nut: '<button type="button" class="btn sm" data-di="khop-isrc">' + HM.esc(c.lang === 'vi' ? 'Mở hàng chờ' : 'Open queue') + '</button>' }) + '</div>'
        : '')
    }) + '</div>';

  return html;
}

/* =====================================================================
   TAB — ĐIỀU KIỆN DUYỆT
   ===================================================================== */
function veDk(c, dk, nay) {
  var A = c.A, t = c.t;
  var giaiThich = {
    feeds: c.lang === 'vi'
      ? 'Thiếu một luồng thì tiền của luồng đó không có trong tổng. Kỳ vẫn ra một con số — con số đúng của phần đã có, và sai hoàn toàn nếu ai đó đọc nó như doanh thu cả kỳ.'
      : 'A missing feed means its money is not in the total. The period still produces a figure — correct for what is loaded, and completely wrong if anyone reads it as the period’s revenue.',
    recon: c.lang === 'vi'
      ? 'Lệch một xu là parser sai hoặc file thiếu dòng. Cả hai đều lớn hơn một xu ở lần chạy sau.'
      : 'A one-cent variance is either a parser bug or a missing row in the file. Both are bigger than one cent next run.',
    queue: c.lang === 'vi'
      ? 'Tiền treo quá ' + HT.fmt.pct(A.cfg.BLACKBOX_CAP, 1) + ' doanh thu kỳ thì đóng sổ là hợp thức hoá một khoản tiền không chủ.'
      : 'Above ' + HT.fmt.pct(A.cfg.BLACKBOX_CAP, 1) + ' of period revenue, closing the books legitimises money with no owner.',
    fx: c.lang === 'vi'
      ? 'Không chốt tỷ giá thì con số quy đổi sang VND trôi theo tỷ giá hôm nay — mở lại báo cáo cũ sau nửa năm ra một số khác.'
      : 'Without a locked rate the VND figures drift with today’s rate — reopening an old statement six months later gives a different number.'
  };
  var noiToi = { feeds: 'nap-du-lieu', recon: null, queue: 'khop-isrc', fx: null };

  return HM.the({
    h2: HM.esc(t('tDk')),
    p: c.lang === 'vi'
      ? 'Bốn điều kiện. Ba cái đầu là chặn cứng vì sai thì mất tiền của người khác; cái thứ tư là chặn cứng vì sai thì không ai đối chiếu lại được.'
      : 'Four conditions. The first three are hard blocks because getting them wrong loses other people’s money; the fourth because getting it wrong makes the report impossible to audit.',
    than: '<div class="checks">' + dk.map(function (x) {
      return '<div class="check ' + (x.ok ? 'ok' : 'no') + '">' + HM.icon(x.ok ? 'check' : 'alert') +
        '<div style="min-width:0;flex:1"><b>' + HM.esc(x.label) + '</b>' +
        '<span>' + HM.esc(x.detail) + '</span>' +
        '<span style="margin-top:6px;color:var(--faint)">' + HM.esc(giaiThich[x.id] || '') + '</span></div>' +
        (noiToi[x.id] && !x.ok ? '<div class="r"><button type="button" class="btn sm" data-di="' + noiToi[x.id] + '">' +
          HM.esc(c.lang === 'vi' ? 'Xử lý' : 'Fix') + '</button></div>' : '') + '</div>';
    }).join('') + '</div>',
    chan: c.lang === 'vi'
      ? 'Duyệt kỳ là hành động một chiều về mặt niềm tin: sau đó khách đã đọc con số. Thu hồi được, nhưng thu hồi rồi thì có hai người cùng nhớ hai con số khác nhau.'
      : 'Approving is one-way in terms of trust: after it, a client has read the figure. It can be revoked, but then two people remember two different numbers.'
  });
}

/* =====================================================================
   TAB — TỶ GIÁ
   ===================================================================== */
function veTg(c) {
  var A = c.A, t = c.t, f = A.fx.get();
  var khoa = f.locked[c.kyKey] || null;
  var duyet = A.isApproved(c.kyKey);

  return '<div class="grid g2">' +
    HM.the({
      dai: khoa ? { kieu: 'ok', icon: 'check', chu: HM.esc(t('tgKhoa') + ' · 1 USD = ' + HT.fmt.n(khoa.rate) + ' ₫ · ' + HT.fmt.ngay(khoa.at)) }
                : { kieu: 'warn', icon: 'alert', chu: HM.esc(t('tgChua') + ' · ' + c.ky.label) },
      h2: HM.esc(t('chotTg')) + ' ' + HM.esc(c.ky.label),
      p: c.lang === 'vi'
        ? 'Chuẩn ngành là giữ tiền tệ gốc của từng nền tảng rồi quy đổi sang tiền chi trả. Bản mẫu tính bằng USD và chốt một tỷ giá cho mỗi kỳ tại thời điểm duyệt — đây là câu hỏi số 4 còn treo.'
        : 'Industry practice is to keep each platform’s source currency and convert at payout. The prototype computes in USD and locks one rate per period at approval — this is open question 4.',
      hanhDong: duyet ? '' : '<button type="button" class="btn sm pri" data-chottg>' +
        HM.esc(khoa ? (c.lang === 'vi' ? 'Đổi tỷ giá đã chốt' : 'Change locked rate') : t('chotTg')) + '</button>',
      than: HM.kv([
        { t: c.lang === 'vi' ? 'Tỷ giá hiện hành' : 'Working rate', v: HT.fmt.n(f.rate) + ' ₫ / USD' },
        { t: c.lang === 'vi' ? 'Chính sách' : 'Policy', v: f.policy },
        { t: c.lang === 'vi' ? 'Tỷ giá đã khoá cho kỳ này' : 'Locked for this period',
          v: khoa ? HT.fmt.n(khoa.rate) + ' ₫ · ' + HT.fmt.ngay(khoa.at) : t('tgChua'), manh: true },
        { t: c.lang === 'vi' ? 'Doanh thu gộp kỳ, quy VND' : 'Period gross in VND',
          v: HT.fmt.n(A.agg('admin', 0, c.ky.idx, 'rec').gross * (khoa ? khoa.rate : f.rate)) + ' ₫' }
      ])
    }) +
    HM.the({
      h2: c.lang === 'vi' ? 'Tỷ giá đã khoá của 12 kỳ' : 'Locked rates across 12 periods',
      thoBody: true,

  ve: function (root, c) {

});

/* =====================================================================
   GOM SỐ LIỆU MỘT KỲ
   ===================================================================== */
function soLieu(A, pi, pk) {
  return HM.nho(A, 'ketoan:' + pi, function () {
    var rec = A.agg('admin', 0, pi, 'rec');
    var pub = A.agg('admin', 0, pi, 'pub');
    var pubFee = Math.round(pub.gross * A.cfg.PUB_FEE * 100) / 100;
    var duyet = A.isApproved(pk);
    var chi = duyet ? A.payoutOf(pk) : A.previewPayout(pi);
    var treo = A.queue.pendingTotal(pk);

    var tong = { earned: 0, carryIn: 0, recoup: 0, payable: 0, carryOut: 0, giu: 0 };
    chi.forEach(function (r) {
      if (r.held) { tong.giu += r.earned; return; }
      tong.earned += r.earned; tong.carryIn += r.carryIn;
      tong.recoup += r.recoup; tong.payable += r.payable; tong.carryOut += r.carryOut;
    });
    var lam = function (v) { return Math.round(v * 100) / 100; };
    Object.keys(tong).forEach(function (k) { tong[k] = lam(tong[k]); });

    return {
      pi: pi, pk: pk, duyet: duyet,
      gross: rec.gross, fee: rec.fee, labelCut: rec.labelCut,
      producer: rec.producer, artist: rec.artist,
      streams: rec.streams, tracks: rec.tracks,
      pubGross: pub.gross, pubFee: pubFee, pubWriter: lam(pub.gross - pubFee),
      pubCo: A.pubLoaded(pi),
      treo: treo, chi: chi, tong: tong
    };
  });
}

/* =====================================================================
   TAB 1 — BÚT TOÁN KỲ
   ===================================================================== */
function veButToan(c, s) {
  var A = c.A, t = c.t;

  function butToan(ten, giaiThich, dong) {
    var no = 0, co = 0;
    dong.forEach(function (d) { if (d.no) no += d.gt; else co += d.gt; });
    no = Math.round(no * 100) / 100; co = Math.round(co * 100) / 100;
    var lech = Math.round((no - co) * 100) / 100;
    return { ten: ten, giaiThich: giaiThich, dong: dong, no: no, co: co, lech: lech };
  }

  var bt = [];

  bt.push(butToan(t('but1'),
    c.lang === 'vi'
      ? 'Doanh thu về theo file của ba luồng, đã khớp về bản ghi. Phí Haustek là doanh thu của công ty; ba khoản còn lại là nợ phải trả, chưa phải chi phí đã chi.'
      : 'Revenue from the three feeds, matched to recordings. The Haustek fee is company revenue; the other three are liabilities, not costs already paid.',

      { no: false, tk: '511', mo: c.lang === 'vi' ? 'Phí Haustek ' + HT.fmt.pct(A.cfg.HAUSTEK_FEE) : 'Haustek fee ' + HT.fmt.pct(A.cfg.HAUSTEK_FEE), gt: s.fee },
      { no: false, tk: '3311', mo: c.lang === 'vi' ? 'Phần label giữ, và phần Haustek giữ thêm với nghệ sĩ độc lập' : 'Label share, plus extra Haustek share on independents', gt: s.labelCut },
      { no: false, tk: '3313', mo: c.lang === 'vi' ? 'Điểm producer — trừ vào phần nghệ sĩ' : 'Producer points — deducted from the artist share', gt: s.producer },
      { no: false, tk: '3312', mo: c.lang === 'vi' ? 'Phần nghệ sĩ, sau điểm producer' : 'Artist share, after producer points', gt: s.artist }
    ]));

  if (s.pubCo && s.pubGross > 0.004) {
    bt.push(butToan(t('but2'),
      c.lang === 'vi'
        ? 'Tác quyền là dòng tiền tách rời và thuộc người sáng tác. Không đi qua label, và không nằm trong bút toán bên trên.'
        : 'Publishing is a separate stream and belongs to the writers. It never passes through a label, and is not part of the entry above.',
      [
        { no: true, tk: '131', mo: c.lang === 'vi' ? 'Tác quyền quý ' + A.periods[s.pi].quarter + '/' + A.periods[s.pi].year : 'Publishing Q' + A.periods[s.pi].quarter, gt: s.pubGross },
        { no: false, tk: '511', mo: c.lang === 'vi' ? 'Phí quản lý ' + HT.fmt.pct(A.cfg.PUB_FEE) : 'Admin fee ' + HT.fmt.pct(A.cfg.PUB_FEE), gt: s.pubFee },
        { no: false, tk: '3314', mo: c.lang === 'vi' ? 'Phần tác giả, chia theo bảng phần sáng tác' : 'Writer share, per the split table', gt: s.pubWriter }
      ]));
  }

  if (s.treo > 0.004) {
    bt.push(butToan(t('but3'),
      c.lang === 'vi'
        ? 'Tiền đã về tài khoản nhưng chưa khớp được bản ghi nào. Ghi vào phải trả khác — nó KHÔNG phải doanh thu của Haustek, dù đang nằm trong tài khoản Haustek.'
        : 'Cash has arrived but matches no recording. Booked to other payables — it is NOT Haustek revenue, even though it sits in Haustek’s account.',
      [
        { no: true, tk: '131', mo: c.lang === 'vi' ? 'Tiền về từ file, chưa khớp' : 'Cash from file, unmatched', gt: s.treo },
        { no: false, tk: '338', mo: c.lang === 'vi' ? A.queue.list({ periodKey: s.pk, status: 'pending' }).length + ' dòng đang treo ở hàng chờ khớp ISRC' : 'Rows held in the ISRC queue', gt: s.treo }
      ]));
  }

  if (s.tong.recoup > 0.004) {
    bt.push(butToan(t('but4'),
      c.lang === 'vi'
        ? 'Bên nhận kiếm được tiền, nhưng đang nợ Haustek khoản tạm ứng. Khoản phải trả giảm, khoản phải thu tạm ứng giảm theo. Không có tiền mặt nào di chuyển.'
        : 'A payee earned money but owes Haustek an advance. The payable falls and the advance receivable falls with it. No cash moves.',

      ]));
  }

  if (s.tong.payable > 0.004) {
    bt.push(butToan(t('but5'),
      c.lang === 'vi'
        ? 'Phần vượt ngưỡng ' + HT.fmt.usd0(A.cfg.PAYOUT_MIN) + ' được chi. Phần dưới ngưỡng — ' + HT.fmt.usd(s.tong.carryOut) + ' — KHÔNG có bút toán: nó vẫn nằm nguyên ở tài khoản phải trả và dồn sang kỳ sau.'
        : 'Amounts above the ' + HT.fmt.usd0(A.cfg.PAYOUT_MIN) + ' threshold are paid. Amounts below — ' + HT.fmt.usd(s.tong.carryOut) + ' — have NO entry: they stay in payables and carry forward.',
      [
        { no: true, tk: '3311', mo: c.lang === 'vi' ? 'Chi trả label và nghệ sĩ kỳ ' + c.ky.label : 'Pay labels and artists, ' + c.ky.label, gt: s.tong.payable },
        { no: false, tk: '131', mo: c.lang === 'vi' ? 'Chuyển khoản đi (bản mẫu gộp một dòng — hệ thật đối chiếu với sao kê ngân hàng)' : 'Bank transfer out (one line here — the real system reconciles to the bank statement)', gt: s.tong.payable }
      ]));
  }

  var tongNo = 0, tongCo = 0;
  bt.forEach(function (b) { tongNo += b.no; tongCo += b.co; });
  tongNo = Math.round(tongNo * 100) / 100; tongCo = Math.round(tongCo * 100) / 100;
  var lechTong = Math.round((tongNo - tongCo) * 100) / 100;

  var html = HM.ghi({
    kieu: s.duyet ? 'ok' : 'warn',
    tieuDe: HM.esc(s.duyet ? t('daDuyet') : t('chuaDuyet')),
    than: HM.esc(s.duyet
      ? (c.lang === 'vi'
         ? 'Bảng chi trả của kỳ này đã ghi vào sổ lúc ' + HT.fmt.luc(A.approvalOf(s.pk).at) + '. Con số dưới đây là con số đã dùng để chuyển tiền.'
         : 'The payout table was written at ' + HT.fmt.luc(A.approvalOf(s.pk).at) + '. The figures below are the ones money moved on.')
      : (c.lang === 'vi'
         ? 'Chưa duyệt kỳ thì chưa có bảng chi trả nào được ghi. Bút toán dưới đây tính lại từ dữ liệu hiện có và sẽ đổi nếu còn nạp thêm luồng hay khớp thêm dòng.'
         : 'Until the period is approved no payout table exists. The entries below are recomputed from current data and will change if another feed is loaded or another row matched.')),
    nut: '<button type="button" class="btn sm" data-di="doi-chieu">' +
      HM.esc(c.lang === 'vi' ? 'Mở màn duyệt kỳ' : 'Open approval') + '</button>'
  });

  html += bt.map(function (b, i) {
    return HM.the({
      h2: (i + 1) + '. ' + HM.esc(b.ten),
      p: HM.esc(b.giaiThich),
      thoBody: true,
      than: '<div class="tw"><table class="t"><thead><tr>' +
        '<th style="width:74px">' + HM.esc(t('tk')) + '</th>' +
        '<th>' + HM.esc(t('dienGiai')) + '</th>' +
        '<th class="num" style="width:150px">' + HM.esc(t('no')) + '</th>' +
        '<th class="num" style="width:150px">' + HM.esc(t('co')) + '</th></tr></thead><tbody>' +
        b.dong.map(function (d) {
          return '<tr><td class="mono">' + HM.esc(d.tk) + '</td>' +
            '<td><div class="t-ttl">' + HM.esc(TK[d.tk].ten) + '</div>' +
            '<div class="t-sub" style="font-family:var(--f);font-size:12px">' + HM.esc(d.mo) + '</div></td>' +
            '<td class="num">' + (d.no ? HM.esc(c.tien2(d.gt)) : '<span class="nil">—</span>') + '</td>' +
            '<td class="num">' + (!d.no ? HM.esc(c.tien2(d.gt)) : '<span class="nil">—</span>') + '</td></tr>';
        }).join('') + '</tbody><tfoot><tr>' +
        '<td colspan="2">' + HM.esc(t('canDoi')) + ' · ' +
        (Math.abs(b.lech) < 0.005 ? '<span class="pos">' + HM.esc(t('canBang')) + '</span>'
          : '<span class="neg">' + HM.esc(t('lech')) + ' ' + HM.esc(HT.fmt.usd(b.lech)) + '</span>') + '</td>' +
        '<td class="num">' + HM.esc(c.tien2(b.no)) + '</td>' +
        '<td class="num">' + HM.esc(c.tien2(b.co)) + '</td></tr></tfoot></table></div>'
    });
  }).join('');

  /* bảng cân đối tổng */
  html += HM.the({
    dai: Math.abs(lechTong) < 0.005
      ? { kieu: 'ok', icon: 'check', chu: HM.esc(c.lang === 'vi'
          ? 'Tổng Nợ bằng tổng Có tới từng xu — ' + c.tien2(tongNo)
          : 'Total debits equal total credits to the cent — ' + c.tien2(tongNo)) }
      : { kieu: 'no', icon: 'alert', chu: HM.esc(c.lang === 'vi'
          ? 'LỆCH ' + HT.fmt.usd(lechTong) + ' — có lỗi ở tầng tính, không phải ở màn hình này'
          : 'OUT BY ' + HT.fmt.usd(lechTong) + ' — the fault is in the calculation layer, not this screen') },
    h2: c.lang === 'vi' ? 'Cân đối cả kỳ' : 'Period balance',
    hanhDong: '<button type="button" class="btn sm" data-xuatbut>' + HM.icon('down2') + HM.esc(t('xuat')) + '</button>',
    than: HM.so([
      { l: t('tongNo'), v: c.tien(tongNo) },
      { l: t('tongCo'), v: c.tien(tongCo) },

    (function () {

      bt.forEach(function (b) {
        b.dong.forEach(function (d) {
          if (d.no) duNo[d.tk] = Math.round(((duNo[d.tk] || 0) + d.gt) * 100) / 100;

        });
      });
      var ma = Object.keys(TK).filter(function (k) { return duNo[k] || duCo[k]; });
      return '<div class="tw"><table class="t"><thead><tr>' +
        '<th style="width:74px">' + HM.esc(t('tk')) + '</th><th>' + (c.lang === 'vi' ? 'Tên tài khoản' : 'Account') + '</th>' +
        '<th class="num">' + HM.esc(t('no')) + '</th><th class="num">' + HM.esc(t('co')) + '</th>' +
        '<th class="num band">' + (c.lang === 'vi' ? 'Số dư' : 'Balance') + '</th></tr></thead><tbody>' +
        ma.map(function (k) {
          var du = Math.round(((duNo[k] || 0) - (duCo[k] || 0)) * 100) / 100;
          return '<tr><td class="mono">' + HM.esc(k) + '</td>' +
            '<td>' + HM.esc(TK[k].ten) + '</td>' +
            '<td class="num">' + (duNo[k] ? HM.esc(c.tien2(duNo[k])) : '<span class="nil">—</span>') + '</td>' +
            '<td class="num">' + (duCo[k] ? HM.esc(c.tien2(duCo[k])) : '<span class="nil">—</span>') + '</td>' +
            '<td class="num band">' + HM.esc(c.tien2(du)) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    })(),
    chan: c.lang === 'vi'
      ? 'Bản mẫu ghi bút toán ở mức TỔNG KỲ. Hệ thật ghi ở mức từng dòng doanh thu, và chính vì vậy mà bảng đối chiếu với sao kê ngân hàng mới lần ra được từng khoản.'
      : 'The prototype posts at period level. A real system posts per revenue line — which is exactly what lets a bank reconciliation trace an individual amount.'
  });

  return html;
}

/* =====================================================================
   TAB 2 — CÔNG NỢ BÊN NHẬN
   ===================================================================== */
function veCongNo(c, s) {
  var A = c.A, t = c.t;
  var rows = s.chi.filter(function (r) { return !r.held; }).map(function (r) {
    return {
      key: r.partyKey, ten: A.partyName(r.partyKey), ma: A.partyClientId(r.partyKey),
      loai: r.kind, duDau: r.carryIn, ps: r.earned, thu: r.recoup,
      chi: r.payable, duCuoi: r.carryOut, ungConLai: r.advanceLeft
    };
  });

  var loc = rows.filter(function (r) {
    if (LOC_CN.loai && r.loai !== LOC_CN.loai) return false;
    if (LOC_CN.chi === 'cochi' && !(r.chi > 0)) return false;
    if (LOC_CN.chi === 'duoi' && !(r.duCuoi > 0)) return false;
    if (LOC_CN.chi === 'tru' && !(r.thu > 0)) return false;
    if (LOC_CN.tim) {
      var q = LOC_CN.tim.toLowerCase();
      if (r.ten.toLowerCase().indexOf(q) < 0 && r.ma.toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });

  var tg = { duDau: 0, ps: 0, thu: 0, chi: 0, duCuoi: 0 };
  loc.forEach(function (r) {
    tg.duDau += r.duDau; tg.ps += r.ps; tg.thu += r.thu; tg.chi += r.chi; tg.duCuoi += r.duCuoi;
  });

  var giu = s.chi.filter(function (r) { return r.held; })[0];

  var html = HM.the({
    h2: HM.esc(t('tCn')) + ' · ' + HM.esc(c.ky.label),
    p: c.lang === 'vi'
      ? 'Phép tính của mỗi dòng: <b>dư đầu kỳ + phát sinh − thu hồi tạm ứng = đã chi + dư cuối kỳ</b>. Dòng nào không đúng phép tính đó là dòng có tiền đi lạc.'
      : 'Each row satisfies: <b>opening + arising − recouped = paid + closing</b>. Any row that does not is a row where money went astray.',
    hanhDong: '<button type="button" class="btn sm" data-xuatcn>' + HM.icon('down2') + HM.esc(t('xuat')) + '</button>',
    than: '<div class="bar">' +
      '<div class="srch">' + HM.icon('tim') + '<input type="search" data-cntim placeholder="' +
        HM.esc(t('tim')) + '" value="' + HM.esc(LOC_CN.tim) + '"></div>' +
      '<select class="in" data-cnloai style="width:auto;height:34px">' +
        '<option value="">' + HM.esc(t('tatCa')) + '</option>' +
        '<option value="label"' + (LOC_CN.loai === 'label' ? ' selected' : '') + '>Label</option>' +
        '<option value="artist"' + (LOC_CN.loai === 'artist' ? ' selected' : '') + '>' +
          HM.esc(c.lang === 'vi' ? 'Nghệ sĩ' : 'Artist') + '</option></select>' +
      [['tatca', t('tatCa')], ['cochi', t('coChi')], ['duoi', t('duoiNguong')], ['tru', t('dangTru')]].map(function (x) {
        return '<button type="button" class="pill' + (LOC_CN.chi === x[0] ? ' on' : '') + '" data-cn="' + x[0] + '">' +
          HM.esc(x[1]) + '</button>';
      }).join('') + '</div>' +
      HM.so([
        { l: t('duDau'), v: c.tien(tg.duDau) },
        { l: t('psTang'), v: c.tien(tg.ps), lon: true },
        { l: t('thuHoi'), v: '−' + c.tien(tg.thu) },
        { l: t('daChi'), v: c.tien(tg.chi) },
        { l: t('duCuoi'), v: c.tien(tg.duCuoi) }
      ])
  });

  html += HM.the({ thoBody: true, than: '<div data-bangcn></div>' });

  if (giu) {
    html += HM.ghi({ kieu: 'warn',
      tieuDe: HM.esc(c.lang === 'vi'
        ? 'Giữ lại ' + c.tien2(giu.earned) + ' — điểm producer chưa gắn được danh tính'
        : 'Holding ' + c.tien2(giu.earned) + ' — producer points with no identity'),
      than: HM.esc(c.lang === 'vi'
        ? 'Danh mục hiện chỉ có cột Producer ghi TÊN, không có mã. Không có mã thì không biết trả cho ai, nên khoản này nằm lại một dòng riêng và nhìn thấy được — chứ không lặng lẽ biến mất khỏi bảng chi trả. Đây là câu hỏi số 3 còn treo.'
        : 'The catalogue’s Producer column holds a NAME, not an id. Without an id there is nobody to pay, so the amount sits on its own visible row rather than quietly vanishing. This is open question 3.'),
      nut: '<button type="button" class="btn sm" data-di="quan-tri">' +
        HM.esc(c.lang === 'vi' ? 'Xem câu hỏi treo' : 'Open questions') + '</button>' });
  }

  /* Bảng chỉ dựng được sau khi HTML đã nằm trong DOM — hàm bang() cần
     một phần tử thật để gắn sự kiện vào. */
  SAU.push(function (root) {
    var host = root.querySelector('[data-bangcn]');
    if (!host) return;
    var b = c.bang({
      host: host, dong: function () { return loc; }, sort: 'ps', dir: -1, co: 25,
      cot: [
        { k: 'ten', l: t('benNhan') },
        { k: 'loai', l: t('loai'), w: '90px' },
        { k: 'duDau', l: t('duDau'), num: true, w: '110px' },
        { k: 'ps', l: t('psTang'), num: true, w: '120px' },
        { k: 'thu', l: t('thuHoi'), num: true, w: '110px' },
        { k: 'chi', l: t('daChi'), num: true, w: '120px' },
        { k: 'duCuoi', l: t('duCuoi'), num: true, w: '110px' }
      ],
      veDong: function (r) {
        return '<td><div class="t-ttl">' + HM.esc(HM.dai(r.ten, 32)) + '</div>' +
            '<div class="t-sub">' + HM.esc(r.ma) + '</div></td>' +
          '<td>' + HM.tag(r.loai === 'label' ? 'Label' : (c.lang === 'vi' ? 'Nghệ sĩ' : 'Artist'),
            r.loai === 'label' ? 'info' : 'link') + '</td>' +
          '<td class="num">' + (r.duDau > 0.004 ? HM.esc(c.tien2(r.duDau)) : '<span class="nil">—</span>') + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(r.ps)) + '</td>' +
          '<td class="num">' + (r.thu > 0.004 ? '<span class="neg">−' + HM.esc(c.tien2(r.thu)) + '</span>' : '<span class="nil">—</span>') + '</td>' +
          '<td class="num">' + (r.chi > 0.004 ? '<b>' + HM.esc(c.tien2(r.chi)) + '</b>' : '<span class="nil">—</span>') + '</td>' +
          '<td class="num">' + (r.duCuoi > 0.004 ? '<span class="tag warn">' + HM.esc(c.tien2(r.duCuoi)) + '</span>' : '<span class="nil">—</span>') + '</td>';
      },
      chon: function (r) { moChiTiet(c, r.key, s); },
      chan: function (rs) {
        var g = { duDau: 0, ps: 0, thu: 0, chi: 0, duCuoi: 0 };
        rs.forEach(function (r) { g.duDau += r.duDau; g.ps += r.ps; g.thu += r.thu; g.chi += r.chi; g.duCuoi += r.duCuoi; });
        return '<tr><td colspan="2">' + HM.esc(t('tongCong')) + ' · ' + HT.fmt.n(rs.length) + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(g.duDau)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(g.ps)) + '</td>' +
          '<td class="num">−' + HM.esc(c.tien2(g.thu)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(g.chi)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien2(g.duCuoi)) + '</td></tr>';
      },
      chanChu: function (rs) {
        var g = { duDau: 0, ps: 0, thu: 0, chi: 0, duCuoi: 0 };
        rs.forEach(function (r) { g.duDau += r.duDau; g.ps += r.ps; g.thu += r.thu; g.chi += r.chi; g.duCuoi += r.duCuoi; });
        var trai = Math.round((g.duDau + g.ps - g.thu) * 100) / 100;
        var phai = Math.round((g.chi + g.duCuoi) * 100) / 100;
        return (Math.abs(trai - phai) < 0.005
          ? '<span class="pos">' + HM.esc(c.lang === 'vi' ? 'Cân: dư đầu + phát sinh − thu hồi = đã chi + dư cuối = ' : 'Balanced: ') + HM.esc(c.tien2(trai)) + '</span>'
          : '<span class="neg">' + HM.esc(c.lang === 'vi' ? 'LỆCH ' : 'OUT BY ') + HM.esc(HT.fmt.usd(trai - phai)) + '</span>');
      },
      rongTieuDe: c.lang === 'vi' ? 'Không có bên nhận nào' : 'No payee',
      rongMoTa: c.lang === 'vi' ? 'Bộ lọc đang đặt không khớp bên nhận nào của kỳ này.' : 'No payee in this period matches the filters.'
    });
    b.ve();
  });

  return html;
}

/* =====================================================================
   TAB 3 — TẠM ỨNG PHẢI THU
   ===================================================================== */
function veTamUng(c) {
  var A = c.A, t = c.t, P = HB.dayMau();
  var ds = A.advances.list();
  var conNo = ds.filter(function (x) { return x.balance > 0; });
  var xong = ds.filter(function (x) { return x.balance <= 0 && x.opening > 0; });
  var tongGoc = ds.reduce(function (s, x) { return s + x.opening; }, 0);
  var tongThu = ds.reduce(function (s, x) { return s + x.recouped; }, 0);

  /* Nhịp thu hồi = số bên đó kiếm được trong kỳ đang xem. Quét toàn danh
     mục MỘT lần cho cả bảng, không phải một lần mỗi dòng. */
  var kiem = HM.nho(A, 'kiem:' + c.ky.idx, function () { return A.earnedByParty(c.ky.idx); });

  var theoKy = HM.nho(A, 'ungTheoKy', function () {
    var st = A.state();
    return A.periods.map(function (p) {
      var s = 0;
      Object.keys(st.advances).forEach(function (k) {
        var b = st.advances[k].byPeriod || {};
        s += b[p.k] || 0;
      });
      return Math.round(s * 100) / 100;
    });
  });

  var html = HM.the({
    h2: HM.esc(t('tUng')),
    p: HM.esc(t('giaiThichUng')),
    than: HM.so([
      { l: t('ungGoc'), v: c.tien(tongGoc), s: HT.fmt.n(ds.length) + (c.lang === 'vi' ? ' bên nhận' : ' payees') },
      { l: t('ungDaThu'), v: c.tien(tongThu),
        s: HT.fmt.pct(tongGoc ? tongThu / tongGoc : 0) + (c.lang === 'vi' ? ' đã thu hồi' : ' recovered') },
      { l: t('ungConLai'), v: c.tien(A.advances.total()), lon: true,
        s: HT.fmt.n(conNo.length) + (c.lang === 'vi' ? ' bên còn nợ' : ' still owing'),
        mau: HB.mau('warn') },
      { l: c.lang === 'vi' ? 'Đã trả xong' : 'Cleared', v: HT.fmt.n(xong.length) }
    ]) +
    '<div style="margin-top:6px">' + HB.chia([
      { ten: t('ungDaThu'), gt: tongThu, mau: P[6] },
      { ten: t('ungConLai'), gt: A.advances.total(), mau: P[4] }
    ]) + '</div>'
  });

  html += '<div class="grid g2">' +
    HM.the({
      h2: c.lang === 'vi' ? 'Thu hồi qua từng kỳ' : 'Recoupment period by period',
      p: c.lang === 'vi' ? 'Chỉ kỳ đã duyệt mới ghi được lượt thu hồi — kỳ chưa duyệt là cột trống, không phải cột 0.'
                         : 'Only approved periods record a recoupment — an unapproved period is an empty column, not a zero.',
      than: HB.o({ loai: 'cot', cao: 180, hienGiaTri: true, chuThich: false,
        truc: A.periods.map(function (p) { return p.label.slice(0, 2); }),
        tieuDeTip: function (i) { return 'Kỳ ' + A.periods[i].label; },
        chuTrong: c.lang === 'vi' ? 'Kỳ chưa duyệt' : 'Period not approved',
        chuoi: [{ ten: t('ungDaThu'), gt: theoKy.map(function (v, i) { return A.isApproved(A.periods[i].k) ? v : null; }), mau: P[6] }],
        noiBat: c.ky.idx })
    }) +
    HM.the({
      h2: c.lang === 'vi' ? 'Nợ lớn nhất' : 'Largest outstanding',
      than: HB.o({ loai: 'thanh', tenTong: t('ungConLai'), hang: conNo.slice(0, 8).map(function (x, i) {
        return { ten: HM.dai(x.name, 26), gt: x.balance, mau: P[i % 8],
                 phu: x.clientId + ' · ' + (c.lang === 'vi' ? 'đã ứng ' : 'advanced ') + HT.fmt.usd0(x.opening) };
      }) })
    }) + '</div>';

  html += HM.the({
    h2: c.lang === 'vi' ? 'Sổ tạm ứng' : 'Advance ledger',
    hanhDong: '<button type="button" class="btn sm" data-di="tam-ung">' + HM.icon('out') +
      (c.lang === 'vi' ? 'Quản lý tạm ứng' : 'Manage advances') + '</button>',
    thoBody: true,
    than: '<div class="tw"><table class="t"><thead><tr>' +
      '<th>' + HM.esc(t('benNhan')) + '</th>' +
      '<th class="num">' + HM.esc(t('ungGoc')) + '</th>' +
      '<th class="num">' + HM.esc(t('ungDaThu')) + '</th>' +
      '<th class="num band">' + HM.esc(t('ungConLai')) + '</th>' +
      '<th style="width:180px">' + (c.lang === 'vi' ? 'Tiến độ thu hồi' : 'Recovery') + '</th>' +
      '<th class="num">' + HM.esc(t('ungKy')) + '</th></tr></thead><tbody>' +
      ds.slice(0, 60).map(function (x) {
        var pc = x.opening > 0 ? x.recouped / x.opening : 1;
        var nhip = kiem.get(x.partyKey) || 0;
        var soKy = x.balance <= 0 ? 0 : nhip > 0 ? Math.ceil(x.balance / nhip) : null;
        return '<tr><td><div class="t-ttl">' + HM.esc(HM.dai(x.name, 34)) + '</div>' +
          '<div class="t-sub">' + HM.esc(x.clientId) + ' · ' + HM.esc(x.note || '') + '</div></td>' +
          '<td class="num">' + HM.esc(c.tien(x.opening)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien(x.recouped)) + '</td>' +
          '<td class="num band">' + (x.balance > 0
            ? '<span class="neg">' + HM.esc(c.tien(x.balance)) + '</span>'
            : '<span class="pos">' + HM.esc(c.lang === 'vi' ? 'xong' : 'clear') + '</span>') + '</td>' +
          '<td><div class="meter thin"><i style="width:' + Math.min(100, pc * 100).toFixed(1) + '%;background:' +
            (x.balance > 0 ? P[4] : HB.mau('ok')) + '"></i></div>' +
            '<div class="t-sub">' + HT.fmt.pct(pc) + '</div></td>' +
          '<td class="num">' + (x.balance <= 0 ? '—' : soKy == null
            ? '<span class="nil">' + HM.esc(c.lang === 'vi' ? 'chưa phát sinh' : 'no earnings') + '</span>'
            : HM.esc(String(soKy))) + '</td></tr>';
      }).join('') + '</tbody></table></div>',
    chan: HT.fmt.n(ds.length) + (c.lang === 'vi' ? ' bên nhận có tạm ứng · hiện 60 dòng đầu'
                                                 : ' payees with advances · first 60 shown')
  });

  return html;
}

/* =====================================================================
   TAB 4 — GHI NHẬN 12 KỲ
   ===================================================================== */
function veGhiNhan(c) {
  var A = c.A, t = c.t, P = HB.dayMau();
  var ds = HM.nho(A, 'ghinhan12', function () {
    return A.periods.map(function (p, i) {
      var r = A.agg('admin', 0, i, 'rec');
      var pub = A.pubLoaded(i) ? A.agg('admin', 0, i, 'pub') : null;
      var pf = pub ? Math.round(pub.gross * A.cfg.PUB_FEE * 100) / 100 : 0;
      return { p: p, gross: r.gross, fee: r.fee, labelCut: r.labelCut,
               producer: r.producer, artist: r.artist, streams: r.streams,
               pubGross: pub ? pub.gross : 0, pubFee: pf,
               treo: A.queue.pendingTotal(p.k), duyet: A.isApproved(p.k) };
    });
  });
  var tg = ds.reduce(function (s, r) {
    s.gross += r.gross; s.fee += r.fee; s.labelCut += r.labelCut;
    s.producer += r.producer; s.artist += r.artist;
    s.pubGross += r.pubGross; s.pubFee += r.pubFee; s.treo += r.treo;
    return s;
  }, { gross: 0, fee: 0, labelCut: 0, producer: 0, artist: 0, pubGross: 0, pubFee: 0, treo: 0 });

  var html = HM.the({
    h2: HM.esc(t('tGhi')),
    p: c.lang === 'vi'
      ? 'Doanh thu Haustek thật sự ghi nhận là <b>phí</b>, không phải doanh thu gộp. Gộp chỉ chảy qua tài khoản — phần lớn nó là tiền của người khác.'
      : 'Haustek’s recognised revenue is the <b>fee</b>, not gross. Gross merely flows through the account — most of it is other people’s money.',
    than: HM.so([
      { l: c.lang === 'vi' ? 'Gộp 12 kỳ' : 'Gross, 12 periods', v: c.tien(tg.gross + tg.pubGross) },
      { l: c.lang === 'vi' ? 'Doanh thu Haustek' : 'Haustek revenue', v: c.tien(tg.fee + tg.pubFee), lon: true,
        mau: HB.mau('ok') },
      { l: t('bienPhi'), v: HT.fmt.pct((tg.fee + tg.pubFee) / (tg.gross + tg.pubGross || 1)) },
      { l: c.lang === 'vi' ? 'Còn treo chưa có chủ' : 'Still ownerless', v: c.tien(tg.treo), mau: HB.mau('warn') }
    ]) +
    '<div style="margin-top:14px">' + HB.o({
      loai: 'cot', cao: 240,
      truc: A.periods.map(function (p) { return p.label; }),
      tieuDeTip: function (i) { return 'Kỳ ' + A.periods[i].label + (ds[i].duyet ? ' · đã duyệt' : ' · chưa duyệt'); },
      dangDo: ds.map(function (r, i) { return r.duyet ? -1 : i; }).filter(function (i) { return i >= 0; }),
      noiBat: c.ky.idx,
      chuoi: [
        { ten: t('dtPhi'), gt: ds.map(function (r) { return Math.round((r.fee + r.pubFee) * 100) / 100; }), mau: P[5] },
        { ten: c.lang === 'vi' ? 'Phải trả label' : 'Payable to labels', gt: ds.map(function (r) { return r.labelCut; }), mau: P[1] },
        { ten: c.lang === 'vi' ? 'Phải trả producer' : 'Payable to producers', gt: ds.map(function (r) { return r.producer; }), mau: P[2] },
        { ten: c.lang === 'vi' ? 'Phải trả nghệ sĩ' : 'Payable to artists', gt: ds.map(function (r) { return r.artist; }), mau: P[0] },
        { ten: c.lang === 'vi' ? 'Phải trả tác giả' : 'Payable to writers',
          gt: ds.map(function (r) { return Math.round((r.pubGross - r.pubFee) * 100) / 100; }), mau: P[3] }
      ]
    }) + '</div>'
  });

  html += HM.the({
    thoBody: true,
    than: '<div class="tw"><table class="t"><thead><tr>' +
      '<th>' + (c.lang === 'vi' ? 'Kỳ' : 'Period') + '</th>' +
      '<th class="num">' + HM.esc(t('dtGop')) + '</th>' +
      '<th class="num band">' + HM.esc(t('dtPhi')) + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Label' : 'Labels') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Producer' : 'Producers') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Nghệ sĩ' : 'Artists') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Tác quyền' : 'Publishing') + '</th>' +
      '<th class="num">' + (c.lang === 'vi' ? 'Treo' : 'Held') + '</th>' +
      '<th>' + (c.lang === 'vi' ? 'Sổ' : 'Books') + '</th></tr></thead><tbody>' +
      ds.slice().reverse().map(function (r) {
        return '<tr class="pick" data-kyto="' + r.p.k + '"' +
          (r.p.k === c.kyKey ? ' style="box-shadow:inset 3px 0 0 var(--accent)"' : '') + '>' +
          '<td class="mono">' + HM.esc(r.p.label) + '</td>' +
          '<td class="num">' + HM.esc(c.tien(r.gross + r.pubGross)) + '</td>' +
          '<td class="num band">' + HM.esc(c.tien(r.fee + r.pubFee)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien(r.labelCut)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien(r.producer)) + '</td>' +
          '<td class="num">' + HM.esc(c.tien(r.artist)) + '</td>' +
          '<td class="num">' + (r.pubGross > 0 ? HM.esc(c.tien(r.pubGross - r.pubFee)) : '<span class="nil">—</span>') + '</td>' +
          '<td class="num">' + (r.treo > 0.004 ? '<span class="tag warn">' + HM.esc(c.tien(r.treo)) + '</span>' : '<span class="nil">—</span>') + '</td>' +
          '<td>' + (r.duyet ? HM.tag(c.lang === 'vi' ? 'đã khoá' : 'closed', 'ok')
            : HM.tag(c.lang === 'vi' ? 'đang mở' : 'open', 'warn')) + '</td></tr>';
      }).join('') + '</tbody><tfoot><tr><td>' + HM.esc(t('tongCong')) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.gross + tg.pubGross)) + '</td>' +
      '<td class="num band">' + HM.esc(c.tien(tg.fee + tg.pubFee)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.labelCut)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.producer)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.artist)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.pubGross - tg.pubFee)) + '</td>' +
      '<td class="num">' + HM.esc(c.tien(tg.treo)) + '</td><td></td></tr></tfoot></table></div>'
  });

  return html;
}

/* =====================================================================
   TAB 5 — THUẾ & KHẤU TRỪ

      '<label class="fld" style="margin-top:12px">' + HM.esc(c.t('hoiGhi')) + '</label>' +
      '<input class="in" data-o="ghi" value="' + HM.esc(cu ? cu.note : '') + '" placeholder="' +
      HM.esc(c.lang === 'vi' ? 'VD: tạm ứng sản xuất album, phụ lục HĐ 12.03.2026' : '') + '">',
    dong: cu ? c.CHU[c.lang].save : c.t('themUng'),

    HM.quenHet(); c.veLai();
  });
}
