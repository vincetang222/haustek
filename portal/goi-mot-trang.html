/* =====================================================================
   24. API CHO KHÁCH — thứ DUY NHẤT dashboard được gọi
   ---------------------------------------------------------------------
   Ba luật của tầng này:
     1. Chỉ trả về kỳ ĐÃ DUYỆT. Kỳ chưa đối chiếu xong thì khách không
        thấy con số nào, kể cả số đúng.
     2. Chỉ trả về dòng thuộc phạm vi của người gọi, và kiểm tra lại
        phạm vi ở mọi lời gọi — kể cả khi giao diện đã lọc rồi.
     3. Mọi phép tính xong ở đây. Trình duyệt khách nhận số, không nhận
        công thức, không nhận tỷ lệ gốc, không nhận tên đơn vị phân phối.
   ===================================================================== */
function scrub(payload) {
  const s = JSON.stringify(payload);
  for (const bad of FORBIDDEN) {
    if (s.toLowerCase().includes(String(bad).toLowerCase())) {
      throw new Error("Chặn ở tầng API: payload chứa thông tin nội bộ (" + bad + ")");
    }
  }
  payload._bytes = s.length;
  return payload;
}
function assertParty(role, partyId) {
  if (role === "label") { if (!(partyId >= 0 && partyId < CFG.N_LABELS)) throw new Error("Không có quyền"); }
  else if (role === "artist") { if (!(partyId >= 0 && partyId < CFG.N_ARTISTS)) throw new Error("Không có quyền"); }
  else throw new Error("Vai trò không hợp lệ ở cổng khách");
}
function inScope(role, partyId, stream, i) {
  const sc = scopeOf(role, partyId, stream);
  if (!sc) return false;
  for (let k = 0; k < sc.length; k++) if (sc[k] === i) return true;
  return false;
}
function approvedPeriods() { return PERIODS.filter(p => !!state.approved[p.k]); }
function requireApproved(periodKey) {
  const pi = pIndexOf(periodKey);
  if (pi < 0 || !state.approved[periodKey]) throw new Error("Kỳ này chưa mở — chưa duyệt xong");
  return pi;
}

const api = {
  /* đọc lại quyết định mới nhất của admin (khi intranet vừa duyệt xong) */
  refresh() { const s = store.load(); if (s) { state = s; invalidateRates(); rebuildMatchIndex(); } return !!s; },

  /* Bản mẫu: liệt kê những tài khoản đã được cấp, để mô phỏng bước đăng
     nhập. Hệ thật KHÔNG có hàm này — trang đăng nhập không bao giờ nói cho
     ai biết những ai đang có tài khoản. */
  demoLogins() {
    return scrub({ accounts: state.accounts
      .filter(a => a.role !== "admin" && a.partyKey && a.status !== "suspended")
      .map(a => {
        const id = +a.partyKey.slice(2), isL = a.partyKey[0] === "L";
        const who = isL ? LABELS[id] : ARTISTS[id];
        if (!who) return null;
        return { email: a.email, role: a.role, partyId: id, name: who.name,
                 clientId: who.clientId, status: a.status,
                 kind: isL ? "label" : (who.labelId >= 0 ? "artist-label" : "artist-indie") };
      }).filter(Boolean) });
  },

  session(role, partyId) {
    assertParty(role, partyId);
    const isLabel = role === "label";
    const me = isLabel ? LABELS[partyId] : ARTISTS[partyId];
    const recCount = isLabel ? idxOf(byLabel, partyId).length : idxOf(byArtist, partyId).length;
    const pubCount = isLabel ? 0 : idxOf(byWriter, partyId).length;
    return scrub({
      role, partyId, clientId: me.clientId, name: me.name,
      belongsTo: isLabel ? null : (me.labelId >= 0 ? LABELS[me.labelId].name : "Độc lập"),
      independent: isLabel ? false : me.labelId < 0,
      hasRecording: recCount > 0,
      /* Tác quyền thuộc người sáng tác, không đi qua label — mục 2.3 */
      hasPublishing: !isLabel && pubCount > 0,
      trackCount: recCount, compositionCount: pubCount,
      currency: "USD", fxNote: "Số liệu tính bằng USD · tỷ giá quy đổi chốt tại thời điểm duyệt kỳ"
    });
  },

  periods(role, partyId) {
    assertParty(role, partyId);
    const open = approvedPeriods().map(p => ({
      k: p.k, label: p.label, approvedAt: state.approved[p.k].at
    }));
    const waiting = PERIODS.filter(p => !state.approved[p.k]).map(p => ({ k: p.k, label: p.label }));
    /* Tác quyền về theo quý và về trễ, nên rất nhiều kỳ đơn giản là không
       có báo cáo nào — khách phải biết điều đó, không thì họ tưởng mất tiền. */
    const pubOpen = PERIODS.filter(p => state.approved[p.k] && pubLoaded(p.idx)).map(p => ({ k: p.k, label: p.label }));
    return scrub({ open, waiting, pubOpen, latest: open.length ? open[open.length - 1].k : null });
  },

  summary(role, partyId, periodKey, stream) {
    assertParty(role, partyId);
    const p = requireApproved(periodKey);
    stream = stream === "pub" ? "pub" : "rec";
    chanTacQuyenChoLabel(role, stream);
    const a = agg(role, partyId, p, stream);
    const prevIdx = approvedPeriods().map(x => x.idx).filter(x => x < p).pop();
    const prev = prevIdx != null ? agg(role, partyId, prevIdx, stream) : null;
    const partyKey = role === "label" ? "L:" + partyId : "A:" + partyId;
    const advOpening = state.advances[partyKey] ? state.advances[partyKey].opening : 0;
    const advLeft = advanceBalance(partyKey);
    const payoutRow = (state.payouts[periodKey] || []).find(r => r.partyKey === partyKey) || null;

    /* chuỗi "Tiền đi đâu" — máy chủ quyết định có những chặng nào */
    const chain = [];
    if (stream === "rec") {
      chain.push({ key: "gross", label: role === "label" ? "Doanh thu gộp nghệ sĩ trong label" : "Doanh thu gộp bài của bạn",
                   value: a.gross, note: "trước mọi khoản trừ", kind: "top" });
      chain.push({ key: "fee", label: "Phí Haustek", value: -a.fee,
                   note: fmt.pct(CFG.HAUSTEK_FEE) + " doanh thu gộp · theo hợp đồng", kind: "out" });
      if (role === "label") {
        chain.push({ key: "artist", label: "Trả cho nghệ sĩ", value: -cents(a.artist + a.producer),
                     note: "theo tỷ lệ bạn đặt, tính theo tỷ lệ có hiệu lực trong kỳ", kind: "out" });
        chain.push({ key: "final", label: "Label giữ lại", value: a.labelCut, note: "phần của bạn kỳ này", kind: "final" });
      } else {
        const me = ARTISTS[partyId];
        chain.push({ key: "cut", label: me.labelId >= 0 ? "Phần label giữ" : "Phần Haustek giữ thêm",
                     value: -a.labelCut,
                     note: me.labelId >= 0 ? LABELS[me.labelId].name : "theo hợp đồng độc lập", kind: "out" });
        if (a.producer > 0.005)
          chain.push({ key: "producer", label: "Điểm producer", value: -a.producer,
                       note: "trừ vào phần của bạn, không cộng thêm bên trên", kind: "out" });
        if (advLeft > 0 || (payoutRow && payoutRow.recoup > 0)) {
          /* Thu hồi tạm ứng chạy ở cấp BÊN NHẬN — gộp cả doanh thu bản ghi
             lẫn tác quyền lẫn phần dồn từ kỳ trước. Nhưng chuỗi này chỉ nói
             về MỘT dòng tiền, nên phải lấy đúng phần thu hồi rơi vào dòng
             tiền đó, chia theo tỷ lệ đóng góp. Bê nguyên con số cấp bên nhận
             xuống đây là để tiền tác quyền chui vào cột bản ghi, và chuỗi
             cộng lại không ra dòng cuối — đúng cái mà cả khối này sinh ra để
             trả lời. */
          const recAll = payoutRow ? payoutRow.recoup : Math.min(advLeft, a.artist);
          const earnedAll = payoutRow ? payoutRow.earned : a.artist;
          const phan = earnedAll > 0 ? Math.min(a.artist / earnedAll, 1) : 1;
          const rec = Math.min(cents(recAll * phan), a.artist);
          const conNo = payoutRow ? payoutRow.advanceLeft : Math.max(advLeft - recAll, 0);
          const camCaHai = payoutRow && payoutRow.earned > a.artist + 0.005;
          chain.push({ key: "recoup", label: "Trừ vào khoản tạm ứng", value: -rec,
                       note: "đã ứng " + fmt.usd0(advOpening) + " · còn phải thu hồi " + fmt.usd0(conNo)
                           + (camCaHai ? " · phần thu hồi tính trên cả doanh thu bản ghi lẫn tác quyền, đây là phần rơi vào dòng này" : ""),
                       kind: "out" });
          chain.push({ key: "final", label: "Thực nhận kỳ này", value: cents(a.artist - rec),
                       note: conNo <= 0 ? "đã thu hồi xong khoản tạm ứng" : "đang trừ dần vào khoản tạm ứng", kind: "final" });
        } else {
          chain.push({ key: "final", label: "Về tay bạn", value: a.artist, note: "số tiền kỳ này", kind: "final" });
        }
      }
    } else {
      const net = cents(a.gross - a.fee);
      chain.push({ key: "gross", label: "Tác quyền thu được", value: a.gross, note: "từ VCPMC, The MLC và các tổ chức khác", kind: "top" });
      chain.push({ key: "fee", label: "Phí quản lý", value: -a.fee, note: fmt.pct(CFG.PUB_FEE), kind: "out" });
      if (net - a.total > 0.005)
        chain.push({ key: "co", label: "Phần đồng tác giả", value: -cents(net - a.total), note: "theo phần sáng tác đã đăng ký", kind: "out" });
      chain.push({ key: "final", label: "Về tay bạn", value: a.total, note: "số tiền kỳ này", kind: "final" });
    }

    /* Kỳ trống vì hai lý do rất khác nhau: chưa có báo cáo về (tác quyền
       theo quý), hay có báo cáo mà bài của người này không phát sinh gì.
       Nói nhầm lý do là làm người ta hoang mang vô cớ. */
    let emptyReason = null, nextPub = null;
    if (a.gross <= 0) {
      if (stream === "pub") {
        if (!pubLoaded(p)) {
          emptyReason = "Tác quyền về theo quý, không phải hằng tháng — kỳ này chưa có tổ chức nào báo cáo.";
          const withPub = PERIODS.filter(x => state.approved[x.k] && pubLoaded(x.idx));
          const before = withPub.filter(x => x.idx < p).pop() || withPub[withPub.length - 1];
          nextPub = before ? { k: before.k, label: before.label } : null;
        } else emptyReason = "Kỳ này có báo cáo tác quyền, nhưng chưa bài nào của bạn phát sinh.";
      } else {
        emptyReason = "Kỳ này chưa bài nào của bạn phát sinh doanh thu.";
      }
    }
    /* Tỷ giá của kỳ KHÔNG phải bí mật — đó là tỷ giá dùng để trả tiền cho
       chính người đang xem, họ có quyền biết. Gửi kèm cả ngày khoá: đọc
       lại báo cáo cũ sau nửa năm vẫn phải ra đúng con số đã chuyển đi. */
    const lockedFx = state.fx.locked[periodKey] || null;
    return scrub({
      periodKey, stream, emptyReason, nextPub,
      fx: { rate: lockedFx ? lockedFx.rate : state.fx.rate,
            at: lockedFx ? lockedFx.at : null,
            locked: !!lockedFx },
      total: a.total, gross: a.gross, streams: a.streams, tracks: a.tracks,
      prevTotal: prev ? prev.total : null, prevStreams: prev ? prev.streams : null,
      prevLabel: prevIdx != null ? PERIODS[prevIdx].label : null,
      chain,
      advance: advOpening > 0 ? {
        opening: advOpening, left: payoutRow ? payoutRow.advanceLeft : advLeft,
        recoupedThisPeriod: payoutRow ? payoutRow.recoup : 0,
        periodsLeft: (() => {
          const left = payoutRow ? payoutRow.advanceLeft : advLeft;
          const rate = payoutRow ? payoutRow.recoup : Math.min(advLeft, a.artist);
          return left <= 0 ? 0 : Math.max(1, Math.ceil(left / Math.max(rate, 1)));
        })()
      } : null,
      /* Khối này ở cấp BÊN NHẬN: một lần chi trả cho cả hai dòng tiền cộng
         lại, không phải riêng dòng đang xem. Nói rõ ra, đừng để người đọc
         cộng nhầm nó vào chuỗi phía trên. */
      payout: payoutRow ? { payable: payoutRow.payable, carryOut: payoutRow.carryOut,
        earnedAllStreams: payoutRow.earned, carryIn: payoutRow.carryIn,
        coversBothStreams: payoutRow.earned > a.artist + 0.005,
        threshold: CFG.PAYOUT_MIN,
        note: payoutRow.payable > 0 ? "sẽ chi trong kỳ chi trả tới"
          : (payoutRow.carryOut > 0 ? "dưới ngưỡng " + fmt.usd0(CFG.PAYOUT_MIN) + " — dồn sang kỳ sau" : "") } : null,
      approvedAt: state.approved[periodKey].at
    });
  },

  trend(role, partyId, stream) {
    assertParty(role, partyId);
    stream = stream === "pub" ? "pub" : "rec";
    chanTacQuyenChoLabel(role, stream);
    return scrub({ points: PERIODS.map(p => state.approved[p.k]
      ? { k: p.k, label: p.label, value: agg(role, partyId, p.idx, stream).total, open: true }
      : { k: p.k, label: p.label, value: null, open: false }) });
  },

  breakdown(role, partyId, periodKey, stream, dim, opts) {
    assertParty(role, partyId);
    const p = requireApproved(periodKey);
    stream = stream === "pub" ? "pub" : "rec";
    chanTacQuyenChoLabel(role, stream);
    const isTerr = dim === "terr";
    /* Khách chỉ thấy tên CỬA HÀNG — thứ họ vốn đã biết. Không có tên đơn
       vị phân phối, không có "luồng dữ liệu" nào ở đây: đó là chuyện vận
       hành nội bộ của Haustek. */
    const names = isTerr ? TERR : (stream === "rec" ? STORES : PUBSRC);
    const wts   = isTerr ? TERR_W : (stream === "rec" ? STORE_W : PUBSRC_W);
    const acc = new Float64Array(names.length);
    const sc = scopeOf(role, partyId, stream), n = sc ? sc.length : 0;
    const cap = Math.min(n, 9000), step = Math.max(1, Math.floor(n / cap));
    let scale = 0;
    for (let k = 0; k < n; k += step) {
      const i = sc[k];
      const m = mineOf(i, p, role, partyId, stream);
      if (m <= 0) continue;
      scale += m;
      const parts = splitDim(i, m, wts);
      for (let j = 0; j < names.length; j++) acc[j] += parts[j];
    }
    const total = agg(role, partyId, p, stream).total;
    const norm = scale > 0 ? total / scale : 0;
    let list = names.map((s, j) => ({ name: s, value: cents(acc[j] * norm) })).filter(x => x.value > 0.004);
    list.sort((a, b) => b.value - a.value);
    const topN = (!isTerr && stream === "rec") ? N_TOP : list.length;
    /* Mở rộng thì hiện nhiều dòng hơn, nhưng KHÔNG được cắt mất tiền: phần
       đuôi bị cắt vẫn phải nằm lại một dòng. Cắt trắng là khách bấm "xem tất
       cả" rồi thấy tổng hụt gần 10% so với lúc thu gọn — không có cách nào
       giải thích được chuyện đó. */
    const N_HIEN = (opts && opts.all) ? 40 : topN;
    const hien = list.slice(0, N_HIEN);
    const duoi = list.slice(N_HIEN);
    let tail = duoi.length
      ? { count: duoi.length, value: cents(duoi.reduce((s, x) => s + x.value, 0)) }
      : null;
    /* Bóc 218 cửa hàng rồi làm tròn từng dòng tới xu thì tổng lệch vài xu
       so với con số ở ô lớn — nhỏ, nhưng đây là báo cáo tiền, và người đọc
       cộng tay được. Dồn phần dư vào dòng "còn lại" (hoặc dòng lớn nhất nếu
       không có dòng nào bị gộp) để bảng luôn cộng đúng tuyệt đối. */
    const dangCo = cents(hien.reduce((x, r) => x + r.value, 0) + (tail ? tail.value : 0));
    const du = cents(total - dangCo);
    if (Math.abs(du) > 0.004) {
      if (tail) tail.value = cents(tail.value + du);
      else if (hien.length) hien[0].value = cents(hien[0].value + du);
    }
    return scrub({
      dim, rows: hien, tail,
      shown: hien.length, totalStores: list.length, expanded: !!(opts && opts.all)
    });
  },

  tracks(role, partyId, periodKey, stream, opts) {
    assertParty(role, partyId);
    const p = requireApproved(periodKey);
    stream = stream === "pub" ? "pub" : "rec";
    chanTacQuyenChoLabel(role, stream);
    opts = opts || {};
    const q = (opts.q || "").trim().toLowerCase();
    const sc = scopeOf(role, partyId, stream), n = sc ? sc.length : 0;
    const rows = [];
    for (let k = 0; k < n; k++) {
      const i = sc[k];
      const g = grossOf(i, p, stream);
      if (g <= 0) continue;
      if (q && !(tTitle[i].toLowerCase().includes(q) || tIsrc[i].toLowerCase().includes(q)
                 || ARTISTS[tArtist[i]].name.toLowerCase().includes(q))) continue;
      rows.push({
        id: i, title: tTitle[i], isrc: tIsrc[i], type: TYPES[tType[i]],
        artist: ARTISTS[tArtist[i]].name,
        streams: stream === "rec" ? recStreams[i * P + p] : null,
        gross: cents(g),
        mine: mineOf(i, p, role, partyId, stream)
      });
    }
    const key = opts.sort || "mine", dir = opts.dir === 1 ? 1 : -1;
    rows.sort((a, b) => {
      const A = a[key], B = b[key];
      return typeof A === "string" ? A.localeCompare(B, "vi") * dir : ((A || 0) - (B || 0)) * dir;
    });
    return scrub({ total: rows.length, rows });
  },

  trackDetail(role, partyId, periodKey, stream, trackId) {
    assertParty(role, partyId);
    const p = requireApproved(periodKey);
    stream = stream === "pub" ? "pub" : "rec";
    chanTacQuyenChoLabel(role, stream);
    const i = +trackId;
    /* kiểm tra quyền lần nữa ở đây, không tin giao diện đã lọc đúng */
    if (!inScope(role, partyId, stream, i)) throw new Error("Bản ghi này không thuộc phạm vi của bạn");
    const g = grossOf(i, p, stream);
    const m = mineOf(i, p, role, partyId, stream);
    const names = stream === "rec" ? STORES : PUBSRC, wts = stream === "rec" ? STORE_W : PUBSRC_W;
    const bySrc = splitDim(i, m, wts), byTerr = splitDim(i, m, TERR_W);
    const mk = (ns, vs) => ns.map((nm, j) => ({ name: nm, value: cents(vs[j]) }))
      .sort((a, b) => b.value - a.value).slice(0, 8).filter(x => x.value > 0.004);
    const out = {
      id: i, title: tTitle[i], isrc: tIsrc[i], type: TYPES[tType[i]],
      artist: ARTISTS[tArtist[i]].name,
      streams: stream === "rec" ? recStreams[i * P + p] : null,
      gross: cents(g), mine: m,
      byStore: mk(names, bySrc), byTerritory: mk(TERR, byTerr), steps: []
    };
    if (stream === "rec") {
      const s = splitRec(i, g, periodKey);
      out.steps = [
        { label: "Doanh thu gộp", value: s.gross },
        { label: "Phí Haustek", value: -s.fee },
        { label: tLabel[i] >= 0 ? "Label giữ" : "Haustek giữ thêm", value: -s.labelCut }
      ];
      if (s.producer > 0.004) out.steps.push({ label: "Điểm producer", value: -s.producer });
      out.steps.push({ label: role === "label" ? "Về tay nghệ sĩ" : "Về tay bạn", value: s.artist, strong: true });
      if (role === "label") out.steps = [
        { label: "Doanh thu gộp", value: s.gross },
        { label: "Phí Haustek", value: -s.fee },
        { label: "Trả cho nghệ sĩ", value: -cents(s.artist + s.producer) },
        { label: "Label giữ", value: s.labelCut, strong: true }
      ];
    } else {
      const share = writerShare(i, partyId);
      out.steps = [
        { label: "Tác quyền thu được", value: cents(g) },
        { label: "Phí quản lý", value: -cents(g * CFG.PUB_FEE) },
        { label: "Phần sáng tác của bạn", value: null, text: fmt.pct(share) },
        { label: "Về tay bạn", value: m, strong: true }
      ];
    }
    return scrub(out);
  }
};

/* =====================================================================
   25. TIỆN ÍCH GIAO DIỆN DÙNG CHUNG
   Bảng ảo hoá: chỉ vẽ chừng 30 dòng đang nhìn thấy, dù danh sách 50.000
   dòng. Cùng một hàm cho danh mục ở intranet và bảng bài ở dashboard.
   ===================================================================== */
function vtable(opts) {
  const body = opts.body, spacer = opts.spacer, head = opts.head;
  const RH = opts.rowHeight || 44;
  let rows = opts.rows || [], cols = opts.cols || [];
  function grid() { return cols.map(c => c.w).join(" "); }
  function paintHead() {
    if (!head) return;
    head.style.display = "grid";
    head.style.gridTemplateColumns = grid();
    head.innerHTML = cols.map(c =>
      `<span class="${c.num ? "num" : ""}" data-k="${esc(c.k)}">${esc(c.lab)}${
        opts.sortKey === c.k ? (opts.sortDir > 0 ? " ↑" : " ↓") : ""}</span>`).join("");
  }
  function paint() {
    const top = body.scrollTop, h = body.clientHeight;
    const first = Math.max(0, Math.floor(top / RH) - 4);
    const last = Math.min(rows.length, Math.ceil((top + h) / RH) + 4);
    let out = "";
    for (let r = first; r < last; r++) {
      out += `<div class="vt-row${opts.isSelected && opts.isSelected(rows[r]) ? " sel" : ""}" style="top:${r * RH}px;grid-template-columns:${grid()};display:grid" data-r="${r}">${opts.rowHTML(rows[r], r)}</div>`;
    }
    spacer.innerHTML = out;
  }
  function refresh(newRows, newCols) {
    if (newRows) rows = newRows;
    if (newCols) cols = newCols;
    spacer.style.height = (rows.length * RH) + "px";
    paintHead(); paint();
  }
  body.onscroll = () => { if (!body._raf) body._raf = requestAnimationFrame(() => { body._raf = 0; paint(); }); };
  refresh();
  return { refresh, paint, rowAt: r => rows[r], get length() { return rows.length; } };
}

/* biểu đồ cột 12 kỳ — dùng ở cả hai trang */
function barChart(canvas, points, opt) {
  opt = opt || {};
  const c = canvas.getContext("2d");
  const d = Math.min(devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect();
  const H = opt.height || 150;
  canvas.width = Math.max(r.width * d, 1); canvas.height = H * d;
  const W = canvas.width, HH = canvas.height;
  c.clearRect(0, 0, W, HH);
  const vals = points.map(p => p.value || 0);
  const peak = Math.max(...vals, 0.01);
  const padB = 22 * d, padT = 16 * d, bw = W / points.length;
  /* Ba trạng thái, đừng gộp làm hai:
       value == null   → chưa có số nào (cổng khách với kỳ chưa duyệt) → vạch cụt
       open === false  → có số nhưng chưa chốt (intranet) → cột viền đứt, vẫn đúng độ cao
       còn lại         → đã chốt → cột đặc
     Vẽ kỳ chưa chốt thành vạch cụt ở intranet là giấu mất thứ người vận
     hành cần nhìn nhất: kỳ đang làm dở to cỡ nào. */
  points.forEach((p, i) => {
    const h = (p.value || 0) / peak * (HH - padB - padT);
    const x = i * bw, y = HH - padB - h, cur = i === opt.current;
    const bx = x + bw * 0.2, bwid = bw * 0.6;
    if (p.value == null) {
      c.fillStyle = "#EDEEF2";
      c.fillRect(bx, HH - padB - 8 * d, bwid, 8 * d);
    } else if (p.open === false) {
      c.fillStyle = cur ? "#FFD8DF" : "#EDEEF2";
      c.fillRect(bx, y, bwid, Math.max(h, 0));
      c.strokeStyle = cur ? "#FF2E4C" : "#B6B7C2";
      c.lineWidth = 1.4 * d;
      if (c.setLineDash) c.setLineDash([3 * d, 2.6 * d]);
      c.strokeRect(bx + c.lineWidth / 2, y + c.lineWidth / 2, bwid - c.lineWidth, Math.max(h - c.lineWidth, 0));
      if (c.setLineDash) c.setLineDash([]);
    } else {
      c.fillStyle = cur ? "#FF2E4C" : "#D7D9E0";
      c.fillRect(bx, y, bwid, Math.max(h, 0));
    }
    if (cur && p.value > 0) {
      c.fillStyle = "#C8102E";
      c.font = `600 ${9.5 * d}px 'IBM Plex Mono',monospace`; c.textAlign = "center";
      c.fillText(fmt.usd0(p.value), x + bw / 2, Math.max(y - 5 * d, 12 * d));
    }
    c.fillStyle = cur ? "#C8102E" : (p.open === false ? "#B6B7C2" : "#8A8A99");
    c.font = `400 ${8.5 * d}px 'IBM Plex Mono',monospace`; c.textAlign = "center";
    c.fillText(String(p.label).slice(0, 2), x + bw / 2, HH - 7 * d);
  });
  c.fillStyle = "#E2E3E8"; c.fillRect(0, HH - padB, W, 1 * d);
}

/* =====================================================================
   26. ĐĂNG KÝ MÀN HÌNH (intranet nạp từng module vào đây)
   ===================================================================== */
const screens = [];
function registerScreen(def) {
  if (!def || !def.id || typeof def.render !== "function")
    throw new Error("Màn hình phải có id và hàm render(root, ctx)");
  screens.push(def);
}

/* =====================================================================
   26b. TRẠNG THÁI KHỞI ĐIỂM
   Mở bản mẫu lần đầu thì 10 kỳ đầu đã đối chiếu xong và đã duyệt — như
   một hệ thống đã chạy được gần một năm. Hai kỳ cuối cố tình để dở:
     · 06/2026 — đủ ba luồng nhưng đối chiếu còn lệch $41,37 ở YouTube
     · 07/2026 — chưa nạp TikTok
   Hai kỳ đó chính là việc phải làm ở màn hình "Đối chiếu & duyệt kỳ",
   và cũng là lý do dashboard của label / nghệ sĩ chưa thấy chúng.
   ===================================================================== */
if (FRESH) {
  for (let pi = 0; pi <= P - 3; pi++) {
    try {
      fx.lock(pi, 25800 + pi * 30);
      approve(pi, "ops@haustek-group.com", "Đối chiếu xong, đã duyệt");
      /* approve() đóng dấu thời điểm HIỆN TẠI — đúng cho lần duyệt thật,
         nhưng mười kỳ lịch sử duyệt lúc khởi tạo thì mang chung một dấu
         thời gian, và bảng kê của khách hiện mười kỳ cùng ngày chốt sổ.
         Đặt lại thành ngày hợp lý: khoảng ba tuần sau khi kỳ kết thúc,
         là lúc luồng cuối cùng về đủ và đối chiếu xong. */
      const p = PERIODS[pi];
      const d = new Date(p.year, p.month, 18 + (pi % 5), 9, 40 + (pi * 7) % 20);
      state.approved[p.k].at = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
        + "-" + String(d.getDate()).padStart(2, "0") + " "
        + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":00";
      state.fx.locked[p.k].at = state.approved[p.k].at.slice(0, 10);
    } catch (e) { console.warn("[haustek-core] không duyệt được kỳ " + PERIODS[pi].label + ": " + e.message); }
  }
  /* Những lần nạp trong lịch sử cũng phải để lại dấu vết, không thì mở
     nhật ký ra thấy trống trơn và tưởng hệ thống không ghi gì. */
  PERIODS.forEach((p, pi) => {
    FEEDS.forEach(f => {
      const st = state.feeds[p.k][f.id];
      if (st.status !== "loaded") return;
      state.audit.push({ at: String(st.at).replace("T", " "), action: "ingest.load",
        by: "ops@haustek-group.com",
        detail: "Nạp " + f.name + " · kỳ " + p.label + " · " + st.file });
    });
    const pb = state.pub[p.k];
    if (pb && pb.status === "loaded")
      state.audit.push({ at: String(pb.at).replace("T", " "), action: "ingest.pub",
        by: "ops@haustek-group.com", detail: "Nạp báo cáo tác quyền quý " + p.quarter + "/" + p.year + " · " + pb.file });
  });
  state.audit.sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : 0);
  state.audit = state.audit.slice(0, 120);
  store.save();
}

     Trong hệ thật, thứ tương đương là: những thứ này chưa bao giờ rời

  lockdown() {
    delete H.admin; delete H.screens; delete H.registerScreen;
    H.storage = { available: store.available };

var fx = 26150;

  n:  function (v) { return Math.round(v).toLocaleString('vi-VN'); },
  n1: function (v) { return v.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); },

  },
  usd0: function (v) {
    return (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('vi-VN');
  },
  vnd: function (v) { return Math.round(v * fx).toLocaleString('vi-VN') + ' ₫'; },
  tien: function (v, cur) { return cur === 'VND' ? fmt.vnd(v) : fmt.usd0(v); },
  tien2: function (v, cur) { return cur === 'VND' ? fmt.vnd(v) : fmt.usd(v); },

function hoiThoai(o) {
  return new Promise(function (xong) {
    /* Chỉ một hộp thoại tại một thời điểm. Chồng hai cái lên nhau thì
       cái dưới vẫn nhận phím Esc và vẫn trả về giá trị — người dùng bấm
       Huỷ một lần mà hai luồng cùng chạy tiếp. */
    var dangCo = document.querySelector('.modal-bg');
    if (dangCo) dangCo.remove();
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(o.tieuDe || '') + '</h3>' +
      (o.moTa ? '<p class="h">' + o.moTa + '</p>' : '') +
      '<div data-than>' + (o.than || '') + '</div>' +
      '<div class="modal-f">' +
        '<button type="button" class="btn" data-act="huy">' + esc(o.huy || CHU[lang].cancel) + '</button>' +
        (o.dong === false ? '' :
          '<button type="button" class="btn ' + (o.nguyHiem ? 'dang' : 'pri') + '" data-act="ok">' +
          esc(o.dong || CHU[lang].confirm) + '</button>') +
      '</div></div>';
    function tat(v) { bg.remove(); document.removeEventListener('keydown', phim); xong(v); }
    function phim(e) { if (e.key === 'Escape') tat(null); }
    bg.addEventListener('click', function (e) {
      if (e.target === bg) return tat(null);
      var b = e.target.closest('button[data-act]');

      if (b.dataset.act === 'huy') return tat(null);
      var form = {};
      bg.querySelectorAll('[data-o]').forEach(function (f) { form[f.dataset.o] = f.value; });

    if (dau) dau.focus();

  });

function nganTruot(noiDung, opt) {

  var cu = document.querySelector('.drawer');

  document.body.appendChild(dr);

  if (!bd) {

    document.addEventListener('keydown', function (e) {
      var d = document.querySelector('.drawer.on');
      if (e.key === 'Escape' && d) dongNgan();

  }
  dr.innerHTML = '<div class="drawer-h"><div style="flex:1;min-width:0">' +
      '<h3>' + esc((opt && opt.tieuDe) || '') + '</h3>' +
      ((opt && opt.phu) ? '<p>' + esc(opt.phu) + '</p>' : '') +
    '</div><button type="button" class="x" data-dong>' + icon('x') + '</button></div>' +
    '<div class="drawer-b">' + noiDung + '</div>';
  dr.querySelector('[data-dong]').addEventListener('click', dongNgan);
  /* Bật lớp ở khung hình sau, để trình duyệt kịp nhận thẻ mới rồi mới
     chạy hiệu ứng trượt — đặt ngay thì thẻ hiện ra không có chuyển động. */
  requestAnimationFrame(function () { dr.classList.add('on'); bd.classList.add('on'); });
  if (opt && opt.khiMo) opt.khiMo(dr);

/* ---------------------------------------------------------------------
   Bảng có sắp xếp + phân trang — dùng lại ở nhiều màn, viết một lần
   --------------------------------------------------------------------- */
function bang(o) {
  /* o: { cot:[{k,l,num,s,w}], dong:[], sort, dir, trang, co, veDong(d,i), chon(d) } */
  var st = { sort: o.sort, dir: o.dir == null ? -1 : o.dir, trang: 0, co: o.co || 25 };
  var host = o.host, loc = o.loc || function (d) { return d; };
  var api = {
    st: st,
    ve: ve,
    dong: function () { return loc(o.dong()); }
  };
  function sapXep(rows) {
    if (!st.sort) return rows;
    return rows.slice().sort(function (a, b) {
      var x = a[st.sort], y = b[st.sort];
      if (x == null) x = typeof y === 'string' ? '' : 0;
      if (y == null) y = typeof x === 'string' ? '' : 0;
      if (typeof x === 'string') return x.localeCompare(y, 'vi') * st.dir;
      return (x - y) * st.dir;
    });
  }
  function ve() {
    var rows = sapXep(loc(o.dong()));
    var het = Math.max(0, Math.ceil(rows.length / st.co) - 1);
    if (st.trang > het) st.trang = het;
    var a = st.trang * st.co, page = rows.slice(a, a + st.co);

      var on = st.sort === c.k;

        (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.l) +
        (on ? '<span class="ar">' + (st.dir > 0 ? '↑' : '↓') + '</span>' : '') + '</th>';
    }).join('');
    var tb = page.map(function (d, i) {
      return '<tr' + (o.chon ? ' class="pick"' : '') + ' data-r="' + (a + i) + '">' +
        o.veDong(d, a + i, st) + '</tr>';
    }).join('');

      '<div class="card-h" style="padding-bottom:12px"><div class="pager">' +
        '<button type="button" class="pg" data-tr="-1" ' + (st.trang === 0 ? 'disabled' : '') + '>' + icon('left') + '</button>' +
        '<button type="button" class="pg" data-tr="1" ' + (a + st.co >= rows.length ? 'disabled' : '') + '>' + icon('right') + '</button>' +
      '</div><div class="range">' + (rows.length ? fmt.n(a + 1) + '–' + fmt.n(Math.min(rows.length, a + st.co)) : '0') +
        ' ' + CHU[lang].of + ' ' + fmt.n(rows.length) + '</div>' +
      '<div class="sp"></div>' + (o.hanhDong || '') + '</div>' +
      (rows.length
        ? '<div class="tw"><table class="t"><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody>' +
          (o.chan ? '<tfoot>' + o.chan(rows) + '</tfoot>' : '') + '</table></div>'
        : '<div class="empty">' + icon('empty') + '<b>' + esc(o.rongTieuDe || '—') + '</b>' +
          '<span>' + esc(o.rongMoTa || '') + '</span>' +
          (o.rongNut ? '<div class="btnrow">' + o.rongNut + '</div>' : '') + '</div>') +
      '<div class="card-f">' + (o.chanChu ? o.chanChu(rows) : '') +
        '<span class="sp" style="flex:1"></span>' + CHU[lang].showing +
        ' <select class="inline-sel" data-co>' + [12, 25, 50, 100].map(function (n) {
          return '<option value="' + n + '"' + (n === st.co ? ' selected' : '') + '>' + n + '</option>';
        }).join('') + '</select> ' + CHU[lang].rows + '</div>';
    api.rows = rows;
  }
  host.addEventListener('click', function (e) {
    var th = e.target.closest('[data-sx]');
    if (th) {
      var k = th.getAttribute('data-sx');
      if (st.sort === k) st.dir = -st.dir;
      else { st.sort = k; var c = o.cot.filter(function (x) { return x.k === k; })[0]; st.dir = (c && c.num) ? -1 : 1; }
      st.trang = 0; return ve();
    }
    var tr = e.target.closest('[data-tr]');
    if (tr) { st.trang += +tr.getAttribute('data-tr'); return ve(); }
    var row = e.target.closest('tr[data-r]');
    if (row && o.chon) { var d = api.rows[+row.getAttribute('data-r')]; if (d) o.chon(d); }
  });
  host.addEventListener('change', function (e) {
    var s = e.target.closest('[data-co]');
    if (s) { st.co = +s.value; st.trang = 0; ve(); }
  });
  return api;
}

/* ---------------------------------------------------------------------
   Khởi động một cửa (intranet hoặc cổng khách)
   --------------------------------------------------------------------- */
function chay(cauHinh) {
  /* cauHinh: { ten, phu, kyDanhSach(), kyMacDinh, doiKy, chanTrai, coTienTe } */
  /* Gọi lúc trình duyệt còn đang đọc phần đầu trang thì document.body chưa
     tồn tại. Ở bản nhiều file điều đó không xảy ra vì thẻ script nằm trong
     body; ở bản gói một trang thì có. Đợi rồi chạy lại, thay vì ném lỗi. */
  if (!document.body) {
    document.addEventListener('DOMContentLoaded', function () { chay(cauHinh); });
    return null;
  }
  var kys = cauHinh.kyDanhSach();
  var kyHienTai = cauHinh.kyMacDinh != null ? cauHinh.kyMacDinh
                : (kys.length ? kys[kys.length - 1].k : null);
  var cur = 'USD';
  var manHienTai = null;

  function t(k) { return (CHU[lang] && CHU[lang][k]) || k; }

  function ctx() {
    var man = MAN.filter(function (m) { return m.id === manHienTai; })[0];
    return {
      lang: lang, cur: cur, kyKey: kyHienTai,
      ky: kys.filter(function (p) { return p.k === kyHienTai; })[0] || null,
      kys: kys,
      fmt: fmt, esc: esc, icon: icon, CHU: CHU,
      tien: function (v) { return fmt.tien(v, cur); },
      tien2: function (v) { return fmt.tien2(v, cur); },
      /* chữ của màn hình, thiếu thì rơi về chữ của khung */
      t: function (k) {
        if (man && man.chu && man.chu[lang] && man.chu[lang][k] != null) return man.chu[lang][k];
        return t(k);
      },
      doiKy: function (k) { kyHienTai = k; if (cauHinh.doiKy) cauHinh.doiKy(k); ve(); },
      di: function (id) { location.hash = '#' + id; },
      veLai: ve,
      thongBao: thongBao, hoiThoai: hoiThoai, xacNhan: xacNhan,
      nganTruot: nganTruot, dongNgan: dongNgan, bang: bang,
      A: cauHinh.A || null, api: cauHinh.api || null, phien: cauHinh.phien || null
    };
  }

  /* ---- khung HTML ---- */
  document.body.innerHTML =
    '<div class="app">' +
      '<aside class="side">' +
        '<div class="side-top"><div class="brand"><i></i>HAUSTEK <em data-ten></em></div></div>' +
        '<nav class="nav" data-nav></nav>' +
        '<div class="side-foot" data-chan></div>' +
      '</aside>' +
      '<div>' +
        '<header class="top">' +
          '<div class="crumb" data-crumb></div>' +
          '<div class="sp"></div>' +
          '<div class="top-note" data-note></div>' +
          '<select class="inline-sel" data-ky aria-label="Kỳ"></select>' +
          (cauHinh.coTienTe === false ? '' :
            '<div class="seg" data-cur>' +
              '<button type="button" data-c="USD" class="on">USD</button>' +
              '<button type="button" data-c="VND">VND</button></div>') +
          '<div class="seg" data-theme-sw>' +
            '<button type="button" data-th="auto" title="' + esc(t('themeAuto')) + '">' + icon('auto') + '</button>' +
            '<button type="button" data-th="light" title="' + esc(t('themeLight')) + '">' + icon('sun') + '</button>' +
            '<button type="button" data-th="dark" title="' + esc(t('themeDark')) + '">' + icon('moon') + '</button>' +
          '</div>' +
          '<div class="seg" data-lang>' +
            '<button type="button" data-l="vi">VI</button>' +
            '<button type="button" data-l="en">EN</button></div>' +
        '</header>' +
        '<main data-main></main>' +
      '</div>' +
    '</div>';

  var $ = function (s) { return document.querySelector(s); };

  /* Chữ của MỘT màn cụ thể.
     ctx().t() tra trong từ điển của màn ĐANG MỞ — đúng cho nội dung bên
     trong màn, nhưng sai cho cột điều hướng: cột đó liệt kê cả mười lăm
     màn, mà mỗi màn chỉ mang từ điển của chính nó. Tra bằng ctx().t() thì
     đứng ở màn Tổng quan sẽ thấy "navKeToan", "nhomTien" nằm nguyên trên
     màn hình. Nên ở đây tra theo từng màn một. */
  function chuCua(m, k) {
    if (m && m.chu && m.chu[lang] && m.chu[lang][k] != null) return m.chu[lang][k];
    return (CHU[lang] && CHU[lang][k]) || k;
  }
  /* Tên nhóm do một màn nào đó trong nhóm khai — lấy màn đầu tiên có khai. */
  function chuNhom(k) {
    for (var i = 0; i < MAN.length; i++) {
      var m = MAN[i];
      if (m.chu && m.chu[lang] && m.chu[lang][k] != null) return m.chu[lang][k];
    }
    return (CHU[lang] && CHU[lang][k]) || k;
  }

  function veNav() {
    var c = ctx(), nhom = [];
    MAN.forEach(function (m) {
      var g = nhom.filter(function (x) { return x.ten === (m.nhom || ''); })[0];
      if (!g) { g = { ten: m.nhom || '', muc: [] }; nhom.push(g); }
      g.muc.push(m);
    });
    $('[data-nav]').innerHTML = nhom.map(function (g) {
      return (g.ten ? '<div class="nav-grp">' + esc(chuNhom(g.ten)) + '</div>' : '') +
        g.muc.map(function (m) {
          var dem = '';
          try { dem = m.dem ? (m.dem(c) || '') : ''; } catch (e) { dem = ''; }
          var canh = dem && String(dem).indexOf('!') === 0;
          if (canh) dem = String(dem).slice(1);
          return '<a href="#' + m.id + '" class="' + (m.id === manHienTai ? 'on' : '') + '">' +
            icon(m.icon || 'grid') + '<span>' + esc(chuCua(m, m.nav || m.id)) + '</span>' +
            (dem !== '' ? '<span class="c' + (canh ? ' alert' : '') + '">' + esc(dem) + '</span>' : '') +
            '</a>';
        }).join('');
    }).join('');
  }

  function ve() {
    var id = (location.hash || '').replace('#', '') || (MAN[0] && MAN[0].id);
    var man = MAN.filter(function (m) { return m.id === id; })[0] || MAN[0];
    if (!man) return;
    manHienTai = man.id;
    var c = ctx();

    $('[data-ten]').textContent = c.t(cauHinh.ten);
    $('[data-crumb]').innerHTML = '<b>' + esc(c.t(cauHinh.ten)) + '</b> / ' + esc(c.t(man.nav || man.id));
    $('[data-note]').textContent = cauHinh.ghiChu ? cauHinh.ghiChu(c) : '';
    $('[data-chan]').innerHTML = cauHinh.chanTrai ? cauHinh.chanTrai(c) : '';

    var sel = $('[data-ky]');
    sel.innerHTML = kys.map(function (p) {
      return '<option value="' + esc(p.k) + '"' + (p.k === kyHienTai ? ' selected' : '') + '>' +
        esc(c.t('period')) + ' ' + esc(p.label) + (p.nhan ? ' · ' + esc(p.nhan) : '') + '</option>';
    }).reverse().join('');

    document.querySelectorAll('[data-th]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.th === theme);
    });
    document.querySelectorAll('[data-l]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.l === lang);
    });
    document.querySelectorAll('[data-c]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.c === cur);
    });

    veNav();
    dongNgan();
    /* Thay hẳn thẻ <main> chứ không chỉ xoá ruột nó.
       Màn hình gắn sự kiện theo uỷ nhiệm lên chính thẻ này (HM.bam). Nếu
       giữ lại thẻ cũ, mỗi lần vẽ lại là chồng thêm một bộ sự kiện nữa lên
       cùng một thẻ — bấm một lần mở ba hộp thoại. Thay thẻ thì bộ cũ chết
       theo thẻ cũ, không phải nhớ gỡ tay ở mười lăm màn. */
    var cu = $('[data-main]');
    var root = document.createElement('main');
    root.setAttribute('data-main', '');
    cu.replaceWith(root);
    try { man.ve(root, c); }
    catch (e) {
      root.innerHTML = '<div class="card"><div class="card-b"><h2>' + esc(c.t('errScreen')) +
        '</h2><p class="muted" style="margin:6px 0 10px">' + esc(e && e.message) + '</p>' +
        '<pre class="mono" style="white-space:pre-wrap;font-size:11px;color:var(--faint)">' +
        esc((e && e.stack || '').split('\n').slice(0, 6).join('\n')) + '</pre></div></div>';
      if (global.console) console.error(e);
    }
  }

  document.addEventListener('click', function (e) {
    var th = e.target.closest('[data-th]');
    if (th) { theme = th.dataset.th; ghiKho(LS_THEME, theme); apTheme(); return ve(); }
    var l = e.target.closest('[data-l]');
    if (l) { lang = l.dataset.l; ghiKho(LS_LANG, lang); return ve(); }
    var cu = e.target.closest('[data-c]');
    if (cu) { cur = cu.dataset.c; return ve(); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.closest('[data-ky]');
    if (k) { kyHienTai = k.value; if (cauHinh.doiKy) cauHinh.doiKy(kyHienTai); ve(); }
  });
  global.addEventListener('hashchange', ve);
  /* đổi cài đặt sáng/tối của máy khi đang để "theo máy" */
  if (global.matchMedia) {
    var mq = global.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (theme === 'auto') ve(); });
  }

  ve();
  return { veLai: ve, ctx: ctx };
}

global.HT = {
  dangKy: dangKy, man: MAN, chay: chay,
  fmt: fmt, esc: esc, icon: icon, IC: IC, CHU: CHU,
  thongBao: thongBao, hoiThoai: hoiThoai, xacNhan: xacNhan,
  nganTruot: nganTruot, dongNgan: dongNgan, bang: bang,
  setFx: setFx,
  get lang() { return lang; },
  get theme() { return theme; }
};

})(window);

</script>
<script>
/* =====================================================================
   HAUSTEK PORTAL v2 — BIỂU ĐỒ
   ---------------------------------------------------------------------
   Vẽ bằng SVG chứ không phải canvas, vì ba lý do:
     · màu lấy thẳng từ biến CSS, nên đổi sáng/tối là biểu đồ đổi theo,
       không phải vẽ lại bằng mã màu cứng;
     · từng cột là một phần tử thật, nên chỉ chuột và bàn phím đều chạm
       được — canvas thì phải tự tính toạ độ;
     · phóng to trang không vỡ nét.

   Cách dùng ở màn hình:
       root.innerHTML = '…' + HB.cot({ diem: […] }) + '…';
       HB.gan(root);          // đo bề ngang thật rồi vẽ
   Gọi HB.gan() một lần ở cuối hàm ve() là đủ cho mọi biểu đồ trong màn.
   ===================================================================== */
"use strict";
(function (global) {

var SO = 0;
var KHO = {};          /* id → cấu hình */
var DANG_TREO = [];    /* các biểu đồ đang gắn trên trang, để vẽ lại khi đổi bề ngang */

/* ---------------------------------------------------------------------
   Màu — đọc từ biến CSS mỗi lần vẽ, không nhớ lại.
   Nhớ lại là sai ngay lần đầu người dùng bấm nút đổi sáng/tối.
   --------------------------------------------------------------------- */
function mau(ten) {
  return getComputedStyle(document.documentElement).getPropertyValue('--' + ten).trim() || '#888';
}
function dayMau() {
  var s = getComputedStyle(document.documentElement), out = [];
  for (var i = 1; i <= 8; i++) out.push((s.getPropertyValue('--s' + i) || '').trim() || '#888');
  return out;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function so(v) { return Math.round(v).toLocaleString('vi-VN'); }
function usd0(v) { return (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('vi-VN'); }
/* Trục tung của báo cáo tiền: rút gọn tới mức đọc lướt được, nhưng không
   rút tới mức mất nghĩa. $1,2Tr thay cho $1.234.567 là được; $1Tr thì
   không, vì $1.4Tr cũng ra $1Tr. */
function gonTien(v) {
  var a = Math.abs(v);
  if (a >= 1e9) return (v < 0 ? '−' : '') + '$' + (a / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (v < 0 ? '−' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'Tr';
  if (a >= 1e3) return (v < 0 ? '−' : '') + '$' + Math.round(a / 1e3) + 'N';
  return usd0(v);
}
function gonSo(v) {
  var a = Math.abs(v);
  if (a >= 1e9) return (a / 1e9).toFixed(1).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'Tr';
  if (a >= 1e3) return Math.round(a / 1e3) + 'N';
  return so(v);
}

/* ---------------------------------------------------------------------
   Chọn mốc trục tung cho ra số tròn mắt người, không phải số máy tính
   --------------------------------------------------------------------- */
function mocTruc(dinh, n) {
  n = n || 4;
  if (!(dinh > 0)) return { moc: [0, 1], tran: 1 };
  var tho = dinh / n;
  var bac = Math.pow(10, Math.floor(Math.log(tho) / Math.LN10));
  var chuan = [1, 2, 2.5, 5, 10];
  var buoc = bac * 10;
  for (var i = 0; i < chuan.length; i++) {
    if (bac * chuan[i] >= tho) { buoc = bac * chuan[i]; break; }
  }
  var tran = Math.ceil(dinh / buoc) * buoc, moc = [];
  for (var v = 0; v <= tran + 1e-9; v += buoc) moc.push(v);
  return { moc: moc, tran: tran };
}

/* ---------------------------------------------------------------------
   Đăng ký một biểu đồ và trả về chỗ trống để nhét vào HTML
   --------------------------------------------------------------------- */
function o(cfg) {
  var id = 'bd' + (++SO);
  KHO[id] = cfg;
  return '<div class="bd" data-bd="' + id + '"' +
    (cfg.caoToiThieu ? ' style="min-height:' + cfg.caoToiThieu + 'px"' : '') + '></div>';
}

/* ---------------------------------------------------------------------
   Gắn: đo bề ngang thật của từng chỗ trống rồi vẽ
   --------------------------------------------------------------------- */
function gan(root) {
  root = root || document;
  DANG_TREO = DANG_TREO.filter(function (x) { return document.body.contains(x.el); });
  var ds = root.querySelectorAll('[data-bd]');
  for (var i = 0; i < ds.length; i++) {
    (function (el) {
      var cfg = KHO[el.getAttribute('data-bd')];
      if (!cfg) return;
      var mucNay = { el: el, cfg: cfg };
      DANG_TREO.push(mucNay);
      ve(el, cfg);
    })(ds[i]);
  }
}
function veLaiTatCa() {
  DANG_TREO = DANG_TREO.filter(function (x) { return document.body.contains(x.el); });
  DANG_TREO.forEach(function (x) { ve(x.el, x.cfg); });
}
var hen = null;
global.addEventListener('resize', function () {
  clearTimeout(hen);
  hen = setTimeout(veLaiTatCa, 140);
});

function ve(el, cfg) {
  var w = el.clientWidth || el.parentNode.clientWidth || 640;
  if (w < 80) w = 640;
  var f = LOAI[cfg.loai];
  if (!f) { el.innerHTML = ''; return; }
  el.innerHTML = f(cfg, w);
  if (cfg.sauKhiVe) cfg.sauKhiVe(el);
}

/* =====================================================================
   MÁCH NƯỚC (tooltip)
   Một hộp duy nhất cho cả trang, đi theo con trỏ. Nội dung nằm sẵn trong
   thuộc tính data-tip của từng cột — không phải tính lại lúc rê chuột.
   ===================================================================== */
var hopTip = null;
function oTip() {
  if (!hopTip) { hopTip = document.createElement('div'); hopTip.className = 'tip'; document.body.appendChild(hopTip); }
  return hopTip;
}
function datTip(html, x, y) {
  var t = oTip();
  t.innerHTML = html;
  t.classList.add('on');
  var r = t.getBoundingClientRect();
  var l = x + 14, tp = y - r.height - 12;
  if (l + r.width > innerWidth - 8) l = x - r.width - 14;
  if (tp < 8) tp = y + 18;
  t.style.left = Math.max(8, l) + 'px';
  t.style.top = tp + 'px';
}
function anTip() { if (hopTip) hopTip.classList.remove('on'); }

document.addEventListener('pointermove', function (e) {
  var g = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!g) { anTip(); return; }
  datTip(g.getAttribute('data-tip'), e.clientX, e.clientY);
}, true);
/* KHÔNG nghe pointerleave ở pha bắt (capture). pointerleave không nổi
   bọt, nhưng listener bắt trên document vẫn nhận được nó của MỌI phần tử
   con — nên rê chuột từ cột này sang cột kia là một lần "rời" và mách
   nước tắt ngay sau khi vừa bật. Rời khỏi vùng có mách nước đã được
   pointermove ở trên lo rồi; ở đây chỉ cần lo lúc con trỏ rời hẳn cửa sổ. */
document.documentElement.addEventListener('pointerleave', anTip);
document.addEventListener('scroll', anTip, true);

/* mách nước theo bàn phím: nhóm nào focus được thì hiện ngay tại chỗ nó */
document.addEventListener('focusin', function (e) {
  var g = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!g) return;
  var r = g.getBoundingClientRect();
  datTip(g.getAttribute('data-tip'), r.left + r.width / 2, r.top);
});
document.addEventListener('focusout', anTip);

function dongTip(ten, gt, mau2) {
  return '<span><i style="background:' + esc(mau2) + '"></i>' + esc(ten) +
    '<span class="r">' + esc(gt) + '</span></span>';
}

/* =====================================================================
   1. CỘT THEO KỲ  — có thể chồng nhiều chuỗi, có thể kèm một đường
   ---------------------------------------------------------------------
   cfg: {
     loai:'cot', truc:[nhãn…],
     chuoi:[{ten, gt:[…], mau}],           ← chồng lên nhau
     duong:{ten, gt:[…], mau, phai:true},  ← đường, có thể dùng trục phải
     cao, dinhDang:'tien'|'so', hienGiaTri, dangDo:[idx…], mo:[idx…],
     chuThich:true
   }
   Ba trạng thái của một cột, đừng gộp làm hai:
     · null           → chưa có số nào (kỳ khách chưa được mở) → vạch cụt
     · dangDo có idx  → có số nhưng chưa chốt → cột viền đứt
     · còn lại        → đã chốt → cột đặc
   ===================================================================== */
function veCot(cfg, W) {
  var H = cfg.cao || 210;
  var P = dayMau();
  var chuoi = (cfg.chuoi || []).map(function (s, i) {
    return { ten: s.ten, gt: s.gt, mau: s.mau || P[i % 8] };
  });
  var truc = cfg.truc || [];
  var n = truc.length;
  var dangDo = cfg.dangDo || [], mo = cfg.mo || [];
  var dinhDang = cfg.dinhDang === 'so' ? gonSo : gonTien;
  var dayDu = cfg.dinhDang === 'so' ? so : usd0;

  /* tổng theo cột để tính đỉnh */
  var tong = [], coSo = [];
  for (var i = 0; i < n; i++) {
    var t = 0, co = false;
    chuoi.forEach(function (s) { var v = s.gt[i]; if (v != null) { t += v; co = true; } });
    tong.push(t); coSo.push(co);
  }
  var dinh = Math.max.apply(null, tong.concat([0]));
  var tr = mocTruc(dinh, 4);
  var LE_T = 14, LE_D = 26, LE_P = 8;
  var LE_TR = cfg.anTruc ? 6 : 52;
  var cao = H - LE_T - LE_D;
  var rong = W - LE_TR - LE_P;
  var bcao = function (v) { return tr.tran > 0 ? v / tr.tran * cao : 0; };
  var bw = n ? rong / n : rong;
  var wcot = Math.min(bw * 0.62, 46);

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.moTa || '') + '">';

  /* lưới ngang + nhãn trục tung */
  tr.moc.forEach(function (v) {
    var y = LE_T + cao - bcao(v);
    s += '<line class="gl" x1="' + LE_TR + '" y1="' + y.toFixed(1) + '" x2="' + (W - LE_P) + '" y2="' + y.toFixed(1) + '"/>';
    if (!cfg.anTruc)
      s += '<text class="vl" x="' + (LE_TR - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        esc(v === 0 ? '0' : dinhDang(v)) + '</text>';
  });

  /* cột */
  for (var i2 = 0; i2 < n; i2++) {
    var x = LE_TR + i2 * bw + (bw - wcot) / 2;
    var duoi = LE_T + cao;
    var doTruc = dangDo.indexOf(i2) >= 0;
    var moCot = mo.indexOf(i2) >= 0;
    var noiBat = cfg.noiBat === i2;
    var dong = [];
    if (!coSo[i2]) {
      /* Vạch cụt "chưa có số". Dùng --bar-bg thì ở chế độ tối nó gần như
         trùng nền thẻ, và người đọc thấy một khoảng trống — trống có nghĩa
         là số 0, mà đây không phải số 0, đây là "chưa biết". Dùng đường
         viền để nó nhìn thấy được ở cả hai chế độ. */
      s += '<rect class="b" x="' + x.toFixed(1) + '" y="' + (duoi - 5) + '" width="' + wcot.toFixed(1) +
        '" height="5" rx="1.5" fill="' + mau('neutral-bar') + '"/>';
    } else {
      var y0 = duoi;
      chuoi.forEach(function (se) {
        var v = se.gt[i2] || 0;
        if (v <= 0) return;
        var h = bcao(v);
        y0 -= h;
        s += '<rect class="b" x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + wcot.toFixed(1) +
          '" height="' + Math.max(h, 0.8).toFixed(1) + '" rx="' + (h > 5 ? 2 : 0) + '"' +
          ' fill="' + se.mau + '"' + (moCot ? ' opacity=".42"' : '') +
          (doTruc ? ' stroke="' + se.mau + '" stroke-width="1.2" stroke-dasharray="3 2" fill-opacity=".2"' : '') + '/>';
        dong.push(dongTip(se.ten, dayDu(v), se.mau));
      });
      if (cfg.hienGiaTri && tong[i2] > 0) {
        s += '<text class="vl' + (noiBat ? ' big' : '') + '" x="' + (x + wcot / 2).toFixed(1) + '" y="' +
          (duoi - bcao(tong[i2]) - 6).toFixed(1) + '" text-anchor="middle">' + esc(dinhDang(tong[i2])) + '</text>';
      }
    }
    /* vùng bắt chuột phủ hết chiều cao, không phải chỉ phần cột — cột thấp
       thì không ai rê trúng được vài pixel */
    var tip = '<b>' + esc(cfg.tieuDeTip ? cfg.tieuDeTip(i2) : truc[i2]) + '</b>' +
      (coSo[i2] ? dong.join('') +
        (chuoi.length > 1 ? '<span class="r" style="float:none;display:block;margin-top:5px;' +
          'border-top:1px solid rgba(255,255,255,.16);padding-top:5px">' + esc(dayDu(tong[i2])) + '</span>' : '')
        : '<span class="d">' + esc(cfg.chuTrong || 'Chưa có số liệu') + '</span>') +
      (doTruc ? '<span class="d">Chưa duyệt kỳ — số còn chạy</span>' : '') +
      (cfg.ghiChuTip ? '<span class="d">' + esc(cfg.ghiChuTip(i2)) + '</span>' : '');
    s += '<g class="hz"' + (cfg.chon ? ' style="cursor:pointer"' : '') +
      ' data-tip="' + esc(tip) + '" data-i="' + i2 + '" tabindex="0">' +
      '<rect class="hit" x="' + (LE_TR + i2 * bw).toFixed(1) + '" y="' + LE_T + '" width="' + bw.toFixed(1) +
      '" height="' + cao + '"/></g>';
  }

  /* đường phủ lên trên (ví dụ: số lượt nghe so với tiền) */
  if (cfg.duong && n) {
    var d = cfg.duong, dinh2 = Math.max.apply(null, d.gt.map(function (v) { return v || 0; }).concat([0]));
    var mauD = d.mau || mau('s4');
    var pt = [], du = [];
    for (var j = 0; j < n; j++) {
      if (d.gt[j] == null) continue;
      var xx = LE_TR + j * bw + bw / 2;
      var yy = LE_T + cao - (dinh2 > 0 ? d.gt[j] / dinh2 * cao * 0.88 : 0);
      pt.push(xx.toFixed(1) + ',' + yy.toFixed(1));
      du.push('<circle class="dot2" cx="' + xx.toFixed(1) + '" cy="' + yy.toFixed(1) + '" r="3" fill="' + mauD + '"/>');
    }
    s += '<polyline class="ln" points="' + pt.join(' ') + '" stroke="' + mauD + '"/>' + du.join('');
  }

  /* nhãn trục hoành — nếu chật thì bỏ bớt, không xoay chữ */
  var buocNhan = Math.ceil(n / Math.max(1, Math.floor(rong / 46)));
  for (var i3 = 0; i3 < n; i3++) {
    if (i3 % buocNhan !== 0 && i3 !== n - 1 && cfg.noiBat !== i3) continue;
    s += '<text class="lb' + (cfg.noiBat === i3 ? ' on' : '') + '" x="' + (LE_TR + i3 * bw + bw / 2).toFixed(1) +
      '" y="' + (H - 9) + '" text-anchor="middle">' + esc(truc[i3]) + '</text>';
  }
  s += '<line class="ax" x1="' + LE_TR + '" y1="' + (LE_T + cao) + '" x2="' + (W - LE_P) + '" y2="' + (LE_T + cao) + '"/>';
  s += '</svg>';

  if (cfg.chuThich !== false && (chuoi.length > 1 || cfg.duong)) {
    s += '<div class="leg">' + chuoi.map(function (se) {
      return '<span><i style="background:' + se.mau + '"></i>' + esc(se.ten) + '</span>';
    }).join('') + (cfg.duong ? '<span><i style="background:' + (cfg.duong.mau || mau('s4')) +
      ';border-radius:50%"></i>' + esc(cfg.duong.ten) + '</span>' : '') + '</div>';
  }
  return s;
}

/* =====================================================================
   2. THANH NGANG XẾP HẠNG — cửa hàng, lãnh thổ, bên nhận
   cfg: { loai:'thanh', hang:[{ten, gt, phu, mau}], dinhDang, cao }
   ===================================================================== */
function veThanh(cfg, W) {
  var hang = cfg.hang || [];
  var dayDu = cfg.dinhDang === 'so' ? so : usd0;
  var dinh = Math.max.apply(null, hang.map(function (r) { return r.gt || 0; }).concat([0.0001]));
  var tong = hang.reduce(function (s2, r) { return s2 + (r.gt || 0); }, 0);
  var P = dayMau();
  return '<div class="bars' + (cfg.chon ? ' pick' : '') + '">' + hang.map(function (r, i) {
    var pc = dinh > 0 ? (r.gt || 0) / dinh : 0;
    var phanTram = tong > 0 ? (r.gt || 0) / tong : 0;
    return '<div class="row"' + (cfg.chon ? ' data-h="' + i + '" tabindex="0"' : '') +
      ' data-tip="' + esc('<b>' + esc(r.ten) + '</b>' +
        dongTip(cfg.tenTong || 'Doanh thu', dayDu(r.gt || 0), r.mau || P[i % 8]) +
        '<span class="d">' + (phanTram * 100).toFixed(1).replace('.', ',') + '% của phần đang xem' +
        (r.phu ? ' · ' + esc(r.phu) : '') + '</span>') + '">' +
      '<div class="nm">' + esc(r.ten) + (r.phu ? '<em>' + esc(r.phu) + '</em>' : '') +
      '<div class="bar"><i style="width:' + (pc * 100).toFixed(2) + '%;background:' +
      (r.mau || P[i % 8]) + '"></i></div></div>' +
      '<div class="vv">' + esc(dayDu(r.gt || 0)) +
      '<em>' + (phanTram * 100).toFixed(1).replace('.', ',') + '%</em></div></div>';
  }).join('') + '</div>';
}

/* =====================================================================
   3. VÒNG — chia phần. Chỉ dùng khi số phần ít (≤6) và tổng có nghĩa.
   cfg: { loai:'vong', phan:[{ten,gt,mau}], giua:{v,l}, cao }
   ===================================================================== */
function veVong(cfg, W) {
  var phan = (cfg.phan || []).filter(function (p) { return (p.gt || 0) > 0; });
  var tong = phan.reduce(function (s, p) { return s + p.gt; }, 0);
  var P = dayMau();
  var H = cfg.cao || 190;
  var R = Math.min(H, W) / 2 - 6, r0 = R * 0.62;
  var cx = R + 6, cy = H / 2;
  var dayDu = cfg.dinhDang === 'so' ? so : usd0;
  var goc = -Math.PI / 2, s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  phan.forEach(function (p, i) {
    var sw = tong > 0 ? p.gt / tong * Math.PI * 2 : 0;
    var g2 = goc + sw;
    var lon = sw > Math.PI ? 1 : 0;
    var x1 = cx + R * Math.cos(goc), y1 = cy + R * Math.sin(goc);
    var x2 = cx + R * Math.cos(g2), y2 = cy + R * Math.sin(g2);
    var x3 = cx + r0 * Math.cos(g2), y3 = cy + r0 * Math.sin(g2);
    var x4 = cx + r0 * Math.cos(goc), y4 = cy + r0 * Math.sin(goc);
    var mauP = p.mau || P[i % 8];
    s += '<g class="hz" tabindex="0" data-tip="' + esc('<b>' + esc(p.ten) + '</b>' +
      dongTip(cfg.tenTong || 'Số tiền', dayDu(p.gt), mauP) +
      '<span class="d">' + (p.gt / tong * 100).toFixed(1).replace('.', ',') + '% tổng</span>') + '">' +
      '<path class="b" fill="' + mauP + '" d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      'A' + R + ' ' + R + ' 0 ' + lon + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
      'L' + x3.toFixed(1) + ' ' + y3.toFixed(1) +
      'A' + r0 + ' ' + r0 + ' 0 ' + lon + ' 0 ' + x4.toFixed(1) + ' ' + y4.toFixed(1) + 'Z"/></g>';
    goc = g2;
  });
  if (cfg.giua) {
    s += '<text x="' + cx + '" y="' + (cy - 1) + '" text-anchor="middle" style="font-size:17px;font-weight:600;' +
      'fill:' + mau('ink') + '">' + esc(cfg.giua.v) + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" class="lb">' + esc(cfg.giua.l) + '</text>';
  }
  s += '</svg>';
  var W2 = R * 2 + 18;
  var chu = '<div style="flex:1;min-width:150px">' + phan.map(function (p, i) {
    return '<div class="stat" style="padding:5px 0;border:0;font-size:12.5px">' +
      '<b><span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:' +
      (p.mau || P[i % 8]) + '"></span>' + esc(p.ten) + '</b>' +
      '<span class="v">' + esc(dayDu(p.gt)) + '<em>' + (p.gt / tong * 100).toFixed(1).replace('.', ',') + '%</em></span></div>';
  }).join('') + '</div>';
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
    '<div style="width:' + W2 + 'px;flex:none">' + s.replace('viewBox="0 0 ' + W + ' ', 'viewBox="0 0 ' + W2 + ' ') + '</div>' +
    chu + '</div>';
}

/* =====================================================================
   4. BẬC THANG TIỀN (waterfall) — chuỗi "tiền đi đâu"
   cfg: { loai:'thac', buoc:[{l, v, kind:'top'|'out'|'final', nt}] }
   Vẽ đúng nghĩa bậc thang: mỗi khoản trừ là một khối rơi xuống từ mức
   trước, không phải một cột mọc từ đáy. Vẽ từ đáy là đúng số nhưng sai
   nghĩa — người đọc không thấy được tiền rơi đi đâu.
   ===================================================================== */
function veThac(cfg, W) {
  var b = cfg.buoc || [];
  if (!b.length) return '';
  var H = cfg.cao || 210;
  var LE_T = 20, LE_D = 34, LE_TR = 52, LE_P = 8;
  var cao = H - LE_T - LE_D, rong = W - LE_TR - LE_P;
  var n = b.length, bw = rong / n, wcot = Math.min(bw * 0.6, 56);

  /* mức tích luỹ */
  var mucTren = [], mucDuoi = [], chay = 0, dinh = 0;
  b.forEach(function (st, i) {
    if (st.kind === 'top') { mucDuoi.push(0); chay = st.v; mucTren.push(chay); }
    else if (st.kind === 'final') { mucDuoi.push(0); mucTren.push(st.v); }
    else { var t = chay; chay = chay + st.v; mucDuoi.push(Math.min(t, chay)); mucTren.push(Math.max(t, chay)); }
    dinh = Math.max(dinh, mucTren[i]);
  });
  var tr = mocTruc(dinh, 4);
  var y = function (v) { return LE_T + cao - (tr.tran > 0 ? v / tr.tran * cao : 0); };
  var mOk = mau('ok'), mAcc = mau('s1'), mTru = mau('neutral-bar');

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  tr.moc.forEach(function (v) {
    s += '<line class="gl" x1="' + LE_TR + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - LE_P) + '" y2="' + y(v).toFixed(1) + '"/>' +
      '<text class="vl" x="' + (LE_TR - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' +
      esc(v === 0 ? '0' : gonTien(v)) + '</text>';
  });
  b.forEach(function (st, i) {
    var x = LE_TR + i * bw + (bw - wcot) / 2;
    var yt = y(mucTren[i]), yb = y(mucDuoi[i]);
    var mauC = st.kind === 'final' ? mOk : st.kind === 'top' ? mAcc : mTru;
    s += '<g class="hz" tabindex="0" data-tip="' + esc('<b>' + esc(st.l) + '</b>' +
      dongTip(st.kind === 'out' ? 'Trừ đi' : 'Số tiền', usd0(Math.abs(st.v)), mauC) +
      (st.nt ? '<span class="d">' + esc(st.nt) + '</span>' : '')) + '">' +
      '<rect class="b" x="' + x.toFixed(1) + '" y="' + yt.toFixed(1) + '" width="' + wcot.toFixed(1) +
      '" height="' + Math.max(yb - yt, 1.5).toFixed(1) + '" rx="2" fill="' + mauC + '"/>' +
      '<rect class="hit" x="' + (LE_TR + i * bw).toFixed(1) + '" y="' + LE_T + '" width="' + bw.toFixed(1) +
      '" height="' + cao + '"/></g>';
    if (i > 0 && st.kind !== 'final') {
      var ynoi = y(mucTren[i - 1] === mucTren[i] ? mucTren[i] : (st.v < 0 ? mucTren[i] : mucDuoi[i]));
      s += '<line class="gl dash" x1="' + (LE_TR + (i - 1) * bw + (bw + wcot) / 2).toFixed(1) + '" y1="' + ynoi.toFixed(1) +
        '" x2="' + x.toFixed(1) + '" y2="' + ynoi.toFixed(1) + '"/>';
    }
    s += '<text class="vl" x="' + (x + wcot / 2).toFixed(1) + '" y="' + (yt - 6).toFixed(1) + '" text-anchor="middle">' +
      esc((st.v < 0 ? '−' : '') + gonTien(Math.abs(st.v)).replace('−', '')) + '</text>';
    var chu = String(st.l);
    if (chu.length > Math.floor(bw / 6.4)) chu = chu.slice(0, Math.max(4, Math.floor(bw / 6.4) - 1)) + '…';
    s += '<text class="lb' + (st.kind === 'final' ? ' on' : '') + '" x="' + (LE_TR + i * bw + bw / 2).toFixed(1) +
      '" y="' + (H - 11) + '" text-anchor="middle">' + esc(chu) + '</text>';
  });
  s += '<line class="ax" x1="' + LE_TR + '" y1="' + (LE_T + cao) + '" x2="' + (W - LE_P) + '" y2="' + (LE_T + cao) + '"/></svg>';
  return s;
}

/* =====================================================================
   5. TIA — đường bé xíu nằm trong ô số hoặc trong dòng bảng
   ===================================================================== */
function tia(gt, opt) {
  opt = opt || {};
  var W = opt.rong || 84, H = opt.cao || 22;
  var v = gt.filter(function (x) { return x != null; });
  if (v.length < 2) return '<svg width="' + W + '" height="' + H + '"></svg>';
  var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
  var dai = hi - lo || 1;
  var b = W / (gt.length - 1), pt = [], cuoi = null;
  gt.forEach(function (x, i) {
    if (x == null) return;
    var yy = H - 2 - (x - lo) / dai * (H - 4);
    pt.push((i * b).toFixed(1) + ',' + yy.toFixed(1));
    cuoi = { x: i * b, y: yy };
  });
  var m = opt.mau || mau('s1');
  return '<svg width="' + W + '" height="' + H + '" style="display:inline-block;vertical-align:middle;overflow:visible">' +
    '<polyline points="' + pt.join(' ') + '" fill="none" stroke="' + m + '" stroke-width="1.5" ' +
    'stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>' +
    (cuoi ? '<circle cx="' + cuoi.x.toFixed(1) + '" cy="' + cuoi.y.toFixed(1) + '" r="2.2" fill="' + m + '"/>' : '') +
    '</svg>';
}

/* =====================================================================
   6. THANH CHIA PHẦN NẰM NGANG — một dòng, nhiều phần
   ===================================================================== */
function chia(phan, opt) {
  opt = opt || {};
  var P = dayMau();
  var tong = phan.reduce(function (s, p) { return s + (p.gt || 0); }, 0) || 1;
  var dayDu = opt.dinhDang === 'so' ? so : usd0;
  return '<div class="prog" style="' + (opt.cao ? 'height:' + opt.cao + 'px' : '') + '">' +
    phan.map(function (p, i) {
      return '<i style="width:' + ((p.gt || 0) / tong * 100).toFixed(2) + '%;background:' +
        (p.mau || P[i % 8]) + '" data-tip="' + esc('<b>' + esc(p.ten) + '</b>' +
        dongTip('Số tiền', dayDu(p.gt || 0), p.mau || P[i % 8]) +
        '<span class="d">' + ((p.gt || 0) / tong * 100).toFixed(1).replace('.', ',') + '% tổng</span>') + '"></i>';
    }).join('') + '</div>' +
    (opt.chuThich === false ? '' : '<div class="leg">' + phan.map(function (p, i) {
      return '<span><i style="background:' + (p.mau || P[i % 8]) + '"></i>' + esc(p.ten) +
        ' <b>' + esc(dayDu(p.gt || 0)) + '</b></span>';
    }).join('') + '</div>');
}

var LOAI = { cot: veCot, thanh: veThanh, vong: veVong, thac: veThac };

global.HB = {
  o: o, gan: gan, veLaiTatCa: veLaiTatCa,
  tia: tia, chia: chia, mau: mau, dayMau: dayMau,
  gonTien: gonTien, gonSo: gonSo, mocTruc: mocTruc,
  dongTip: dongTip, anTip: anTip
};

})(window);

</script>
<script>
/* =====================================================================
   HAUSTEK PORTAL v2 — TIỆN ÍCH CHO MÀN HÌNH
   ---------------------------------------------------------------------
   Mười lăm màn hình dùng chung một bộ khuôn: đầu trang, dải ô số, thẻ,
   tab, ô trống, ô ghi chú. Viết một lần ở đây thay vì chép mười lăm lần —
   chép mười lăm lần thì sửa một chỗ là quên mười bốn chỗ.
   ===================================================================== */
"use strict";
(function (global) {

var esc = HT.esc, icon = HT.icon;

function dai(s, n) {
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ---- đầu trang ---- */
function dau(o) {
  return '<div class="page"><div><h1>' + (o.h1 || '') + '</h1>' +
    (o.mo ? '<p>' + o.mo + '</p>' : '') + '</div>' +
    (o.so && o.so.length ? '<div class="page-kpis">' + o.so.map(function (k) {
      return '<div class="page-kpi"><div class="l">' + esc(k.l) + '</div>' +
        '<div class="v"' + (k.mau ? ' style="color:' + k.mau + '"' : '') + '>' + esc(k.v) + '</div></div>';
    }).join('') + '</div>' : '') + '</div>';
}

/* ---- dải ô số ---- */
function so(list) {
  return '<div class="kpis">' + list.map(function (k) {
    return '<div class="kpi' + (k.lon ? ' hero' : '') + '"' +
      (k.tip ? ' data-tip="' + esc(k.tip) + '"' : '') + '>' +
      '<div class="l">' + esc(k.l) + '</div>' +
      '<div class="v"' + (k.mau ? ' style="color:' + k.mau + '"' : '') + '>' + (k.html || esc(k.v)) + '</div>' +
      (k.s ? '<div class="s">' + (k.sHtml ? k.s : esc(k.s)) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* ---- thẻ ---- */
function the(o) {
  return '<div class="card"' + (o.id ? ' id="' + esc(o.id) + '"' : '') + '>' +
    (o.dai ? '<div class="ribbon ' + o.dai.kieu + '">' + icon(o.dai.icon || 'info') +
      '<span>' + o.dai.chu + '</span></div>' : '') +
    (o.h2 || o.hanhDong ? '<div class="card-h"><div style="min-width:0"><h2>' + (o.h2 || '') + '</h2>' +
      (o.p ? '<p>' + o.p + '</p>' : '') + '</div><div class="sp"></div>' +
      (o.hanhDong ? '<div class="btnrow">' + o.hanhDong + '</div>' : '') + '</div>' : '') +
    (o.thoBody ? o.than : '<div class="card-b">' + (o.than || '') + '</div>') +
    (o.chan ? '<div class="card-f">' + o.chan + '</div>' : '') + '</div>';
}

/* ---- tab trong màn ---- */
function tabs(list, cur) {
  return '<div class="tabs">' + list.map(function (t) {
    return '<button type="button" data-tab="' + esc(t.k) + '"' +
      (t.k === cur ? ' class="on"' : '') + '>' + (t.icon ? icon(t.icon) : '') +

      esc(t.l) + (t.dem != null ? ' <span class="muted">(' + esc(t.dem) + ')</span>' : '') + '</button>';
  }).join('') + '</div>';

/* ---- ô trống ---- */

}

/* ---- ô ghi chú ---- */
function ghi(o) {

    '<div style="min-width:0;flex:1"><b>' + (o.tieuDe || '') + '</b>' +
    (o.than ? '<p>' + o.than + '</p>' : '') + '</div>' +
    (o.nut ? '<div class="btnrow" style="align-self:center">' + o.nut + '</div>' : '') + '</div>';
}

/* ---- danh sách khoá : giá trị ---- */
function kv(rows) {

    return '<dl class="kv"><dt>' + (r.tHtml ? r.t : esc(r.t)) + '</dt>' +
      '<dd' + (r.manh ? ' style="font-weight:600"' : '') + (r.mau ? ' class="' + r.mau + '"' : '') + '>' +
      (r.vHtml ? r.v : esc(r.v)) + '</dd></dl>';

}

/* ---- nhãn ---- */
function tag(chu, kieu) { return '<span class="tag ' + (kieu || '') + '">' + esc(chu) + '</span>'; }
function cham(kieu, chu) { return '<span class="dot ' + kieu + '"></span>' + esc(chu); }

/* ---- gắn sự kiện theo uỷ nhiệm ---- */
function bam(root, sel, fn) {
  root.addEventListener('click', function (e) {
    var el = e.target.closest(sel);
    if (el && root.contains(el)) { e.preventDefault(); fn(el, e); }
  });
}
function doi(root, sel, fn) {
  root.addEventListener('change', function (e) {
    var el = e.target.closest(sel);
    if (el && root.contains(el)) fn(el, e);
  });
}
function nhap(root, sel, fn, cho) {
  var hen = null;
  root.addEventListener('input', function (e) {
    var el = e.target.closest(sel);
    if (!el || !root.contains(el)) return;
    clearTimeout(hen);
    hen = setTimeout(function () { fn(el); }, cho == null ? 180 : cho);
  });
}

/* ---------------------------------------------------------------------
   Xuất CSV
   Dấu phân cách là chấm phẩy và có BOM ở đầu: Excel bản tiếng Việt mở
   file dấu phẩy không có BOM thì dồn hết vào một cột và mất dấu.
   --------------------------------------------------------------------- */
function csv(ten, cot, dong) {
  var q = function (v) {
    if (v == null) return '';
    var s = String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var txt = '﻿' + cot.map(q).join(';') + '\n' +
    dong.map(function (r) { return r.map(q).join(';'); }).join('\n');
  try {
    var b = new Blob([txt], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = ten;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    /* Bản xem online chạy trong khung cách ly, và khung đó chặn mọi lượt
       tải file — không báo lỗi, chỉ đơn giản không có gì xảy ra. Nói ra
       còn hơn để người dùng bấm ba lần rồi tưởng nút hỏng. */
    if (global.HAUSTEK_XEM_ONLINE) {
      HT.thongBao('Bản xem online không tải file được — mở bản mã nguồn để xuất ' + ten, 'no');
    } else {
      HT.thongBao('Đã xuất ' + ten + ' · ' + dong.length.toLocaleString('vi-VN') + ' dòng', 'ok');
    }
  } catch (e) {
    HT.thongBao('Trình duyệt chặn tải file: ' + e.message, 'no');
  }
}

/* ---------------------------------------------------------------------
   So sánh hai kỳ — trả về chuỗi "▲ 12,4% so với 05/2026"
   --------------------------------------------------------------------- */
function lech(nay, truoc, nhanTruoc) {
  if (truoc == null || !truoc) return null;
  var d = (nay - truoc) / truoc;
  var s = (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d * 100).toFixed(1).replace('.', ',') + '%';
  return { chu: s + (nhanTruoc ? ' so với ' + nhanTruoc : ''), duong: d >= 0, ty: d };
}
function lechHtml(nay, truoc, nhanTruoc) {
  var l = lech(nay, truoc, nhanTruoc);
  if (!l) return '';
  return '<span class="' + (l.duong ? 'pos' : 'neg') + '">' + esc(l.chu) + '</span>';
}


/* ---------------------------------------------------------------------
   Nhớ tạm kết quả nặng
   Tổng hợp một kỳ là quét 50.000 bản ghi. Vẽ biểu đồ 12 kỳ tách theo ba
   luồng là 1,8 triệu lượt — bấm đổi sáng/tối một cái là trang đứng hình
   nửa giây. Nhớ lại theo DẤU MỐC của trạng thái: admin duyệt kỳ hay nạp
   thêm luồng thì dấu mốc đổi và bộ nhớ tạm tự bỏ đi, nên không bao giờ
   hiện số cũ sau khi vừa thay đổi.
   --------------------------------------------------------------------- */
var _nho = {}, _moc = null;
function moc(A) {
  if (!A || !A.state) return 'khach';
  var s = A.state();
  return [Object.keys(s.approved).length, s.queue.length, s.rates.length,
          Object.keys(s.match).length, Object.keys(s.variance).length,
          Object.keys(s.advances).length, s.publishedAt,
          Object.keys(s.feeds).map(function (k) {
            return Object.keys(s.feeds[k]).map(function (f) { return s.feeds[k][f].status[0]; }).join('');
          }).join(''),
          Object.keys(s.pub).map(function (k) { return s.pub[k].status[0]; }).join('')].join('|');
}
function nho(A, key, fn) {
  var m = moc(A);
  if (_moc !== m) { _nho = {}; _moc = m; }
  if (!(key in _nho)) _nho[key] = fn();
  return _nho[key];
}
function quenHet() { _nho = {}; _moc = null; }

global.HM = {
  dau: dau, so: so, the: the, tabs: tabs, trong: trong, ghi: ghi, kv: kv,
  tag: tag, cham: cham, bam: bam, doi: doi, nhap: nhap, csv: csv,
  lech: lech, lechHtml: lechHtml, dai: dai, esc: esc, icon: icon,
  nho: nho, quenHet: quenHet, moc: moc
};

    buoc.push({ l: 'Nghệ sĩ', v: -(a.artist + a.producer), kind: 'out', nt: 'phần trả cho nghệ sĩ và điểm producer' });

  c.nganTruot(
    HM.so([
      { l: c.lang === 'vi' ? 'Kiếm được kỳ này' : 'Earned this period', v: c.tien(dong ? dong.earned : a.total), lon: true },

    '<h4 class="sec">' + (c.lang === 'vi' ? 'Chuỗi chia tiền kỳ ' + c.ky.label : 'Money chain, ' + c.ky.label) + '</h4>' +

    '<h4 class="sec">' + (c.lang === 'vi' ? 'Chi trả' : 'Payout') + '</h4>' +
    HM.kv([

      dong ? { t: c.lang === 'vi' ? 'Dồn từ kỳ trước' : 'Carried in', v: c.tien2(dong.carryIn) } : null,
      dong ? { t: c.lang === 'vi' ? 'Trừ vào tạm ứng' : 'Advance recouped', v: '−' + c.tien2(dong.recoup), mau: dong.recoup > 0 ? 'neg' : '' } : null,
      dong ? { t: c.lang === 'vi' ? 'Sẽ chi kỳ tới' : 'Payable', v: c.tien2(dong.payable), manh: true } : null,
      dong && dong.carryOut > 0 ? { t: c.lang === 'vi' ? 'Dồn sang kỳ sau (dưới ngưỡng ' + HT.fmt.usd0(A.cfg.PAYOUT_MIN) + ')' : 'Carried out',
        v: c.tien2(dong.carryOut) } : null,
      { t: c.lang === 'vi' ? 'Dư nợ tạm ứng còn lại' : 'Advance balance', v: ung > 0 ? c.tien2(ung) : '—' }
    ]) +
    '<h4 class="sec">' + (c.lang === 'vi' ? 'Tỷ lệ chia đang áp' : 'Applied rate') + '</h4>' +
    '<div class="say">' + (function () {
      var lich = A.rates.scheduleFor(key);

        ? 'Bên này không có dòng tỷ lệ riêng — nghệ sĩ thuộc label thì tỷ lệ nằm ở dòng của label.'
        : 'No rate row for this party — an artist under a label inherits the label’s rate.';
      return lich.map(function (r) {

          '<span class="v">' + HM.esc(r.note || r.by) + '</span></div>';

/* =====================================================================
   TAB 1 — LƯỚI KỲ × LUỒNG
   Mười hai dòng, năm cột. Nhìn một cái là biết kỳ nào hổng chỗ nào — đó
   là toàn bộ lý do màn này tồn tại.
   ===================================================================== */
function veLuoi(c) {
  var A = c.A, t = c.t, P = HB.dayMau();
  var than = '<div class="mx"><table><thead><tr>' +
    '<th>' + (c.lang === 'vi' ? 'Kỳ' : 'Period') + '</th>' +
    A.feeds.map(function (f) { return '<th>' + HM.esc(f.short) + '</th>'; }).join('') +
    '<th>' + HM.esc(t('tacQuyen')) + '</th>' +
    '<th class="num">' + (c.lang === 'vi' ? 'Doanh thu vào sổ' : 'Booked') + '</th>' +
    '<th>' + (c.lang === 'vi' ? 'Trạng thái kỳ' : 'Period') + '</th>' +
    '</tr></thead><tbody>';

  A.periods.slice().reverse().forEach(function (p) {
    var i = p.idx, duyet = A.isApproved(p.k);
    than += '<tr' + (p.k === c.kyKey ? ' style="box-shadow:inset 3px 0 0 var(--accent)"' : '') + '>' +
      '<td class="k"><div class="cell">' + HM.esc(p.label) + '</div></td>';
    A.feeds.forEach(function (f) {
      var st = A.state().feeds[p.k][f.id];
      var co = st.status === 'loaded';
      than += '<td>' + (duyet
        ? '<div class="cell">' + HM.cham(co ? 'ok' : 'no', co ? t('daNap') : t('thieu')) + '</div>'
        : '<button type="button" class="cell" ' +
          (co ? 'data-go="' + i + ':' + f.id + '"' : 'data-nap="' + i + ':' + f.id + '"') +
          ' data-tip="' + HM.esc('<b>' + f.name + '</b>' + (co
            ? '<span class="d">' + HM.esc(st.file) + '<br>' + HT.fmt.luc(st.at) + '<br>Bấm để gỡ</span>'
            : '<span class="d">' + HM.esc(f.fmt) + '<br>Bấm để nạp</span>')) + '">' +
          HM.cham(co ? 'ok' : 'no', co ? t('daNap') : t('thieu')) + '</button>') + '</td>';
    });
    var pb = A.state().pub[p.k], coPub = pb && pb.status === 'loaded';
    var cuoiQuy = p.month % 3 === 0;
    than += '<td>' + (duyet
      ? '<div class="cell">' + (coPub ? HM.cham('ok', t('quy') + p.quarter) : '<span class="nil">—</span>') + '</div>'
      : '<button type="button" class="cell" ' +
        (coPub ? 'data-gopub="' + i + '"' : 'data-pub="' + i + '"') +
        ' data-tip="' + HM.esc('<b>' + A.pubFeed.name + '</b><span class="d">' +
          (coPub ? HM.esc(pb.file) : cuoiQuy ? 'Cuối quý ' + p.quarter + ' — nạp được'
                 : 'Tháng ' + p.month + ' ' + HM.esc(t('khongQuy')) + ' — nạp vào đây là đặt cả quý tiền vào sai kỳ') +
          '</span>') + '">' +
        (coPub ? HM.cham('ok', t('quy') + p.quarter)
               : cuoiQuy ? HM.cham('warn', t('quy') + p.quarter) : '<span class="nil">—</span>') +
        '</button>') + '</td>';
    than += '<td class="num"><div class="cell" style="justify-content:flex-end">' +
      HM.esc(c.tien(A.agg('admin', 0, i, 'rec').gross)) + '</div></td>' +

        : A.canApprove(i) ? HM.tag(c.lang === 'vi' ? 'sẵn sàng duyệt' : 'ready', 'info')
        : HM.tag(c.lang === 'vi' ? 'còn vướng' : 'blocked', 'warn')) + '</div></td></tr>';
  });

    h2: HM.esc(t('tLuoi')),

      ? 'Bấm vào một ô của kỳ chưa duyệt để nạp hoặc gỡ luồng đó. Kỳ đã duyệt khoá lại — sửa số của kỳ khách đã đọc là chuyện phải làm có chủ ý, không phải bấm nhầm.'
      : 'Click a cell on an unapproved period to load or unload that feed. Approved periods are locked — changing figures a client has already read must be deliberate.',
    thoBody: true, than: than,
    chan: (c.lang === 'vi'
      ? 'Ô đỏ không có nghĩa là mất tiền. Nghĩa là tiền của luồng đó chưa được đếm — và mọi con số của kỳ đang thiếu đúng phần ấy.'
      : 'A red cell does not mean lost money. It means that feed’s money is not being counted — every figure for the period is short by exactly that much.')
  });
}

/* =====================================================================
   TAB 2 — TỪNG LUỒNG
   ===================================================================== */
function veLuong(c) {
  var A = c.A, t = c.t, P = HB.dayMau();
  var html = '<div class="grid g2">';

  A.feeds.forEach(function (f, fi) {
    var daNap = A.periods.filter(function (p, i) { return A.feedLoaded(i, f.id); }).length;
    var theoKy = HM.nho(A, 'luong:' + f.id, function () {
      return A.periods.map(function (p, i) {
        if (!A.feedLoaded(i, f.id)) return 0;
        var s = 0;
        for (var k = 0; k < A.trackCount; k++) s += A.grossRecByFeed(k, i, f.id);
        return Math.round(s * 100) / 100;
      });
    });
    var st = A.state().feeds[c.kyKey][f.id];
    var co = st.status === 'loaded';
    var duyet = A.isApproved(c.kyKey);
    var treo = A.queue.list({ feedId: f.id, status: 'pending' });

function napLuong(c, pi, fid, lai) {

function goLuong(c, pi, fid) {
  var A = c.A, f = A.feeds[fid], p = A.periods[pi];
  var mat = 0;
  for (var k = 0; k < A.trackCount; k++) mat += A.grossRecByFeed(k, pi, fid);
