<title>Haustek Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* =====================================================================
   HAUSTEK PORTAL — HỆ GIAO DIỆN v2
   ---------------------------------------------------------------------
   Một hệ dùng chung cho cả hai cửa: intranet nội bộ và cổng khách.
   Có hai chế độ sáng/tối, người dùng tự bật bằng nút trên thanh trên.

   Cách đặt màu: mọi thành phần chỉ đọc biến, không viết mã màu trực
   tiếp. Đổi chế độ chỉ là đổi giá trị biến ở gốc — không có thành phần
   nào phải biết mình đang ở chế độ nào.

   Ba trạng thái phải lo, không phải hai:
     · chưa chọn gì  → theo cài đặt hệ điều hành (prefers-color-scheme)
     · chọn sáng     → [data-theme="light"] thắng cả khi máy đang tối
     · chọn tối      → [data-theme="dark"]  thắng cả khi máy đang sáng
   ===================================================================== */

:root {
  /* ---- khung tối: sidebar và thanh trên ở CHẾ ĐỘ SÁNG vẫn tối ----
     Đây là thứ khách chỉ ra trong ảnh mẫu: khung tối, ruột sáng. */
  --chrome:      #0E1A24;
  --chrome-2:    #16242F;
  --chrome-3:    #1B2C38;
  --chrome-line: #22323E;
  --on-chrome:   #EAF0F5;
  --on-chrome-2: #B9C6D1;
  --on-chrome-3: #7F909E;

  /* ---- vùng nội dung ---- */
  /* --faint và --on-chrome-3 đo trên trang đã render, không phải đo theo
     cặp biến: chúng được dùng cho chữ 11–12px (nhãn ô số, tên nhóm ở cột
     trái, ghi chú dưới bảng), và ở cỡ đó chuẩn WCAG AA đòi 4,5:1. Bộ màu
     ban đầu chỉ đạt 3,1:1 trên nền thẻ trắng — nhìn thì "nhã", đọc thì
     không ra, nhất là trên laptop nghiêng màn. */
  --bg:      #F5F6F8;
  --card:    #FFFFFF;
  --raised:  #FFFFFF;
  --ink:     #1A2129;
  --ink-2:   #5B6672;
  --faint:   #626B75;
  --line:    #E6E9ED;
  --line-2:  #D5DAE0;
  --head:    #F2F4F6;
  --zebra:   #FAFBFC;
  --fill:    #ECEEF1;
  --band:    #F7F9FA;
  --sel:     #E6EEFA;

  /* ---- màu mang nghĩa ---- */
  --accent:     #0C7287;   /* màu dữ liệu chính, suy từ ice blue của brand */
  --accent-2:   #3D9DB1;
  --accent-3:   #7FC3D2;
  --accent-lo:  #DCEEF3;
  --link:       #2967BE;
  --danger:     #C8102E;
  --danger-lo:  #FCEEF0;
  --ok:         #157A4E;
  --ok-lo:      #E6F4ED;
  --warn:       #A15F00;
  --warn-lo:    #FFF5E4;
  --neutral-bar:#DCE1E6;
  /* Chữ nằm TRÊN nền màu nhấn. Ở chế độ sáng --accent là màu đậm nên chữ
     trắng đọc tốt; ở chế độ tối --accent là màu nhạt, và chữ trắng trên
     nền nhạt chỉ đạt 2,3:1 — nút chính đọc không ra. Nên đây phải là biến,
     không phải #fff viết cứng. */
  --on-accent: #FFFFFF;
  --on-ok:     #FFFFFF;
  --on-danger: #FFFFFF;
  /* Đỏ cảnh báo đặt trên nền khung tối cần sáng hơn --danger của vùng nội
     dung: #C8102E trên #0E1A24 chỉ đạt 3,0:1. */
  --danger-chrome: #FF8095;

  --shadow:   0 1px 2px rgba(16,24,32,.06);
  --shadow-2: 0 8px 28px rgba(16,24,32,.13);

  --f:    'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;

  --side-w: 250px;
  --top-h:  56px;
  --r:      9px;
  --r-sm:   6px;

  color-scheme: light;
}

/* ---- chế độ tối theo cài đặt máy, trừ khi người dùng chọn sáng ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome:      #080E14;
    --chrome-2:    #101B24;
    --chrome-3:    #16242F;
    --chrome-line: #1D2C37;
    --on-chrome:   #E3EBF2;
    --on-chrome-2: #A6B5C2;
    --on-chrome-3: #82939F;

    --bg:      #0E1820;
    --card:    #15212B;
    --raised:  #1A2833;
    --ink:     #E8EEF4;
    --ink-2:   #A9B7C4;
    --faint:   #909FAD;
    --line:    #233240;
    --line-2:  #2E4050;
    --head:    #1A2732;
    --zebra:   #17232E;
    --fill:    #22303C;
    --band:    #1A2934;
    --sel:     #1B3242;

    --accent:     #4CB8CE;
    --accent-2:   #6FCADD;
    --accent-3:   #8FD8E7;
    --accent-lo:  #14313C;
    --link:       #74A9F0;
    --danger:     #FF6B80;
    --danger-lo:  #33161C;
    --ok:         #4FC98F;
    --ok-lo:      #122F24;
    --warn:       #E5A24A;
    --warn-lo:    #2E2413;
    --neutral-bar:#2C3D4B;
  --on-accent: #06232B;
  --on-ok:   #06281B;
  --on-danger: #350810;
  --danger-chrome: #FF8FA1;
    --on-accent: #06232B;
    --on-ok:     #06281B;
    --on-danger: #350810;
    --danger-chrome: #FF8FA1;

    --shadow:   0 1px 2px rgba(0,0,0,.32);
    --shadow-2: 0 10px 30px rgba(0,0,0,.45);

    color-scheme: dark;
  }
}

/* ---- người dùng bấm chọn tối ---- */
:root[data-theme="dark"] {
  --chrome:      #080E14;
  --chrome-2:    #101B24;
  --chrome-3:    #16242F;
  --chrome-line: #1D2C37;
  --on-chrome:   #E3EBF2;
  --on-chrome-2: #A6B5C2;
  --on-chrome-3: #82939F;

  --bg:      #0E1820;
  --card:    #15212B;
  --raised:  #1A2833;
  --ink:     #E8EEF4;
  --ink-2:   #A9B7C4;
  --faint:   #909FAD;
  --line:    #233240;
  --line-2:  #2E4050;
  --head:    #1A2732;
  --zebra:   #17232E;
  --fill:    #22303C;
  --band:    #1A2934;
  --sel:     #1B3242;

  --accent:     #4CB8CE;
  --accent-2:   #6FCADD;
  --accent-3:   #8FD8E7;
  --accent-lo:  #14313C;
  --link:       #74A9F0;
  --danger:     #FF6B80;
  --danger-lo:  #33161C;
  --ok:         #4FC98F;
  --ok-lo:      #122F24;
  --warn:       #E5A24A;
  --warn-lo:    #2E2413;
  --neutral-bar:#2C3D4B;
  --on-accent: #06232B;
  --on-ok:   #06281B;
  --on-danger: #350810;
  --danger-chrome: #FF8FA1;

  --shadow:   0 1px 2px rgba(0,0,0,.32);
  --shadow-2: 0 10px 30px rgba(0,0,0,.45);

  color-scheme: dark;
}

/* =====================================================================
   NỀN CHUNG
   ===================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
svg{display:block}
table{border-collapse:collapse;width:100%}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.muted{color:var(--ink-2)}
.faint{color:var(--faint)}
.nil{color:var(--faint);opacity:.6}
.right{text-align:right}
.nowrap{white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* =====================================================================
   KHUNG ỨNG DỤNG
   ===================================================================== */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{background:var(--chrome);color:var(--on-chrome-2);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto}
.side-top{display:flex;align-items:center;gap:9px;height:var(--top-h);padding:0 18px;flex:none;
  border-bottom:1px solid var(--chrome-line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.13em;
  font-size:12.5px;color:var(--on-chrome);white-space:nowrap}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--danger-chrome);flex:none;display:block}
.brand em{font-style:normal;color:var(--on-chrome-3);font-weight:500;letter-spacing:.06em;font-size:11px}
.nav{padding:10px 0 18px;flex:1}
.nav-grp{font-size:10.5px;color:var(--on-chrome-3);padding:15px 20px 5px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 20px;font-size:13px;
  color:var(--on-chrome-2);text-decoration:none;transition:background .12s}
.nav a:hover{background:var(--chrome-2);color:var(--on-chrome);text-decoration:none}
.nav a.on{background:var(--chrome-3);color:#fff;font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a .c{margin-left:auto;font-size:11.5px;color:var(--on-chrome-3);font-variant-numeric:tabular-nums}
.nav a.on .c{color:var(--on-chrome-2)}
.nav a .c.alert{color:var(--danger-chrome)}
.side-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--chrome-line);font-size:12px}
.side-foot b{display:block;color:var(--on-chrome);font-weight:500}
.side-foot span{color:var(--on-chrome-3);font-size:11.5px}

.top{display:flex;align-items:center;gap:12px;height:var(--top-h);padding:0 24px;
  background:var(--chrome);color:var(--on-chrome-2);position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--chrome-line)}
.crumb{font-size:12.5px;color:var(--on-chrome-3)}
.crumb b{color:var(--on-chrome-2);font-weight:400}
.sp{flex:1}
.top-note{font-size:12px;color:var(--on-chrome-3);white-space:nowrap}
.seg{display:flex;border:1px solid var(--chrome-line);border-radius:var(--r-sm);overflow:hidden;flex:none}
.seg button{padding:5px 11px;font-size:11.5px;color:var(--on-chrome-3);font-weight:500;
  display:flex;align-items:center;gap:5px}
.seg button:hover{color:var(--on-chrome)}
.seg button.on{background:var(--chrome-3);color:#fff}
.seg svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
main{padding:22px 24px 56px;min-width:0}

/* =====================================================================
   ĐẦU TRANG
   ===================================================================== */
.page{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.page h1{font-size:25px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.page h1 span{color:var(--link);font-weight:500}
.page p{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:76ch}
.page-kpis{margin-left:auto;display:flex;gap:32px}
.page-kpi{text-align:right}
.page-kpi .l{font-size:11.5px;color:var(--ink-2);margin-bottom:2px;white-space:nowrap}
.page-kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* =====================================================================
   TAB · PILL · CHIP
   ===================================================================== */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:7px;padding:0 0 10px;font-size:13.5px;
  color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;
  background:var(--fill);color:var(--ink);font-size:13px;white-space:nowrap}
.pill:hover{background:var(--line-2)}
.pill.on{background:var(--sel);color:var(--link)}
.pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.srch{position:relative;flex:0 1 300px;min-width:180px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--faint);fill:none;stroke-width:1.6}
/* Viết là .srch input[type=search] chứ không phải .srch input.
   Khối "TRƯỜNG NHẬP" bên dưới có .srch input[type=search] cùng độ ưu tiên
   (0,1,1) và nằm SAU, nên nó thắng: ô tìm mất padding trái 33px, và cái
   kính lúp ngồi đè lên chữ đầu tiên của dòng gợi ý. Thêm một bộ chọn nữa
   để độ ưu tiên cao hơn hẳn, thay vì trông chờ vào thứ tự dòng. */
.srch input[type=search]{width:100%;height:34px;padding:0 14px 0 34px;font:inherit;font-size:13px;
  color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:17px;outline:0}
.srch input[type=search]:focus{border-color:var(--accent)}
.srch input[type=search]::placeholder{color:var(--faint)}
.srch input[type=search]::-webkit-search-cancel-button{cursor:pointer}

.chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;min-height:26px}
.chip{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 5px 0 11px;
  border-radius:13px;background:var(--sel);color:var(--link);font-size:12.5px;white-space:nowrap}
.chip b{font-weight:600}
.chip button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;opacity:.6}
.chip button:hover{background:rgba(127,127,127,.2);opacity:1}
.chip svg{width:9px;height:9px;stroke:currentColor;stroke-width:2.2;fill:none}
.chip.q{background:var(--fill);color:var(--ink-2)}

/* =====================================================================
   THẺ
   ===================================================================== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
  margin-bottom:14px}
.card-h{display:flex;align-items:flex-start;gap:14px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.card-h p{font-size:12.5px;color:var(--faint);margin-top:2px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,1fr)}
@media(min-width:1080px){
  .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .g3{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
}

/* ---- dải ô số ---- */
.kpis{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;
  overflow:hidden}
.kpi{padding:15px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .l{font-size:12px;color:var(--faint);margin-bottom:5px}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.kpi .s{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.kpi.hero .v{font-size:30px;letter-spacing:-.025em}

/* =====================================================================
   NÚT
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;
  padding:0 15px;border-radius:var(--r-sm);font-size:13px;font-weight:500;white-space:nowrap;
  background:var(--card);color:var(--ink);border:1px solid var(--line-2);transition:.13s}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.dang{color:var(--danger);border-color:var(--danger)}
.btn.dang:hover{background:var(--danger-lo)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--fill);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
.btn.link{border:0;background:0;color:var(--link);height:auto;padding:0;font-weight:600;
  font-size:12px;letter-spacing:.05em}
.btn.link:hover{text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* =====================================================================
   BIỂU MẪU
   ===================================================================== */
label.fld{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=date],
select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
textarea{resize:vertical;line-height:1.6}
.inline-sel{width:auto;padding:3px 6px;font-size:12.5px;border-radius:var(--r-sm)}

/* =====================================================================
   BẢNG
   ===================================================================== */
.tw{overflow-x:auto}
table.t{min-width:720px}
/* Bảng nằm trong khung hai cột không được ép 720px — ép thì cột tiền
   trôi ra ngoài tầm nhìn và người dùng phải cuộn ngang để đọc số. */
.two table.t,.g2 table.t,.g3 table.t,.drawer table.t{min-width:0}
table.t th{background:var(--head);font-size:11.5px;font-weight:600;color:var(--ink-2);
  text-align:left;padding:9px 14px;white-space:nowrap;border-bottom:1px solid var(--line);
  position:relative}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--ink)}
table.t th.num,table.t td.num{text-align:right}
table.t th.sorted{background:var(--fill);color:var(--ink)}
table.t th .ar{display:inline-block;width:9px;margin-left:5px;opacity:.75}
table.t td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);
  vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
table.t tbody tr.pick{cursor:pointer}
table.t tbody tr.pick:hover td{background:var(--sel)}
table.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.band,table.t th.band{background:var(--band)}
table.t tbody tr:nth-child(even) td.band{background:var(--fill)}
table.t tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:600;
  background:var(--head)}
.t-ttl{font-weight:500}
.t-sub{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:1px}

/* =====================================================================
   NHÃN TRẠNG THÁI
   ===================================================================== */
.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;white-space:nowrap;
  background:var(--fill);color:var(--ink-2)}
.tag.ok{background:var(--ok-lo);color:var(--ok)}
.tag.no{background:var(--danger-lo);color:var(--danger)}
.tag.warn{background:var(--warn-lo);color:var(--warn)}
.tag.info{background:var(--accent-lo);color:var(--accent)}
.tag.link{background:var(--sel);color:var(--link)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;flex:none}
.dot.ok{background:var(--ok)} .dot.no{background:var(--danger)}
.dot.warn{background:var(--warn)} .dot.off{background:var(--neutral-bar)}

/* ---- dải thông báo ---- */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:13px 16px;
  margin-bottom:14px;background:var(--card);box-shadow:var(--shadow)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.note b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.note p{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.note .sp{flex:1}
.note.warn{background:var(--warn-lo);color:var(--warn);box-shadow:none}
.note.warn b,.note.warn p{color:var(--warn)}
.note.no{background:var(--danger-lo);color:var(--danger);box-shadow:none}
.note.no b,.note.no p{color:var(--danger)}
.note.ok{background:var(--ok-lo);color:var(--ok);box-shadow:none}
.note.ok b,.note.ok p{color:var(--ok)}
.note.info{background:var(--accent-lo);color:var(--accent);box-shadow:none}
.note.info b,.note.info p{color:var(--accent)}

/* ---- danh sách điều kiện ---- */
.checks{display:grid;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden}
.check{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--card)}
.check svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.check.ok svg{color:var(--ok)} .check.no svg{color:var(--danger)}
.check b{display:block;font-size:13px;font-weight:500}
.check span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.check .r{margin-left:auto;font-size:12.5px;text-align:right;white-space:nowrap}

/* ---- thanh tiến độ ---- */
.meter{height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter.thin{height:5px}

/* =====================================================================
   PHÂN TRANG · RỖNG
   ===================================================================== */
.pager{display:flex;align-items:center;gap:4px}
.pg{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2)}
.pg:hover:not(:disabled){background:var(--fill);color:var(--ink)}
.pg:disabled{opacity:.35;cursor:default}
.pg svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.range{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:0 6px}

.empty{padding:56px 20px;text-align:center}
.empty svg{width:34px;height:34px;margin:0 auto 12px;stroke:var(--faint);fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.empty b{display:block;font-size:14.5px;font-weight:600;margin-bottom:5px}
.empty span{display:block;font-size:13px;color:var(--ink-2);max-width:46ch;margin:0 auto}
.empty .btnrow{justify-content:center;margin-top:14px}

/* =====================================================================
   NGĂN TRƯỢT · HỘP THOẠI · THÔNG BÁO
   ===================================================================== */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,94vw);z-index:60;
  background:var(--card);box-shadow:var(--shadow-2);transform:translateX(100%);
  transition:transform .18s ease-out;overflow:auto}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.drawer-h h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.drawer-h p{font-size:12.5px;color:var(--faint);font-family:var(--mono);margin-top:3px}
.drawer-b{padding:18px 22px 26px}
.x{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink-2);flex:none}
.x:hover{background:var(--fill);color:var(--ink)}
.x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.backdrop{position:fixed;inset:0;background:rgba(8,14,20,.42);z-index:59;opacity:0;
  pointer-events:none;transition:opacity .18s}
.backdrop.on{opacity:1;pointer-events:auto}

dl.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px}
dl.kv:last-of-type{border-bottom:0}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{text-align:right;font-variant-numeric:tabular-nums}
h4.sec{font-size:11.5px;color:var(--faint);margin:18px 0 6px;font-weight:500}
h4.sec:first-child{margin-top:0}

.modal-bg{position:fixed;inset:0;background:rgba(8,14,20,.46);z-index:80;display:flex;
  align-items:flex-start;justify-content:center;padding:7vh 16px;overflow:auto}
.modal{background:var(--card);border-radius:12px;max-width:620px;width:100%;padding:22px;
  box-shadow:var(--shadow-2)}
.modal h3{font-size:17px;font-weight:600;margin-bottom:4px}
.modal p.h{font-size:12.5px;color:var(--ink-2);margin-bottom:16px;line-height:1.65}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;
  gap:8px;max-width:min(92vw,380px)}
.toast{background:var(--chrome);color:var(--on-chrome);border-radius:var(--r);padding:11px 15px;
  font-size:13px;box-shadow:var(--shadow-2);animation:pop .18s ease-out}
.toast.ok{background:var(--ok);color:var(--on-ok)}
.toast.no{background:var(--danger);color:var(--on-danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =====================================================================
   THU HẸP
   ===================================================================== */
@media(max-width:1080px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}
  .side-top{border-bottom:0;border-right:1px solid var(--chrome-line)}
  .nav{display:flex;padding:0;flex:1}
  .nav-grp,.side-foot,.nav a .c{display:none}
  .nav a{padding:0 14px;height:var(--top-h);white-space:nowrap}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .page-kpis{margin-left:0;width:100%;gap:24px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* =====================================================================
   MÀU CHUỖI DỮ LIỆU
   ---------------------------------------------------------------------
   Bảy màu, xếp theo thứ tự dùng. Chọn sao cho phân biệt được cả khi in
   đen trắng (độ sáng cách nhau), và không dùng cặp đỏ–xanh lá cạnh nhau
   làm thông tin duy nhất — khoảng 8% đàn ông Việt Nam không phân biệt
   được cặp đó.
   ===================================================================== */
:root{
  --s1:#0C7287; --s2:#3F6FB4; --s3:#7A5AA6; --s4:#B0517A;
  --s5:#C2703A; --s6:#8A8F3C; --s7:#3E8F72; --s8:#6C7A87;
  --grid:#E9ECEF; --axis:#C3C9D0;
  --bar-bg:#EAEDF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s1:#4CB8CE; --s2:#7CA7E8; --s3:#B396DE; --s4:#EE8DAF;
    --s5:#EDA46A; --s6:#C3CC72; --s7:#6FD3AC; --s8:#9AA9B6;
    --grid:#20303C; --axis:#334756;
    --bar-bg:#1E2C38;
  }
}
:root[data-theme="dark"]{
  --s1:#4CB8CE; --s2:#7CA7E8; --s3:#B396DE; --s4:#EE8DAF;
  --s5:#EDA46A; --s6:#C3CC72; --s7:#6FD3AC; --s8:#9AA9B6;
  --grid:#20303C; --axis:#334756;
  --bar-bg:#1E2C38;
}

/* =====================================================================
   BIỂU ĐỒ
   ===================================================================== */
.bd{position:relative;width:100%}
.bd svg{width:100%;height:auto;display:block;overflow:visible}
.bd .gl{stroke:var(--grid);stroke-width:1}
.bd .ax{stroke:var(--axis);stroke-width:1}
.bd text{font-family:var(--f);fill:var(--ink-2)}
.bd .lb{font-size:10.5px;fill:var(--faint)}
.bd .lb.on{fill:var(--ink);font-weight:600}
.bd .vl{font-size:10.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.bd .vl.big{font-size:12px;fill:var(--ink);font-weight:600}
.bd rect.b{transition:opacity .12s}
.bd .hz:hover rect.b{opacity:.55}
.bd .hz rect.b.on{opacity:1}
.bd .hit{fill:transparent;cursor:default}
.bd .hz:hover .hit{fill:var(--ink);opacity:.035}
.bd .dash{stroke-dasharray:3 3}
.bd .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bd .dot2{stroke:var(--card);stroke-width:1.6}

.tip{position:fixed;z-index:95;pointer-events:none;background:var(--chrome);
  color:var(--on-chrome);border-radius:7px;padding:9px 12px;font-size:12px;line-height:1.55;
  box-shadow:var(--shadow-2);max-width:280px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:3px;color:#fff}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tip .r{float:right;margin-left:16px;font-variant-numeric:tabular-nums;color:#fff}
.tip .d{color:var(--on-chrome-3);font-size:11px;margin-top:4px}

.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:2px;flex:none}
.leg b{color:var(--ink);font-weight:500}

/* ---- danh sách có thanh trong dòng ---- */
.bars{display:flex;flex-direction:column}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line)}
.bars .row:last-child{border-bottom:0}
.bars .nm{min-width:0;font-size:13px}
.bars .nm em{font-style:normal;display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.bars .bar{height:5px;border-radius:3px;background:var(--bar-bg);margin-top:5px;overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:3px;background:var(--s1)}
.bars .vv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.bars .vv em{font-style:normal;display:block;font-size:11.5px;color:var(--faint)}
.bars.pick .row{cursor:pointer}
.bars.pick .row:hover{background:var(--band)}

/* ---- chỉ số nhỏ trong thẻ ---- */
.stat{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:500}
.stat .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.stat .v em{font-style:normal;display:block;font-size:11.5px;color:var(--faint)}
.stat p{font-size:11.5px;color:var(--faint);margin-top:2px;max-width:52ch}

/* ---- lưới 3–4 cột ---- */
.g4{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.g31{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.g13{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(min-width:1240px){
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g31{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g13{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
}

/* ---- bậc thang tiền (waterfall) ---- */
.wf{display:flex;flex-direction:column;gap:0}
.wf .st{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;
  align-items:start;padding:11px 0;border-bottom:1px solid var(--line);position:relative}
.wf .st:last-child{border-bottom:0}
.wf .mk{width:11px;height:11px;border-radius:3px;margin-top:4px;background:var(--s1)}
.wf .st.out .mk{background:var(--neutral-bar)}
.wf .st.fin .mk{background:var(--ok)}
.wf .lbl{font-size:13.5px;font-weight:500}
.wf .nt{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.55;max-width:62ch}
.wf .amt{text-align:right;font-size:15px;font-variant-numeric:tabular-nums;
  white-space:nowrap;font-weight:500}
.wf .st.out .amt{color:var(--ink-2)}
.wf .st.fin{background:var(--band);margin:0 -18px;padding:14px 18px;border-bottom:0}
.wf .st.fin .lbl{font-size:14px;font-weight:600}
.wf .st.fin .amt{font-size:21px;font-weight:600;color:var(--ok)}

/* ---- các bước / dòng thời gian ---- */
.steps{position:relative;padding-left:26px}
.steps::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.steps .s{position:relative;padding:9px 0}
.steps .s::before{content:"";position:absolute;left:-23px;top:14px;width:9px;height:9px;
  border-radius:50%;background:var(--card);border:2px solid var(--line-2)}
.steps .s.ok::before{background:var(--ok);border-color:var(--ok)}
.steps .s.now::before{background:var(--accent);border-color:var(--accent)}
.steps .s.no::before{background:var(--danger);border-color:var(--danger)}
.steps b{display:block;font-size:13.5px;font-weight:500}
.steps span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.55}
.steps .tm{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:3px}

/* ---- lưới kỳ × luồng ---- */
.mx{overflow-x:auto}
.mx table{min-width:640px}
.mx th{font-size:11.5px;color:var(--ink-2);font-weight:600;padding:8px 10px;text-align:left;
  background:var(--head);white-space:nowrap}
.mx th.num{text-align:right}
.mx td{padding:0;border-bottom:1px solid var(--line)}
.mx td .cell{display:flex;align-items:center;gap:7px;padding:9px 10px;font-size:12.5px;white-space:nowrap}
.mx td.k{font-weight:500;font-variant-numeric:tabular-nums}
.mx tr:hover td{background:var(--band)}
.mx button.cell{width:100%;text-align:left}
.mx button.cell:hover{background:var(--sel)}

/* ---- chỗ nạp file ---- */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;
  background:var(--band)}
.drop.on{border-color:var(--accent);background:var(--accent-lo)}
.drop svg{width:26px;height:26px;margin:0 auto 9px;stroke:var(--faint);fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-size:13.5px;margin-bottom:3px}
.drop span{display:block;font-size:12.5px;color:var(--ink-2)}

/* ---- hai cột: danh sách trái, chi tiết phải ---- */
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1180px){ .two{grid-template-columns:minmax(0,5fr) minmax(0,4fr)} }

/* ---- thanh tiến trình có nhãn ---- */
.prog{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bar-bg)}
.prog i{display:block;height:100%}
.prog i+i{border-left:1px solid var(--card)}

/* ---- nhóm trường ---- */
.fldrow{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){ .fldrow.two-up{grid-template-columns:repeat(2,minmax(0,1fr))} }
input.in,select.in,textarea.in{width:100%;height:36px;padding:0 11px;font:inherit;font-size:13px;
  color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);outline:0}
textarea.in{height:auto;padding:9px 11px;line-height:1.55;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.55}

/* ---- khối chữ giải thích ---- */
.say{font-size:13px;color:var(--ink-2);line-height:1.7;max-width:74ch}
.say+.say{margin-top:9px}
.say b{color:var(--ink);font-weight:600}
.say code{font-family:var(--mono);font-size:12px;background:var(--fill);padding:1px 5px;border-radius:4px}

h4.sec{font-size:12px;color:var(--faint);font-weight:600;margin:20px 0 9px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
h4.sec:first-child{margin-top:0}

/* ---- ô chọn nhiều mục ---- */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line-2);
  border-radius:var(--r-sm);cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt.on{border-color:var(--accent);background:var(--accent-lo)}
.opt input{margin-top:3px;flex:none;accent-color:var(--accent)}
.opt b{display:block;font-size:13px;font-weight:500}
.opt span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}

/* ---- dải trạng thái nhỏ trên đầu thẻ ---- */
.ribbon{display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.ribbon svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ribbon.ok{background:var(--ok-lo);color:var(--ok)}
.ribbon.warn{background:var(--warn-lo);color:var(--warn)}
.ribbon.no{background:var(--danger-lo);color:var(--danger)}
.ribbon.info{background:var(--accent-lo);color:var(--accent)}

/* =====================================================================
   IN RA GIẤY
   ---------------------------------------------------------------------
   Bảng kê là tờ giấy khách gửi cho kế toán của họ. In ra thì bỏ hết
   phần điều hướng, ép về nền trắng chữ đen (máy in phun nền tối tốn
   mực và chữ nhoè), và bỏ nút bấm — trên giấy nút bấm là rác.
   ===================================================================== */
@media print {
  :root{ --bg:#fff; --card:#fff; --raised:#fff; --ink:#000; --ink-2:#333;
    --faint:#555; --line:#ccc; --line-2:#999; --head:#f0f0f0; --zebra:#fff;
    --fill:#f2f2f2; --band:#f6f6f6; --sel:#fff; --shadow:none; --shadow-2:none;
    color-scheme: light; }
  .side,.top,.tabs,.bar,.chips,.pager,.card-f select,.toasts,.drawer,.backdrop{display:none!important}
  .btn,.pill,.btnrow{display:none!important}
  .app{display:block}
  main{padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:10px}
  .page h1{font-size:19px}
  .tw{overflow:visible}
  table.t{min-width:0;font-size:11px}
  table.t td,table.t th{padding:5px 7px}
  a{color:#000;text-decoration:none}
  .say,.hint{color:#333}
}



/* ---- ô chọn cửa, chỉ có ở bản gói một trang ---- */
.cua-chon{margin-top:10px}
.cua-chon .seg{width:100%}
.cua-chon .seg button{flex:1;padding:7px 8px;font-size:11.5px}
.cua-chon p{font-size:11px;color:var(--on-chrome-3);line-height:1.55;margin-top:7px}
</style>


<script>
/* =====================================================================
   HAUSTEK PORTAL — LÕI DÙNG CHUNG  ("máy chủ giả lập")
   ---------------------------------------------------------------------
   File này đóng vai trò cái mà sau này là DATABASE + API. Hai trang
   intranet.html (admin) và dashboard.html (label / nghệ sĩ) cùng nạp
   file này, nhưng KHÔNG được phép với tới cùng một thứ:

     · HAUSTEK.admin  — toàn bộ dữ liệu thô, tên đơn vị phân phối, tỷ lệ
                        gốc, hàng chờ khớp ISRC, nút duyệt kỳ.
                        CHỈ intranet được chạm vào.
     · HAUSTEK.api    — trả về gói dữ liệu ĐÃ TÍNH SẴN và ĐÃ CẮT BỚT cho
                        đúng một người xem, đúng một kỳ ĐÃ DUYỆT.
                        Đây là thứ duy nhất dashboard được gọi.

/* Danh mục thật không chia đều. Một nhóm nghệ sĩ ra đều tay gánh phần lớn
   danh mục, phần còn lại mỗi người dăm bài. Chia đều cho 900 người thì ai
   cũng kiếm được vài nghìn đô một kỳ, và ngưỡng chi trả tối thiểu — cùng

const RANK = [];

const CORE_N = Math.round(CFG.N_ARTISTS * 0.45);
for (let i = 0; i < N; i++) {
  const a = rnd() < 0.88
    ? RANK[(rnd() * CORE_N) | 0]

  tRel[i] = (rnd() * P) | 0;
  tPop[i] = 0.04 + Math.pow(rnd(), 2.2) * 0.96;   /* độ phổ biến cũng đuôi dài: nhiều bài rất ít nghe */
  tType[i] = rnd() < 0.72 ? 0 : (rnd() < 0.6 ? 1 : 2);

/* ---------------------------------------------------------------------
   6. DOANH THU
   recGross[(i*P + p)*3 + f] — tách sẵn theo LUỒNG. Nhờ vậy "kỳ này chưa
   nạp TikTok" không phải là một lời cảnh báo suông: phần tiền của TikTok
   thật sự không có trong tổng, đúng như ngoài đời.
   Làm tròn tới xu ngay khi sinh, để bước đối chiếu so được tới từng xu.
   --------------------------------------------------------------------- */
const recGross = new Float64Array(N * P * 3);
const recStreams = new Int32Array(N * P);
const pubGross = new Float64Array(N * P);
for (let i = 0; i < N; i++) {
  const rel = tRel[i], pop = tPop[i];
  for (let p = rel; p < P; p++) {
    const decay = Math.pow(0.88, Math.max(p - rel - 1, 0));
    const season = 1 + 0.14 * Math.sin(p / 2.1);
    const st = Math.round(pop * decay * season * (9000 + rnd() * 260000));
    const idx = i * P + p;
    recStreams[idx] = st;
    const g = st * (0.0020 + rnd() * 0.0022);
    /* chia doanh thu bài đó cho ba luồng, mỗi bài một khẩu vị thị trường riêng */
    let sum = 0; const part = [0, 0, 0];
    for (let f = 0; f < 3; f++) { part[f] = FEED_W[f] * (0.6 + hash(i, 900 + f) * 0.8); sum += part[f]; }
    let acc = 0;
    for (let f = 0; f < 3; f++) {
      const v = f === 2 ? cents(g - acc) : cents(g * part[f] / sum);
      recGross[idx * 3 + f] = v; acc = cents(acc + v);
    }
    if (p >= rel + 2) pubGross[idx] = cents(pop * decay * (3 + rnd() * 70));
  }
}

/* ---------------------------------------------------------------------

function buildIndex(getKey, size) {
  const cnt = new Int32Array(size);
  for (let i = 0; i < N; i++) { const k = getKey(i); if (k >= 0) cnt[k]++; }
  const off = new Int32Array(size + 1);
  for (let i = 0; i < size; i++) off[i + 1] = off[i] + cnt[i];
  const arr = new Int32Array(off[size]); const cur = off.slice(0, size);
  for (let i = 0; i < N; i++) { const k = getKey(i); if (k >= 0) arr[cur[k]++] = i; }
  return { off, arr };
}
const byArtist = buildIndex(i => tArtist[i], CFG.N_ARTISTS);
const byLabel  = buildIndex(i => tLabel[i],  CFG.N_LABELS);
const byWriter = (() => {
  const cnt = new Int32Array(CFG.N_ARTISTS);
  for (let i = 0; i < N; i++) { cnt[tW1[i]]++; if (tW2[i] >= 0) cnt[tW2[i]]++; }
  const off = new Int32Array(CFG.N_ARTISTS + 1);
  for (let i = 0; i < CFG.N_ARTISTS; i++) off[i + 1] = off[i] + cnt[i];
  const arr = new Int32Array(off[CFG.N_ARTISTS]); const cur = off.slice(0, CFG.N_ARTISTS);
  for (let i = 0; i < N; i++) { arr[cur[tW1[i]]++] = i; if (tW2[i] >= 0) arr[cur[tW2[i]]++] = i; }
  return { off, arr };
})();

    carry: {},        /* dồn sang kỳ sau khi dưới ngưỡng chi trả */
    approved: {},     /* approved[periodKey] = {at, by, note} */
    payouts: {},      /* payouts[periodKey] = [{partyKey, earned, recoup, payable, carry}] */
    variance: {},     /* variance["<periodKey>:<feedId>"] = {amount, note, at} */
    fx: { rate: 26150, at: "2026-08-01", policy: "ngày chốt kỳ", locked: {} },
    accounts: [],
    audit: [],
    answers: {},      /* câu trả lời cho các câu hỏi còn treo (mục 3 tài liệu) */
    publishedAt: null
  };

  /* --- tỷ lệ khởi tạo: mỗi label và mỗi nghệ sĩ độc lập một dòng, hiệu
     lực từ kỳ đầu tiên. Đây là BẢNG, không phải cột — đổi tỷ lệ hôm nay
     không được làm đổi báo cáo các kỳ đã chốt (mục 5.5). --- */
  const first = PERIODS[0].k;
  LABELS.forEach(l => s.rates.push({ partyKey: l.key, rate: l.baseRate, from: first, by: "khởi tạo", at: "2025-08-01" }));
  ARTISTS.forEach(a => { if (a.labelId < 0) s.rates.push({ partyKey: a.key, rate: a.indieRate, from: first, by: "khởi tạo", at: "2025-08-01" }); });
  /* một label đổi tỷ lệ giữa chừng, để thấy tác dụng của ngày hiệu lực */
  s.rates.push({ partyKey: "L:3", rate: 0.72, from: PERIODS[8].k, by: "khởi tạo", at: "2026-04-02",
                 note: "Phụ lục hợp đồng ký 02.04.2026 — chỉ áp cho kỳ 04/2026 trở đi" });

  /* --- tạm ứng --- */
  ARTISTS.forEach(a => { if (rnd() < 0.18) s.advances[a.key] = { opening: Math.round(600 + rnd() * 22000), note: "Tạm ứng theo hợp đồng", byPeriod: {} }; });
  LABELS.forEach(l => { if (rnd() < 0.30) s.advances[l.key] = { opening: Math.round(4000 + rnd() * 90000), note: "Tạm ứng marketing / sản xuất", byPeriod: {} }; });

  /* --- lịch sử nạp: 11 kỳ đầu đã nạp đủ, kỳ mới nhất còn thiếu TikTok,
     một kỳ cũ từng thiếu YouTube rồi nạp bù muộn. Kỳ nào nạp đủ và đối
     chiếu sạch thì đã duyệt. --- */
  PERIODS.forEach((p, pi) => {
    s.feeds[p.k] = {};
    FEEDS.forEach(f => {
      const missing = (pi === P - 1 && f.id === 2);
      s.feeds[p.k][f.id] = missing
        ? { status: "missing", at: null, file: null, rows: 0, control: null }
        : { status: "loaded", at: p.year + "-" + String(p.month).padStart(2, "0") + "-22T09:14:00",
            file: fileNameFor(f, p), rows: 0, control: null };
    });
    /* tác quyền: chỉ về vào kỳ cuối mỗi quý, và trễ */
    s.pub[p.k] = (p.month % 3 === 0 && pi < P - 2)
      ? { status: "loaded", at: p.year + "-" + String(p.month).padStart(2, "0") + "-28T16:02:00", file: "vcpmc-quy" + p.quarter + "-" + p.year + ".xlsx" }
      : { status: "missing", at: null, file: null };
  });

  return s;
}
function fileNameFor(f, p) {
  const ym = p.year + String(p.month).padStart(2, "0");
  if (f.id === 0) return "sales-report-" + ym + ".csv";
  if (f.id === 1) return "yt-" + ym + "-partner.csv.gz";
  return "tiktok-" + ym + ".xlsx";
}

let state = null;

/* ---------------------------------------------------------------------
   9. LƯU / NẠP / XUẤT
   localStorage là kênh chính. Mở bằng file:// trên Safari thì localStorage
   bị chặn — nên có thêm đường xuất/nhập một file JSON nhỏ.
   --------------------------------------------------------------------- */
const store = {
  save() {
    try { localStorage.setItem(CFG.STORE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  },
  load() {
    try {
      const raw = localStorage.getItem(CFG.STORE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return (s && s.v === CFG.VERSION) ? s : null;
    } catch (e) { return null; }
  },
  clear() { try { localStorage.removeItem(CFG.STORE_KEY); } catch (e) {} },
  exportJSON() { return JSON.stringify(state, null, 1); },
  importJSON(txt) {
    const s = JSON.parse(txt);
    if (!s || s.v !== CFG.VERSION) throw new Error("Snapshot không đúng phiên bản " + CFG.VERSION);
    state = s; invalidateRates(); rebuildMatchIndex(); store.save(); return true;
  },
  available() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } }
};

const _saved = store.load();
const FRESH = !_saved;
state = _saved || defaultState();
if (FRESH) buildQueueSeed();

/* ---------------------------------------------------------------------
   10. HÀNG CHỜ KHỚP ISRC — "black box"
   Dòng doanh thu về mà không khớp được bản ghi nào thì KHÔNG được bỏ im.
   Riêng The MLC đang giữ hơn 424 triệu đô tiền chưa tìm ra chủ. Ở quy mô
   Haustek con số nhỏ hơn nhiều, nhưng đó vẫn là tiền của người khác.
   --------------------------------------------------------------------- */
function buildQueueSeed() {
  const BAD_TITLES = ["Đêm (Remix)","Sương - Acoustic","Vọng (feat. Chin)","Nhịp — live at Kho 13",
    "Mưa [sped up]","Trắng (Instrumental)","Khói (Radio Edit)","Lối về","Tro tàn","Vệt nắng"];
  let qid = 1;
  PERIODS.forEach((p, pi) => {
    FEEDS.forEach(f => {
      if (state.feeds[p.k][f.id].status !== "loaded") return;
      /* kỳ càng mới càng nhiều dòng chưa xử lý; kỳ cũ đã dọn gần hết */
      const n = pi >= P - 3 ? 3 + ((rnd() * 6) | 0) : (rnd() < 0.35 ? 1 : 0);
      for (let j = 0; j < n; j++) {
        const seedTrack = (rnd() * N) | 0;
        const broken = rnd();
        const isrc = broken < 0.34 ? ""                                  /* thiếu hẳn mã */
          : broken < 0.67 ? tIsrc[seedTrack].slice(0, -1) + "X"          /* sai một ký tự */
          : "QZ" + String(20 + ((rnd() * 6) | 0)) + String(100000 + ((rnd() * 899999) | 0)) + String(10 + ((rnd() * 89) | 0));
        state.queue.push({
          id: "Q" + String(qid++).padStart(5, "0"),
          periodKey: p.k, feedId: f.id,
          isrc,
          title: rnd() < 0.5 ? tTitle[seedTrack] : pick(BAD_TITLES),
          artist: ARTISTS[tArtist[seedTrack]].name,
          store: STORES[(rnd() * N_TOP) | 0],
          territory: pick(TERR),
          streams: Math.round(200 + rnd() * 90000),
          amount: cents(2 + rnd() * 900),
          reason: broken < 0.34 ? "Thiếu mã ISRC" : broken < 0.67 ? "Mã ISRC không có trong danh mục" : "Mã của nhà phát hành khác",
          hint: seedTrack,     /* bản ghi "đúng" — dùng để chấm điểm gợi ý, không hiện cho ai */
          status: "pending", resolvedTo: null, at: null
        });
      }
    });
  });
  store.save();
}

/* gợi ý khớp: so mã, so tên bài, so tên nghệ sĩ. Chấm điểm rồi xếp hạng —
   quyết định cuối vẫn là của người, hệ thống không tự khớp. */
function suggestFor(q, limit) {
  const out = [];
  const nq = norm(q.title), na = norm(q.artist);
  const seen = new Set();
  const push = (i, score, why) => { if (seen.has(i)) return; seen.add(i); out.push({ i, score, why }); };
  if (q.isrc) {
    for (let i = 0; i < N; i++) {
      if (tIsrc[i] === q.isrc || tIsrcAlt[i] === q.isrc) { push(i, 100, "Trùng mã ISRC"); break; }
    }
    /* sai một ký tự cuối là lỗi gõ tay hay gặp nhất */
    const stem = q.isrc.slice(0, -1);
    for (let i = 0; i < N && out.length < 40; i++) if (tIsrc[i].startsWith(stem)) push(i, 82, "Lệch 1 ký tự cuối mã ISRC");
  }
  for (let i = 0; i < N && out.length < 60; i++) {
    const t = norm(tTitle[i]);
    if (!t) continue;
    const a = norm(ARTISTS[tArtist[i]].name);
    if (t === nq && a === na) push(i, 90, "Trùng tên bài và tên nghệ sĩ");
    else if (t === nq) push(i, 62, "Trùng tên bài");
    else if (na && a === na && nq.includes(t)) push(i, 55, "Cùng nghệ sĩ · tên bài gần giống");
  }
  return out.sort((a, b) => b.score - a.score).slice(0, limit || 6);
}
function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d").replace(/\(.*?\)|\[.*?\]/g, "").replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(remix|acoustic|live|instrumental|radio edit|sped up|feat|ft)\b/g, "")
    .replace(/\s+/g, " ").trim();
}

/* =====================================================================
   11. TỶ LỆ CHIA CÓ NGÀY HIỆU LỰC
   rate_share KHÔNG phải một cột trên bảng nghệ sĩ. Nếu label đổi tỷ lệ
   hôm nay mà báo cáo các kỳ đã chốt đổi theo thì đó là lỗi không sửa
   được sau khi đã chi tiền.
   ===================================================================== */
/* Tra tỷ lệ chạy 50.000 lần cho mỗi lần tổng hợp một kỳ. Quét lại cả
   bảng mỗi lần thì trang đứng hình — nên dựng chỉ mục một lần rồi nhớ
   kết quả, và xoá bộ nhớ đệm mỗi khi bảng tỷ lệ đổi. */
let _sched = null, _rateCache = new Map();
function invalidateRates() { _sched = null; _rateCache.clear(); }
function schedIndex() {
  if (_sched) return _sched;
  _sched = new Map();
  state.rates.forEach(r => {
    let a = _sched.get(r.partyKey);
    if (!a) { a = []; _sched.set(r.partyKey, a); }
    a.push(r);
  });
  _sched.forEach(a => a.sort((x, y) => x.from < y.from ? -1 : x.from > y.from ? 1 : 0));
  return _sched;
}
const rates = {
  invalidate: invalidateRates,
  scheduleFor(partyKey) { return (schedIndex().get(partyKey) || []).slice(); },
  rateFor(partyKey, periodKey) {
    const ck = partyKey + "|" + periodKey;
    const hit = _rateCache.get(ck);
    if (hit !== undefined) return hit;
    const list = schedIndex().get(partyKey) || [];
    let r = null;
    for (const e of list) { if (e.from <= periodKey) r = e; else break; }
    const v = r ? r.rate : 0.8;
    _rateCache.set(ck, v);
    return v;
  },
  add(partyKey, rate, fromPeriodKey, by, note) {
    if (!(rate > 0 && rate < 1)) throw new Error("Tỷ lệ phải nằm giữa 0 và 1");
    if (state.approved[fromPeriodKey]) throw new Error("Kỳ " + fromPeriodKey + " đã duyệt — không đặt tỷ lệ hiệu lực vào kỳ đã chốt");
    state.rates = state.rates.filter(r => !(r.partyKey === partyKey && r.from === fromPeriodKey));
    state.rates.push({ partyKey, rate, from: fromPeriodKey, by: by || "admin", at: nowISO(), note: note || "" });
    invalidateRates();
    audit.log("rate.add", partyKey + " → " + (rate * 100).toFixed(1) + "% từ kỳ " + fromPeriodKey);
    store.save();
  },
  remove(partyKey, fromPeriodKey) {
    const before = state.rates.length;
    state.rates = state.rates.filter(r => !(r.partyKey === partyKey && r.from === fromPeriodKey));
    if (state.rates.length !== before) { invalidateRates(); audit.log("rate.remove", partyKey + " · kỳ " + fromPeriodKey); store.save(); }
  }
};
function partyKeyOfTrack(i) { return tLabel[i] >= 0 ? "L:" + tLabel[i] : "A:" + tArtist[i]; }
function partyName(key) {
  if (key === "P:*") return "Điểm producer — chưa gắn danh tính";
  const id = +key.slice(2);
  return key[0] === "L" ? (LABELS[id] ? LABELS[id].name : key) : (ARTISTS[id] ? ARTISTS[id].name : key);
}
function partyClientId(key) {
  if (key === "P:*") return "—";
  const id = +key.slice(2);
  return key[0] === "L" ? (LABELS[id] ? LABELS[id].clientId : "") : (ARTISTS[id] ? ARTISTS[id].clientId : "");
}

/* =====================================================================
   12. CHUỖI CHIA TIỀN  (mục 2.2 tài liệu bàn giao)

     Doanh thu gộp
       − phí Haustek (15%)
       − phần label giữ, hoặc phần Haustek giữ thêm nếu nghệ sĩ độc lập
       − điểm producer      ← TRỪ VÀO PHẦN NGHỆ SĨ, không cộng thêm bên trên
       = về tay nghệ sĩ (trước khi trừ tạm ứng)

   Điểm producer trừ vào phần nghệ sĩ là chuẩn ngành. Làm ngược lại thì
   tổng các phần vượt quá 100%.
   ===================================================================== */
function splitRec(i, gross, periodKey) {
  const fee = cents(gross * CFG.HAUSTEK_FEE);
  const net = cents(gross - fee);
  const r = rates.rateFor(partyKeyOfTrack(i), periodKey);
  const artistBase = cents(net * r);
  const labelCut = cents(net - artistBase);
  const producer = Math.min(cents(net * tProd[i]), artistBase);
  return { gross, fee, net, labelCut, producer, artist: cents(artistBase - producer), rate: r };
}

/* =====================================================================
   13. DOANH THU NHÌN THẤY ĐƯỢC
   Chỉ luồng ĐÃ NẠP mới có tiền trong tổng. Cộng thêm những dòng admin đã
   khớp tay từ hàng chờ.
   ===================================================================== */
let MATCH = new Map();                     /* (i*P+p) → Float64Array(3) tiền khớp tay theo luồng */
function rebuildMatchIndex() {
  MATCH = new Map();
  for (const k in state.match) {
    const [i, p, f] = k.split(":").map(Number);
    const key = i * P + p;
    let a = MATCH.get(key);
    if (!a) { a = new Float64Array(3); MATCH.set(key, a); }
    a[f] += state.match[k];
  }
}
rebuildMatchIndex();

function feedLoaded(pIdx, fId) {
  const st = state.feeds[PERIODS[pIdx].k];
  return !!(st && st[fId] && st[fId].status === "loaded");
}
function loadedFeedIds(pIdx) { return FEEDS.filter(f => feedLoaded(pIdx, f.id)).map(f => f.id); }
function missingFeeds(pIdx)  { return FEEDS.filter(f => !feedLoaded(pIdx, f.id)); }
function pubLoaded(pIdx)     { const s = state.pub[PERIODS[pIdx].k]; return !!(s && s.status === "loaded"); }

/* doanh thu bản ghi của một bài trong một kỳ, chỉ tính luồng đã nạp */
function grossRec(i, p) {
  const base = i * P + p, o = base * 3;
  let g = 0;
  if (feedLoaded(p, 0)) g += recGross[o];
  if (feedLoaded(p, 1)) g += recGross[o + 1];
  if (feedLoaded(p, 2)) g += recGross[o + 2];
  if (MATCH.size) {
    const m = MATCH.get(base);
    if (m) { for (let f = 0; f < 3; f++) if (feedLoaded(p, f)) g += m[f]; }
  }
  return g;
}
function grossRecByFeed(i, p, f) {
  if (!feedLoaded(p, f)) return 0;
  const base = i * P + p;
  const m = MATCH.size ? MATCH.get(base) : null;
  return recGross[base * 3 + f] + (m ? m[f] : 0);
}
function grossPub(i, p) { return pubLoaded(p) ? pubGross[i * P + p] : 0; }
function grossOf(i, p, stream) { return stream === "pub" ? grossPub(i, p) : grossRec(i, p); }

/* bóc một số tiền theo cửa hàng / lãnh thổ — tính từ mã bài, không lưu sẵn */
function splitDim(trackIdx, total, weights) {
  const out = new Float64Array(weights.length);
  let sum = 0;
  for (let j = 0; j < weights.length; j++) {
    const jitter = 0.55 + hash(trackIdx, j) * 0.9;
    out[j] = weights[j] * jitter; sum += out[j];
  }
  for (let j = 0; j < weights.length; j++) out[j] = out[j] / sum * total;
  return out;
}

/* =====================================================================
   14. PHẠM VI & TỔNG HỢP
   ===================================================================== */
const RONG = new Int32Array(0);
function scopeOf(role, partyId, stream) {
  if (role === "admin") return null;                         /* null = toàn danh mục */
  if (role === "label") {
    /* Tác quyền thuộc người sáng tác, không đi qua label. Trả danh mục bản
       ghi của label cho luồng tác quyền là mở toang cửa: bài thì đúng của
       label, nhưng TIỀN thì của người sáng tác — nhiều người trong số đó
       chẳng liên quan gì tới label. Chặn ngay ở đây, đừng chỉ chặn ở từng
       lời gọi: quên một lời gọi là quên cả một dòng tiền. */
    return stream === "pub" ? RONG : idxOf(byLabel, partyId);
  }
  return stream === "pub" ? idxOf(byWriter, partyId) : idxOf(byArtist, partyId);
}
/* Một chỗ duy nhất phát biểu luật, để không lời gọi nào quên. */
function chanTacQuyenChoLabel(role, stream) {
  if (stream === "pub" && role === "label")
    throw new Error("Tác quyền không đi qua label");
}
function writerShare(i, artistId) {
  if (tW1[i] === artistId) return tW1s[i];
  if (tW2[i] === artistId) return 1 - tW1s[i];
  return 0;
}
/* số tiền "của người này" trên một bài trong một kỳ */
function mineOf(i, p, role, partyId, stream) {
  const g = grossOf(i, p, stream);
  if (g <= 0) return 0;
  if (stream === "rec") {
    const s = splitRec(i, g, PERIODS[p].k);
    if (role === "admin") return s.gross;
    if (role === "label") return s.labelCut;
    return s.artist;
  }
  if (role === "admin") return g;
  return cents(g * (1 - CFG.PUB_FEE) * writerShare(i, partyId));
}

function agg(role, partyId, p, stream) {
  const sc = scopeOf(role, partyId, stream), n = sc ? sc.length : N;
  let total = 0, gross = 0, fee = 0, labelCut = 0, prod = 0, artist = 0, streams = 0, tracks = 0;
  for (let k = 0; k < n; k++) {
    const i = sc ? sc[k] : k;
    const g = grossOf(i, p, stream);
    if (g <= 0) continue;
    tracks++;
    if (stream === "rec") {
      const s = splitRec(i, g, PERIODS[p].k);
      gross += g; fee += s.fee; labelCut += s.labelCut; prod += s.producer; artist += s.artist;
      streams += recStreams[i * P + p];
      total += role === "admin" ? s.gross : (role === "label" ? s.labelCut : s.artist);
    } else {
      gross += g; fee += g * CFG.PUB_FEE;
      total += role === "admin" ? g : g * (1 - CFG.PUB_FEE) * writerShare(i, partyId);
    }
  }
  return { total: cents(total), gross: cents(gross), fee: cents(fee), labelCut: cents(labelCut),
           producer: cents(prod), artist: cents(artist), streams, tracks };
}

/* =====================================================================
   15. ĐỐI CHIẾU
   Tổng trên file gốc = phần đã khớp + phần treo. Chênh lệch phải bằng 0
   tới từng xu; nếu không, hoặc là parser sai, hoặc là file thiếu dòng —
   cả hai đều không được để lọt sang bước duyệt kỳ.
   ===================================================================== */
function feedTotals(pIdx, fId) {
  const pk = PERIODS[pIdx].k;
  let attributed = 0;
  for (let i = 0; i < N; i++) attributed += grossRecByFeed(i, pIdx, fId);
  attributed = cents(attributed);
  const pending = cents(state.queue
    .filter(q => q.periodKey === pk && q.feedId === fId && q.status === "pending")
    .reduce((s, q) => s + q.amount, 0));
  /* Khoản truy thu của kỳ khác đang được ghi vào kỳ này KHÔNG có trong file
     của kỳ này — phải trừ ra khỏi con số đem đi so với file gốc, không thì
     đối chiếu báo lệch trong khi chẳng có gì sai. */
  const adjustments = cents(state.queue
    .filter(q => q.status === "matched" && q.intoPeriod === pk && q.feedId === fId)
    .reduce((s, q) => s + q.amount, 0));
  const fromFile = cents(attributed - adjustments);
  const vKey = pk + ":" + fId;
  const injected = state.variance[vKey] ? 0 : builtinVariance(pIdx, fId);
  const control = cents(fromFile + pending + injected);
  return { attributed, adjustments, fromFile, pending, control,
           diff: cents(control - fromFile - pending),
           accepted: state.variance[vKey] || null };
}
/* một kỳ cố tình lệch, để thấy quy trình xử lý chênh lệch chứ không chỉ
   thấy màn hình toàn dấu tích xanh */
function builtinVariance(pIdx, fId) {
  return (pIdx === P - 2 && fId === 1) ? 41.37 : 0;
}
function recon(pIdx) {
  const rows = FEEDS.map(f => {
    const st = state.feeds[PERIODS[pIdx].k][f.id];
    const t = st.status === "loaded" ? feedTotals(pIdx, f.id)
            : { attributed: 0, adjustments: 0, fromFile: 0, pending: 0, control: 0, diff: 0, accepted: null };
    return { feed: f, status: st.status, at: st.at, file: st.file, ...t };
  });
  const sum = k => cents(rows.reduce((s, r) => s + (r[k] || 0), 0));
  return { rows, attributed: sum("attributed"), adjustments: sum("adjustments"),
           fromFile: sum("fromFile"), pending: sum("pending"),
           control: sum("control"), diff: sum("diff") };
}

/* =====================================================================
   16. DUYỆT KỲ — cánh cửa duy nhất mở số liệu cho khách
   ===================================================================== */
function approvalChecks(pIdx) {
  const pk = PERIODS[pIdx].k;
  const miss = missingFeeds(pIdx);
  const r = recon(pIdx);
  const a = agg("admin", 0, pIdx, "rec");
  const pendingAmt = r.pending;
  const ratio = a.gross > 0 ? pendingAmt / a.gross : 0;
  const unresolvedDiff = r.rows.filter(x => Math.abs(x.diff) > 0.005 && !x.accepted);
  return [
    { id: "feeds", ok: miss.length === 0, label: "Đã nạp đủ " + FEEDS.length + " luồng dữ liệu",
      detail: miss.length ? "Còn thiếu: " + miss.map(f => f.name).join(", ") : "Đủ cả " + FEEDS.length + " luồng" },
    { id: "recon", ok: unresolvedDiff.length === 0, label: "Đối chiếu khớp tới từng xu",
      detail: unresolvedDiff.length ? unresolvedDiff.map(x => x.feed.short + " lệch " + fmt.usd(x.diff)).join(" · ")
                                    : "Tổng hệ thống khớp tổng trên file gốc" },
    { id: "queue", ok: ratio <= CFG.BLACKBOX_CAP, label: "Tiền treo dưới " + (CFG.BLACKBOX_CAP * 100).toFixed(1) + "% doanh thu kỳ",
      detail: fmt.usd(pendingAmt) + " đang treo · " + (ratio * 100).toFixed(2) + "% doanh thu kỳ" },
    { id: "fx", ok: !!state.fx.locked[pk], label: "Đã chốt tỷ giá cho kỳ",
      detail: state.fx.locked[pk] ? "1 USD = " + fmt.num(state.fx.locked[pk].rate) + " ₫ · chốt " + state.fx.locked[pk].at
                                  : "Chưa chốt — số quy đổi sang VND sẽ trôi theo tỷ giá hôm nay" }
  ];
}
function canApprove(pIdx) { return approvalChecks(pIdx).every(c => c.ok); }

/* Kỳ phải đóng theo thứ tự. Phần tiền dưới ngưỡng chi trả được dồn từ kỳ
   này sang kỳ sau, và tạm ứng thu hồi dần qua từng kỳ — duyệt nhảy cóc thì
   hai chuỗi đó đứt, và không có cách nào phát hiện ra sau khi đã chi tiền. */
function approve(pIdx, by, note, force) {
  const pk = PERIODS[pIdx].k;
  if (state.approved[pk]) throw new Error("Kỳ " + pk + " đã duyệt rồi");
  const openBefore = PERIODS.slice(0, pIdx).filter(p => !state.approved[p.k]);
  if (openBefore.length)
    throw new Error("Phải duyệt xong kỳ trước đã: " + openBefore.map(p => p.label).join(", ")
      + " — tiền dồn và thu hồi tạm ứng chạy nối tiếp qua từng kỳ");
  const checks = approvalChecks(pIdx);
  const failed = checks.filter(c => !c.ok);
  if (failed.length && !force) throw new Error("Chưa đủ điều kiện duyệt: " + failed.map(c => c.label).join(" · "));
  state.approved[pk] = { at: nowISO(), by: by || "admin", note: note || "",
                         overrides: failed.map(c => c.id) };
  state.payouts[pk] = runPayout(pIdx, true);
  state.publishedAt = nowISO();
  audit.log("period.approve", "Duyệt kỳ " + PERIODS[pIdx].label + (failed.length ? " (bỏ qua: " + failed.map(c => c.label).join(", ") + ")" : ""));
  store.save();
  return state.payouts[pk];
}
function revoke(pIdx, why) {
  const pk = PERIODS[pIdx].k;
  if (!state.approved[pk]) return;
  const approvedAfter = PERIODS.slice(pIdx + 1).filter(p => state.approved[p.k]);
  if (approvedAfter.length)
    throw new Error("Phải thu hồi kỳ sau trước: " + approvedAfter.map(p => p.label).join(", ")
      + " — các kỳ sau đã tính dựa trên kết quả của kỳ này");
  /* Trả lại đúng trạng thái trước khi duyệt: hoàn phần đã thu hồi tạm ứng
     (không thì kỳ sau thu hồi hai lần) và trả phần dồn về đúng số dồn VÀO
     kỳ này, chứ không phải xoá trắng — xoá trắng là làm mất tiền của người ta. */
  (state.payouts[pk] || []).forEach(row => {
    const adv = state.advances[row.partyKey];
    if (adv && adv.byPeriod) delete adv.byPeriod[pk];
    if (row.carryIn > 0) state.carry[row.partyKey] = row.carryIn;
    else delete state.carry[row.partyKey];
  });
  delete state.payouts[pk]; delete state.approved[pk];
  state.publishedAt = nowISO();
  audit.log("period.revoke", "Thu hồi duyệt kỳ " + PERIODS[pIdx].label + (why ? " · " + why : ""));
  store.save();
}

/* =====================================================================
   17. CHI TRẢ & THU HỒI TẠM ỨNG
   Ai đã nhận tạm ứng thì tiền kỳ này đi trừ dần vào khoản đã ứng, chưa
   về tay họ. Dưới ngưỡng chi trả thì dồn sang kỳ sau chứ không mất.
   ===================================================================== */
function advanceBalance(partyKey) {
  const a = state.advances[partyKey];
  if (!a) return 0;
  const used = Object.values(a.byPeriod || {}).reduce((s, v) => s + v, 0);
  return cents(Math.max(a.opening - used, 0));
}
function earnedByParty(pIdx) {
  const out = new Map();
  const pk = PERIODS[pIdx].k;
  const add = (key, v) => out.set(key, cents((out.get(key) || 0) + v));
  for (let i = 0; i < N; i++) {
    const g = grossRec(i, pIdx);
    if (g <= 0) continue;
    const s = splitRec(i, g, pk);
    const lb = tLabel[i];
    if (lb >= 0) { add("L:" + lb, s.labelCut); add("A:" + tArtist[i], s.artist); }
    else add("A:" + tArtist[i], s.artist);
    if (s.producer > 0) add("P:" + i, s.producer);   /* producer gom theo bài, gộp lại ở bước chi */
  }
  if (pubLoaded(pIdx)) {
    for (let i = 0; i < N; i++) {
      const g = grossPub(i, pIdx);
      if (g <= 0) continue;
      const net = cents(g * (1 - CFG.PUB_FEE));
      add("A:" + tW1[i], cents(net * tW1s[i]));
      if (tW2[i] >= 0) add("A:" + tW2[i], cents(net * (1 - tW1s[i])));
    }
  }
  return out;
}
/* GHI vào sổ: đặt lượt thu hồi tạm ứng và phần dồn sang kỳ sau. Chỉ được
   gọi từ approve(). Gọi lạc một lần ngoài đó là ghi khống một lượt thu hồi
   cho kỳ chưa duyệt — và vì lần chạy sau thấy dư nợ đã trừ rồi nên nó
   không ghi đè lại, kết quả là sổ tạm ứng nói đã thu còn bảng chi trả nói
   chưa trừ. Bên ngoài muốn xem trước thì dùng previewPayout(). */
function runPayout(pIdx, ghi) {
  const pk = PERIODS[pIdx].k;
  const earned = earnedByParty(pIdx);
  const rows = [];
  /* Điểm producer đã trừ khỏi phần nghệ sĩ, nhưng danh mục hiện tại chỉ có
     cột Producer ghi TÊN, không có mã. Không có mã thì không biết trả cho
     ai, nên khoản này phải nằm lại một dòng riêng và nhìn thấy được — chứ
     không phải lặng lẽ biến mất khỏi bảng chi trả.
     Đây chính là câu hỏi số 3 còn treo: một cột Rate Share có đủ không,
     hay phải tách bảng chia phần mỗi dòng một người. */
  let producerHeld = 0;
  earned.forEach((amount, key) => { if (key[0] === "P") producerHeld = cents(producerHeld + amount); });
  earned.forEach((amount, key) => {
    if (key[0] === "P") return;
    const carryIn = state.carry[key] || 0;
    const gross = cents(amount + carryIn);
    const bal = advanceBalance(key);
    const recoup = cents(Math.min(bal, gross));
    const after = cents(gross - recoup);
    const payable = after >= CFG.PAYOUT_MIN ? after : 0;
    const carryOut = after >= CFG.PAYOUT_MIN ? 0 : after;
    if (ghi && recoup > 0) {
      const adv = state.advances[key];
      adv.byPeriod = adv.byPeriod || {}; adv.byPeriod[pk] = recoup;
    }
    if (ghi) state.carry[key] = carryOut;
    rows.push({ partyKey: key, kind: key[0] === "L" ? "label" : "artist",
                earned: amount, carryIn, recoup, payable, carryOut,
                advanceLeft: cents(Math.max(bal - recoup, 0)) });
  });
  rows.sort((a, b) => b.payable - a.payable);
  if (producerHeld > 0) rows.push({
    partyKey: "P:*", kind: "producer", held: true,
    earned: producerHeld, carryIn: 0, recoup: 0, payable: 0, carryOut: producerHeld, advanceLeft: 0,
    note: "Chưa gắn được danh tính producer — danh mục chỉ có tên, chưa có mã"
  });
  return rows;
}

function seedAccounts() {
  if (state.accounts.length) return;
  const mk = (email, role, partyKey, status) => ({
    id: "U" + String(state.accounts.length + 1).padStart(4, "0"),
    email, role, partyKey, status: status || "active",
    createdAt: "2026-08-01", lastSeen: null, mfa: role === "admin"
  });
  state.accounts.push(mk("mgmt@haustek-group.com", "admin", null));
  state.accounts.push(mk("ops@haustek-group.com", "admin", null));
  [0, 1, 2, 3].forEach(i => state.accounts.push(mk("label" + (i + 1) + "@vidu.vn", "label", LABELS[i].key)));
  /* Chọn tài khoản nghệ sĩ sao cho phủ đủ các trường hợp phải thử: thuộc
     label, độc lập, có phần sáng tác, không có phần sáng tác, đang còn nợ
     tạm ứng. Tên có ký tự lạ nằm ở nhóm đầu danh mục nên lấy luôn. */
  const wanted = [];
  const enough = i => idxOf(byArtist, i).length >= 12;
  const want = (test, n) => { let c = 0; for (let i = 0; i < REAL.length && c < n; i++) if (!wanted.includes(i) && enough(i) && test(ARTISTS[i])) { wanted.push(i); c++; } };
  want(a => a.labelId >= 0 && a.writer, 3);
  want(a => a.labelId < 0 && a.writer, 2);
  want(a => a.labelId < 0 && !a.writer, 1);
  want(a => a.labelId >= 0 && !a.writer, 1);
  wanted.forEach((i, n) => state.accounts.push(mk("nghesi" + (n + 1) + "@vidu.vn", "artist", ARTISTS[i].key)));
  state.accounts.push(mk("cho-moi@vidu.vn", "artist", ARTISTS[5].key, "invited"));
  store.save();
}

const ingest = {
  steps: INGEST_STEPS,
  load(pIdx, fId, opts) {
    const pk = PERIODS[pIdx].k;
    if (state.approved[pk]) throw new Error("Kỳ đã duyệt — muốn nạp lại phải thu hồi duyệt trước");
    const f = FEEDS.find(x => x.id === fId);
    const st = state.feeds[pk][fId];
    if (st.status === "loaded" && !(opts && opts.replace)) throw new Error("Luồng này đã nạp cho kỳ " + PERIODS[pIdx].label);
    st.status = "loaded";
    st.at = nowISO();
    st.file = (opts && opts.file) || fileNameFor(f, PERIODS[pIdx]);
    /* nạp xong thì luôn có một ít dòng không khớp được — đó là chuyện bình thường */
    const n = 2 + ((Math.random() * 5) | 0);
    let qid = state.queue.length + 1;
    for (let j = 0; j < n; j++) {
      const seedTrack = (Math.random() * N) | 0;
      state.queue.push({
        id: "Q" + String(Date.now() % 100000 + qid++).padStart(5, "0"),
        periodKey: pk, feedId: fId,
        isrc: Math.random() < 0.4 ? "" : tIsrc[seedTrack].slice(0, -1) + "X",
        title: tTitle[seedTrack], artist: ARTISTS[tArtist[seedTrack]].name,
        store: STORES[(Math.random() * N_TOP) | 0], territory: TERR[(Math.random() * TERR.length) | 0],
        streams: Math.round(200 + Math.random() * 90000), amount: cents(2 + Math.random() * 900),
        reason: Math.random() < 0.4 ? "Thiếu mã ISRC" : "Mã ISRC không có trong danh mục",
        hint: seedTrack, status: "pending", resolvedTo: null, at: null
      });
    }
    audit.log("ingest.load", "Nạp " + f.name + " · kỳ " + PERIODS[pIdx].label + " · " + st.file + " · " + n + " dòng vào hàng chờ");
    store.save();
    return { added: n };
  },
  unloadPub(pIdx) {
    const pk = PERIODS[pIdx].k;
    if (state.approved[pk]) throw new Error("Kỳ đã duyệt — thu hồi duyệt trước đã");
    state.pub[pk] = { status: "missing", at: null, file: null };
    audit.log("ingest.pub", "Gỡ báo cáo tác quyền kỳ " + PERIODS[pIdx].label);
    store.save();
  },
  unload(pIdx, fId) {
    const pk = PERIODS[pIdx].k;
    if (state.approved[pk]) throw new Error("Kỳ đã duyệt — thu hồi duyệt trước đã");
    state.feeds[pk][fId] = { status: "missing", at: null, file: null, rows: 0, control: null };
    audit.log("ingest.unload", "Gỡ luồng " + FEEDS[fId].name + " khỏi kỳ " + PERIODS[pIdx].label);
    store.save();
  },
  loadPub(pIdx, opts) {
    const pk = PERIODS[pIdx].k;
    /* Tác quyền chốt theo quý. Nạp một báo cáo quý vào tháng giữa quý là
       đặt cả quý tiền vào sai kỳ — và không ai phát hiện ra, vì con số vẫn
       "có". Chặn ở đây; muốn cố tình thì phải nói rõ ra. */
    if (PERIODS[pIdx].month % 3 !== 0 && !(opts && opts.force))
      throw new Error("Kỳ " + PERIODS[pIdx].label + " không phải cuối quý — tác quyền chốt theo quý, nạp vào đây là đặt cả quý tiền vào sai kỳ");
    if (state.approved[pk]) throw new Error("Kỳ đã duyệt — thu hồi duyệt trước đã");
    state.pub[pk] = { status: "loaded", at: nowISO(), file: (opts && opts.file) || ("cmo-" + pk + ".xlsx") };
    audit.log("ingest.pub", "Nạp báo cáo tác quyền kỳ " + PERIODS[pIdx].label);
    store.save();
  },
  acceptVariance(pIdx, fId, note) {
    const t = feedTotals(pIdx, fId);
    state.variance[PERIODS[pIdx].k + ":" + fId] = { amount: t.diff, note: note || "", at: nowISO() };
    audit.log("recon.accept", "Ghi nhận chênh lệch " + fmt.usd(t.diff) + " · " + FEEDS[fId].short + " kỳ " + PERIODS[pIdx].label + " · " + (note || "không ghi chú"));
    store.save();
  }
};

/* hàng chờ khớp ISRC */
const queue = {
  list(filter) {
    let l = state.queue;
    if (filter && filter.periodKey) l = l.filter(q => q.periodKey === filter.periodKey);
    if (filter && filter.status) l = l.filter(q => q.status === filter.status);
    if (filter && filter.feedId != null) l = l.filter(q => q.feedId === filter.feedId);
    return l;
  },
  pendingTotal(periodKey) {
    return cents(state.queue.filter(q => q.status === "pending" && (!periodKey || q.periodKey === periodKey))
      .reduce((s, q) => s + q.amount, 0));
  },
  suggest(qid) { const q = state.queue.find(x => x.id === qid); return q ? suggestFor(q, 6) : []; },
  /* Khớp một dòng của kỳ ĐÃ DUYỆT không được sửa lại kỳ đó. Kỳ đã chốt,
     đã đối chiếu, đã chi tiền, và khách đã đọc con số ấy — sửa lại là làm
     hai người cùng nhìn một kỳ mà ra hai số khác nhau.
     Cách làm của ngành: tiền vẫn về đúng chủ, nhưng cộng vào KỲ ĐANG MỞ
     gần nhất, ghi rõ là khoản truy thu của kỳ nào. Kỳ cũ giữ nguyên. */
  resolve(qid, trackIdx, by) {
    const q = state.queue.find(x => x.id === qid);
    if (!q) throw new Error("Không tìm thấy dòng " + qid);
    if (q.status !== "pending") throw new Error("Dòng này đã xử lý rồi");
    if (!(trackIdx >= 0 && trackIdx < N)) throw new Error("Bản ghi không hợp lệ");
    let p = pIndexOf(q.periodKey);
    let intoKey = null;
    if (state.approved[q.periodKey]) {
      const open = PERIODS.find(x => !state.approved[x.k]);
      if (!open) throw new Error("Kỳ của dòng này đã duyệt và không còn kỳ nào đang mở để ghi khoản truy thu — mở kỳ mới rồi khớp lại");
      p = open.idx; intoKey = open.k;
    }
    const key = trackIdx + ":" + p + ":" + q.feedId;
    state.match[key] = cents((state.match[key] || 0) + q.amount);
    q.status = "matched"; q.resolvedTo = trackIdx; q.at = nowISO(); q.by = by || "admin";
    q.intoPeriod = intoKey;
    rebuildMatchIndex();
    audit.log("queue.resolve", q.id + " → " + tIsrc[trackIdx] + " (" + tTitle[trackIdx] + ") · " + fmt.usd(q.amount)
      + (intoKey ? " · truy thu của kỳ " + q.periodKey + ", ghi vào kỳ " + intoKey : ""));
    store.save();
  },
  /* Kỳ nào sẽ nhận khoản truy thu nếu khớp dòng này bây giờ — để giao diện
     nói trước cho người bấm, đừng để họ ngạc nhiên sau khi đã bấm. */
  landingPeriod(qid) {
    const q = state.queue.find(x => x.id === qid);
    if (!q) return null;
    if (!state.approved[q.periodKey]) return { k: q.periodKey, label: PERIODS[pIndexOf(q.periodKey)].label, adjustment: false };
    const open = PERIODS.find(x => !state.approved[x.k]);
    return open ? { k: open.k, label: open.label, adjustment: true } : null;
  },
  park(qid, note) {
    const q = state.queue.find(x => x.id === qid);
    if (!q) return;
    q.status = "parked"; q.at = nowISO(); q.note = note || "";
    audit.log("queue.park", q.id + " · để lại chờ đối tác xác nhận · " + (note || ""));
    store.save();
  },
  unpark(qid) {
    const q = state.queue.find(x => x.id === qid);
    if (!q) return;
    if (q.status === "matched") {
      /* Gỡ đúng ở kỳ đã ghi vào — với khoản truy thu thì đó không phải kỳ
         gốc của dòng. Gỡ nhầm kỳ là để lại tiền ma trong sổ. */
      const landed = q.intoPeriod || q.periodKey;
      if (state.approved[landed]) throw new Error("Khoản này đã nằm trong kỳ " + landed + " và kỳ đó đã duyệt — thu hồi duyệt kỳ đó trước");
      const p = pIndexOf(landed);
      const key = q.resolvedTo + ":" + p + ":" + q.feedId;
      state.match[key] = cents((state.match[key] || 0) - q.amount);
      if (state.match[key] <= 0.004) delete state.match[key];
      rebuildMatchIndex();
    }
    q.status = "pending"; q.resolvedTo = null; q.at = null; q.intoPeriod = null;
    audit.log("queue.unpark", q.id + " · trả lại hàng chờ");
    store.save();
  }
};

/* =====================================================================
   22. ĐỊNH DẠNG & TIỆN ÍCH
   ===================================================================== */
const fmt = {
  usd:  v => "$" + (v < 0 ? "-" : "") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  usd0: v => "$" + (v < 0 ? "-" : "") + Math.round(Math.abs(v)).toLocaleString("en-US"),
  vnd:  (v, rate) => Math.round(v * (rate || state.fx.rate)).toLocaleString("vi-VN") + " ₫",
  money(v, cur, rate) { return cur === "VND" ? fmt.vnd(v, rate) : fmt.usd0(v); },
  money2(v, cur, rate) { return cur === "VND" ? fmt.vnd(v, rate) : fmt.usd(v); },
  num:  v => Math.round(v).toLocaleString("vi-VN"),
  pct:  v => (v * 100).toFixed(1).replace(/\.0$/, "") + "%",
  date: s => s ? String(s).slice(0, 10).split("-").reverse().join(".") : "—",
  when: s => s ? String(s).slice(8, 10) + "." + String(s).slice(5, 7) + "." + String(s).slice(0, 4) + " " + String(s).slice(11, 16) : "—",
  bytes: n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB"
};
/* Mọi chuỗi do người nhập hoặc do dữ liệu mang theo đều phải đi qua đây
   trước khi ghép vào HTML. Tên nghệ sĩ ở đây có &, ', :, dấu tiếng Việt. */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
