<style>
/* ===================================================================
   HƯỚNG D3 — BẢNG LÀM CHỦ, BIỂU ĐỒ ĐỠ
   Bảng đứng trước, biểu đồ nhỏ nằm cạnh để đỡ. Mở ra là dò được số.
   Mọi selector bắt đầu bằng .huong-d3. Không dùng id.
   =================================================================== */
.huong-d3{
  --dark:#0E1A24; --dark2:#16242F; --dark3:#1E313E;
  --bg:#F5F6F8;   --card:#FFFFFF;
  --ink:#1A2129;  --ink2:#5B6672; --faint:#8A939E; --line:#E6E9ED;
  --teal:#0E7C92; --teal-mid:#4FA3B5; --teal-soft:#B7E3EC;
  --slate:#9AA6B1;
  --blue:#2C6ECB; --blue-soft:#E8F0FB;
  --red:#C8102E;  --green:#157A4E;
  --zebra:#F7F8FA; --thead:#F1F3F5; --grid:#E2E6EA;
  --sh:0 1px 2px rgba(16,24,32,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  position:relative; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:14px; line-height:1.5; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
.huong-d3,.huong-d3 *{box-sizing:border-box}
.huong-d3 *{margin:0;padding:0}
.huong-d3 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.huong-d3 table{border-collapse:collapse;border-spacing:0}
.huong-d3 svg{display:block}
.huong-d3 svg text{font-family:var(--font)}
.huong-d3 :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.huong-d3 h1,.huong-d3 h2,.huong-d3 h3{font-weight:600;letter-spacing:-.012em}
.huong-d3 .d3-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- khung ---------- */
.huong-d3 .d3-shell{display:flex;align-items:stretch;min-height:940px}
.huong-d3 .d3-side{flex:0 0 270px;width:270px;background:var(--dark);color:#fff;
  display:flex;flex-direction:column}
.huong-d3 .d3-main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- sidebar ---------- */
.huong-d3 .d3-brand{height:52px;display:flex;align-items:center;gap:9px;padding:0 22px;flex:none}
.huong-d3 .d3-bname{font-size:15px;font-weight:600;letter-spacing:-.005em}
.huong-d3 .d3-bsub{font-size:11.5px;color:rgba(255,255,255,.42)}
.huong-d3 .d3-nav{padding:10px 12px 24px;flex:1}
.huong-d3 .d3-ng{font-size:11.5px;color:rgba(255,255,255,.36);padding:0 10px;margin:16px 0 5px}
.huong-d3 .d3-ng:first-child{margin-top:2px}
.huong-d3 .d3-ni{display:flex;align-items:center;gap:11px;width:100%;
  padding:8px 10px;border-radius:6px;font-size:13.5px;color:rgba(255,255,255,.72);
  transition:background .13s,color .13s}
.huong-d3 .d3-ni svg{flex:none;opacity:.6}
.huong-d3 .d3-ni:hover{background:var(--dark2);color:#fff}
.huong-d3 .d3-ni.on{background:var(--dark3);color:#fff;font-weight:500}
.huong-d3 .d3-ni.on svg{opacity:1}
.huong-d3 .d3-sfoot{padding:15px 22px 20px;border-top:1px solid var(--dark2);flex:none}
.huong-d3 .d3-user{font-size:13px;font-weight:500}
.huong-d3 .d3-role{font-size:11.5px;color:rgba(255,255,255,.42);margin-top:2px}

/* ---------- thanh tiện ích ---------- */
.huong-d3 .d3-util{display:flex;align-items:center;gap:8px;height:52px;flex:none;
  padding:0 30px;background:var(--card);border-bottom:1px solid var(--line);font-size:12.5px}
.huong-d3 .d3-crumb,.huong-d3 .d3-sep{color:var(--faint)}
.huong-d3 .d3-here{color:var(--ink2)}
.huong-d3 .d3-grow{flex:1}
.huong-d3 .d3-fx{color:var(--ink2);white-space:nowrap}
.huong-d3 .d3-fx b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.huong-d3 .d3-fx i{font-style:normal;color:var(--faint)}
.huong-d3 .d3-lang{display:flex;align-items:center;gap:0;margin-left:18px}
.huong-d3 .d3-lang button{padding:4px 8px;font-size:12px;color:var(--faint);border-radius:4px}
.huong-d3 .d3-lang button:hover{color:var(--ink)}
.huong-d3 .d3-lang button.on{color:var(--ink);font-weight:500}
.huong-d3 .d3-lsep{width:1px;height:12px;background:var(--line)}

/* ---------- trang ---------- */
.huong-d3 .d3-page{padding:26px 30px 44px;display:flex;flex-direction:column;gap:18px}
.huong-d3 .d3-head{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap}
.huong-d3 .d3-h1{font-size:24px;line-height:1.2}
.huong-d3 .d3-code{font-style:normal;color:var(--blue);font-weight:500;margin-left:8px}
.huong-d3 .d3-reads{display:flex;gap:44px}
.huong-d3 .d3-read{text-align:right}
.huong-d3 .d3-read .l{font-size:12px;color:var(--faint);margin-bottom:3px}
.huong-d3 .d3-read .v{font-size:23px;font-weight:600;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.huong-d3 .d3-read .s{font-size:12px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

/* ---------- bộ lọc ---------- */
.huong-d3 .d3-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.huong-d3 .d3-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;
  border-radius:15px;background:#EDEFF2;color:var(--ink);font-size:12.5px;transition:background .13s}
.huong-d3 .d3-pill:hover{background:#E4E7EB}
.huong-d3 .d3-pill.on{background:var(--blue-soft);color:#1F4E93}
.huong-d3 .d3-pill svg{opacity:.55}

/* ---------- khối ---------- */
.huong-d3 .d3-card{background:var(--card);border-radius:8px;box-shadow:var(--sh);padding:20px 22px 22px}
.huong-d3 .d3-plain{padding:2px 0 4px}
.huong-d3 .d3-ch{display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:14px}
.huong-d3 .d3-h2{font-size:15.5px}
.huong-d3 .d3-h3{font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:12px}
.huong-d3 .d3-note{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.huong-d3 .d3-foot{margin-top:12px;font-size:12px;color:var(--faint);line-height:1.7;
  font-variant-numeric:tabular-nums}

/* ---------- bảng ---------- */
.huong-d3 .d3-tw{overflow-x:auto}
.huong-d3 .d3-tbl{width:100%;font-size:13.5px}
.huong-d3 .d3-tbl th{background:var(--thead);color:var(--ink2);font-weight:500;font-size:12px;
  text-align:left;padding:8px 12px;white-space:nowrap;line-height:1.35}
.huong-d3 .d3-tbl th:first-child{border-radius:4px 0 0 4px}
.huong-d3 .d3-tbl th:last-child{border-radius:0 4px 4px 0}
.huong-d3 .d3-tbl td{padding:10px 12px;vertical-align:middle;line-height:1.45}
.huong-d3 .d3-tbl tbody tr:nth-child(even) td{background:var(--zebra)}
.huong-d3 .d3-tbl .d3-n{text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.huong-d3 .d3-tbl th.d3-n{text-align:right}
.huong-d3 .d3-sub{display:block;font-size:11.5px;color:var(--faint);margin-top:1px;
  font-variant-numeric:tabular-nums}
.huong-d3 .d3-dim{color:var(--faint)}
.huong-d3 .d3-soft{color:var(--ink2)}
.huong-d3 .d3-red{color:var(--red)}
.huong-d3 .d3-lead td{font-weight:500;font-size:14.5px}
.huong-d3 .d3-tot td{font-weight:500;background:#fff!important;
  border-top:1px solid var(--line);padding-top:11px}
.huong-d3 .d3-code2{font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:-.01em}
.huong-d3 .d3-link{color:var(--blue);cursor:pointer}
.huong-d3 .d3-link:hover{text-decoration:underline}

/* thanh nhỏ trong ô bảng */
.huong-d3 .d3-bcell{width:84px;padding-right:0}
.huong-d3 .d3-track{height:6px;border-radius:3px;background:#EDF0F2;overflow:hidden}
.huong-d3 .d3-track span{display:block;height:100%;background:var(--teal);border-radius:3px}
.huong-d3 .d3-track.d3-tail span{background:var(--slate)}

/* ---------- tình trạng kỳ ---------- */
.huong-d3 .d3-shead{display:flex;align-items:flex-start;justify-content:space-between;
  gap:22px;flex-wrap:wrap;margin-bottom:15px}
.huong-d3 .d3-warn{display:flex;align-items:flex-start;gap:11px}
.huong-d3 .d3-warn svg{flex:none;margin-top:2px}
.huong-d3 .d3-warn .t{font-size:15.5px;font-weight:600;letter-spacing:-.012em}
.huong-d3 .d3-warn .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.huong-d3 .d3-acts{display:flex;gap:9px;flex:none}
.huong-d3 .d3-btn{padding:8px 15px;border-radius:6px;font-size:13px;font-weight:500;
  background:#EDEFF2;color:var(--ink);transition:background .13s;white-space:nowrap}
.huong-d3 .d3-btn:hover{background:#E4E7EB}
.huong-d3 .d3-btn-pri{background:var(--dark);color:#fff}
.huong-d3 .d3-btn-pri:hover{background:var(--dark2)}
.huong-d3 .d3-btn-pri:disabled{background:#E7EAEE;color:#9AA3AD;cursor:not-allowed}
.huong-d3 .d3-chk td:first-child{width:26px;padding-right:0}
.huong-d3 .d3-chk td:first-child svg{margin-top:1px}

/* ---------- hai cột ---------- */
.huong-d3 .d3-flow{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);
  gap:30px;align-items:start}
.huong-d3 .d3-recon{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:30px;align-items:start}
.huong-d3 .d3-split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.huong-d3 .d3-wfwrap,.huong-d3 .d3-trendwrap{width:100%}
.huong-d3 .d3-mix{padding-top:2px}
.huong-d3 .d3-donutrow{display:flex;align-items:center;gap:15px}
.huong-d3 .d3-lg{display:flex;flex-direction:column;gap:9px;min-width:0}
.huong-d3 .d3-lgi{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.huong-d3 .d3-lgd{width:9px;height:9px;border-radius:50%;flex:none}
.huong-d3 .d3-lgn{color:var(--ink2);flex:1}
.huong-d3 .d3-lgv{font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- tab ---------- */
.huong-d3 .d3-tabs{display:flex;gap:20px}
.huong-d3 .d3-tab{font-size:13px;color:var(--ink2);padding:2px 0 6px;
  border-bottom:2px solid transparent;transition:color .13s,border-color .13s}
.huong-d3 .d3-tab:hover{color:var(--ink)}
.huong-d3 .d3-tab.on{color:var(--ink);font-weight:500;border-bottom-color:var(--teal)}

/* ---------- gợi ý ---------- */
.huong-d3 .d3-tip{position:absolute;z-index:20;pointer-events:none;opacity:0;
  transform:translate(-50%,-100%);background:#fff;border-radius:6px;
  box-shadow:0 3px 12px rgba(16,24,32,.14);padding:8px 11px;font-size:12px;
  line-height:1.55;white-space:nowrap;transition:opacity .1s}
.huong-d3 .d3-tip.on{opacity:1}
.huong-d3 .d3-tip .k{color:var(--ink2)}
.huong-d3 .d3-tip .v{font-weight:500;font-variant-numeric:tabular-nums}
.huong-d3 .d3-tip .p{color:var(--faint)}

@media (max-width:1180px){
  .huong-d3 .d3-flow,.huong-d3 .d3-recon,.huong-d3 .d3-split{grid-template-columns:minmax(0,1fr)}
  .huong-d3 .d3-recon{gap:22px}
  .huong-d3 .d3-page{padding:24px 24px 40px}
  .huong-d3 .d3-util{padding:0 24px}
  .huong-d3 .d3-reads{gap:38px}
  .huong-d3 .d3-read{text-align:left}
}
@media (prefers-reduced-motion:reduce){.huong-d3 *{transition:none!important}}
</style>

<div class="huong-d3">
  <div class="d3-shell">

    <aside class="d3-side">
      <div class="d3-brand">
        <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><circle cx="4.5" cy="4.5" r="4.5" fill="#FF2E4C"/></svg>
        <span class="d3-bname">Haustek</span>
        <span class="d3-bsub" data-t="brandSub"></span>
      </div>
      <nav class="d3-nav" data-nav></nav>

        <div class="d3-role" data-t="role"></div>
      </div>
    </aside>

    <div class="d3-main">
      <div class="d3-util">
        <span class="d3-crumb" data-t="crumb"></span>
        <span class="d3-sep">/</span>
        <span class="d3-here" data-t="screen"></span>
        <span class="d3-grow"></span>
        <span class="d3-fx" data-fx></span>
        <div class="d3-lang" data-lang>
          <button type="button" data-set="vi">VI</button>
          <span class="d3-lsep"></span>
          <button type="button" data-set="en">EN</button>

      </div>

      <div class="d3-page">

        <div class="d3-head">

        <div class="d3-filters" data-filters></div>

        <section class="d3-card">

        <section class="d3-card">

            <span class="d3-note" data-kpi-note></span>
          </div>
          <div class="d3-tw"><table class="d3-tbl" data-kpi></table></div>
        </section>

        <section class="d3-card">
          <div class="d3-ch">
            <h2 class="d3-h2" data-t="flowH"></h2>
            <span class="d3-note" data-flow-note></span>
          </div>
          <div class="d3-flow">
            <div class="d3-tw"><table class="d3-tbl" data-flow></table></div>
            <div class="d3-wfwrap" data-wfwrap><svg data-wf aria-hidden="true"></svg></div>
          </div>
          <div class="d3-foot" data-flow-foot></div>
        </section>

        <section class="d3-card">
          <div class="d3-ch">
            <h2 class="d3-h2" data-t="reconH"></h2>
            <span class="d3-note" data-recon-note></span>
          </div>
          <div class="d3-recon">
            <div class="d3-tw"><table class="d3-tbl" data-recon></table></div>
            <div class="d3-mix">
              <div class="d3-h3" data-t="mixH"></div>
              <div class="d3-donutrow">
                <svg width="116" height="116" viewBox="0 0 116 116" data-donut aria-hidden="true"></svg>
                <div class="d3-lg" data-legend></div>
              </div>
            </div>
          </div>
        </section>

        <section class="d3-plain">
          <div class="d3-ch">
            <h2 class="d3-h2" data-t="trendH"></h2>
            <div class="d3-tabs" data-tabs></div>
          </div>
          <div class="d3-trendwrap" data-trendwrap><svg data-trend></svg></div>
          <div class="d3-foot" data-t="trendNote"></div>
        </section>

        <div class="d3-split">
          <section class="d3-card">
            <div class="d3-ch">
              <h2 class="d3-h2" data-t="storeH"></h2>
              <span class="d3-note" data-store-note></span>
            </div>
            <div class="d3-tw"><table class="d3-tbl" data-stores></table></div>
          </section>
          <section class="d3-card">
            <div class="d3-ch">
              <h2 class="d3-h2" data-t="terrH"></h2>
              <span class="d3-note" data-terr-note></span>
            </div>
            <div class="d3-tw"><table class="d3-tbl" data-terr></table></div>
          </section>
        </div>

        <section class="d3-card">
          <div class="d3-ch">
            <h2 class="d3-h2" data-t="payH"></h2>
            <span class="d3-note" data-t="payNote"></span>
          </div>
          <div class="d3-tw"><table class="d3-tbl" data-pay></table></div>
          <div class="d3-foot" data-pay-foot></div>
        </section>

      </div>
    </div>
  </div>
  <div class="d3-tip" data-tip></div>
</div>

        '<td class="d3-n">' + usd(r.value) + '</td>' +
        '<td class="d3-n d3-soft">' + pct(ofGross(r.value)) + '</td>' +
        '<td class="d3-bcell"><div class="d3-track"><span style="width:' +
        (r.value / max * 100).toFixed(2) + '%"></span></div></td></tr>';
    }).join('');
    if (tail) {
      body += '<tr><td class="d3-dim">' + esc(tailTxt) + '</td>' +
        '<td class="d3-n d3-soft">' + usd(tail.value) + '</td>' +
        '<td class="d3-n d3-dim">' + pct(ofGross(tail.value)) + '</td>' +
        '<td class="d3-bcell"><div class="d3-track d3-tail"><span style="width:' +
        Math.min(100, tail.value / max * 100).toFixed(2) + '%"></span></div></td></tr>';
    }
    setHTML(sel, head + '<tbody>' + body + '</tbody>');
  }

  function paintRanks() {
    var L = t();
    rankTable('[data-stores]', S.stores || [], S.storesTail,
      fill(L.tailStore, { n: fmt(S.storesTail.count, 0) }), L.rankTh);
    rankTable('[data-terr]', S.territories || [], S.terrTail,
      fill(L.tailTerr, { n: fmt(S.terrTail.count, 0) }), L.rankTh2);
  }

  function paintPay() {
    var L = t();
    var head = '<thead><tr><th>' + esc(L.payTh[0]) + '</th><th>' + esc(L.payTh[1]) + '</th>' +
      '<th>' + esc(L.payTh[2]) + '</th>' +
      '<th class="d3-n">' + esc(L.payTh[3]) + '</th>' +
      '<th class="d3-n">' + esc(L.payTh[4]) + '</th></tr></thead>';
    var body = (S.payees || []).map(function (p) {
      return '<tr><td><span class="d3-link">' + esc(p.name) + '</span></td>' +
        '<td class="d3-code2">' + esc(p.clientId) + '</td>' +
        '<td class="d3-soft">' + esc(p.kind === 'label' ? L.kindLabel : L.kindArtist) + '</td>' +
        '<td class="d3-n">' + usd(p.earned) + '</td>' +
        '<td class="d3-n ' + (p.advance ? 'd3-soft' : 'd3-dim') + '">' +
        (p.advance ? usd(p.advance) : '—') + '</td></tr>';
    }).join('');
    setHTML('[data-pay]', head + '<tbody>' + body + '</tbody>');
  }

  /* ================= vòng tròn ba luồng ================= */
  function drawDonut() {
    var svg = el('[data-donut]');
    if (!svg) return;
    var cx = 58, cy = 58, r = 40, w = 26, a = -Math.PI / 2, out = '';
    (S.feeds || []).forEach(function (f, i) {
      var sw = f.gross / N.gross * Math.PI * 2, b = a + sw;
      var big = sw > Math.PI ? 1 : 0, ro = r + w / 2, ri = r - w / 2;
      out += '<path d="M' + (cx + ro * Math.cos(a)).toFixed(2) + ' ' + (cy + ro * Math.sin(a)).toFixed(2) +
        ' A' + ro + ' ' + ro + ' 0 ' + big + ' 1 ' + (cx + ro * Math.cos(b)).toFixed(2) + ' ' + (cy + ro * Math.sin(b)).toFixed(2) +
        ' L' + (cx + ri * Math.cos(b)).toFixed(2) + ' ' + (cy + ri * Math.sin(b)).toFixed(2) +
        ' A' + ri + ' ' + ri + ' 0 ' + big + ' 0 ' + (cx + ri * Math.cos(a)).toFixed(2) + ' ' + (cy + ri * Math.sin(a)).toFixed(2) +
        ' Z" fill="' + DCOL[i] + '"/>';
      a = b;
    });
    svg.innerHTML = out;
  }

  /* ================= thác nước ================= */
  function drawWF() {
    var wrap = el('[data-wfwrap]'), svg = el('[data-wf]');
    if (!wrap || !svg) return;
    var W = wrap.clientWidth;
    if (!W) return;
    var H = W > 560 ? 206 : 268, padT = 30, padB = 30, plotH = H - padT - padB;
    var sc = plotH / N.gross;
    var band = W / 5, bw = Math.min(52, band * 0.5);
    function y(v) { return padT + plotH - v * sc; }

    var out = '<line x1="0" y1="' + (padT + plotH) + '" x2="' + W + '" y2="' + (padT + plotH) +
      '" stroke="#D9DEE3" stroke-width="1"/>';
    var run = N.gross, tops = [];
    STEPS.forEach(function (s, i) {
      var top, bot;
      if (i === 0) { top = N.gross; bot = 0; }
      else if (i === STEPS.length - 1) { top = s.v; bot = 0; }
      else { top = run; bot = run - s.v; run = bot; }
      tops.push({ top: top, bot: bot });
      var x = band * i + (band - bw) / 2;
      var h = Math.max(2.5, (top - bot) * sc);
      var yy = y(top);
      out += '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + h.toFixed(1) + '" fill="' + (s.sign > 0 ? TEAL : SLATE) + '"/>';
    });
    /* đường nối giữa các cột, ở mức số dư đang chạy */
    for (var i = 0; i < STEPS.length - 1; i++) {
      var lv = i === 0 ? N.gross : tops[i].bot;
      var x1 = band * i + (band + bw) / 2, x2 = band * (i + 1) + (band - bw) / 2;
      out += '<line x1="' + x1.toFixed(1) + '" y1="' + y(lv).toFixed(1) + '" x2="' + x2.toFixed(1) +
        '" y2="' + y(lv).toFixed(1) + '" stroke="#C9D0D7" stroke-width="1" stroke-dasharray="3 3"/>';
    }
    /* nhãn số trên đầu cột, nhãn tên dưới chân */
    var L = t();
    STEPS.forEach(function (s, i) {
      var cx = band * i + band / 2;
      out += '<text x="' + cx.toFixed(1) + '" y="' + (y(tops[i].top) - 9).toFixed(1) +
        '" text-anchor="middle" font-size="11" font-weight="500" fill="#1A2129">' +
        esc((s.sign < 0 ? '−' : '') + shortUsd(s.v)) + '</text>';
      out += '<text x="' + cx.toFixed(1) + '" y="' + (H - 11) +
        '" text-anchor="middle" font-size="11" fill="#8A939E">' + esc(L.wfShort[i]) + '</text>';
    });
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = out;
  }

  /* ================= xu hướng 12 kỳ ================= */
  function niceStep(raw) {
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / mag;
    return mag * (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10);
  }
  var SKEY = ['gross', 'artist', 'streams'];

  function drawTrend() {
    var wrap = el('[data-trendwrap]'), svg = el('[data-trend]');
    if (!wrap || !svg) return;
    var W = wrap.clientWidth;
    if (!W) return;
    var key = SKEY[serIdx], money = serIdx < 2;
    var H = 236, padT = 22, padB = 30, padL = 54, padR = 6;
    var plotH = H - padT - padB, plotW = W - padL - padR;
    var max = 0;
    B.forEach(function (b) { if (b[key] > max) max = b[key]; });
    var step = niceStep(max / 4), nStep = Math.ceil(max / step), top = step * nStep;
    function y(v) { return padT + plotH - v / top * plotH; }

    var out = '';
    for (var g = 0; g <= nStep; g++) {
      var v = step * g, yy = y(v);
      out += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yy.toFixed(1) + '" stroke="' + (g ? '#E2E6EA' : '#D9DEE3') + '" stroke-width="1"/>';
      out += '<text x="' + (padL - 10) + '" y="' + (yy + 3.5).toFixed(1) +
        '" text-anchor="end" font-size="10.5" fill="#8A939E">' +
        esc(g === 0 ? '0' : axisLab(v, money)) + '</text>';
    }
    var band = plotW / B.length, bw = Math.min(40, band * 0.54);
    var shortLab = band < 52;
    B.forEach(function (b, i) {
      var x = padL + band * i + (band - bw) / 2, yy = y(b[key]);
      var h = Math.max(1, padT + plotH - yy);
      out += '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + h.toFixed(1) + '" fill="' + (b.approved ? TEAL : TSOFT) + '"/>';
      var lab = shortLab ? b.label.slice(0, 3) + b.label.slice(5) : b.label;
      out += '<text x="' + (padL + band * i + band / 2).toFixed(1) + '" y="' + (H - 11) +
        '" text-anchor="middle" font-size="10.5" font-weight="' + (b.k === N.k ? '500' : '400') +
        '" fill="' + (b.k === N.k ? '#1A2129' : '#8A939E') + '">' + esc(lab) + '</text>';
      if (b.k === N.k) {
        out += '<text x="' + (padL + band * i + band / 2).toFixed(1) + '" y="' + (yy - 8).toFixed(1) +
          '" text-anchor="middle" font-size="11" font-weight="500" fill="#1A2129">' +
          esc(money ? shortUsd(b[key]) : shortN(b[key])) + '</text>';
      }
      out += '<rect x="' + (padL + band * i).toFixed(1) + '" y="' + padT + '" width="' + band.toFixed(1) +
        '" height="' + plotH + '" fill="transparent" data-bi="' + i + '"/>';
    });
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = out;
  }

  /* ================= gợi ý ================= */
  var tip = el('[data-tip]');
  function tipShow(e, i) {
    var b = B[i], L = t(), key = SKEY[serIdx], money = serIdx < 2;
    tip.innerHTML = '<div class="k">' + esc(b.label) + ' · <span class="p">' +
      esc(b.approved ? L.tipDone : L.tipPend) + '</span></div>' +
      '<div class="v">' + esc(money ? usd(b[key]) : fmt(b[key], 0)) + '</div>';
    var r = root.getBoundingClientRect();
    tip.style.left = (e.clientX - r.left) + 'px';
    tip.style.top = (e.clientY - r.top - 14) + 'px';
    tip.classList.add('on');
  }
  function tipHide() { tip.classList.remove('on'); }

  root.addEventListener('mousemove', function (e) {
    var h = e.target.closest ? e.target.closest('[data-bi]') : null;
    if (h) tipShow(e, +h.getAttribute('data-bi')); else tipHide();
  });
  root.addEventListener('mouseleave', tipHide);

  /* ================= tương tác ================= */
  root.addEventListener('click', function (e) {
    var tg = e.target.closest ? e.target.closest('[data-set],[data-ti],[data-ni],.d3-pill') : null;
    if (!tg || !root.contains(tg)) return;
    if (tg.hasAttribute('data-set')) {
      var l = tg.getAttribute('data-set');
      if (l !== lang) { lang = l; paintAll(); }
      return;
    }
    if (tg.hasAttribute('data-ti')) {
      serIdx = +tg.getAttribute('data-ti');
      root.querySelectorAll('.d3-tab').forEach(function (b) {
        b.classList.toggle('on', +b.getAttribute('data-ti') === serIdx);
      });
      tipHide(); drawTrend();
      return;
    }
    if (tg.hasAttribute('data-ni')) {
      navIdx = +tg.getAttribute('data-ni');
      root.querySelectorAll('.d3-ni').forEach(function (b) {
        b.classList.toggle('on', +b.getAttribute('data-ni') === navIdx);
      });
      return;
    }
    if (tg.classList.contains('d3-pill')) {
      root.querySelectorAll('.d3-pill').forEach(function (b) { b.classList.toggle('on', b === tg); });
    }
  });

  function paintAll() {
    paintStatic(); paintNav(); paintReads(); paintFilters(); paintStatus();
    paintKpi(); paintFlow(); paintRecon(); paintTabs(); paintRanks(); paintPay();
    drawDonut(); drawWF(); drawTrend();
  }

  /* ================= vẽ lại khi đổi bề rộng ================= */
  var lastW = -1, raf = 0;
  function schedule() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      raf = 0;
      var w = root.clientWidth;
      if (!w || w === lastW) return;
      lastW = w; tipHide(); drawWF(); drawTrend();
    });
  }

  paintAll();
  schedule();
  window.addEventListener('resize', schedule);
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(root);
})();
</script>
