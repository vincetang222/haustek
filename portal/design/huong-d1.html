<style>
/* ==================================================================
   HƯỚNG D1 — bám sát ảnh giao diện khách gửi.
   Khung tối bên trái + thanh trên, vùng nội dung sáng, thẻ trắng không viền.
   MỌI selector bắt đầu bằng .huong-d1 — file này nằm chung trang với các hướng khác.
   ================================================================== */
.huong-d1{
  --dark:#0E1A24; --dark-2:#16242F; --dark-3:#1B2C38; --dark-4:#243646;
  --on-dark:#EAF0F5; --on-dark-2:#B9C6D1; --on-dark-3:#6C7D8B;

  --bg:#F5F6F8; --card:#FFFFFF;
  --ink:#1A2129; --ink-2:#5B6672; --faint:#8A939E; --line:#E6E9ED;
  --zebra:#FAFBFC; --head:#F2F4F6; --fill:#ECEEF1;

  --teal:#0E7C92; --teal-2:#3D9DB1; --teal-3:#7FC3D2; --teal-lo:#B7E3EC;
  --blue:#2C6ECB; --sel:#E6EEFA;
  --red:#C8102E; --red-lo:#FCEEF0; --red-ink:#8E1226;
  --green:#157A4E;
  --grey-bar:#DCE1E6;

  --f:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 1px 2px rgba(16,24,32,.06);

  background:var(--bg); color:var(--ink);
  font-family:var(--f); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.huong-d1 *{margin:0;padding:0;box-sizing:border-box}
.huong-d1 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.huong-d1 svg{display:block}
.huong-d1 table{border-collapse:collapse;width:100%}
.huong-d1 ul{list-style:none}
.huong-d1 :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.huong-d1 .d1-n{font-variant-numeric:tabular-nums}
.huong-d1 .d1-mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- thanh trên (tối) ---------- */
.huong-d1 .d1-top{display:flex;align-items:center;gap:14px;height:56px;padding:0 22px;
  background:var(--dark);color:var(--on-dark);border-bottom:1px solid var(--dark-2)}
.huong-d1 .d1-brand{display:flex;align-items:center;gap:9px;flex:0 0 248px;
  font-size:13.5px;font-weight:600;letter-spacing:.15em}
.huong-d1 .d1-dot{width:8px;height:8px;border-radius:50%;background:#FF2E4C;flex:0 0 auto}
.huong-d1 .d1-brand em{font-style:normal;font-weight:400;font-size:11.5px;
  letter-spacing:.02em;color:var(--on-dark-3)}
.huong-d1 .d1-grow{flex:1}
.huong-d1 .d1-fx{font-size:12px;color:var(--on-dark-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.huong-d1 .d1-lang{display:flex;gap:2px;background:var(--dark-2);border-radius:7px;padding:2px;flex:0 0 auto}
.huong-d1 .d1-lang button{padding:5px 11px;border-radius:5px;font-size:12px;font-weight:500;
  color:#8F9DAA;transition:background .15s,color .15s}
.huong-d1 .d1-lang button:hover{color:var(--on-dark)}
.huong-d1 .d1-lang button.on{background:var(--dark-4);color:#fff}

/* ---------- khung ---------- */
.huong-d1 .d1-body{display:flex;align-items:stretch}

/* ---------- cột trái (tối) ---------- */
.huong-d1 .d1-side{flex:0 0 270px;width:270px;background:var(--dark);
  padding:14px 12px 22px;display:flex;flex-direction:column}
.huong-d1 .d1-gp{font-size:11px;color:var(--on-dark-3);padding:15px 10px 5px}
.huong-d1 .d1-gp:first-child{padding-top:2px}
.huong-d1 .d1-nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:7px;color:var(--on-dark-2);font-size:13.5px;
  transition:background .15s,color .15s}
.huong-d1 .d1-nav:hover{background:var(--dark-2);color:var(--on-dark)}
.huong-d1 .d1-nav.on{background:var(--dark-3);color:#fff;font-weight:500}
.huong-d1 .d1-nav svg{flex:0 0 auto;opacity:.6}
.huong-d1 .d1-nav.on svg{opacity:1}
.huong-d1 .d1-nav span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.huong-d1 .d1-nav i{font-style:normal;font-size:11.5px;color:var(--on-dark-3);
  font-variant-numeric:tabular-nums}
.huong-d1 .d1-acct{margin-top:auto;display:flex;align-items:center;gap:10px;
  padding:14px 10px 0;margin:24px 2px 0;border-top:1px solid var(--dark-2)}
.huong-d1 .d1-av{width:28px;height:28px;border-radius:50%;background:var(--dark-4);
  color:var(--on-dark-2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:.04em;flex:0 0 auto}
.huong-d1 .d1-acct div{min-width:0}
.huong-d1 .d1-acct b{display:block;font-size:12.5px;font-weight:500;color:var(--on-dark-2)}
.huong-d1 .d1-acct span{display:block;font-size:11.5px;color:var(--on-dark-3)}

/* ---------- vùng nội dung (sáng) ---------- */
.huong-d1 .d1-main{flex:1;min-width:0;position:relative;padding:22px 30px 46px}

.huong-d1 .d1-crumb{display:flex;align-items:center;gap:7px;font-size:12px;
  color:var(--faint);margin-bottom:9px}
.huong-d1 .d1-crumb svg{opacity:.7}

.huong-d1 .d1-head{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-bottom:16px}
.huong-d1 .d1-hl{display:flex;align-items:baseline;gap:11px;flex:1 1 300px;min-width:0}
.huong-d1 .d1-hl h1{font-size:clamp(21px,1.8vw,27px);font-weight:600;
  letter-spacing:-.012em;line-height:1.2}
.huong-d1 .d1-code{font-family:var(--mono);font-size:12.5px;color:var(--blue)}
.huong-d1 .d1-cells{display:flex;gap:clamp(20px,2.4vw,38px);flex:0 0 auto}
.huong-d1 .d1-cell{text-align:right}
.huong-d1 .d1-cl{font-size:11.5px;color:var(--faint);margin-bottom:4px;white-space:nowrap}
.huong-d1 .d1-cv{font-size:clamp(18px,1.5vw,23px);font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.huong-d1 .d1-cs{font-size:11.5px;color:var(--ink-2);margin-top:4px;white-space:nowrap}

.huong-d1 .d1-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.huong-d1 .d1-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:500;
  transition:background .15s}
.huong-d1 .d1-pill:hover{background:#E2E5EA}
.huong-d1 .d1-pill.on{background:var(--sel)}
.huong-d1 .d1-pill em{font-style:normal;font-weight:400;color:var(--ink-2)}
.huong-d1 .d1-pill svg{opacity:.45}

.huong-d1 .d1-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px}
.huong-d1 .d1-tab{position:relative;padding:0 0 11px;font-size:13.5px;color:var(--ink-2);
  transition:color .15s}
.huong-d1 .d1-tab:hover{color:var(--ink)}
.huong-d1 .d1-tab.on{color:var(--ink);font-weight:500}
.huong-d1 .d1-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--ink);border-radius:2px}

/* ---------- thẻ ---------- */
.huong-d1 .d1-card{background:var(--card);border-radius:8px;box-shadow:var(--sh);padding:21px 24px}
.huong-d1 .d1-card + .d1-card,.huong-d1 .d1-sec + .d1-sec{margin-top:18px}
.huong-d1 .d1-sec{scroll-margin-top:70px}
.huong-d1 .d1-split{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);
  gap:18px;align-items:start}
.huong-d1 .d1-split .d1-card + .d1-card{margin-top:0}
.huong-d1 .d1-ch{display:flex;align-items:flex-start;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:16px}
.huong-d1 .d1-h2{font-size:15.5px;font-weight:600;letter-spacing:-.006em}
.huong-d1 .d1-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.huong-d1 .d1-lbl{font-size:11.5px;color:var(--faint);margin-bottom:10px}

/* ---------- khối duyệt kỳ ---------- */
.huong-d1 .d1-acts{display:flex;gap:9px;flex:0 0 auto}
.huong-d1 .d1-btn{height:36px;padding:0 15px;border-radius:6px;font-size:13px;font-weight:500;
  background:var(--teal);color:#fff;transition:background .15s}
.huong-d1 .d1-btn:hover{background:#0B6C80}
.huong-d1 .d1-btn-off{height:36px;padding:0 15px;border-radius:6px;font-size:13px;font-weight:500;
  background:#EDEFF2;color:#9AA3AD;cursor:not-allowed}
.huong-d1 .d1-warn{display:flex;align-items:center;gap:9px;background:var(--red-lo);
  color:var(--red-ink);border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:18px}
.huong-d1 .d1-warn svg{flex:0 0 auto}
.huong-d1 .d1-ag{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px}
.huong-d1 .d1-ck{display:flex;align-items:flex-start;gap:10px;padding:9px 0}
.huong-d1 .d1-ck + .d1-ck{border-top:1px solid #F0F2F4}
.huong-d1 .d1-ck svg{flex:0 0 auto;margin-top:1px}
.huong-d1 .d1-ck b{display:block;font-size:13px;font-weight:400}
.huong-d1 .d1-ck span{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.huong-d1 .d1-ck.no b{font-weight:500}

/* ---------- hàng chỉ số ---------- */
.huong-d1 .d1-kpi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0}
.huong-d1 .d1-kc{padding:17px 16px 18px;min-width:0}
.huong-d1 .d1-kc + .d1-kc{border-left:1px solid var(--line)}
.huong-d1 .d1-kl{font-size:11.5px;color:var(--faint);margin-bottom:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.huong-d1 .d1-kv{font-size:clamp(15px,1.35vw,20px);font-weight:600;line-height:1.2;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.huong-d1 .d1-ks{font-size:11.5px;color:var(--ink-2);margin-top:5px}

/* ---------- biểu đồ ---------- */
.huong-d1 .d1-legend{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-2)}
.huong-d1 .d1-lg{display:flex;align-items:center;gap:7px}
.huong-d1 .d1-sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.huong-d1 .d1-note{font-size:12px;color:var(--faint);margin-top:12px}
.huong-d1 .d1-gl{stroke:var(--line);stroke-width:1}
.huong-d1 .d1-gt{font-size:10.5px;fill:var(--faint)}
.huong-d1 .d1-xt{font-size:11px;fill:var(--faint)}
.huong-d1 .d1-xt.cur{fill:var(--ink-2)}
.huong-d1 .d1-fv{font-size:clamp(10.5px,.86vw,12.5px);font-weight:500;fill:var(--ink)}
.huong-d1 .d1-fn{font-size:clamp(10.5px,.85vw,12.5px);fill:var(--ink-2)}
.huong-d1 .d1-fp{font-size:10.5px;fill:var(--faint)}
.huong-d1 .d1-conn{stroke:#CFD5DB;stroke-width:1;stroke-dasharray:3 3}
.huong-d1 .d1-hit{fill:transparent;cursor:default}
.huong-d1 .d1-chart{position:relative}
.huong-d1 .d1-chart svg{position:absolute;left:0;top:0}
.huong-d1 .d1-col{position:absolute}
.huong-d1 .d1-bar{position:absolute;bottom:0;border-radius:2px 2px 0 0;
  background:linear-gradient(to top,#3AA4B9,#0E7C92);transition:filter .15s}
.huong-d1 .d1-bar.open{background:linear-gradient(to top,#CBEBF2,#A6D9E5)}
.huong-d1 .d1-col:hover .d1-bar{filter:brightness(1.07)}
.huong-d1 .d1-anim{animation:d1rise .4s cubic-bezier(.22,.7,.3,1) both}
@keyframes d1rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.huong-d1 .d1-tip{position:absolute;z-index:20;pointer-events:none;opacity:0;
  transform:translate(-50%,-100%);background:#fff;border-radius:7px;padding:9px 11px;
  box-shadow:0 4px 16px rgba(16,24,32,.14);font-size:12px;white-space:nowrap;
  transition:opacity .12s}
.huong-d1 .d1-tip.on{opacity:1}
.huong-d1 .d1-tip b{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.huong-d1 .d1-tip u{text-decoration:none;color:var(--ink-2)}
.huong-d1 .d1-tip i{font-style:normal;font-variant-numeric:tabular-nums;
  margin-left:12px;float:right}
.huong-d1 .d1-tip s{display:block;text-decoration:none;color:var(--ink-2);margin-top:5px}

/* ---------- xếp hạng cửa hàng ---------- */
.huong-d1 .d1-rank{display:flex;align-items:center;gap:12px;padding:6px 0}
.huong-d1 .d1-rn{flex:0 0 clamp(134px,11.5vw,158px);font-size:12.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.huong-d1 .d1-rt{flex:1;min-width:20px;height:16px;position:relative}
.huong-d1 .d1-rb{position:absolute;left:0;top:0;height:100%;border-radius:2px;
  background:var(--teal);transition:width .45s cubic-bezier(.22,.7,.3,1)}
.huong-d1 .d1-rb.tail{background:var(--grey-bar)}
.huong-d1 .d1-rv{flex:0 0 auto;font-size:12.5px;font-variant-numeric:tabular-nums;
  text-align:right;min-width:96px}
.huong-d1 .d1-rank.tail .d1-rn,.huong-d1 .d1-rank.tail .d1-rv{color:var(--ink-2)}

/* ---------- vòng lãnh thổ ---------- */
.huong-d1 .d1-donut{display:flex;align-items:center;gap:clamp(14px,2vw,26px);flex-wrap:wrap}
.huong-d1 .d1-dl{flex:1 1 186px;min-width:min(100%,186px)}
.huong-d1 .d1-dr{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px}
.huong-d1 .d1-dr + .d1-dr{border-top:1px solid #F2F4F6}
.huong-d1 .d1-dd{display:block;width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.huong-d1 .d1-dr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.huong-d1 .d1-dr em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.huong-d1 .d1-dc{font-size:15px;font-weight:600;fill:var(--ink)}
.huong-d1 .d1-dcs{font-size:10.5px;fill:var(--faint)}

/* ---------- bảng ---------- */
.huong-d1 .d1-tw{overflow-x:auto}
.huong-d1 .d1-tb{font-size:13px;min-width:560px}
.huong-d1 .d1-tb th{background:var(--head);color:var(--ink-2);font-weight:500;font-size:12px;
  text-align:left;padding:9px 12px;white-space:nowrap}
.huong-d1 .d1-tb th:first-child{border-radius:5px 0 0 5px}
.huong-d1 .d1-tb th:last-child{border-radius:0 5px 5px 0}
.huong-d1 .d1-tb td{padding:10px 12px;border-bottom:1px solid #F2F4F6}
.huong-d1 .d1-tb tbody tr:nth-child(even){background:var(--zebra)}
.huong-d1 .d1-tb tbody tr:hover{background:#F1F4F7}
.huong-d1 .d1-tb tbody tr:last-child td{border-bottom:0}
.huong-d1 .d1-r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.huong-d1 .d1-link{color:var(--blue);font-size:13px;text-align:left;transition:color .15s}
.huong-d1 .d1-link:hover{text-decoration:underline}
.huong-d1 .d1-dim{color:var(--faint)}
.huong-d1 .d1-red{color:var(--red)}
.huong-d1 .d1-green{color:var(--green)}
.huong-d1 .d1-foot{font-size:12px;color:var(--ink-2);margin-top:13px}
.huong-d1 .d1-rt2{font-size:12.5px;min-width:0}
.huong-d1 .d1-rt2 th{color:var(--faint);font-weight:400;font-size:11.5px;
  text-align:right;padding:0 0 7px;white-space:nowrap}
.huong-d1 .d1-rt2 th:first-child{text-align:left}
.huong-d1 .d1-rt2 td{padding:8px 0;border-top:1px solid #F0F2F4;text-align:right;white-space:nowrap}
.huong-d1 .d1-rt2 td:first-child{text-align:left}

@media (max-width:1230px){
  .huong-d1 .d1-side{flex-basis:232px;width:232px}
  .huong-d1 .d1-brand{flex-basis:210px}
  .huong-d1 .d1-main{padding:20px 22px 40px}
  .huong-d1 .d1-ag{gap:22px}
}
@media (max-width:1060px){
  .huong-d1 .d1-ag{grid-template-columns:minmax(0,1fr);gap:20px}
  .huong-d1 .d1-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .huong-d1 .d1-kc:nth-child(4){border-left:0}
  .huong-d1 .d1-kc:nth-child(n+4){border-top:1px solid var(--line)}
  .huong-d1 .d1-split{grid-template-columns:minmax(0,1fr)}
  .huong-d1 .d1-fx{display:none}
}
@media (prefers-reduced-motion:reduce){
  .huong-d1 *{animation:none!important;transition:none!important}
}
</style>

<div class="huong-d1">
  <div class="d1-top">
    <div class="d1-brand"><span class="d1-dot"></span>HAUSTEK<em data-t="brandSub"></em></div>
    <div class="d1-grow"></div>
    <div class="d1-fx" data-fx></div>
    <div class="d1-lang">
      <button data-lang="vi" class="on">VI</button><button data-lang="en">EN</button>
    </div>
  </div>

  <div class="d1-body">
    <nav class="d1-side" data-nav></nav>

    <main class="d1-main">
      <div class="d1-crumb" data-crumb></div>

      <div class="d1-head">
        <div class="d1-hl"><h1 data-t="title"></h1><span class="d1-code" data-per></span></div>
        <div class="d1-cells" data-cells></div>
      </div>

      <div class="d1-pills" data-pills></div>
      <div class="d1-tabs" data-tabs></div>

      <section class="d1-sec" data-sec="overview">
        <div class="d1-card" data-appr></div>
        <div class="d1-card d1-kpi" data-kpi></div>
        <div class="d1-card">
          <div class="d1-ch">
            <div><div class="d1-h2" data-t="trendTitle"></div>
                 <div class="d1-sub" data-trendsub></div></div>
            <div class="d1-legend" data-trendleg></div>
          </div>
          <div data-trend></div>
          <div class="d1-note" data-trendnote></div>
        </div>
      </section>

      <section class="d1-sec" data-sec="flow">
        <div class="d1-card">
          <div class="d1-ch">
            <div><div class="d1-h2" data-t="flowTitle"></div>
                 <div class="d1-sub" data-t="flowSub"></div></div>
          </div>
          <div data-fall></div>
        </div>
      </section>

      <section class="d1-sec d1-split" data-sec="split">
        <div class="d1-card" data-store></div>
        <div class="d1-card" data-terr></div>
      </section>

      <section class="d1-sec" data-sec="payees">
        <div class="d1-card" data-pay></div>
      </section>

      <div class="d1-tip" data-tip></div>
    </main>
  </div>
</div>

<script>
(function () {
  var root = document.querySelector('.huong-d1');
  if (!root || !window.SNAP) return;
  var S = window.SNAP;
  var N = S.now, P = S.prev, B = S.byPeriod;

  /* ---------------- chữ hai thứ tiếng ---------------- */
  var T = {
    vi: {
      brandSub: 'Nội bộ',
      fxNote: 'chưa chốt cho kỳ',
      acct: 'Vận hành', acctSub: 'TP.HCM',
      nav: { g1:'Vận hành', overview:'Tổng quan', periods:'Kỳ doanh thu', recon:'Đối chiếu',
             queue:'Tiền treo', g2:'Chi trả', payees:'Bên nhận', advances:'Tạm ứng',
             payments:'Lệnh chi', g3:'Danh mục', tracks:'Bản ghi', stores:'Cửa hàng',
             terr:'Lãnh thổ', g4:'Hệ thống', imports:'Tệp nhập', users:'Người dùng' },

  var lang = 'vi';

  /* ---------------- số, chuỗi ---------------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function grp(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function num(v, d) {
    d = (d == null) ? 2 : d;
    var neg = v < 0, s = Math.abs(v).toFixed(d).split('.');
    return (neg ? '−' : '') + grp(s[0]) + (s[1] ? ',' + s[1] : '');
  }
  function usd(v, d) {
    var neg = v < 0;
    return (neg ? '−$' : '$') + num(Math.abs(v), d == null ? 2 : d);
  }
  function pct(v, d) { return num(v, d == null ? 1 : d) + '%'; }
  function sig(v, d) { return (v >= 0 ? '+' : '−') + num(Math.abs(v), d == null ? 1 : d) + '%'; }
  function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k]; }); }
  function compact(v) {
    if (v >= 1e6) { var m = v / 1e6; return num(m, m % 1 ? 1 : 0) + ' M'; }
    if (v >= 1e3) return num(v / 1e3, 0) + ' K';
    return num(v, 0);
  }
  function niceTop(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    var m = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5
          : n <= 3 ? 3 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10;
    return m * p;
  }

        (p.advance ? usd(p.advance) : '—') + '</td></tr>';
    }).join('');
    q('[data-pay]').innerHTML =
      '<div class="d1-ch"><div><div class="d1-h2">' + esc(L.payTitle) + '</div>' +
      '<div class="d1-sub">' + esc(L.paySub) + '</div></div></div>' +
      '<div class="d1-tw"><table class="d1-tb"><thead><tr>' +
      '<th>' + esc(L.thPayee) + '</th><th>' + esc(L.thCode) + '</th><th>' + esc(L.thKind) + '</th>' +
      '<th class="d1-r">' + esc(L.thEarned) + ' ' + esc(S.period.label) + '</th>' +
      '<th class="d1-r">' + esc(L.thAdv) + '</th></tr></thead><tbody>' + body +
      '</tbody></table></div>' +
      '<div class="d1-foot">' +
      esc(fill(L.payFoot, { v: usd(S.advances.total), n: num(S.advances.parties, 0) })) +
      '</div>';
  }

  function renderFlow() {
    var L = t();
    setText('[data-t="flowTitle"]', L.flowTitle);
    setText('[data-t="flowSub"]', L.flowSub);
  }

  function renderAll() {
    renderChrome(); renderAppr(); renderKpi(); renderTrend();
    renderFlow(); renderSplit(); renderPay();
    bindTabs();
  }

  /* ---------------- biểu đồ cột 12 kỳ ---------------- */
  var animated = false;

  function drawTrend() {
    var host = q('[data-trend]');
    var W = Math.max(300, host.clientWidth), H = 250;
    var padL = 56, padR = 8, padT = 14, padB = 32;
    var iw = W - padL - padR, ih = H - padT - padB;
    var max = B.reduce(function (a, d) { return Math.max(a, d.gross); }, 0);
    var top = niceTop(max), ticks = 4, step = iw / B.length;
    var bw = Math.min(40, step * 0.54);
    var every = step < 46 ? 2 : 1;

    var g = '';
    for (var i = 0; i <= ticks; i++) {
      var v = top / ticks * i, y = padT + ih - (v / top) * ih;
      g += '<line class="d1-gl" x1="' + padL + '" y1="' + y.toFixed(1) +
           '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>' +
           '<text class="d1-gt" x="' + (padL - 10) + '" y="' + (y + 3.5).toFixed(1) +
           '" text-anchor="end">' + compact(v) + '</text>';
    }
    B.forEach(function (d, i) {
      if (i % every) return;
      var cx = padL + step * i + step / 2;
      g += '<text class="d1-xt' + (d.k === S.period.k ? ' cur' : '') + '" x="' + cx.toFixed(1) +
           '" y="' + (H - 10) + '" text-anchor="middle">' + esc(d.label) + '</text>';
    });

    var bars = B.map(function (d, i) {
      var h = (d.gross / top) * ih;
      var left = padL + step * i;
      return '<div class="d1-col" data-i="' + i + '" style="left:' + left.toFixed(1) +
        'px;width:' + step.toFixed(1) + 'px;height:' + ih + 'px;top:' + padT + 'px">' +
        '<div class="d1-bar' + (d.approved ? '' : ' open') + '" data-g="' + d.gross +
        '" data-h="' + h.toFixed(2) + '" style="left:' + ((step - bw) / 2).toFixed(1) +
        'px;width:' + bw.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px"></div></div>';
    }).join('');

    host.innerHTML = '<div class="d1-chart' + (animated ? '' : ' d1-anim') +
      '" style="height:' + H + 'px">' +
      '<svg width="' + W + '" height="' + H + '" aria-hidden="true">' + g + '</svg>' +
      bars + '</div>';

    host.querySelectorAll('.d1-col').forEach(function (col) {
      col.addEventListener('mouseenter', function () {
        var d = B[+col.dataset.i], L = t();
        tipShow(col.querySelector('.d1-bar'),
          '<b>' + esc(d.label) + '</b>' +
          '<u>' + esc(L.tipGross) + '</u><i>' + usd(d.gross) + '</i><br>' +
          '<u>' + esc(L.tipArtist) + '</u><i>' + usd(d.artist) + '</i>' +
          (d.approved ? '' : '<s>' + esc(L.tipOpen) + '</s>'));
      });
      col.addEventListener('mouseleave', tipHide);
    });
  }

  /* ---------------- thác nước: tiền đi đâu ---------------- */
  function drawFall() {
    var host = q('[data-fall]');
    var W = Math.max(300, host.clientWidth), H = 274;
    var padT = 36, padB = 54, padL = 4, padR = 4;
    var iw = W - padL - padR, ih = H - padT - padB;
    var L = t(), G = N.gross;
    var c1 = G - N.fee, c2 = c1 - N.labelCut, c3 = c2 - N.producer;
    var steps = [
      { lo:0,  hi:G,  v:G,           total:true, p:100 },
      { lo:c1, hi:G,  v:-N.fee,      p:N.fee / G * 100 },
      { lo:c2, hi:c1, v:-N.labelCut, p:N.labelCut / G * 100 },
      { lo:c3, hi:c2, v:-N.producer, p:N.producer / G * 100 },
      { lo:0,  hi:N.artist, v:N.artist, total:true, p:N.artist / G * 100 }
    ];
    var step = iw / steps.length, bw = Math.min(86, step * 0.52);
    function Y(v) { return padT + ih - (v / G) * ih; }
    function cx(i) { return padL + step * i + step / 2; }

    var s = '<line class="d1-gl" x1="' + padL + '" y1="' + (padT + ih) +
            '" x2="' + (W - padR) + '" y2="' + (padT + ih) + '"/>';
    steps.forEach(function (d, i) {
      var y = Y(d.hi), h = Math.max(4, Y(d.lo) - Y(d.hi));
      s += '<rect x="' + (cx(i) - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' +
        (d.total ? '#0E7C92' : '#B7E3EC') + '"/>';
      s += '<text class="d1-fv" x="' + cx(i).toFixed(1) + '" y="' + (y - 11).toFixed(1) +
        '" text-anchor="middle">' + (d.v < 0 ? '−' : '') + usd(Math.abs(d.v)) + '</text>';
      s += '<text class="d1-fn" x="' + cx(i).toFixed(1) + '" y="' + (padT + ih + 22) +
        '" text-anchor="middle">' + esc(L.flow[i]) + '</text>';
      s += '<text class="d1-fp" x="' + cx(i).toFixed(1) + '" y="' + (padT + ih + 39) +
        '" text-anchor="middle">' + pct(d.p) + '</text>';
      if (i < steps.length - 1) {
        var yc = Y(i === 0 ? d.hi : d.lo);
        s += '<line class="d1-conn" x1="' + (cx(i) + bw / 2).toFixed(1) + '" y1="' + yc.toFixed(1) +
          '" x2="' + (cx(i + 1) - bw / 2).toFixed(1) + '" y2="' + yc.toFixed(1) + '"/>';
      }
    });
    host.innerHTML = '<svg class="' + (animated ? '' : 'd1-anim') + '" width="' + W +
      '" height="' + H + '" role="img" aria-label="' + esc(L.flowTitle) + '">' + s + '</svg>';
  }

  /* ---------------- vòng lãnh thổ ---------------- */
  function drawDonut() {
    var host = q('[data-dsvg]'); if (!host) return;
    var card = q('[data-terr]');
    var w = Math.max(200, card.clientWidth - 48);
    var size = Math.max(124, Math.min(172, Math.round(w * 0.38)));
    var sw = Math.max(19, Math.round(size * 0.16));
    var r = size / 2 - sw / 2 - 1, C = 2 * Math.PI * r, cxy = size / 2;
    var acc = 0, gap = 2.5, L = t();
    var s = '';
    (root._slices || []).forEach(function (sl) {
      var len = sl.v / N.gross * C;
      s += '<circle cx="' + cxy + '" cy="' + cxy + '" r="' + r.toFixed(2) +
        '" fill="none" stroke="' + sl.c + '" stroke-width="' + sw +
        '" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' +
        (C - Math.max(0, len - gap)).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) +
        '" transform="rotate(-90 ' + cxy + ' ' + cxy + ')"/>';
      acc += len;
    });
    s += '<text class="d1-dc" x="' + cxy + '" y="' + (cxy - 2) + '" text-anchor="middle">' +
      num(S.counts.territories, 0) + '</text>' +
      '<text class="d1-dcs" x="' + cxy + '" y="' + (cxy + 14) + '" text-anchor="middle">' +
      esc(L.terrCenter) + '</text>';
    host.innerHTML = '<svg width="' + size + '" height="' + size + '" aria-hidden="true">' + s + '</svg>';
  }

  /* ---------------- chú thích nổi ---------------- */
  var tip = q('[data-tip]');
  function tipShow(el, html) {
    var main = q('.d1-main');
    var a = el.getBoundingClientRect(), b = main.getBoundingClientRect();
    tip.innerHTML = html;
    tip.classList.add('on');
    var half = tip.offsetWidth / 2 + 6;
    var x = a.left - b.left + a.width / 2;
    x = Math.min(Math.max(x, half), b.width - half);
    tip.style.left = x.toFixed(1) + 'px';
    tip.style.top = (a.top - b.top - 9).toFixed(1) + 'px';
  }
  function tipHide() { tip.classList.remove('on'); }

  /* ---------------- tab + ngôn ngữ ---------------- */
  function bindTabs() {
    root.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        tab = b.dataset.tab;
        lock = Date.now() + 900;
        markTab();
        var sec = q('[data-sec="' + tab + '"]');
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }
  function markTab() {
    root.querySelectorAll('[data-tab]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === tab);
    });
  }
  var spy = 0, lock = 0;
  function onScroll() {
    if (spy) return;
    spy = requestAnimationFrame(function () {
      spy = 0;
      if (!root.clientWidth || Date.now() < lock) return;
      var cur = TABS[0];
      TABS.forEach(function (k) {
        var sec = q('[data-sec="' + k + '"]');
        if (sec && sec.getBoundingClientRect().top <= 140) cur = k;
      });
      var doc = document.documentElement;
      if (window.innerHeight + window.scrollY >= doc.scrollHeight - 6) cur = TABS[TABS.length - 1];
      if (cur !== tab) { tab = cur; markTab(); }
    });
  }

  root.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (lang === b.dataset.lang) return;
      lang = b.dataset.lang;
      root.querySelectorAll('[data-lang]').forEach(function (x) {
        x.classList.toggle('on', x.dataset.lang === lang);
      });
      tipHide(); renderAll(); drawAll();
    });
  });

  /* ---------------- vẽ lại theo bề rộng ---------------- */
  function drawAll() { drawTrend(); drawFall(); drawDonut(); animated = true; }

  var lastW = -1, raf = 0;
  function schedule() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      raf = 0;
      var w = root.clientWidth;
      if (!w || w === lastW) return;
      lastW = w; tipHide(); drawAll();
    });
  }

  renderAll();
  schedule();
  window.addEventListener('resize', schedule);
  window.addEventListener('scroll', onScroll, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(root);
})();
</script>
